<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spelerprofiel – Afrigter</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,sans-serif;background:#eef2f6;color:#172033;margin:0;padding:18px}.wrap{max-width:900px;margin:auto}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}.top{display:flex;gap:18px;align-items:center;border-bottom:1px solid #e4e7ec;padding-bottom:18px}.photo{width:120px;height:120px;border-radius:18px;background:#edf2f7;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:36px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.box{border:1px solid #e4e7ec;border-radius:13px;padding:13px}.box strong{display:block;margin-bottom:5px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stat{border:1px solid #e4e7ec;border-radius:13px;padding:13px;text-align:center}.stat b{display:block;font-size:24px}.muted{color:#667085}button{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.ghost{background:#eef2f6}@media(max-width:700px){.grid,.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.top{align-items:flex-start}.photo{width:90px;height:90px;flex:0 0 90px}}</style></head><body><div class="wrap"><div class="card"><button class="ghost" onclick="history.back()">← Terug</button><div id="profile" style="margin-top:18px">Laai spelerprofiel…</div></div></div><script>(async()=>{const U='https://moomommajyldjquncnrd.supabase.co',K='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH',db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true}}),e=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const id=new URLSearchParams(location.search).get('player');if(!id){profile.innerHTML='<p class="muted">Geen speler gekies nie.</p>';return}const s=await db.auth.getSession();if(!s.data.session){profile.innerHTML='<p class="muted">Meld eers aan.</p>';return}const p=await db.from('players').select('id,first_name,surname,team_id,photo_path,teams(name,age_group)').eq('id',id).maybeSingle();if(p.error||!p.data){profile.innerHTML='<p>Speler kon nie gelaai word nie.</p>';return}const x=p.data,t=x.teams||{},st=await db.rpc('coach_get_player_career_stats',{p_player_id:id});if(st.error){profile.innerHTML='<p>Statistieke kon nie gelaai word nie.</p>';return}const a=st.data?.[0]||{},photo=x.photo_path?(/^https?:\\/\\//i.test(x.photo_path)?x.photo_path:(await db.storage.from('player-photos').createSignedUrl(x.photo_path,3600)).data?.signedUrl):null;const initials=(x.first_name||'')[0]+(x.surname||'')[0];const sr=Number(a.playable_balls)>0?(Number(a.batting_runs)*100/Number(a.playable_balls)).toFixed(1):'0.0';profile.innerHTML=`<div class="top"><div class="photo">${photo?`<img src="${e(photo)}">`:e(initials)}</div><div><h1 style="margin:0">${e(x.first_name)} ${e(x.surname)}</h1><p class="muted">${e(t.name||'')} • ${e(t.age_group||'')}</p></div></div><div class="card" style="box-shadow:none;padding:0;margin-top:20px"><h2>📊 Loopbaan-statistieke</h2><div class="stats"><div class="stat"><b>${a.matches||0}</b>Wedstryde</div><div class="stat"><b>${a.batting_runs||0}</b>Kolf lopies</div><div class="stat"><b>${a.playable_balls||0}</b>Kolf balle</div><div class="stat"><b>${sr}</b>Strike rate</div><div class="stat"><b>${a.fours||0}</b>4s</div><div class="stat"><b>${a.sixes||0}</b>6s</div><div class="stat"><b>${a.bowler_wickets||0}</b>Paaltjies</div><div class="stat"><b>${a.bowler_runs_conceded||0}</b>Bowling lopies</div><div class="stat"><b>${a.bowler_playable_balls||0}</b>Bowling balle</div><div class="stat"><b>${a.dot_balls||0}</b>Dot balle</div><div class="stat"><b>${a.catches||0}</b>Vangskote</div><div class="stat"><b>${a.run_outs||0}</b>Run outs</div></div></div></div>`})()</script></body></html>
