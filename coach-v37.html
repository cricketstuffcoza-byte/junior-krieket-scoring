<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Junior Krieket – Afrigter Portaal V37</title><style>body{font-family:system-ui,sans-serif;background:#eef2f6;color:#172033;margin:0}.wrap{max-width:1180px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:block;font-weight:800;margin-bottom:6px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd3dc;border-radius:10px}button{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#172033;color:#fff}.ghost{background:#eef2f6}.hidden{display:none!important}.muted{color:#667085}.error{color:#b42318}.success{color:#087443}.fixture{border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:10px 0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#edf2f7;font-size:12px;font-weight:800}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section id="auth" class="card"><h1>🧑‍🏫 Afrigter Portaal V37</h1><p class="muted">Meld aan met jou Junior Krieket-rekening.</p><form id="login"><div class="grid"><div><label>E-pos</label><input id="email" type="email" autocomplete="username" required></div><div><label>Wagwoord</label><input id="password" type="password" autocomplete="current-password" required></div></div><div class="actions"><button id="loginBtn" class="primary" type="submit">Meld Aan</button></div></form><p id="msg" class="muted"></p></section><section id="denied" class="card hidden"><h2>🔒 Geen Afrigter-toegang</h2><p id="deniedMsg"></p><button class="ghost" id="back">Meld aan met ander rekening</button></section><main id="app" class="hidden"><section class="card"><h1>🧑‍🏫 Afrigter Portaal</h1><p id="welcome" class="muted"></p><button class="ghost" id="logout">Teken uit</button></section><section class="card"><h2>📅 My wedstryde</h2><div id="fixtures"></div></section></main></div><script>(function(){'use strict';const URL='https://moomommajyldjquncnrd.supabase.co',KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH',$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let session=null;const H=token=>({apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'});async function req(path,opts={}){const r=await fetch(URL+path,{...opts,headers:{apikey:KEY,...(opts.headers||{})},cache:'no-store'});let data=null;try{data=await r.json()}catch(e){}if(!r.ok){const msg=data?.msg||data?.message||data?.error_description||data?.error||('HTTP '+r.status);throw Error(msg)}return data}async function login(email,password){const data=await req('/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});session=data;localStorage.setItem('junior_coach_session',JSON.stringify(data));return data}async function restoreSession(){try{const s=JSON.parse(localStorage.getItem('junior_coach_session')||'null');if(s?.access_token)return s}catch(e){}return null}async function hasRole(token){const r=await req('/rest/v1/rpc/has_access_role',{method:'POST',headers:H(token),body:JSON.stringify({p_role:'coach'})});return r===true}async function start(s){session=s;if(!s?.access_token||!s?.user?.id)throw Error('Geen geldige sessie ontvang nie.');if(!await hasRole(s.access_token)){ $('auth').classList.add('hidden');$('denied').classList.remove('hidden');$('deniedMsg').textContent='Hierdie rekening het nie Afrigter-toegang nie.';return}const p=await req('/rest/v1/user_profiles?select=full_name,active&user_id=eq.'+encodeURIComponent(s.user.id)+'&limit=1',{headers:H(s.access_token)});if(!p?.[0]||p[0].active===false)throw Error('Jou gebruikersprofiel is gedeaktiveer.');$('auth').classList.add('hidden');$('denied').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='Welkom, '+(p[0].full_name||s.user.email);await loadAll()}async function loadAll(){const u=session.user.id;const rows=await req('/rest/v1/matches?select=id,age_group,team_a_id,team_b_id,match_date,match_time,venue,status,coach_user_id,scorer_user_id&or=(coach_user_id.eq.'+encodeURIComponent(u)+',scorer_user_id.eq.'+encodeURIComponent(u)+')&order=match_date.asc,match_time.asc',{headers:H(session.access_token)});const list=rows||[],ids=[...new Set(list.flatMap(x=>[x.team_a_id,x.team_b_id]).filter(Boolean))];const tm={};if(ids.length){const t=await req('/rest/v1/teams?select=id,name&id=in.('+ids.join(',')+')',{headers:H(session.access_token)});(t||[]).forEach(x=>tm[x.id]=x.name)}$('fixtures').innerHTML=list.length?list.map(x=>'<div class="fixture"><b>'+esc(tm[x.team_a_id]||'Onbekend')+' vs '+esc(tm[x.team_b_id]||'Onbekend')+'</b><div class="muted">'+esc(x.match_date)+' • '+esc(String(x.match_time||'').slice(0,5))+' • '+esc(x.venue||'')+'</div><div class="actions"><button class="primary" onclick="openScorecard(\''+x.id+'\',\''+esc(x.age_group)+'\')">🏏 Open Telkaart</button><span class="pill">'+esc(x.age_group)+' · '+esc(x.status)+'</span></div></div>').join(''):'<p class="muted">Geen wedstryde is tans aan jou toegeken nie.</p>'}window.openScorecard=function(id,age){if(String(age||'').toUpperCase()==='U/6'){location.href='scorer-o6-v40.html?match='+encodeURIComponent(id)+'&v=40&resume=1&ts='+Date.now();return}location.href='scorer-fixed.html?match='+encodeURIComponent(id)+'&resume=1&ts='+Date.now()};$('login').onsubmit=async function(e){e.preventDefault();const b=$('loginBtn');b.disabled=true;b.textContent='Meld aan…';$('msg').textContent='';$('msg').className='muted';try{await login($('email').value.trim(),$('password').value);await start(session)}catch(e){$('msg').textContent=e.message||String(e);$('msg').className='error'}finally{b.disabled=false;b.textContent='Meld Aan'}};$('logout').onclick=function(){localStorage.removeItem('junior_coach_session');session=null;location.reload()};$('back').onclick=function(){localStorage.removeItem('junior_coach_session');location.reload()};(async function(){const s=await restoreSession();if(s){try{await start(s)}catch(e){localStorage.removeItem('junior_coach_session')}}})();})();</script></body></html>
