.on==='1').map(b=>b.textContent.trim()),b=[...document.querySelectorAll('#avListB button')].filter(b=>b.dataset.on==='1').map(b=>b.textContent.trim());if(a.length<2||b.length<2){alert('Elke span moet minstens 2 beskikbare spelers hê.');return}chosen={[window.MATCH.teamA]:a,[window.MATCH.teamB]:b};window.PLAYERS[window.MATCH.teamA]=a.slice();window.PLAYERS[window.MATCH.teamB]=b.slice();overlay.style.display='none';allow=true;start.click();allow=false;setTimeout(function(){if(window.__juniorState){window.__juniorState.availablePlayers=chosen;try{localStorage.setItem('junior_krieket_v19_saved_${id}',JSON.stringify({savedAt:new Date().toISOString(),state:window.__juniorState,players:chosen}))}catch(e){}}},100)};setTimeout(function(){if(window.__juniorState&&window.__juniorState.started){overlay.remove()}},200)}catch(e){console.error('O6 availability setup',e)}}setTimeout(setup,100);setInterval(setup,500)});</script>`;html=html.replace('</body>',script+'</body>');f.srcdoc=html}catch(e){console.error(e);document.body.innerHTML='<div style="padding:30px;font-family:system-ui"><h2>O/6 telkaart kon nie laai nie</h2><p>'+String(e.message||e)+'</p></div>'}})();</script></body></html>
