<html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Afrigter Portaal V25</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eef2f6;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033}body{padding:18px}.shell{max-width:1220px;margin:0 auto}.brand{background:#172033;color:#fff;border-radius:18px 18px 0 0;padding:22px 24px 8px;box-shadow:0 3px 16px #0001}.brand h1{margin:0;font-size:28px}.brand p{margin:7px 0 18px;color:#d5deea}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#edf2f7;color:#172033;font-size:12px;font-weight:800}.frame{width:100%;height:calc(100vh - 58px);min-height:920px;border:0;border-radius:0 0 18px 18px;background:transparent;box-shadow:0 3px 16px #0001}</style></head><body><div class="shell"><div class="brand"><h1>🧑‍🏫 Afrigter Portaal V25</h1><p>Junior Krieket • Afrigter bestuur en wedstryde</p><span class="pill">V25</span></div><iframe id="portal" class="frame" src="coach-v24.html?v=20260831-routefix1" title="Afrigter Portaal V25"></iframe></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>'use strict';
const SUPABASE_URL='https://moomommajyldjquncnrd.supabase.co',SUPABASE_KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const frame=document.getElementById('portal');
function norm(v){return String(v||'').trim().toUpperCase().replace(/\s+/g,' ')}
function parseFixture(btn){const fixture=btn.closest('.fixture');if(!fixture)return null;const text=String(fixture.innerText||'').trim();const first=text.split(/\n/)[0]||'';const m=first.match(/^(.+?)\s+vs\s+(.+)$/i);if(!m)return null;const meta=text.split(/\n/).slice(1).join(' ');const d=meta.match(/(\d{4}-\d{2}-\d{2})/);const t=meta.match(/(?:\d{4}-\d{2}-\d{2})\s*[•-]\s*(\d{1,2}:\d{2})/);return {teamA:norm(m[1]),teamB:norm(m[2]),date:d?d[1]:'',time:t?t[1].slice(0,5):''};}
async function findExactMatch(fallbackId,fixture){const fallback=String(fallbackId||'').trim();if(fallback){const r=await db.from('matches').select('id,team_a_id,team_b_id,match_date,match_time,age_group').eq('id',fallback).maybeSingle();if(!r.error&&r.data){const ids=[r.data.team_a_id,r.data.team_b_id].filter(Boolean);const tr=ids.length?await db.from('teams').select('id,name').in('id',ids):{data:[],error:null};if(!tr.error){const tm=Object.fromEntries((tr.data||[]).map(x=>[x.id,norm(x.name)]));const a=tm[r.data.team_a_id],b=tm[r.data.team_b_id];if(!fixture||((a===fixture.teamA&&b===fixture.teamB)&&(!fixture.date||r.data.match_date===fixture.date)&&(!fixture.time||String(r.data.match_time||'').slice(0,5)===fixture.time)))return r.data.id;}}}return fallback;}
function openCorrectScorecard(id){const mid=String(id||'').trim();if(!mid)return;window.location.href=`scorer-v5.html?match=${encodeURIComponent(mid)}&v=25`;}
frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;doc.addEventListener('click',async e=>{const btn=e.target?.closest?.('button[onclick*="openScorer"]');if(!btn)return;e.preventDefault();e.stopImmediatePropagation();const onclick=String(btn.getAttribute('onclick')||'');const m=onclick.match(/openScorer\(['"]([^'"]+)['"]/);const fallback=m?m[1]:'';try{const fixture=parseFixture(btn);const exact=await findExactMatch(fallback,fixture);openCorrectScorecard(exact);}catch(err){console.error(err);if(fallback)openCorrectScorecard(fallback);}},true);}catch(e){console.error(e)}});</script></body></html>
