<!doctype html>
<html lang="af">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Junior Krieket – Afrigter Portaal V25</title>
<style>
html,body{margin:0;height:100%;background:#eef2f6;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033}
body{display:flex;flex-direction:column}
#linksPanel{flex:0 0 auto;background:#fff;border-bottom:1px solid #dfe3e8;box-shadow:0 2px 10px #0001;padding:12px 18px;z-index:10}
.linksInner{max-width:1220px;margin:auto}.linksHead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.linksTitle{font-size:18px;font-weight:900}.linksSub{font-size:13px;color:#667085;margin-top:3px}.linkGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}.linkCard{border:1px solid #e4e7ec;border-radius:12px;padding:10px 12px;background:#f8fafc}.linkTop{display:flex;justify-content:space-between;align-items:center;gap:10px}.linkName{font-weight:850}.live{display:inline-block;padding:4px 8px;border-radius:999px;background:#fde8e8;color:#b42318;font-size:11px;font-weight:900;margin-left:6px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}button{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer}.copy{background:#eef2f6;color:#172033}.wa{background:#e8f7ee;color:#087443}.share{background:#172033;color:#fff}.url{font-size:11px;color:#667085;word-break:break-all;margin-top:5px}.empty{font-size:12px;color:#667085;margin-top:8px}
#iframeWrap{flex:1;min-height:0}iframe{width:100%;height:100%;border:0;display:block}
@media(max-width:650px){#linksPanel{padding:10px}.linkGrid{grid-template-columns:1fr}.linksTitle{font-size:16px}}
</style>
</head>
<body>
<section id="linksPanel"><div class="linksInner">
  <div class="linksHead"><div><div class="linksTitle">🔗 Belangrike skakels</div><div class="linksSub">Deel vinnig registrasie en die huidige live telling.</div></div></div>
  <div id="linkGrid" class="linkGrid"></div>
</div></section>
<div id="iframeWrap"><iframe id="portal" src="coach-v25-base.html?v=20260902-homework5" title="Afrigter Portaal V25"></iframe></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
(function(){
  // Safety guard: this panel belongs ONLY to the Coach V25 route.
  // If this file is ever embedded/reused by another portal or scorecard route,
  // remove the panel immediately and leave the underlying page untouched.
  const path=(window.location.pathname||'').replace(/\/+$/,'')||'/';
  const isCoachRoute=path==='/coach-v25'||path==='/coach-v25.html';
  if(!isCoachRoute){
    const panel=document.getElementById('linksPanel');
    if(panel)panel.remove();
    return;
  }
  const U='https://moomommajyldjquncnrd.supabase.co',K='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH';
  const db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const REG='https://junior-krieket-scoring.pages.dev/parent-register.html';
  const LIVE='https://junior-krieket-scoring.pages.dev/live-score.html?match=';
  const grid=document.getElementById('linkGrid');let busy=false;
  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  function card(title,desc,url,isLive){return `<div class="linkCard"><div class="linkTop"><div><span class="linkName">${esc(title)}</span>${isLive?'<span class="live">● LIVE</span>':''}<div class="linksSub">${esc(desc)}</div></div></div><div class="url">${esc(url)}</div><div class="actions"><button class="copy" data-copy="${esc(url)}">📋 Kopieer skakel</button><button class="wa" data-wa="${esc(url)}">💬 WhatsApp</button><button class="share" data-share="${esc(url)}">📤 Deel</button></div></div>`}
  function bind(){
    grid.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);const old=b.textContent;b.textContent='✓ Gekopieer';setTimeout(()=>b.textContent=old,1400)}catch{window.prompt('Kopieer hierdie skakel:',b.dataset.copy)}});
    grid.querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent('Junior Krieket skakel\n'+b.dataset.wa),'_blank'));
    grid.querySelectorAll('[data-share]').forEach(b=>b.onclick=async()=>{const u=b.dataset.share;try{if(navigator.share){await navigator.share({title:'Junior Krieket',url:u})}else{await navigator.clipboard.writeText(u);alert('Skakel gekopieer.')}}catch(e){if(e.name!=='AbortError'){window.prompt('Kopieer hierdie skakel:',u)}}});
  }
  async function load(){
    if(busy)return;busy=true;
    try{
      let html=card('👨‍👩‍👧 Ouer / Voog registrasie','Deel hierdie skakel met ’n ouer of voog wat nog moet registreer.',REG,false);
      const s=(await db.auth.getSession()).data.session;
      if(s){
        const q=await db.from('matches').select('id,team_a_id,team_b_id,status').or('coach_user_id.eq.'+s.user.id+',scorer_user_id.eq.'+s.user.id).eq('status','LIVE');
        if(!q.error&&q.data?.length){
          const ids=[...new Set(q.data.flatMap(x=>[x.team_a_id,x.team_b_id]).filter(Boolean))],names={};
          if(ids.length){const t=await db.from('teams').select('id,name').in('id',ids);(t.data||[]).forEach(x=>names[x.id]=x.name)}
          q.data.forEach(x=>{html+=card('🏏 Live telling – '+(names[x.team_a_id]||'Span A')+' vs '+(names[x.team_b_id]||'Span B'),'Die wedstryd is tans LIVE.',LIVE+x.id,true)})
        }
      }
      grid.innerHTML=html;bind();
    }finally{busy=false}
  }
  load();setInterval(load,10000);db.auth.onAuthStateChange(()=>setTimeout(load,300));
})();
</script>
</body></html>
