<!doctype html>
<html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Afrigter Portaal V25</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eef2f6;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033}body{padding:18px}.shell{max-width:1220px;margin:0 auto}.brand{background:#172033;color:#fff;border-radius:18px 18px 0 0;padding:22px 24px 8px;box-shadow:0 3px 16px #0001}.brand h1{margin:0;font-size:28px}.brand p{margin:7px 0 18px;color:#d5deea}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#edf2f7;color:#172033;font-size:12px;font-weight:800}.frame{width:100%;height:calc(100vh - 58px);min-height:920px;border:0;border-radius:0 0 18px 18px;background:transparent;box-shadow:0 3px 16px #0001}</style></head><body><div class="shell"><div class="brand"><h1>🧑‍🏫 Afrigter Portaal V25</h1><p>Junior Krieket • Afrigter bestuur en wedstryde</p><span class="pill">V25</span></div><iframe id="portal" class="frame" src="coach-v24.html" title="Afrigter Portaal V25"></iframe></div><script>'use strict';const frame=document.getElementById('portal');
function openCorrectScorecard(id,ageHint){const mid=String(id||'').trim();if(!mid)return;const age=String(ageHint||'').toUpperCase().replace(/\s/g,'');let scorer;if(age==='O/6'||age==='U/6')scorer='scorer-o6-v19.html';else if(age==='O/8'||age==='U/8')scorer='scorer-fixed.html';else {alert(`Onbekende ouderdomsgroep: ${age||'leeg'}`);return;}window.location.href=`${scorer}?match=${encodeURIComponent(mid)}`;}
frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;doc.addEventListener('click',e=>{const btn=e.target?.closest?.('button[onclick*="openScorer"]');if(!btn)return;const onclick=String(btn.getAttribute('onclick')||'');const m=onclick.match(/openScorer\(['"]([^'"]+)['"]/);if(!m)return;e.preventDefault();e.stopImmediatePropagation();const fixture=btn.closest('.fixture');const text=String(fixture?.innerText||'').toUpperCase();let age='';if(/\b(?:O\/6|U\/6)\b/.test(text))age='O/6';else if(/\b(?:O\/8|U\/8)\b/.test(text))age='O/8';openCorrectScorecard(m[1],age);},true);}catch(e){console.error(e)}});</script></body></html>
