ayer_id:playerId});if(q.error){box.innerHTML='<p style="color:#b42318">'+esc(q.error.message)+'</p>';return}const list=(q.data||[]).filter(x=>x.difficulty===selected);box.innerHTML=list.length?list.map(x=>'<div class="hw-activity"><b>'+esc(x.title)+'</b><div class="muted">'+esc(x.category)+' · '+esc(x.duration_minutes)+' minute · '+esc(x.age_group)+' · '+esc(x.difficulty)+'</div><p style="line-height:1.45">'+esc(x.instructions)+'</p><button class="primary" data-activity="'+esc(x.id)+'" type="button">Kies hierdie aktiwiteit</button></div>').join(''):'<p class="muted">Geen aktiwiteite vir hierdie vlak beskikbaar nie.</p>';doc.querySelectorAll('[data-activity]').forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent='Toedien…';const r=await db.rpc('coach_assign_homework',{p_player_id:playerId,p_activity_id:b.dataset.activity});if(r.error){alert(r.error.message);b.disabled=false;b.textContent='Kies hierdie aktiwiteit';return}m.remove();await augment();await dots()})};doc.querySelectorAll('.hw-level').forEach(b=>b.onclick=()=>{selected=b.dataset.level;loadLevel()});await loadLevel()}function wire(){const doc=d();style();doc.addEventListener('click',e=>{const p=e.target.closest('[data-player]');if(p?.dataset.player){playerId=p.dataset.player;let n=0;const timer=setInterval(()=>{n++;const modal=doc.getElementById('modal'),profile=doc.getElementById('profile');if(profile&&modal&&!modal.classList.contains('hidden')&&profile.children.length){clearInterval(timer);augment()}if(n>30)clearInterval(timer)},100)}});setInterval(()=>{const modal=doc.getElementById('modal');if(playerId&&modal&&!modal.classList.contains('hidden'))augment();dots()},10000);setTimeout(dots,1200)}f.addEventListener('load',wire);})();</script></body></html>
