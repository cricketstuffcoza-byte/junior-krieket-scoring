<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Afrigter Portaal V25</title><style>html,body{margin:0;height:100%;background:#eef2f6}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="portal" src="coach-v25-main.html?v=20260902-homework" title="Afrigter Portaal V25"></iframe><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){const U='https://moomommajyldjquncnrd.supabase.co',K='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH';const db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),f=document.getElementById('portal');let playerId=null,styleDone=false;const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[m]));function d(){return f.contentDocument||f.contentWindow.document}function addStyle(){if(styleDone)return;styleDone=true;const s=d().createElement('style');s.textContent='.hw-status{display:inline-flex;align-items:center;gap:7px;font-weight:900}.hw-dot{width:12px;height:12px;border-radius:50%;display:inline-block}.hw-red{background:#d92d20}.hw-green{background:#12b76a}.hw-grey{background:#98a2b3}.hw-box{border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin-top:18px;background:#f8fafc}.hw-modal{position:fixed;inset:0;background:#17203380;z-index:999;display:flex;align-items:center;justify-content:center;padding:18px}.hw-modal-box{background:#fff;width:min(760px,100%);max-height:88vh;overflow:auto;border-radius:18px;padding:20px}.hw-activity{border:1px solid #e4e7ec;border-radius:13px;padding:13px;margin:9px 0}.hw-activity button{margin-top:9px}.hw-history{border-top:1px solid #e4e7ec;margin-top:14px;padding-top:12px}.hw-done{color:#067647;font-weight:800}.hw-pending{color:#b42318;font-weight:800}';d().head.appendChild(s)}async function augment(){if(!playerId)return;const box=d().getElementById('profile');if(!box)return;addStyle();let sec=d().getElementById('playerHomeworkBox');if(!sec){sec=d().createElement('section');sec.id='playerHomeworkBox';sec.className='hw-box';box.appendChild(sec)}sec.innerHTML='<p class="muted">Laai huiswerkstatus…</p>';const st=await db.rpc('coach_get_homework_status',{p_player_id:playerId});const hist=await db.rpc('coach_get_player_homework',{p_player_id:playerId});if(st.error){sec.innerHTML='<p style="color:#b42318">Kon huiswerkstatus nie laai nie.</p>';return}const rows=hist.data||[],pending=st.data===true;const dot=pending?'hw-red':(rows.length?'hw-green':'hw-grey');const label=pending?'Huiswerk nog nie voltooi nie':(rows.length?'Huiswerk voltooi':'Geen huiswerk toegeken');sec.innerHTML='<div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><h3 style="margin:0">🏠 Huiswerk</h3><div class="hw-status" style="margin-top:7px"><span class="hw-dot '+dot+'"></span>'+label+'</div></div><button id="giveHomework" class="primary" type="button">➕ Gee huiswerk</button></div>'+(rows.length?'<div class="hw-history"><b>Huiswerk geskiedenis</b>'+rows.slice(0,5).map(x=>'<div style="border:1px solid #e4e7ec;border-radius:10px;padding:10px;margin-top:8px;background:#fff"><b>'+esc(x.title)+'</b><div class="muted">15 minute · '+esc(x.category)+'</div><div class="'+(x.completed_at?'hw-done':'hw-pending')+'" style="margin-top:4px">'+(x.completed_at?'✓ Voltooi':'● Wag vir ouer se regmerkie')+'</div></div>').join('')+'</div>':'');d().getElementById('giveHomework').onclick=openChooser}async function openChooser(){addStyle();const old=d().getElementById('hwChooser');if(old)old.remove();const m=d().createElement('div');m.id='hwChooser';m.className='hw-modal';m.innerHTML='<div class="hw-modal-box"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><h2 style="margin:0">➕ Gee huiswerk</h2><button id="hwClose" class="ghost" type="button">Sluit</button></div><p class="muted">Kies een 15-minute aktiwiteit vir hierdie speler.</p><div id="hwActivities">Laai aktiwiteite…</div></div>';d().body.appendChild(m);d().getElementById('hwClose').onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()};const q=await db.rpc('coach_list_homework_activities');if(q.error){d().getElementById('hwActivities').innerHTML='<p style="color:#b42318">'+esc(q.error.message)+'</p>';return}const list=q.data||[];d().getElementById('hwActivities').innerHTML=list.map(x=>'<div class="hw-activity"><b>'+esc(x.title)+'</b><div class="muted" style="margin-top:3px">'+esc(x.category)+' · 15 minute</div><p style="line-height:1.45">'+esc(x.instructions)+'</p><button class="primary" data-activity="'+esc(x.id)+'" type="button">Kies hierdie aktiwiteit</button></div>').join('');d().querySelectorAll('[data-activity]').forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent='Toedien…';const r=await db.rpc('coach_assign_homework',{p_player_id:playerId,p_activity_id:b.dataset.activity});if(r.error){alert(r.error.message);b.disabled=false;b.textContent='Kies hierdie aktiwiteit';return}m.remove();await augment()})}function wire(){const doc=d();addStyle();doc.addEventListener('click',e=>{const p=e.target.closest('[data-player]');if(p&&p.dataset.player){playerId=p.dataset.player;setTimeout(augment,120)}});const prof=doc.getElementById('profile');if(prof){new MutationObserver(()=>{if(playerId)setTimeout(augment,50)}).observe(prof,{childList:true,subtree:true})}setInterval(()=>{const modal=doc.getElementById('modal');if(playerId&&modal&&!modal.classList.contains('hidden'))augment()},15000)}f.addEventListener('load',wire);})();</script></body></html>
