YGBQ_VBBlEGAH',db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){try{const{data:{session}}=await db.auth.getSession();if(!session){$('playerMsg').textContent='Meld eers aan om jou spelers te sien.';return}const t=await db.from('coach_teams').select('team_id,teams(id,name,age_group,active)').eq('coach_user_id',session.user.id).eq('active',true);if(t.error)throw t.error;const teams=(t.data||[]).map(x=>x.teams).filter(Boolean).filter(x=>x.active!==false);if(!teams.length){$('playerMsg').textContent='Geen aktiewe spanne is tans aan jou toegeken nie.';return}const ids=teams.map(x=>x.id);const p=await db.from('players').select('id,first_name,surname,team_id,active').in('team_id',ids).eq('active',true).order('surname').order('first_name');if(p.error)throw p.error;const by={};(p.data||[]).forEach(x=>(by[x.team_id]??=[]).push(x));$('playerMsg').textContent=teams.length+' span'+(teams.length===1?'':'ne')+' • '+(p.data||[]).length+' aktiewe speler'+((p.data||[]).length===1?'':'s');$('playerTeams').innerHTML=teams.map(t=>`<div class="team"><div class="teamhead"><strong>${esc(t.name)}</strong><span class="pill">${esc(t.age_group)} · ${(by[t.id]||[]).length} spelers</span></div>${(by[t.id]||[]).length?(by[t.id]||[]).map(x=>`<div class="player">${esc(x.first_name)} ${esc(x.surname)}</div>`).join(''):'<div class="muted" style="margin-top:8px">Geen aktiewe spelers in hierdie span nie.</div>'}</div>`).join('')}catch(e){$('playerMsg').textContent='Kon spelers nie laai nie: '+(e.message||String(e));$('playerMsg').style.color='#b42318'}}db.auth.onAuthStateChange(()=>setTimeout(load,150));load()})();</script></body></html>
