<!doctype html>
<html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Junior Krieket – O/6 Herstel V20</title>
<style>html,body{margin:0;width:100%;height:100%;background:#eef2f6;font-family:system-ui,sans-serif}#boot{max-width:900px;margin:40px auto;background:#fff;border-radius:16px;padding:24px;font-weight:800;line-height:1.5}#app{display:none;width:100%;height:100%;border:0}</style></head>
<body><div id="boot">Laai en herstel die O/6 wedstryd…</div><iframe id="app" title="Junior Krieket O/6 Telkaart"></iframe>
<script>
'use strict';
(async function(){
 const id=new URLSearchParams(location.search).get('match'),boot=document.getElementById('boot'),frame=document.getElementById('app');
 if(!id){boot.textContent='Geen wedstryd-ID is verskaf nie.';return}
 const MID='54e506e4-dcdc-478c-b223-c748e784f5de';
 if(id!==MID){boot.textContent='Hierdie herstelroete is net vir die Vikings vs Dragons wedstryd.';return}
 const fail=(e)=>{boot.textContent='Herstel het misluk: '+(e?.message||e);boot.style.color='#b42318';console.error(e)};
 try{
   const rr=await fetch('./restore-vikings-dragons.html?x='+Date.now(),{cache:'no-store'});
   if(!rr.ok)throw Error('restore-vikings-dragons.html kon nie gelaai word nie ('+rr.status+').');
   const txt=await rr.text(),dm=txt.match(/const DATA='([^']+)'/);
   if(!dm)throw Error('Die gestoorde hersteldata is nie gevind nie.');
   const raw=atob(dm[1]),bytes=new Uint8Array(raw.length);
   for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
   const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
   const backup=JSON.parse(await new Response(stream).text());
   if(!backup?.state?.started)throw Error('Die gestoorde wedstryd is nie aktief nie.');
   const cr=await fetch('./o6-v19-core.html?x='+Date.now(),{cache:'no-store'});
   if(!cr.ok)throw Error('o6-v19-core.html kon nie gelaai word nie ('+cr.status+').');
   let html=await cr.text();
   const matchObj={teamA:'Vikings',teamB:'Dragons',group:'U/6',date:'2026-08-31',time:'17:30',venue:'Laerskool Wonderboom'};
   html=html.replace(/const MATCH=\{[^;]*\};/,'const MATCH='+JSON.stringify(matchObj)+';');
   html=html.replace(/const PLAYERS=\{[\s\S]*?\};\s*const RULES=/,'const PLAYERS='+JSON.stringify({Vikings:['De Wet Cilliers','Drikus Venter','Heinro Michau','Henrique Bronkhorst','Joshua van Staden','Juandré Van Loggerenberg','Kai van Schoor','Ryan Nolte','Zayn Steynberg'],Dragons:['Caelem Meeling','CJ Kruger','DeAndre Joubert','Edward Nienaber','Jacques Marais','Keegan Kruger','Lehan Benadie','Preston Kruger','Tristan Theron']})+';\nconst RULES=');
   html=html.replace(/<div class="locked">Blitzwolwe<\/div>/g,'<div class="locked">Vikings</div>').replace(/<div class="locked">Sixers<\/div>/g,'<div class="locked">Dragons</div>').replace(/<option>Blitzwolwe<\/option>/g,'<option>Vikings</option>').replace(/<option>Sixers<\/option>/g,'<option>Dragons</option>');
   html=html.replace('Plaaslike toetsweergawe • wedstrydinstellings is deur Admin vooraf bepaal','O/6 Alpha & Omega • gestoorde Vikings vs Dragons wedstryd');
   const availFix='function available(){const all=teamPlayers().filter(n=>{if(!state.bats[n])state.bats[n]=makeBatter(n);return !state.bats[n].out&&!state.bats[n].retired;});if(MATCH.group==="U/8")return all;const fresh=all.filter(n=>!state.completedPairPlayers.includes(n));if(fresh.length===1)return all;return fresh}';
   html=html.replace(/function available\(\)\{[^}]*\}/,availFix);
   frame.srcdoc=html;
   let done=false;
   frame.onload=function(){
     if(done)return; done=true;
     try{
       const stateJson=JSON.stringify(backup.state);
       const code='state='+stateJson+'; undoStack=[]; render(); state.striker=null; state.nonStriker=null; state.bowler=null; state.selectedPair=[]; render(); openPair(); render(); document.getElementById("status").textContent="Gestoorde Vikings vs Dragons wedstryd herstel: Dragons 65/11 na 64 wettige balle. Kies nou die nuwe kolfpaar."; document.getElementById("status").className="banner blue";';
       frame.contentWindow.eval(code);
       boot.style.display='none';frame.style.display='block';
     }catch(e){fail(e)}
   };
   setTimeout(()=>{if(!done)fail(Error('Die telkaart-kern het nie betyds gelaai nie.'))},12000);
 }catch(e){fail(e)}
})();
</script></body></html>
