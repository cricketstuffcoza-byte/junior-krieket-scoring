id],B=map[m.team_b_id];if(!A||!B)throw Error('Die twee spanne kon nie uit die wedstryd gevind word nie.');const mp=await db.from('match_players').select('player_id,team_id,players(first_name,surname)').eq('match_id',id);if(mp.error)throw mp.error;const P={};P[A]=(mp.data||[]).filter(x=>x.team_id===m.team_a_id&&x.players).map(x=>[x.players.first_name,x.players.surname].filter(Boolean).join(' '));P[B]=(mp.data||[]).filter(x=>x.team_id===m.team_b_id&&x.players).map(x=>[x.players.first_name,x.players.surname].filter(Boolean).join(' '));if(P[A].length<2||P[B].length<2)throw Error('Die wedstryd se spelers kon nie volledig gelaai word nie.');const r=await fetch(BASE,{cache:'no-store'});if(!r.ok)throw Error('Die Alpha & Omega basis-telkaart kon nie gelaai word nie.');let h=await r.text();const M={teamA:A,teamB:B,group:'U/6',date:m.match_date||'',time:String(m.match_time||'').slice(0,5),venue:m.venue||''};h=h.replace(/const\s+MATCH\s*=\s*\{[\s\S]*?\};/,'const MATCH='+JSON.stringify(M)+';');h=h.replace(/const\s+PLAYERS\s*=\s*\{[\s\S]*?\};/,'const PLAYERS='+JSON.stringify(P)+';');h=h.replace(/Plaaslike toetsweergawe[^<]*/g,'Alpha & Omega U/6 V20');const f=$('frame');f.src=URL.createObjectURL(new Blob([h],{type:'text/html'}));f.classList.remove('hidden')}init().catch(fail)</script></body></html>
