<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Ouerportaal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,sans-serif;background:#eef2f6;color:#172033;margin:0}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;margin-bottom:6px}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd2da;border-radius:9px}button{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#172033;color:white}.ghost{background:#eef2f6}.hidden{display:none}.muted{color:#667085}.error{color:#b42318}.ok{color:#067647}.child{border:1px solid #e4e7ec;border-radius:12px;padding:14px;margin:10px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section id="auth" class="card"><h1>🏏 Junior Krieket – Ouerportaal</h1><p class="muted">Meld aan of registreer as ouer/voog.</p><div id="tabs"><button id="loginTab" class="primary">Meld Aan</button> <button id="signupTab" class="ghost">Registreer</button></div><form id="login" class="grid" style="margin-top:18px"><div><label>E-pos</label><input id="le" type="email" required></div><div><label>Wagwoord</label><input id="lp" type="password" required></div><button class="primary">Meld Aan</button></form><form id="signup" class="hidden" style="margin-top:18px"><div class="grid"><div><label>Volle naam</label><input id="name" required></div><div><label>Selfoonnommer</label><input id="phone"></div><div><label>E-pos</label><input id="se" type="email" required></div><div><label>Wagwoord</label><input id="sp" type="password" minlength="8" required></div><div><label>Verhouding</label><select id="rel"><option>Ouer</option><option>Voog</option><option>Ander</option></select></div><div><label>Kind / speler se volle naam</label><input id="child" required></div></div><button class="primary" style="margin-top:14px">Registreer</button></form><p id="msg" class="muted"></p></section><main id="app" class="hidden"><section class="card"><div style="display:flex;justify-content:space-between"><div><h1>👨‍👩‍👧 My Ouerportaal</h1><p id="welcome" class="muted"></p></div><button id="logout" class="ghost">Teken uit</button></div></section><section class="card"><h2>My kinders</h2><div id="children"></div></section><section class="card"><h2>📅 Wedstryde</h2><div id="matches"></div></section></main></div><script>(function(){const URL='https://moomommajyldjquncnrd.supabase.co',KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH';let db,session;const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function msg(t,c='muted'){$('msg').textContent=t;$('msg').className=c}function tabs(login){$('login').classList.toggle('hidden',!login);$('signup').classList.toggle('hidden',login);$('loginTab').className=login?'primary':'ghost';$('signupTab').className=login?'ghost':'primary'}async function signup(e){e.preventDefault();try{msg('Skep rekening…');const email=$('se').value.trim(),password=$('sp').value;const {data,error}=await db.auth.signUp({email,password,options:{data:{full_name:$('name').value.trim(),phone:$('phone').value.trim(),role:'guardian'}}});if(error)throw error;if(!data.user)throw Error('Registrasie kon nie voltooi word nie.');const {error:pe}=await db.from('parent_approval_requests').insert({guardian_user_id:data.user.id,requested_child_name:$('child').value.trim(),requested_email:email,requested_phone:$('phone').value.trim(),relationship:$('rel').value,status:'pending'});if(pe)throw pe;msg('Registrasie ontvang. Jou profiel wag nou vir admin-goedkeuring. Ons sal jou per e-pos laat weet wanneer toegang gereed is.','ok');tabs(true)}catch(e){msg(e.message||String(e),'error')}}async function start(s){session=s;const {data:p,error}=await db.from('user_profiles').select('full_name,role,active').eq('user_id',s.user.id).maybeSingle();if(error)throw error;if(!p||!['guardian','parent','ouer'].includes(String(p.role).toLowerCase())||p.active===false){msg('Jou ouer/voogprofiel is nog nie goedgekeur nie.','error');return} $('auth').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='Welkom, '+(p.full_name||s.user.email);await load()}async function load(){const {data,error}=await db.from('guardian_players').select('player_id,relationship,players(id,first_name,surname,team_id,teams(name,age_group))').eq('guardian_user_id',session.user.id);if(error)throw error;const kids=data||[];$('children').innerHTML=kids.length?kids.map(x=>`<div class="child"><b>${esc(x.players?.first_name)} ${esc(x.players?.surname)}</b><div class="muted">${esc(x.players?.teams?.name||'')} · ${esc(x.players?.teams?.age_group||'')} · ${esc(x.relationship||'')}</div></div>`).join(''):'<p class="muted">Geen kinders is tans aan jou rekening gekoppel nie.</p>';const ids=kids.map(x=>x.player_id);if(!ids.length){$('matches').innerHTML='<p class="muted">Geen wedstryde.</p>';return}const {data:rows,error:me}=await db.from('matches').select('id,age_group,team_a_id,team_b_id,match_date,match_time,venue,status').in('age_group',kids.map(x=>x.players?.teams?.age_group).filter(Boolean));if(me)throw me;const teamIds=[...new Set(kids.map(x=>x.players?.team_id).filter(Boolean))];const relevant=(rows||[]).filter(m=>teamIds.includes(m.team_a_id)||teamIds.includes(m.team_b_id));$('matches').innerHTML=relevant.length?relevant.map(m=>`<div class="child"><b>${esc(m.status)} · ${esc(m.age_group)}</b><div>${esc(m.match_date)} ${esc(m.match_time||'')} · ${esc(m.venue||'')}</div>${String(m.status).toUpperCase()==='LIVE'?`<button class="primary" style="margin-top:9px" onclick="location.href='live-score.html?match=${encodeURIComponent(m.id)}'">🔴 Volg Regstreeks</button>`:''}</div>`).join(''):'<p class="muted">Geen geskeduleerde wedstryde.</p>'}async function login(e){e.preventDefault();try{const {data,error}=await db.auth.signInWithPassword({email:$('le').value.trim(),password:$('lp').value});if(error)throw error;await start(data.session)}catch(e){msg(e.message||String(e),'error')}}function init(){db=window.supabase.createClient(URL,KEY);$('login').onsubmit=login;$('signup').onsubmit=signup;$('loginTab').onclick=()=>tabs(true);$('signupTab').onclick=()=>tabs(false);$('logout').onclick=()=>db.auth.signOut();db.auth.getSession().then(({data:{session:s}})=>s&&start(s))}init()})();</script></body></html>
