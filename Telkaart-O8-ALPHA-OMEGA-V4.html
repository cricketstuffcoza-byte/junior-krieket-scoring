<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Junior Krieket – O/8 T80 V4</title><style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#eef2f6}iframe{display:block;width:100%;height:100%;height:100dvh;border:0}</style></head><body><iframe id="scorecard" title="O/8 T80 V4"></iframe><script>'use strict';const frame=document.getElementById('scorecard');frame.src='./Telkaart-O8-ALPHA-OMEGA-V2.html'+(location.search||'')+(location.hash||'');frame.addEventListener('load',()=>{const w=frame.contentWindow,d=frame.contentDocument;try{const score=d.getElementById('scoreCard'),batSelect=d.getElementById('batSelect'),wide=d.getElementById('wide'),nb=d.getElementById('noball'),wicket=d.getElementById('wicket');if(!score||!w.current||!w.endDelivery)return;const state=()=>{try{return w.eval('state')}catch(e){return null}};const install=()=>{try{w.eval("window.__v4score=function(kind,runs,meta){const s=state,i=current();if(!s||!s.started||!i||!i.striker||!i.non||!i.bowler||i.retirementPending)return false;const striker=i.striker,ps=playerStats(striker),bs=bowlStats(i.bowler);let n=Math.max(0,Math.floor(Number(runs)||0)),teamRuns=0,label='';i.balls++;i.overBalls++;ps.balls++;bs.balls++;if(kind==='RUN'){teamRuns=n;i.runs+=n;bs.runs+=n;ps.runs+=n;if(n===4)ps.fours++;if(n===6)ps.sixes++;label=pname(striker)+' +'+n;if(n%2)[i.striker,i.non]=[i.non,i.striker]}else if(kind==='WIDE'){teamRuns=1+n;i.runs+=teamRuns;bs.runs+=teamRuns;bs.wides+=teamRuns;label='WIDE +'+teamRuns+' (1 + '+n+')'}else if(kind==='NOBALL'){teamRuns=1+n;i.runs+=teamRuns;bs.runs+=teamRuns;bs.noballs+=teamRuns;if(meta.type==='BAT'){ps.runs+=n;if(n===4)ps.fours++;if(n===6)ps.sixes++;if(n%2)[i.striker,i.non]=[i.non,i.striker]}else if(n%2)[i.striker,i.non]=[i.non,i.striker];label='NO-BALL +'+teamRuns+' (1 + '+(meta.type==='BAT'?'bat ':meta.type==='BYE'?'bye ':'leg-bye ')+n+')'}else{teamRuns=n;i.runs+=n;label=kind==='BYE'?'BYE +'+n:'LEG-BYE +'+n;if(n%2)[i.striker,i.non]=[i.non,i.striker]}s.log.push({ball:(i.overs||0)+'.'+i.overBalls,text:label});render();endDelivery();return true};")}catch(e){console.error('V4 bridge',e)}};install();const refresh=()=>{const s=state(),i=s&&w.current();if(i&&s.started&&i.striker&&i.non&&i.bowler){if(batSelect)batSelect.classList.add('hidden');if(score)score.classList.remove('hidden')}d.querySelectorAll('.label').forEach(x=>{if(['Striker','Kolwer'].includes(x.textContent.trim()))x.textContent='Kolwer';if(['Non-striker','Nie-kolwer'].includes(x.textContent.trim()))x.textContent='Nie-kolwer'})};refresh();function call(kind,n=0,meta={}){try{if(typeof w.__v4score==='function')w.__v4score(kind,n,meta);else{install();w.__v4score&&w.__v4score(kind,n,meta)}}catch(e){console.error(e)}}function askNum(msg,def='0'){const v=w.prompt(msg,def);if(v===null)return null;const n=Number(v);if(!Number.isFinite(n)||n<0)return null;return Math.floor(n)}d.querySelectorAll('#scoreCard button[data-run]').forEach(b=>{b.onclick=null;b.addEventListener('click',()=>call('RUN',Number(b.dataset.run)))});if(wide){wide.onclick=null;wide.addEventListener('click',()=>{const n=askNum('Hoeveel ekstra wide-lopies was daar NA die aanvanklike wide?','0');if(n!==null)call('WIDE',n)})}if(nb){nb.onclick=null;nb.addEventListener('click',()=>{const v=w.prompt('NO-BALL: tik BAT, BYE of LEG-BYE','BAT');if(v===null)return;const t=v.trim().toUpperCase();if(!['BAT','BYE','LEG-BYE'].includes(t)){w.alert('Kies BAT, BYE of LEG-BYE.');return}const n=askNum('Hoeveel lopies was daar NA die no-ball ekstra 1?','0');if(n!==null)call('NOBALL',n,{type:t})})}let by=d.getElementById('bye'),lb=d.getElementById('legbye');if(!by){by=d.createElement('button');by.id='bye';by.className='extra';by.textContent='BYE';score.querySelector('.score').insertBefore(by,wicket)}if(!lb){lb=d.createElement('button');lb.id='legbye';lb.className='extra';lb.textContent='LEG-BYE';score.querySelector('.score').insertBefore(lb,wicket)}by.onclick=()=>{const n=askNum('Hoeveel bye-lopies?','1');if(n!==null)call('BYE',n)};lb.onclick=()=>{const n=askNum('Hoeveel leg-bye-lopies?','1');if(n!==null)call('LEG_BYE',n)};if(wicket){wicket.onclick=null;wicket.addEventListener('click',()=>{const s=state(),i=w.current();if(!s||!s.started||!i||!i.striker||!i.non||!i.bowler)return;score.classList.add('hidden');const card=d.getElementById('dismissCard');if(card){card.classList.remove('hidden');const choices=d.getElementById('dismissChoices'),confirm=d.getElementById('confirmDismiss');let pending=null;const opts=[['BOWLED','Geboul'],['CAUGHT','Gevang'],['STUMPED','Gestump'],['LBW','LBW'],['RUN OUT','Uitgehard'],['HIT WICKET','Houtjie getref'],['OBSTRUCTING THE FIELD','Veld belemmer']];choices.innerHTML=opts.map(o=>'<button data-reason="'+o[0]+'">'+o[1]+'</button>').join('');confirm.disabled=true;choices.querySelectorAll('button').forEach(b=>b.onclick=()=>{pending=b.dataset.reason;choices.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');confirm.disabled=false});confirm.onclick=()=>{if(!pending)return;const i=w.current(),striker=i.striker,ps=w.playerStats(striker),bs=w.bowlStats(i.bowler);i.balls++;i.overBalls++;ps.balls++;bs.balls++;i.wickets++;i.out.push(striker);ps.out=pending;bs.wickets++;i.striker=null;w.render();card.classList.add('hidden');const nc=d.getElementById('newBatterCard'),cc=d.getElementById('newBatterChoices'),cb=d.getElementById('confirmNewBatter');if(!nc||!cc||!cb){w.endDelivery();return}w.renderNewBatter&&w.renderNewBatter();let sel=null;cc.querySelectorAll('button').forEach(b=>b.onclick=()=>{sel=b.dataset.id;cc.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');cb.disabled=false});cb.disabled=true;nc.classList.remove('hidden');cb.onclick=()=>{if(!sel)return;i.striker=sel;nc.classList.add('hidden');score.classList.remove('hidden');w.render();w.endDelivery()}}}})}refresh()}}catch(e){console.error('O/8 V4:',e)}});</script></body></html>
