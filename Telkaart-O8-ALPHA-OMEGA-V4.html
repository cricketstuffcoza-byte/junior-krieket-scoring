<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – O/8 T80 Alpha & Omega V4</title></head><body><p id="m">Laai O/8 telkaart…</p><script>
(async()=>{try{const r=await fetch('./Telkaart-O8-ALPHA-OMEGA-V2.html',{cache:'no-store'});if(!r.ok)throw Error('O/8 telkaart kon nie gelaai word nie.');let h=await r.text();
const old=`function addDelivery(kind,runs=0){const i=current();if(!state.started||!i.striker||!i.non||!i.bowler||i.retirementPending)return;const striker=i.striker,bs=bowlStats(i.bowler),ps=playerStats(striker);i.balls++;i.overBalls++;ps.balls++;bs.balls++;i.runs+=runs;bs.runs+=runs;if(kind==='RUN'){ps.runs+=runs;if(runs===4)ps.fours++;if(runs===6)ps.sixes++;}if(kind==='WIDE'){i.runs+=1;bs.runs+=1;bs.wides++;}if(kind==='NOBALL'){i.runs+=1;bs.runs+=1;bs.noballs++;}if(kind==='RUN'&&runs%2)[i.striker,i.non]=[i.non,i.striker];state.log.push({ball:\`${'${'}i.overs}.${'${'}i.overBalls}\`,text:kind==='RUN'?\`${'${'}pname(striker)} +${'${'}runs}\`:\`${'${'}kind} +1 spanlopie; geen kolwer-lopie\`});render();endDelivery()}`;
const fresh=`function addDelivery(kind,runs=0,meta={}){const i=current();if(!state.started||!i.striker||!i.non||!i.bowler||i.retirementPending)return;const striker=i.striker,bs=bowlStats(i.bowler),ps=playerStats(striker);i.balls++;i.overBalls++;ps.balls++;bs.balls++;let teamRuns=0,batRuns=0,label='';if(kind==='RUN'){teamRuns=runs;batRuns=runs;ps.runs+=runs;if(runs===4)ps.fours++;if(runs===6)ps.sixes++;bs.runs+=teamRuns;label=\`${'${'}pname(striker)} +${'${'}runs}\`;if(runs%2)[i.striker,i.non]=[i.non,i.striker]}else if(kind==='WIDE'){const extra=Math.max(0,Number(runs)||0);teamRuns=1+extra;bs.runs+=teamRuns;bs.wides+=teamRuns;label=\`WIDE +${'${'}teamRuns} (1 + ${'${'}extra})\`}else if(kind==='NOBALL'){const extra=Math.max(0,Number(runs)||0);teamRuns=1+extra;bs.runs+=teamRuns;bs.noballs+=teamRuns;if(meta.type==='BAT'){batRuns=extra;ps.runs+=extra;if(extra===4)ps.fours++;if(extra===6)ps.sixes++;}label=\`NO-BALL +${'${'}teamRuns} (1 + ${'${'}meta.type==='BAT'?'bat '+extra:meta.type==='BYE'?'bye '+extra:'leg-bye '+extra})\`}else if(kind==='BYE'||kind==='LEG_BYE'){teamRuns=Math.max(0,Number(runs)||0);bs.runs+=0;label=kind==='BYE'?\`BYE +${'${'}teamRuns}\`:\`LEG-BYE +${'${'}teamRuns}\`}i.runs+=teamRuns;state.log.push({ball:\`${'${'}i.overs}.${'${'}i.overBalls}\`,text:label});render();endDelivery()}`;
if(!h.includes(old))throw Error('O/8 scoring-funksie kon nie gevind word nie.');h=h.replace(old,fresh);
const oldScore='<button id="wide" class="extra">WIDE +1</button><button id="noball" class="extra">NO-BALL +1</button><button id="wicket" class="danger">WICKET</button>';
const newScore='<button id="wide" class="extra">WIDE</button><button id="noball" class="extra">NO-BALL</button><button id="bye" class="extra">BYE</button><button id="legbye" class="extra">LEG-BYE</button><button id="wicket" class="danger">WICKET</button>';
if(!h.includes(oldScore))throw Error('O/8 extras-knoppies kon nie gevind word nie.');h=h.replace(oldScore,newScore);
const inject=`<section id="extrasCard" class="card hidden"><h3 id="extrasTitle">Ekstra lopies</h3><p id="extrasHelp" class="muted"></p><label id="extrasLabel">Ekstra lopies</label><input id="extrasRuns" type="number" min="0" max="20" value="0" style="width:100%;padding:12px;box-sizing:border-box;margin:8px 0"><div id="nbType" class="choices hidden"><button data-type="BAT">🏏 BAT</button><button data-type="BYE">BYE</button><button data-type="LEG_BYE">LEG-BYE</button></div><button id="extrasConfirm" class="primary" disabled>BEVESTIG</button></section>`;
h=h.replace('<section id="dismissCard"',inject+'<section id="dismissCard"');
const scriptInject=`
(function(){let extraKind=null,nbType=null;function openExtras(kind){extraKind=kind;nbType=kind==='NOBALL'?'BAT':null;const c=document.getElementById('extrasCard'),t=document.getElementById('extrasTitle'),help=document.getElementById('extrasHelp'),label=document.getElementById('extrasLabel'),inp=document.getElementById('extrasRuns'),types=document.getElementById('nbType'),btn=document.getElementById('extrasConfirm');inp.value='0';types.classList.toggle('hidden',kind!=='NOBALL');t.textContent=kind==='WIDE'?'WIDE':'NO-BALL';help.textContent=kind==='WIDE'?'1 wide-lopie word outomaties bygetel. Kies enige bykomende wide-lopies.':'Die 1 no-ball-lopie word outomaties bygetel. Kies BAT, BYE of LEG-BYE vir enige verdere lopies.';label.textContent=kind==='WIDE'?'Bykomende wide-lopies':'Lopies ná die no-ball';btn.disabled=kind==='NOBALL';c.classList.remove('hidden');if(kind==='NOBALL')document.querySelectorAll('#nbType button').forEach(b=>b.classList.toggle('selected',b.dataset.type==='BAT'));}function closeExtras(){document.getElementById('extrasCard').classList.add('hidden');extraKind=null;nbType=null;}document.getElementById('wide').onclick=()=>openExtras('WIDE');document.getElementById('noball').onclick=()=>openExtras('NOBALL');document.getElementById('bye').onclick=()=>{if(!state||!state.started)return;const n=prompt('Hoeveel bye-lopies?','1');if(n!==null&&Number(n)>=0)addDelivery('BYE',Number(n))};document.getElementById('legbye').onclick=()=>{if(!state||!state.started)return;const n=prompt('Hoeveel leg-bye-lopies?','1');if(n!==null&&Number(n)>=0)addDelivery('LEG_BYE',Number(n))};document.getElementById('extrasRuns').oninput=()=>{const v=Number(document.getElementById('extrasRuns').value);document.getElementById('extrasConfirm').disabled=extraKind==='NOBALL'&&!nbType};document.querySelectorAll('#nbType button').forEach(b=>b.onclick=()=>{nbType=b.dataset.type;document.querySelectorAll('#nbType button').forEach(x=>x.classList.toggle('selected',x===b));document.getElementById('extrasConfirm').disabled=false});document.getElementById('extrasConfirm').onclick=()=>{const n=Math.max(0,Number(document.getElementById('extrasRuns').value)||0);if(extraKind==='WIDE')addDelivery('WIDE',n);else addDelivery('NOBALL',n,{type:nbType||'BAT'});closeExtras()};})();`;
h=h.replace('<\/script>','<script>'+scriptInject+'<\/script></body></html>');
document.open();document.write(h);document.close();
}catch(e){document.getElementById('m').textContent=e.message;document.getElementById('m').style.color='#b42318'}})();</script></body></html>
