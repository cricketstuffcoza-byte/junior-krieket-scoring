<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Junior Krieket – O/8 T80 V4</title><style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#eef2f6}iframe{display:block;width:100%;height:100%;height:100dvh;border:0}</style></head><body><iframe id="scorecard" title="O/8 T80 V4"></iframe><script>'use strict';
const frame=document.getElementById('scorecard');
frame.src='./Telkaart-O8-ALPHA-OMEGA-V2.html'+(location.search||'')+(location.hash||'');
frame.addEventListener('load',()=>{const w=frame.contentWindow,d=frame.contentDocument;try{
const score=d.getElementById('scoreCard'), wide=d.getElementById('wide'), nb=d.getElementById('noball'), wicket=d.getElementById('wicket');
const labels=d.querySelectorAll('.label');labels.forEach(x=>{if(x.textContent.trim()==='Kolwer')x.textContent='Kolwer';if(x.textContent.trim()==='Nie-kolwer')x.textContent='Nie-kolwer';if(x.textContent.trim()==='Striker')x.textContent='Kolwer';if(x.textContent.trim()==='Non-striker')x.textContent='Nie-kolwer'});
if(!score||!w.current||!w.endDelivery)return;
function valid(){const i=w.current();return i&&w.state&&w.state.started&&i.striker&&i.non&&i.bowler&&!i.retirementPending}
function add(kind,runs=0,meta={}){const i=w.current();if(!valid())return;const striker=i.striker,bs=w.bowlStats(striker===i.bowler?i.bowler:i.bowler),ps=w.playerStats(striker);i.balls++;i.overBalls++;ps.balls++;bs.balls++;let teamRuns=0,label='';if(kind==='RUN'){teamRuns=Math.max(0,Number(runs)||0);i.runs+=teamRuns;bs.runs+=teamRuns;ps.runs+=teamRuns;if(teamRuns===4)ps.fours++;if(teamRuns===6)ps.sixes++;label=`${w.pname(striker)} +${teamRuns}`;if(teamRuns%2)[i.striker,i.non]=[i.non,i.striker]}else if(kind==='WIDE'){const extra=Math.max(0,Number(runs)||0);teamRuns=1+extra;i.runs+=teamRuns;bs.runs+=teamRuns;bs.wides+=teamRuns;label=`WIDE +${teamRuns} (1 + ${extra})`}else if(kind==='NOBALL'){const extra=Math.max(0,Number(runs)||0);teamRuns=1+extra;i.runs+=teamRuns;bs.runs+=teamRuns;bs.noballs+=teamRuns;if(meta.type==='BAT'){ps.runs+=extra;if(extra===4)ps.fours++;if(extra===6)ps.sixes++;if(extra%2)[i.striker,i.non]=[i.non,i.striker]}label=`NO-BALL +${teamRuns} (1 + ${meta.type==='BAT'?'bat '+extra:meta.type==='BYE'?'bye '+extra:'leg-bye '+extra})`}else if(kind==='BYE'||kind==='LEG_BYE'){teamRuns=Math.max(0,Number(runs)||0);i.runs+=teamRuns;label=kind==='BYE'?`BYE +${teamRuns}`:`LEG-BYE +${teamRuns}`;if(teamRuns%2)[i.striker,i.non]=[i.non,i.striker]}w.state.log.push({ball:`${i.overs}.${i.overBalls}`,text:label});w.render();w.endDelivery()}
function askNum(msg,def='0'){const v=w.prompt(msg,def);if(v===null)return null;const n=Number(v);if(!Number.isFinite(n)||n<0)return null;return Math.floor(n)}
// Normal run buttons were not wired by the V4 wrapper; wire them explicitly.
d.querySelectorAll('#scoreCard button[data-run]').forEach(b=>{b.onclick=()=>{const n=Number(b.dataset.run);add('RUN',n)}});
if(wide)wide.onclick=()=>{const n=askNum('Hoeveel ekstra wide-lopies was daar NA die aanvanklike wide?','0');if(n!==null)add('WIDE',n)};
if(nb)nb.onclick=()=>{const v=w.prompt('NO-BALL: tik BAT, BYE of LEG-BYE','BAT');if(v===null)return;const t=v.trim().toUpperCase();if(!['BAT','BYE','LEG-BYE'].includes(t)){w.alert('Kies BAT, BYE of LEG-BYE.');return}const n=askNum('Hoeveel lopies was daar NA die no-ball ekstra 1?','0');if(n!==null)add('NOBALL',n,{type:t})};
let by=d.getElementById('bye'),lb=d.getElementById('legbye');if(!by){by=d.createElement('button');by.id='bye';by.className='extra';by.textContent='BYE';score.querySelector('.score').insertBefore(by,wicket)}if(!lb){lb=d.createElement('button');lb.id='legbye';lb.className='extra';lb.textContent='LEG-BYE';score.querySelector('.score').insertBefore(lb,wicket)}by.onclick=()=>{const n=askNum('Hoeveel bye-lopies?','1');if(n!==null)add('BYE',n)};lb.onclick=()=>{const n=askNum('Hoeveel leg-bye-lopies?','1');if(n!==null)add('LEG_BYE',n)};
}catch(e){console.error('O/8 V4:',e)}});</script></body></html>
