<!doctype html>
<html lang="af">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Junior Krieket – My Portale</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#eef2f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:26px}.top{background:#172033;color:#fff;border-radius:22px;padding:28px 30px;display:flex;justify-content:space-between;align-items:center;gap:20px;box-shadow:0 8px 28px #17203325}.top h1{margin:0;font-size:30px}.top p{margin:6px 0 0;color:#d5deea}.logout{border:0;border-radius:11px;padding:11px 15px;font-weight:900;cursor:pointer;background:#fff;color:#172033}.status{margin:18px 0;color:#667085}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 4px 18px #17203312;border:1px solid #e7eaf0;display:flex;flex-direction:column;min-height:205px}.icon{font-size:38px}.card h2{margin:12px 0 6px;font-size:20px}.card p{margin:0;color:#667085;line-height:1.45;flex:1}.open{margin-top:18px;width:100%;border:0;border-radius:11px;padding:12px 14px;font-weight:900;cursor:pointer;background:#172033;color:#fff}.notice{margin-top:18px;background:#fff;border:1px solid #e7eaf0;border-radius:16px;padding:16px;color:#667085;font-size:13px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.wrap{padding:14px}.top{padding:22px;align-items:flex-start}.top h1{font-size:25px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<header class="top"><div><h1>🏏 Junior Krieket</h1><p id="welcome">Laai jou portale…</p></div><button class="logout" id="logout">Teken uit</button></header>
<div id="status" class="status">Bepaal jou toegang…</div><main id="grid" class="grid"></main><div class="notice">🔒 Jou toegang word deur jou bestaande Interhuis-rekening se aktiewe rolle bepaal. Geen bestaande portaal word deur hierdie skerm verander nie.</div>
</div>
<script>
(function(){
 const SUPABASE_URL='https://moomommajyldjquncnrd.supabase.co',SUPABASE_KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH';
 const db=globalThis.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id);
 const portals={admin:{icon:'🛠️',title:'Admin Portaal',desc:'Administrasie, spanne, spelers, afrigters en wedstryde.',href:'admin-v23.html',roles:['admin']},coach:{icon:'🏏',title:'Afrigter Portaal',desc:'Spanne, spelers, ontwikkeling en afrigterfunksies.',href:'coach-v26.html',roles:['admin','coach']},parent:{icon:'👨‍👩‍👧',title:'Ouer / Voog Portaal',desc:'Kindprofiele, statistieke en ouerfunksies.',href:'parent-v3.html',roles:['admin','coach','parent']}};
 function card(key){const p=portals[key];return '<section class="card"><div class="icon">'+p.icon+'</div><h2>'+p.title+'</h2><p>'+p.desc+'</p><button class="open" data-href="'+p.href+'">Open portaal →</button></section>'}
 document.addEventListener('click',e=>{const b=e.target.closest('[data-href]');if(b)location.href=b.dataset.href});
 $('logout').onclick=async()=>{await db.auth.signOut();location.replace('central-login.html')};
 async function init(){const s=await db.auth.getSession();if(!s.data.session){location.replace('central-login.html');return}const user=s.data.session.user;const p=await db.from('user_profiles').select('full_name,role,active').eq('user_id',user.id).maybeSingle();if(p.error)throw p.error;if(!p.data||!p.data.active)throw Error('Geen aktiewe Junior Krieket-profiel is aan hierdie rekening gekoppel nie.');const r=await db.from('user_roles').select('role').eq('user_id',user.id).eq('active',true);if(r.error)throw r.error;const roles=new Set([p.data.role,...(r.data||[]).map(x=>x.role)].filter(Boolean).map(x=>String(x).toLowerCase()));$('welcome').textContent='Welkom, '+(p.data.full_name||user.email)+' • Kies jou portaal';const keys=Object.keys(portals).filter(k=>portals[k].roles.some(role=>roles.has(role)));$('grid').innerHTML=keys.length?keys.map(card).join(''):'<section class="card"><div class="icon">🔒</div><h2>Geen portaaltoegang</h2><p>Jou rekening het tans geen aktiewe portaaltoegang nie.</p></section>';$('status').textContent=keys.length?'Beskikbare portale':'Geen portale beskikbaar nie';}
 init().catch(e=>{$('status').textContent=e.message||String(e);$('status').style.color='#b42318';});
})();
</script></body></html>
