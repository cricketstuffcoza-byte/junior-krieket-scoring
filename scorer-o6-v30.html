<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – O/6 Telkaart V30</title><style>html,body{margin:0;background:#eef2f6;width:100%;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="score" title="Junior Krieket O/6 Telkaart"></iframe><script>
'use strict';
const q=location.search,outer=document.getElementById('score');
outer.src='scorer-o6-v27.html'+q+'&fix=v30';
let lastBoundarySeen='', forcedResumeBoundary=false;
function innerDoc(){try{const d=outer.contentDocument;if(!d)return null;const f=d.getElementById('frame');return f&&f.contentDocument?f.contentDocument:null}catch(e){return null}}
function innerWin(){try{const d=outer.contentDocument,f=d&&d.getElementById('frame');return f&&f.contentWindow?f.contentWindow:null}catch(e){return null}}
function patch(){try{const d=innerDoc(),w=innerWin(),s=w&&w.__juniorState;if(!d||!w||!s)return;
if(Number(s.pairBalls)===16){const panel=d.getElementById('pairPanel'),choices=d.getElementById('pairChoices');if(panel&&!panel.classList.contains('hidden')&&choices){[s.striker,s.nonStriker].filter(Boolean).forEach(name=>{if(![...choices.children].some(b=>b.textContent.trim().replace(/ ✓.*$/,'')===name)){const b=d.createElement('button');b.type='button';b.className='btn choice';b.textContent=name;b.addEventListener('click',()=>{if(b.disabled)return;const i=s.selectedPair.indexOf(name);if(i>=0)s.selectedPair.splice(i,1);else if(s.selectedPair.length<2)s.selectedPair.push(name);[...choices.children].forEach(x=>x.classList.toggle('selected',s.selectedPair.includes(x.textContent.trim().replace(/ ✓.*$/,''))));const c=d.getElementById('confirmPair');if(c)c.disabled=s.selectedPair.length!==2});choices.appendChild(b)}})}}
const t=s.score&&s.batting?s.score[s.batting]:null,legal=t?Number(t.legalBalls||0):0,atBoundary=s.started&&!s.completed&&legal>0&&legal%8===0,bp=d.getElementById('bowlerPanel'),bc=d.getElementById('bowlerChoices'),boundaryKey=String(s.innings)+'-'+legal;
if(atBoundary&&bp){if(!bp.classList.contains('hidden'))lastBoundarySeen=boundaryKey;else if(lastBoundarySeen!==boundaryKey&&!forcedResumeBoundary&&typeof w.openBowler==='function'){forcedResumeBoundary=true;lastBoundarySeen=boundaryKey;s.bowler=null;w.openBowler();if(typeof w.render==='function')w.render()}}
if(bp&&!bp.classList.contains('hidden')&&bc){const enabled=[...bc.querySelectorAll('button')].filter(b=>!b.disabled);if(enabled.length===1){const previous=Array.isArray(s.usedBowlers)?s.usedBowlers.slice():[];previous.forEach(name=>{const existing=[...bc.querySelectorAll('button')].find(b=>b.textContent.trim().replace(/ ✓.*$/,'')===name);if(existing){existing.disabled=false;existing.textContent=name;if(!existing.dataset.v30wired){existing.dataset.v30wired='1';existing.addEventListener('click',()=>{[...bc.querySelectorAll('button')].forEach(x=>x.classList.remove('selected'));existing.classList.add('selected');s.selectedBowler=name;const c=d.getElementById('confirmBowler');if(c)c.disabled=false})}}else{const b=d.createElement('button');b.type='button';b.className='btn choice';b.textContent=name;b.addEventListener('click',()=>{[...bc.querySelectorAll('button')].forEach(x=>x.classList.remove('selected'));b.classList.add('selected');s.selectedBowler=name;const c=d.getElementById('confirmBowler');if(c)c.disabled=false});bc.appendChild(b)}});const msg=d.getElementById('bowlerMessage');if(msg)msg.textContent='Laaste nuwe bouler: kies die laaste nuwe bouler, of kies enige vorige bouler wat reeds geboul het.'}}
const actions=d.querySelector('.actions');if(actions&&!d.getElementById('saveMatch')){const b=d.createElement('button');b.id='saveMatch';b.type='button';b.className='btn';b.textContent='💾 STOOR HUIDIGE WEDSTRYD';b.addEventListener('click',()=>{try{const id=new URLSearchParams(location.search).get('match'),key='junior_krieket_v19_saved_'+id;localStorage.setItem(key,JSON.stringify({savedAt:new Date().toISOString(),state:w.__juniorState}));b.textContent='✓ GESTOOR';setTimeout(()=>b.textContent='💾 STOOR HUIDIGE WEDSTRYD',1800)}catch(e){alert('Kon nie die huidige wedstryd stoor nie: '+(e.message||e))}});actions.appendChild(b)}}catch(e){console.warn('O/6 v30 patch',e)}}
setInterval(patch,200);outer.addEventListener('load',()=>setTimeout(patch,350));
</script></body></html>
