<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>U13 Cricket Live</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#0b1220;color:#eef3f8}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1200px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.brand{font-weight:800;font-size:22px}.muted{color:#9eabbc}.card{background:#111b2d;border:1px solid #26334a;border-radius:16px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;color:#aeb9c8;font-weight:700;text-transform:uppercase;letter-spacing:.05em}.field input,.field select{background:#0b1424;border:1px solid #30405b;color:#fff;border-radius:10px;padding:11px 12px;outline:none}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800}.primary{background:#2f80ed;color:white}.secondary{background:#26344b;color:#fff}.danger{background:#a62d3a;color:white}.score{font-size:44px;font-weight:900}.setup-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.players input{width:100%}.playerRow{display:flex;gap:8px;align-items:center}.playerRow input{flex:1}.removePlayer{padding:8px 10px}.addPlayer{margin-top:10px}.scorebar{display:flex;justify-content:space-between;align-items:center;gap:14px;background:#0b1424;border:1px solid #2b3b55;border-radius:14px;padding:14px 16px}.statuspill{padding:6px 10px;border-radius:999px;background:#17253a;color:#9fd0ff;font-size:12px;font-weight:800}.controls{display:grid;grid-template-columns:repeat(7,minmax(64px,1fr));gap:9px}.controls button{min-height:58px;background:#26344b;color:#fff;border:1px solid #354760;border-radius:12px;font-weight:900;font-size:18px}.controls .run{background:#17345d}.controls .wicket{background:#612a38}.controls .extra{font-size:14px}.summary{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.mini{display:flex;justify-content:space-between;border-bottom:1px solid #243149;padding:9px 0}.mini:last-child{border-bottom:0}.wide{width:100%}.overlayWrap{min-height:100vh;background:transparent;padding:20px}.overlay{max-width:1000px;margin:auto;background:rgba(5,10,18,.94);border:1px solid rgba(255,255,255,.16);border-radius:12px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.35)}.ovtop{display:flex;align-items:center;justify-content:space-between;padding:12px 18px}.ovteams{display:flex;align-items:center;gap:18px;font-weight:900}.ovscore{font-size:34px}.ovsub{padding:8px 18px;background:rgba(255,255,255,.06);display:flex;justify-content:space-between;gap:12px;font-size:14px}.event{font-weight:900}.note{font-size:12px;color:#aeb9c8}.toast{position:fixed;right:18px;bottom:18px;background:#1a2940;border:1px solid #344966;padding:10px 14px;border-radius:10px;display:none}.center{text-align:center}@media(max-width:760px){.grid,.summary,.players{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}.controls{grid-template-columns:repeat(4,1fr)}.score{font-size:36px}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main id="root"></main><div id="toast" class="toast"></div><script>
const KEY='u13live.match.v1';
const wonderboom=['Tiaan Olivier','Sion Kruger','Julian Van Loggerenberg','Gideon Van Der Merwe','Christo Hendriks','Vaughn Venter','Liam Rademan','Mason Barkhuizen','Kelvin Botha','',''];
const diePoort=['Lian Spies','Pierre Potgieter','Janco Du Plessis','Carel Wentzel','Sebastiaan Fouche','Logan Kruger','Wynand Visagie','Connor Van Den Berg','Leo Camacho','',''];
const defaultState=()=>({screen:'setup',matchId:'',venue:'',overs:20,teams:[{name:'WONDERBOOM 13 A',players:[...wonderboom]},{name:'DIE POORT 13 A',players:[...diePoort]}],innings:0,score:0,wickets:0,legalBalls:0,ballsInOver:0,batters:[{name:'',runs:0,balls:0,out:false},{name:'',runs:0,balls:0,out:false}],striker:0,bowler:'',extras:{wide:0,noBall:0,bye:0,legBye:0},freeHit:false,events:[],target:null,completed:false,lastEvent:''});
let state=load(); function load(){try{return JSON.parse(localStorage.getItem(KEY))||defaultState()}catch{return defaultState()}} function save(){localStorage.setItem(KEY,JSON.stringify(state));try{window._bc?.postMessage(state)}catch{} render()} if('BroadcastChannel'in window){window._bc=new BroadcastChannel('u13-cricket-live');window._bc.onmessage=e=>{if(e.data&&e.data.matchId===state.matchId){state=e.data;render()}}}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} function route(){const p=new URLSearchParams(location.search);return p.get('overlay')?'overlay':'app'}
function setup(){return `<div class="app"><div class="top"><div><div class="brand">U/13 Cricket Live</div><div class="muted">2026 Primary School T20 scoring + broadcast overlay</div></div><span class="statuspill">U/13 • 20 overs</span></div><div class="card"><h2>New Match</h2><div class="grid"><div class="field"><label>Team 1</label><input id="t1" value="${esc(state.teams[0].name)}"></div><div class="field"><label>Team 2</label><input id="t2" value="${esc(state.teams[1].name)}"></div><div class="field"><label>Venue</label><input id="venue" value="${esc(state.venue)}"></div><div class="field"><label>Overs per side</label><select id="overs"><option value="20" selected>20</option><option value="19">19</option><option value="18">18</option><option value="17">17</option><option value="16">16</option><option value="15">15</option><option value="10">10</option><option value="5">5</option></select></div></div></div><div class="grid"><div class="card"><h3>${esc(state.teams[0].name)} players</h3><div class="players">${state.teams[0].players.map((p,i)=>`<div class="playerRow"><input data-team="0" data-i="${i}" value="${esc(p)}" placeholder="Player ${i+1}"><button type="button" class="btn secondary removePlayer" data-remove-team="0" data-remove-i="${i}">×</button></div>`).join('')}<button type="button" class="btn secondary addPlayer" data-add-team="0">+ Add player</button></div></div><div class="card"><h3>${esc(state.teams[1].name)} players</h3><div class="players">${state.teams[1].players.map((p,i)=>`<div class="playerRow"><input data-team="1" data-i="${i}" value="${esc(p)}" placeholder="Player ${i+1}"><button type="button" class="btn secondary removePlayer" data-remove-team="1" data-remove-i="${i}">×</button></div>`).join('')}<button type="button" class="btn secondary addPlayer" data-add-team="1">+ Add player</button></div></div></div><div class="card"><h3>Start match</h3><p class="muted">Players are pre-loaded from the supplied U/13 match report. You can add or remove players.</p><div class="setup-actions"><button class="btn secondary" id="demo">Load Demo Match</button><button class="btn primary" id="start">Start Match</button></div></div></div>`}
function scoreScreen(){const batting=state.teams[state.innings],bowling=state.teams[1-state.innings],ov=Math.floor(state.legalBalls/6)+'.'+(state.legalBalls%6);return `<div class="app"><div class="top"><div><div class="brand">${esc(batting.name)} vs ${esc(bowling.name)}</div><div class="muted">${esc(state.venue)} • ${esc(state.matchId)}</div></div><div><button class="btn secondary" id="overlay">Open Broadcast Overlay</button> <button class="btn danger" id="reset">Reset</button></div></div><div class="scorebar"><div><div class="muted">${state.innings===0?'1st':'2nd'} innings</div><div class="score">${state.score}/${state.wickets}</div><div class="muted">${ov} overs</div></div><div class="center"><div class="statuspill">${state.freeHit?'FREE HIT':''}</div><div class="note">Target: ${state.target??'—'}</div></div></div><div class="summary" style="margin-top:16px"><div class="card"><h3>Batters</h3>${state.batters.map((b,i)=>`<div class="mini"><span>${i===state.striker?'▶ ':''}${esc(b.name||'Select batter')} ${b.out?' • OUT':''}</span><b>${b.runs}${b.out?'':'*'} (${b.balls})</b></div>`).join('')}<div class="grid3" style="margin-top:12px"><div class="field"><label>Striker</label><select id="striker">${state.batters.map((b,i)=>`<option value="${i}" ${i===state.striker?'selected':''}>${esc(b.name||'Batter '+(i+1))}</option>`).join('')}</select></div><div class="field"><label>Bowler</label><input id="bowler" value="${esc(state.bowler)}" placeholder="Bowler name"></div></div></div><div class="card"><h3>Quick score</h3><div class="controls">${[0,1,2,3,4,6].map(n=>`<button class="run" data-action="run" data-value="${n}">${n}</button>`).join('')}<button class="wicket" data-action="wicket">W</button><button class="extra" data-action="wide">WIDE</button><button class="extra" data-action="noball">NO BALL</button><button class="extra" data-action="bye">BYE</button><button class="extra" data-action="legbye">LEG BYE</button><button class="extra" data-action="penalty">+5</button><button class="extra" data-action="undo">UNDO</button></div><p class="note" style="margin-top:12px">Testing build: wides/no-balls currently add 1 run; detailed extras and full U/13 law enforcement are next.</p></div></div><div class="card"><h3>Extras</h3><div class="grid3"><div>Wides <b>${state.extras.wide}</b></div><div>No-balls <b>${state.extras.noBall}</b></div><div>Byes <b>${state.extras.bye}</b></div><div>Leg-byes <b>${state.extras.legBye}</b></div></div></div></div>`}
function apply(action,val=0){if(state.completed)return;const prev=JSON.stringify(state);if(action==='undo'){if(state.events.length){state=JSON.parse(state.events.pop().before);save()}return}let legal=true,runs=0,event='';if(action==='wide'){runs=1;state.extras.wide++;legal=false;event='Wide'}else if(action==='noball'){runs=1;state.extras.noBall++;legal=false;state.freeHit=true;event='No Ball'}else if(action==='bye'){runs=val||1;state.extras.bye+=runs;event='Bye'}else if(action==='legbye'){runs=val||1;state.extras.legBye+=runs;event='Leg Bye'}else if(action==='penalty'){runs=5;event='Penalty +5'}else if(action==='wicket'){event='Wicket';state.wickets++;state.batters[state.striker].out=true;state.batters[state.striker].balls++;if(state.wickets<10){const next=prompt('New batter name?');state.batters[state.striker]={name:next||'New Batter',runs:0,balls:0,out:false}}else if(action==='run'){runs=val;state.batters[state.striker].runs+=runs;event=String(runs)}if(action!=='wicket'&&(action==='wide'||action==='noball')){}else if(action!=='wicket'&&action!=='penalty'){state.batters[state.striker].balls++;if((action==='run'||action==='bye'||action==='legbye')&&runs%2===1)state.striker=1-state.striker}state.score+=runs;if(legal){state.legalBalls++;if(state.legalBalls%6===0)state.striker=1-state.striker}if(state.freeHit&&action!=='noball'&&action!=='wide')state.freeHit=false;if(action==='wicket')state.freeHit=false;state.events.push({before:prev,event});state.lastEvent=event;save()}
function bindScore(){document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>apply(b.dataset.action,Number(b.dataset.value)||0)));document.getElementById('striker').addEventListener('change',e=>{state.striker=Number(e.target.value);save()});document.getElementById('bowler').addEventListener('input',e=>{state.bowler=e.target.value;localStorage.setItem(KEY,JSON.stringify(state))});document.getElementById('overlay').addEventListener('click',()=>window.open(location.pathname+'?overlay=1','_blank'));document.getElementById('reset').addEventListener('click',()=>{if(confirm('Reset this match?')){state=defaultState();save()}})}
function overlay(){return `<div class="overlayWrap"><div class="overlay"><div class="ovtop"><div class="ovteams"><span>${esc(state.teams[state.innings].name)}</span><span class="ovscore">${state.score}/${state.wickets}</span></div><div class="note">${Math.floor(state.legalBalls/6)}.${state.legalBalls%6} OV</div></div><div class="ovsub"><span>${esc(state.batters[state.striker]?.name||'')} <b>${state.batters[state.striker]?.runs||0}*</b></span><span>${esc(state.batters[1-state.striker]?.name||'')} <b>${state.batters[1-state.striker]?.runs||0}*</b></span><span>Bowler: <b>${esc(state.bowler||'')}</b></span><span class="event">${esc(state.lastEvent)}</span></div></div><div class="note center" style="margin-top:12px">${esc(state.teams[0].name)} vs ${esc(state.teams[1].name)} • ${esc(state.venue)} • U/13 T20</div></div>`}
function render(){if(route()==='overlay'){document.body.style.background='transparent';document.getElementById('root').innerHTML=overlay();return}document.body.style.background='#0b1220';document.getElementById('root').innerHTML=state.screen==='setup'?setup():scoreScreen();if(state.screen==='setup'){document.getElementById('start').addEventListener('click',start);document.getElementById('demo').addEventListener('click',demo);const sync=()=>{document.querySelectorAll('[data-team]').forEach(i=>state.teams[Number(i.dataset.team)].players[Number(i.dataset.i)]=i.value);state.teams[0].name=document.getElementById('t1').value;state.teams[1].name=document.getElementById('t2').value;state.venue=document.getElementById('venue').value};document.querySelectorAll('.addPlayer').forEach(b=>b.addEventListener('click',()=>{sync();state.teams[Number(b.dataset.addTeam)].players.push('');render()}));document.querySelectorAll('.removePlayer').forEach(b=>b.addEventListener('click',()=>{sync();const t=Number(b.dataset.removeTeam),i=Number(b.dataset.removeI);if(state.teams[t].players.length>1){state.teams[t].players.splice(i,1);render()}}))}else bindScore()}
function start(){state.matchId='U13-'+Date.now().toString(36).toUpperCase();state.teams[0].name=document.getElementById('t1').value.trim()||'Home Team';state.teams[1].name=document.getElementById('t2').value.trim()||'Away Team';state.venue=document.getElementById('venue').value.trim()||'Venue';state.overs=Number(document.getElementById('overs').value);document.querySelectorAll('[data-team]').forEach(i=>state.teams[Number(i.dataset.team)].players[Number(i.dataset.i)]=i.value.trim()||'Player '+(Number(i.dataset.i)+1));state.screen='score';state.batters=[{name:state.teams[0].players[0],runs:0,balls:0,out:false},{name:state.teams[0].players[1],runs:0,balls:0,out:false}];save()}function demo(){state=defaultState();state.screen='score';state.matchId='DEMO-U13';state.venue='Demo Oval';state.batters=[{name:'Tiaan Olivier',runs:0,balls:0,out:false},{name:'Sion Kruger',runs:0,balls:0,out:false}];save()}render();</script></body></html>
