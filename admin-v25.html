ontrol:'3600'});if(u.error)throw u.error;patch.logo_path=path}if(cover){const ext=(cover.name.split('.').pop()||'jpg').toLowerCase(),path=t.id+'/cover.'+ext;const u=await sb.storage.from('team-branding').upload(path,cover,{upsert:true,contentType:cover.type,cacheControl:'3600'});if(u.error)throw u.error;patch.cover_photo_path=path}const u=await sb.from('teams').update(patch).eq('id',t.id);if(u.error)throw u.error;Object.assign(t,patch);apply(t);logoFile.value='';coverFile.value='';msg.textContent='Branding suksesvol gestoor.';msg.className='small success'}catch(e){msg.textContent='Kon branding nie stoor nie: '+(e.message||e);msg.className='small error'}finally{save.disabled=false}};d.defaultView.v25ShowBranding=async()=>{if(typeof w.show==='function')w.show('v25Branding');else{d.querySelectorAll('#app>section').forEach(s=>s.classList.add('hidden'));sec.classList.remove('hidden');d.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b))}await load()};b.onclick=()=>d.defaultView.v25ShowBranding();d.getElementById('v25BrandRefresh').onclick=load;return true}frame.addEventListener('load',async()=>{for(let i=0;i<100;i++){try{if(await install())return}catch(e){}await sleep(250)}})})();</script></body></html>
