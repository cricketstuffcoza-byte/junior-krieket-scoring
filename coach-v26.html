<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Afrigter Portaal V26</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,sans-serif;background:#eef2f6;color:#172033;margin:0}.wrap{max-width:1180px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}label{display:block;font-weight:800;margin-bottom:6px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd3dc;border-radius:10px}button{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#172033;color:#fff}.ghost{background:#eef2f6}.hidden{display:none}.muted{color:#667085}.error{color:#b42318}.success{color:#087443}.fixture{border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:10px 0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#edf2f7;font-size:12px;font-weight:800}@media(max-width:800px){.grid,.grid3{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section id="auth" class="card"><h1>🧑‍🏫 Afrigter Portaal V26</h1><p class="muted">Dieselfde login kan nou ook Admin en Ouer toegang hê.</p><form id="login"><div class="grid"><div><label>E-pos</label><input id="email" type="email" required></div><div><label>Wagwoord</label><input id="password" type="password" required></div></div><div class="actions"><button class="primary">Meld Aan</button></div></form><p id="msg" class="muted"></p></section><section id="denied" class="card hidden"><h2>🔒 Geen Afrigter-toegang</h2><p id="deniedMsg"></p><button class="ghost" id="back">Meld aan met ander rekening</button></section><main id="app" class="hidden"><section class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h1>🧑‍🏫 Afrigter Portaal</h1><p id="welcome" class="muted"></p><p id="roles" class="muted"></p></div><button class="ghost" id="logout">Teken uit</button></div></section><section class="card"><h2>My spanne</h2><div id="teams" class="grid3"></div></section><section class="card"><div style="display:flex;justify-content:space-between"><h2>📅 My wedstryde</h2><button class="ghost" id="refresh">↻ Verfris</button></div><div id="fixtures"></div></section><section class="card"><h2>📄 My ingediende verslae</h2><div id="reports"></div></section></main></div><script>(function(){const URL='https://moomommajyldjquncnrd.supabase.co',KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH',db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let session=null,profile=null,roles=[];function msg(t,c='muted'){$('msg').textContent=t;$('msg').className=c}async function hasRole(r){const q=await db.rpc('has_access_role',{p_role:r});if(q.error)throw q.error;return q.data===true}async function start(s){session=s;try{roles=[];for(const r of ['admin','coach','parent'])if(await hasRole(r))roles.push(r);if(!roles.includes('coach'))throw Error('Hierdie rekening het nie Afrigter-toegang nie.');const p=await db.from('user_profiles').select('full_name,active').eq('user_id',s.user.id).maybeSingle();if(p.error)throw p.error;if(!p.data||p.data.active===false)throw Error('Jou gebruikersprofiel is gedeaktiveer.');profile=p.data;$('auth').classList.add('hidden');$('denied').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='Welkom, '+(profile.full_name||s.user.email);$('roles').textContent='Toegang: '+roles.join(' • ');await loadAll()}catch(e){$('auth').classList.add('hidden');$('app').classList.add('hidden');$('denied').classList.remove('hidden');$('deniedMsg').textContent=e.message||String(e)}}async function openScorecard(id,age){const g=String(age||'').toUpperCase().replace('/','/');let target='scorer-fixed.html';if(g==='U/6')target='scorer-o6-v19.html';else if(g==='U/7')target='scorer-o7-v19.html';location.href=target+'?match='+encodeURIComponent(id)+'&v=26&resume=1'}async function loadAll(){const r=await db.from('coach_teams').select('team_id,active,teams(id,name,age_group,active)').eq('coach_user_id',session.user.id).eq('active',true);if(r.error)throw r.error;const myTeams=(r.data||[]).map(x=>x.teams).filter(Boolean).filter(t=>t.active!==false);$('teams').innerHTML=myTeams.length?myTeams.map(t=>`<div class="fixture"><b>${esc(t.name)}</b><div><span class="pill">${esc(t.age_group)}</span></div></div>`).join(''):'<p class="muted">Geen aktiewe spanne aan jou toegeken nie.</p>';const f=await db.from('matches').select('id,age_group,team_a_id,team_b_id,match_date,match_time,venue,status,coach_user_id,scorer_user_id').or(`coach_user_id.eq.${session.user.id},scorer_user_id.eq.${session.user.id}`).order('match_date',{ascending:true}).order('match_time',{ascending:true});if(f.error)throw f.error;const rows=f.data||[],ids=[...new Set(rows.flatMap(x=>[x.team_a_id,x.team_b_id]).filter(Boolean))];let tm={};if(ids.length){const t=await db.from('teams').select('id,name').in('id',ids);if(t.error)throw t.error;(t.data||[]).forEach(x=>tm[x.id]=x.name)}$('fixtures').innerHTML=rows.length?rows.map(x=>`<div class="fixture"><b>${esc(tm[x.team_a_id]||'Onbekend')} vs ${esc(tm[x.team_b_id]||'Onbekend')}</b><div class="muted">${esc(x.match_date)} • ${esc(String(x.match_time||'').slice(0,5))} • ${esc(x.venue||'')}</div><div class="actions">${['SCHEDULED','LIVE'].includes(String(x.status).toUpperCase())?`<button class="primary" onclick="openScorecard('${encodeURIComponent(x.id)}','${esc(x.age_group)}')">🏏 Open Telkaart</button>`:''}<span class="pill">${esc(x.age_group)} · ${esc(x.status)}</span></div></div>`).join(''):'<p class="muted">Geen wedstryde is tans aan jou toegeken nie.</p>';const rr=await db.from('player_reports').select('id,created_at,homework,coach_feedback,players(first_name,surname)').eq('author_user_id',session.user.id).order('created_at',{ascending:false});if(rr.error){$('reports').innerHTML='<p class="error">'+esc(rr.error.message)+'</p>';return}$('reports').innerHTML=(rr.data||[]).length?rr.data.map(x=>`<div class="fixture"><b>${esc(x.players?.first_name)} ${esc(x.players?.surname)}</b><div class="muted">${new Date(x.created_at).toLocaleString('af-ZA')}</div><p><b>Huiswerk:</b> ${esc(x.homework)}</p><p><b>Terugvoer:</b> ${esc(x.coach_feedback||'')}</p></div>`).join(''):'<p class="muted">Nog geen verslae ingedien nie.</p>'}async function login(e){e.preventDefault();try{msg('Meld aan…');const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;await start(r.data.session)}catch(e){msg(e.message||String(e),'error')}}$('login').onsubmit=login;$('logout').onclick=()=>db.auth.signOut();$('back').onclick=()=>{db.auth.signOut();$('denied').classList.add('hidden');$('auth').classList.remove('hidden')};$('refresh').onclick=()=>loadAll().catch(e=>msg(e.message||String(e),'error'));db.auth.getSession().then(({data:{session}})=>session&&start(session));})();</script></body></html>
