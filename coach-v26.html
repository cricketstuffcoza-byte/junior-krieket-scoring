<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Afrigter Portaal V27</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,sans-serif;background:#eef2f6;color:#172033;margin:0}.wrap{max-width:1180px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}label{display:block;font-weight:800;margin-bottom:6px}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd3dc;border-radius:10px}button{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#172033;color:#fff}.ghost{background:#eef2f6}.hidden{display:none}.muted{color:#667085}.error{color:#b42318}.success{color:#087443}.fixture{border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:10px 0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#edf2f7;font-size:12px;font-weight:800}.hero{min-height:280px;border-radius:20px;background-size:cover;background-position:center;position:relative;overflow:hidden;display:flex;align-items:flex-end;color:#fff;margin-bottom:14px}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 25%,rgba(0,0,0,.78))}.heroInner{position:relative;padding:24px;display:flex;align-items:center;gap:18px;width:100%;box-sizing:border-box}.logo{width:92px;height:92px;border-radius:50%;object-fit:cover;background:#fff;border:3px solid #fff}.hero h1{margin:0 0 4px;font-size:30px}.hero p{margin:0}.brandrow{display:flex;gap:14px;align-items:end}.brandrow>div{flex:1}.small{font-size:13px}@media(max-width:800px){.grid,.grid3{grid-template-columns:1fr}.hero{min-height:230px}.heroInner{padding:18px}.logo{width:70px;height:70px}}
</style></head><body><div class="wrap"><section id="auth" class="card"><h1>🧑‍🏫 Afrigter Portaal V27</h1><p class="muted">Dieselfde login kan nou ook Admin en Ouer toegang hê.</p><form id="login"><div class="grid"><div><label>E-pos</label><input id="email" type="email" required></div><div><label>Wagwoord</label><input id="password" type="password" required></div></div><div class="actions"><button class="primary">Meld Aan</button></div></form><p id="msg" class="muted"></p></section><section id="denied" class="card hidden"><h2>🔒 Geen Afrigter-toegang</h2><p id="deniedMsg"></p><button class="ghost" id="back">Meld aan met ander rekening</button></section><main id="app" class="hidden"><section id="hero" class="hero"><div class="heroInner"><img id="heroLogo" class="logo" alt="Span logo"><div><h1 id="heroTeam">My Span</h1><p id="heroAge"></p></div></div></section><section class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h1>🧑‍🏫 Afrigter Portaal</h1><p id="welcome" class="muted"></p><p id="roles" class="muted"></p></div><button class="ghost" id="logout">Teken uit</button></div></section><section class="card"><h2>🎨 My span se branding</h2><p class="muted">Kies ’n span. Die coverpage-foto en logo word vir jou portaal gebruik.</p><div class="grid"><div><label>Span</label><select id="brandTeam"></select></div><div><label>Span logo</label><input id="brandLogo" type="file" accept="image/png,image/jpeg,image/webp"></div><div><label>Span coverpage foto</label><input id="brandCover" type="file" accept="image/png,image/jpeg,image/webp"></div></div><div class="actions"><button class="primary" id="saveBrand">💾 Stoor Branding</button></div><p id="brandMsg" class="muted"></p></section><section class="card"><h2>My spanne</h2><div id="teams" class="grid3"></div></section><section class="card"><div style="display:flex;justify-content:space-between"><h2>📅 My wedstryde</h2><button class="ghost" id="refresh">↻ Verfris</button></div><div id="fixtures"></div></section><section class="card"><h2>📄 My ingediende verslae</h2><div id="reports"></div></section></main></div><script>(function(){const URL='https://moomommajyldjquncnrd.supabase.co',KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH',db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let session=null,profile=null,roles=[],myTeams=[];function msg(t,c='muted'){$('msg').textContent=t;$('msg').className=c}function brandMsg(t,c='muted'){$('brandMsg').textContent=t;$('brandMsg').className=c}async function hasRole(r){const q=await db.rpc('has_access_role',{p_role:r});if(q.error)throw q.error;return q.data===true}function publicUrl(path){return path?db.storage.from('team-branding').getPublicUrl(path).data.publicUrl:''}function applyBrand(t){if(!t){$('heroTeam').textContent='My Span';$('heroAge').textContent='';$('hero').style.backgroundImage='';$('heroLogo').removeAttribute('src');return}$('heroTeam').textContent=t.name||'My Span';$('heroAge').textContent=t.age_group||'';const cover=publicUrl(t.cover_photo_path),logo=publicUrl(t.logo_path);$('hero').style.backgroundImage=cover?'url("'+cover.replace(/"/g,'%22')+'")':'';if(logo)$('heroLogo').src=logo;else $('heroLogo').removeAttribute('src')}function populateBrandSelect(){ $('brandTeam').innerHTML=myTeams.map(t=>'<option value="'+esc(t.id)+'">'+esc(t.name)+' · '+esc(t.age_group)+'</option>').join('');if(myTeams[0])applyBrand(myTeams[0])}async function start(s){session=s;try{roles=[];for(const r of ['admin','coach','parent'])if(await hasRole(r))roles.push(r);if(!roles.includes('coach'))throw Error('Hierdie rekening het nie Afrigter-toegang nie.');const p=await db.from('user_profiles').select('full_name,active').eq('user_id',s.user.id).maybeSingle();if(p.error)throw p.error;if(!p.data||p.data.active===false)throw Error('Jou gebruikersprofiel is gedeaktiveer.');profile=p.data;$('auth').classList.add('hidden');$('denied').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='Welkom, '+(profile.full_name||s.user.email);$('roles').textContent='Toegang: '+roles.join(' • ');await loadAll()}catch(e){$('auth').classList.add('hidden');$('app').classList.add('hidden');$('denied').classList.remove('hidden');$('deniedMsg').textContent=e.message||String(e)}}window.openScorecard=function(id,age){const g=String(age||'').toUpperCase();let target='scorer-fixed.html';if(g==='U/6')target='scorer-o6-v25.html';else if(g==='U/7')target='scorer-o7-v19.html';location.href=target+'?match='+encodeURIComponent(id)+'&v=25&resume=1&ts='+Date.now()};async function loadAll(){const r=await db.from('coach_teams').select('team_id,active,teams(id,name,age_group,active,logo_path,cover_photo_path)').eq('coach_user_id',session.user.id).eq('active',true);if(r.error)throw r.error;myTeams=(r.data||[]).map(x=>x.teams).filter(Boolean).filter(t=>t.active!==false);populateBrandSelect();$('teams').innerHTML=myTeams.length?myTeams.map(t=>`<div class="fixture"><div style="display:flex;align-items:center;gap:12px">${t.logo_path?`<img src="${esc(publicUrl(t.logo_path))}" style="width:54px;height:54px;border-radius:50%;object-fit:cover">`:''}<div><b>${esc(t.name)}</b><div><span class="pill">${esc(t.age_group)}</span></div></div></div></div>`).join(''):'<p class="muted">Geen aktiewe spanne aan jou toegeken nie.</p>';const f=await db.from('matches').select('id,age_group,team_a_id,team_b_id,match_date,match_time,venue,status,coach_user_id,scorer_user_id').or(`coach_user_id.eq.${session.user.id},scorer_user_id.eq.${session.user.id}`).order('match_date',{ascending:true}).order('match_time',{ascending:true});if(f.error)throw f.error;const rows=f.data||[],ids=[...new Set(rows.flatMap(x=>[x.team_a_id,x.team_b_id]).filter(Boolean))];let tm={};if(ids.length){const t=await db.from('teams').select('id,name').in('id',ids);if(t.error)throw t.error;(t.data||[]).forEach(x=>tm[x.id]=x.name)}$('fixtures').innerHTML=rows.length?rows.map(x=>`<div class="fixture"><b>${esc(tm[x.team_a_id]||'Onbekend')} vs ${esc(tm[x.team_b_id]||'Onbekend')}</b><div class="muted">${esc(x.match_date)} • ${esc(String(x.match_time||'').slice(0,5))} • ${esc(x.venue||'')}</div><div class="actions">${['SCHEDULED','LIVE'].includes(String(x.status).toUpperCase())?`<button class="primary" onclick="openScorecard('${x.id}','${esc(x.age_group)}')">🏏 Open Telkaart</button>`:''}<span class="pill">${esc(x.age_group)} · ${esc(x.status)}</span></div></div>`).join(''):'<p class="muted">Geen wedstryde is tans aan jou toegeken nie.</p>';const rr=await db.from('player_reports').select('id,created_at,homework,coach_feedback,players(first_name,surname)').eq('author_user_id',session.user.id).order('created_at',{ascending:false});if(rr.error){$('reports').innerHTML='<p class="error">'+esc(rr.error.message)+'</p>';return}$('reports').innerHTML=(rr.data||[]).length?rr.data.map(x=>`<div class="fixture"><b>${esc(x.players?.first_name)} ${esc(x.players?.surname)}</b><div class="muted">${new Date(x.created_at).toLocaleString('af-ZA')}</div><p><b>Huiswerk:</b> ${esc(x.homework)}</p><p><b>Terugvoer:</b> ${esc(x.coach_feedback||'')}</p></div>`).join(''):'<p class="muted">Nog geen verslae ingedien nie.</p>'}async function saveBrand(){const t=myTeams.find(x=>x.id===$('brandTeam').value);if(!t)return brandMsg('Kies asseblief ’n span.','error');const logo=$('brandLogo').files[0],cover=$('brandCover').files[0];if(!logo&&!cover)return brandMsg('Kies ’n logo en/of coverpage foto.','error');$('saveBrand').disabled=true;brandMsg('Laai branding op…');try{const patch={};if(logo){const ext=(logo.name.split('.').pop()||'jpg').toLowerCase(),path=t.id+'/logo.'+ext;const u=await db.storage.from('team-branding').upload(path,logo,{upsert:true,contentType:logo.type,cacheControl:'3600'});if(u.error)throw u.error;patch.logo_path=path}if(cover){const ext=(cover.name.split('.').pop()||'jpg').toLowerCase(),path=t.id+'/cover.'+ext;const u=await db.storage.from('team-branding').upload(path,cover,{upsert:true,contentType:cover.type,cacheControl:'3600'});if(u.error)throw u.error;patch.cover_photo_path=path}const u=await db.from('teams').update(patch).eq('id',t.id);if(u.error)throw u.error;Object.assign(t,patch);applyBrand(t);$('brandLogo').value='';$('brandCover').value='';brandMsg('Branding suksesvol gestoor.','success');await loadAll()}catch(e){brandMsg('Kon branding nie stoor nie: '+(e.message||e),'error')}finally{$('saveBrand').disabled=false}}$('login').onsubmit=login;$('logout').onclick=()=>db.auth.signOut();$('back').onclick=()=>{db.auth.signOut();$('denied').classList.add('hidden');$('auth').classList.remove('hidden')};$('refresh').onclick=()=>loadAll().catch(e=>msg(e.message||String(e),'error'));$('brandTeam').onchange=()=>{const t=myTeams.find(x=>x.id===$('brandTeam').value);applyBrand(t)};$('saveBrand').onclick=saveBrand;async function login(e){e.preventDefault();try{msg('Meld aan…');const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;await start(r.data.session)}catch(e){msg(e.message||String(e),'error')}}db.auth.getSession().then(({data:{session}})=>session&&start(session));})();</script></body></html>
