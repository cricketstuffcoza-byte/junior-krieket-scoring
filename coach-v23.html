<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Afrigter Portaal V23</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,sans-serif;background:#eef2f6;color:#172033;margin:0}.wrap{max-width:1180px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}label{display:block;font-weight:800;margin-bottom:6px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd3dc;border-radius:10px;font-size:15px;box-sizing:border-box}textarea{min-height:120px}button{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#172033;color:#fff}.ghost{background:#eef2f6}.good{background:#dcfae6;color:#087443}.danger{background:#fee4e2;color:#b42318}.hidden{display:none!important}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#edf2f7;font-size:12px;font-weight:800}.muted{color:#667085}.small{font-size:13px}.error{color:#b42318}.success{color:#087443}.fixture{border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:10px 0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}@media(max-width:800px){.grid,.grid3{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section id="auth" class="card"><div class="top"><div><h1>🏏 Junior Krieket</h1><p class="muted">Afrigter Portaal V23</p></div><span class="pill">V23</span></div><form id="loginForm" novalidate><div class="grid"><div><label for="email">E-pos</label><input id="email" type="email" autocomplete="username" required></div><div><label for="password">Wagwoord</label><input id="password" type="password" autocomplete="current-password" required></div></div><div class="actions"><button type="submit" class="primary" id="login">Meld Aan</button></div></form><p id="authMsg" class="small">Veilige aanmelding gereed.</p></section><section id="denied" class="card hidden"><h2>🔒 Geen toegang</h2><p id="deniedMsg"></p><button type="button" class="ghost" id="backToLogin">Meld aan met ander rekening</button></section><main id="app" class="hidden"><section class="card"><div class="top"><div><h1>🧑‍🏫 Afrigter Portaal V23</h1><p id="welcome" class="muted"></p></div><button type="button" class="ghost" id="logout">Teken uit</button></div></section><section id="dataError" class="card hidden"><p id="dataErrorMsg" class="error"></p><button type="button" class="ghost" id="retry">↻ Probeer weer</button></section><section class="card"><h2>My spanne</h2><div id="teams" class="grid3"></div></section><section class="card"><div class="top"><div><h2>📅 My wedstryde</h2><p class="muted">Wedstryde wat aan jou toegeken is, ongeag watter van jou gekoppelde spanne die wedstryd speel.</p></div><button type="button" class="ghost" id="refresh">↻ Verfris</button></div><div id="fixtures"></div></section><section class="card"><h2>📄 My ingediende verslae</h2><div id="reports"></div></section></main></div><script>(function(){'use strict';const URL='https://moomommajyldjquncnrd.supabase.co',KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH';let db,session,profile,myTeams=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function authMsg(t,c=''){const el=$('authMsg');el.textContent=t;el.className='small '+c}function showAuth(){$('auth').classList.remove('hidden');$('app').classList.add('hidden');$('denied').classList.add('hidden');$('dataError').classList.add('hidden')}function showDataError(e){$('dataError').classList.remove('hidden');$('dataErrorMsg').textContent=e.message||String(e)}async function start(s){session=s;try{const {data:p,error}=await db.from('user_profiles').select('full_name,role,active').eq('user_id',s.user.id).maybeSingle();if(error)throw error;if(!p)throw Error('Gebruikersprofiel bestaan nog nie.');if(p.active===false)throw Error('Jou gebruikersprofiel is gedeaktiveer.');if(!['coach','afrigter'].includes(String(p.role).toLowerCase()))throw Error('Hierdie rekening is nie as afrigter geregistreer nie.');profile=p;$('auth').classList.add('hidden');$('denied').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='Welkom, '+(p.full_name||s.user.email);try{await loadAll()}catch(e){showDataError(e)}}catch(e){$('auth').classList.add('hidden');$('app').classList.add('hidden');$('denied').classList.remove('hidden');$('deniedMsg').textContent=e.message||String(e)}}async function loadAll(){const {data,error}=await db.from('coach_teams').select('team_id,active,teams(id,name,age_group,active)').eq('coach_user_id',session.user.id).eq('active',true);if(error)throw error;myTeams=(data||[]).map(x=>x.teams).filter(Boolean).filter(t=>t.active!==false);$('teams').innerHTML=myTeams.length?myTeams.map(t=>`<div class="fixture"><h3>${esc(t.name)}</h3><span class="pill">${esc(t.age_group)}</span></div>`).join(''):'<p class="muted">Geen aktiewe spanne aan jou toegeken nie.</p>';await loadFixtures();await loadReports()}async function loadFixtures(){const {data,error}=await db.from('matches').select('id,fixture_code,age_group,team_a_id,team_b_id,match_date,match_time,venue,status,coach_user_id,scorer_user_id').or(`coach_user_id.eq.${session.user.id},scorer_user_id.eq.${session.user.id}`).order('match_date',{ascending:true}).order('match_time',{ascending:true});if(error)throw error;const rows=data||[];const ids=[...new Set(rows.flatMap(f=>[f.team_a_id,f.team_b_id]).filter(Boolean))];let teamsById={};if(ids.length){const tr=await db.from('teams').select('id,name,age_group,active').in('id',ids);if(tr.error)throw tr.error;(tr.data||[]).forEach(t=>teamsById[t.id]=t)}$('fixtures').innerHTML=rows.length?rows.map(f=>{const a=teamsById[f.team_a_id]?.name||f.team_a_id||'Onbekend';const b=teamsById[f.team_b_id]?.name||f.team_b_id||'Onbekend';const role=f.scorer_user_id===session.user.id?'Telling gehou deur jou':f.coach_user_id===session.user.id?'Aan jou toegeken':'';const can=['SCHEDULED','LIVE'].includes(String(f.status).toUpperCase());return `<div class="fixture"><div class="top"><div><h3>${esc(a)} vs ${esc(b)}</h3><div class="muted">${esc(f.match_date)} • ${String(f.match_time||'').slice(0,5)} • ${esc(f.venue||'')}</div></div><span class="pill">${esc(f.age_group)} · ${esc(f.status)}</span></div>${role?`<p class="small"><b>${esc(role)}</b></p>`:''}<div class="actions">${can?`<button type="button" class="primary" onclick="openScorer('${f.id}')">🏏 Open Telkaart</button>`:''}${f.status==='COMPLETED'?`<span class="small muted">Verslae kan ná voltooiing ingedien word.</span>`:''}</div></div>`}).join(''):'<p class="muted">Geen wedstryde is tans aan jou toegeken nie.</p>'}window.openScorer=id=>{const safeId=String(id||'').trim();if(!safeId)return;location.href=`scorer-fixed.html?match=${encodeURIComponent(safeId)}&v=23`};async function loadReports(){const {data,error}=await db.from('player_reports').select('id,created_at,homework,coach_feedback,players(first_name,surname)').eq('author_user_id',session.user.id).order('created_at',{ascending:false});if(error){$('reports').innerHTML='<p class="error">'+esc(error.message)+'</p>';return}$('reports').innerHTML=(data||[]).length?data.map(r=>`<div class="fixture"><b>${esc(r.players?.first_name)} ${esc(r.players?.surname)}</b><div class="small muted">${new Date(r.created_at).toLocaleString('af-ZA')}</div><p><b>Huiswerk:</b> ${esc(r.homework)}</p><p><b>Terugvoer:</b> ${esc(r.coach_feedback||'')}</p></div>`).join(''):'<p class="muted">Nog geen verslae ingedien nie.</p>'}async function login(e){e.preventDefault();const btn=$('login');try{const email=$('email').value.trim(),password=$('password').value;if(!email||!password){authMsg('Vul asseblief jou e-pos en wagwoord in.','error');return}btn.disabled=true;btn.textContent='Meld aan…';authMsg('Meld aan…');const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;if(!data.session)throw Error('Aanmelding het nie ’n sessie teruggestuur nie.');await start(data.session)}catch(e){authMsg(e.message||String(e),'error')}finally{btn.disabled=false;btn.textContent='Meld Aan'}}function init(){try{if(!window.supabase||!window.supabase.createClient)throw Error('Die veilige aanmeldingsdiens kon nie laai nie.');db=window.supabase.createClient(URL,KEY);$('loginForm').addEventListener('submit',login);$('logout').addEventListener('click',()=>db.auth.signOut());$('backToLogin').addEventListener('click',async()=>{await db.auth.signOut();showAuth()});$('refresh').addEventListener('click',async()=>{try{$('dataError').classList.add('hidden');await loadAll()}catch(e){showDataError(e)}});$('retry').addEventListener('click',async()=>{try{$('dataError').classList.add('hidden');await loadAll()}catch(e){showDataError(e)}});db.auth.getSession().then(({data:{session:s}})=>s?start(s):showAuth()).catch(e=>authMsg(e.message||String(e),'error'));db.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_IN'&&s)start(s);if(e==='SIGNED_OUT')showAuth()})}catch(e){authMsg(e.message||String(e),'error')}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})();</script></body></html>
