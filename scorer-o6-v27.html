d_'+id;let saved=null;try{const x=JSON.parse(localStorage.getItem(key)||'null');if(x?.state?.started)saved=x.state}catch(e){}if(!saved){try{const r=await fetch(U+'/rest/v1/live_match_state?match_id=eq.'+encodeURIComponent(id)+'&select=state_json&limit=1',{headers:H,cache:'no-store'});if(r.ok){const x=(await r.json())[0];if(x?.state_json?.started)saved=x.state_json}}catch(e){}}let pA=dbp[m.team_a_id],pB=dbp[m.team_b_id];if(saved?.bats){const used=new Set(Object.keys(saved.bats));const a=pA.filter(n=>used.has(n)),b=pB.filter(n=>used.has(n));if(a.length>=2)pA=a;if(b.length>=2)pB=b}const tossWinner=m.toss_winner_team_id?tm[m.toss_winner_team_id]?.name||'':'';const tossDecision=String(m.toss_decision||'').toUpperCase();const firstBat=m.first_batting_team_id?tm[m.first_batting_team_id]?.name||'':'';const MATCH={teamA:A,teamB:B,group:'U/6',date:m.match_date||'',time:String(m.match_time||'').slice(0,5),venue:m.venue||''},PLAYERS={[A]:pA,[B]:pB};let html=await(await fetch('./o6-v19-core.html?x='+Date.now(),{cache:'no-store'})).text();html=html.replace(/const MATCH=\{[\s\S]*?\};\s*const PLAYERS=\{[\s\S]*?\};\s*const RULES=/,'const MATCH='+JSON.stringify(MATCH)+';\nconst PLAYERS='+JSON.stringify(PLAYERS)+';\nconst RULES=');const extra='<script>(function(){const A='+JSON.stringify(A)+',B='+JSON.stringify(B)+',KEY='+JSON.stringify(key)+',TW='+JSON.stringify(tossWinner)+',TD='+JSON.stringify(tossDecision)+',FB='+JSON.stringify(firstBat)+',MID='+JSON.stringify(id)+';function labels(){const a=document.getElementById("labelA"),b=document.getElementById("labelB");if(a)a.textContent=A;if(b)b.textContent=B;document.title="Junior Krieket – "+A+" vs "+B+" • O/6"}function toss(){const w=document.getElementById("tossWinner"),d=document.getElementById("tossDecision"),t=document.getElementById("tossText");if(!w||!d)return;w.value=TW||"";d.value=TD||"";if(TW&&TD){t.textContent=TW+" het die toss gewen en gekies om "+(TD==="BAT"?"eerste te kolf":"eerste te boul")+".";t.className="banner"}else if(FB){t.textContent=FB+" het eerste gekolf volgens die gestoorde wedstrydinstelling.";t.className="banner blue"}}async function resume(){try{let s=null;try{const x=JSON.parse(localStorage.getItem(KEY)||"null");if(x?.state?.started)s=x.state}catch(e){}if(!s){const r=await fetch('+JSON.stringify(U)+'/rest/v1/live_match_state?match_id=eq.'+encodeURIComponent('+JSON.stringify(id)+')&select=state_json&limit=1',{headers:{apikey:'+JSON.stringify(K)+',Authorization:"Bearer "+'+JSON.stringify(K)+'},cache:"no-store"});if(r.ok){const x=(await r.json())[0];if(x?.state_json?.started)s=x.state_json}}if(!s)return alert("Daar is nog geen gestoorde onvoltooide wedstryd vir hierdie wedstryd nie.");window.__juniorState=s;window.__juniorUndoStack=[];labels();toss();const w=document.getElementById("tossWinner"),d=document.getElementById("tossDecision");if(w)w.disabled=true;if(d)d.disabled=true;render();if(s.started&&!s.completed&&Number(s.pairBalls)>=16){s.pairLimitAccepted=false;openPair();render()}}catch(e){alert("Die huidige wedstryd kon nie hervat word nie: "+(e?.message||e))}}const old=document.getElementById("reset");if(old){const b=old.cloneNode(true);b.textContent="▶ GAAN VOORT MET HUIDIGE WEDSTRYD";old.replaceWith(b);b.addEventListener("click",resume)}labels();toss()})();<\/script>';html=html.replace('</body>',extra+'</body>');frame.srcdoc=html;frame.onload=()=>{boot.style.display='none';frame.style.display='block'}}catch(e){boot.textContent='Telkaart kon nie gelaai word nie: '+(e?.message||e);boot.style.color='#b42318'}})();</script></body></html>
