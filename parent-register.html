<!doctype html>
<html lang="af">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Junior Krieket – Ouer / Voog Registrasie</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#eef2f6}*{box-sizing:border-box}body{margin:0}.wrap{min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(100%,620px);background:#fff;border-radius:22px;padding:32px;box-shadow:0 12px 40px #17203318}.brand{background:#172033;color:#fff;border-radius:16px;padding:22px;margin-bottom:24px}.brand h1{margin:0 0 5px;font-size:26px}.brand p{margin:0;color:#d5deea}.field{margin:16px 0}.field label{display:block;font-weight:800;margin-bottom:7px;font-size:14px}.field input{width:100%;padding:13px;border:1px solid #ccd3dc;border-radius:11px;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.primary,.back{border:0;border-radius:11px;padding:13px 16px;font-weight:900;cursor:pointer}.primary{background:#172033;color:#fff;width:100%;margin-top:8px}.back{background:#eef2f6;color:#172033;margin-top:10px}.msg{min-height:22px;margin-top:14px}.error{color:#b42318}.ok{color:#067647}.small{font-size:12px;color:#667085;line-height:1.5}@media(max-width:600px){.card{padding:22px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap"><section class="card"><div class="brand"><h1>👨‍👩‍👧 Ouer / Voog Registrasie</h1><p>Skep jou Junior Krieket-rekening.</p></div><form id="form"><div class="grid"><div class="field"><label for="name">Volle naam</label><input id="name" autocomplete="name" required></div><div class="field"><label for="email">E-posadres</label><input id="email" type="email" autocomplete="email" required></div></div><div class="field"><label for="password">Wagwoord</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label for="confirm">Bevestig wagwoord</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required></div><button class="primary" type="submit">Skep Ouer / Voog-rekening</button></form><button class="back" type="button" onclick="location.href='central-login.html'">← Terug na Aanmelding</button><p id="msg" class="msg"></p><p class="small">Hierdie eerste stap skep jou rekening. Die koppeling van jou kind/kinders en die volledige ouerportaal word daarna deur die Junior Krieket-stelsel hanteer.</p></section></div>
<script>
(function(){const URL='https://sbncjeezviyqitwgutvk.supabase.co',KEY='sb_publishable_ueyMmVM6wP-4y9HrEMFubQ_ydIxrKZf',db=globalThis.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id);$('form').addEventListener('submit',async e=>{e.preventDefault();const msg=$('msg');msg.className='msg';msg.textContent='Skep rekening…';if($('password').value!==$('confirm').value){msg.textContent='Die wagwoorde stem nie ooreen nie.';msg.className='msg error';return}try{const r=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{data:{full_name:$('name').value.trim()},emailRedirectTo:location.origin+'/central-login.html'}});if(r.error)throw r.error;if(r.data.session){msg.textContent='Rekening suksesvol geskep. Jy word na jou portale geneem…';msg.className='msg ok';setTimeout(()=>location.replace('portal-hub.html'),700)}else{msg.textContent='Rekening geskep. Kontroleer jou e-pos om die rekening te bevestig, en meld daarna aan.';msg.className='msg ok'}}catch(err){msg.textContent=err.message||String(err);msg.className='msg error'}})})();
