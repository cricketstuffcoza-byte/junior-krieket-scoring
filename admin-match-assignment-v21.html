<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Wedstryd Afrigter Toewysing V21</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,sans-serif;background:#eef2f6;color:#172033;margin:0}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.fixture{border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;align-items:end}.muted{color:#667085}.small{font-size:13px}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#edf2f7;font-size:12px;font-weight:800}select,button{padding:10px 12px;border-radius:10px;border:1px solid #ccd3dc;font-weight:700}button{cursor:pointer;background:#172033;color:#fff;border:0}.good{color:#087443}.error{color:#b42318}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="card"><div class="top"><div><h1>📅 Wedstryd & Afrigter Toewysing V21</h1><p class="muted">Ken of verander die afrigter wat die telling vir ’n spesifieke wedstryd hou.</p></div><button id="logout">Teken uit</button></div><p id="msg" class="small">Laai…</p></section><section class="card"><h2>Wedstryde</h2><div id="list"></div></section></div><script>'use strict';const URL='https://moomommajyldjquncnrd.supabase.co',KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH',db=supabase.createClient(URL,KEY),$=id=>document.getElementById(id);let coaches=[],teams=[];const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function setMsg(t,c=''){ $('msg').textContent=t;$('msg').className='small '+c }async function init(){const {data:{session},error:se}=await db.auth.getSession();if(se)throw se;if(!session){location.href='admin-v20.html';return}const {data:p,error:pe}=await db.from('user_profiles').select('role,active').eq('user_id',session.user.id).maybeSingle();if(pe)throw pe;if(!p||p.active===false||String(p.role).toLowerCase()!=='admin')throw Error('Geen Admin-toegang.');const [cr,tr,mr]=await Promise.all([db.from('coach_teams').select('coach_user_id,team_id,active').eq('active',true),db.from('teams').select('id,name,age_group,active').order('age_group').order('name'),db.from('matches').select('id,fixture_code,age_group,team_a_id,team_b_id,team_a_name,team_b_name,match_date,match_time,venue,status,coach_user_id,scorer_user_id').order('match_date').order('match_time')]);if(cr.error)throw cr.error;if(tr.error)throw tr.error;if(mr.error)throw mr.error;teams=tr.data||[];const ids=[...new Set((cr.data||[]).map(x=>x.coach_user_id))];if(ids.length){const {data:ps,error}=await db.from('user_profiles').select('user_id,full_name,role,active').in('user_id',ids);if(error)throw error;const map=new Map((ps||[]).map(x=>[x.user_id,x]));coaches=(cr.data||[]).map(x=>({...x,profile:map.get(x.coach_user_id)})).filter(x=>x.profile&&x.profile.active!==false)}render(mr.data||[])}function team(id){return teams.find(x=>x.id===id)}function coachOptions(m){const allowed=new Set([m.team_a_id,m.team_b_id]);const rows=coaches.filter(c=>allowed.has(c.team_id));const unique=new Map();rows.forEach(c=>unique.set(c.coach_user_id,c));return [...unique.values()]}function render(matches){$('list').innerHTML=matches.length?matches.map(m=>{const cs=coachOptions(m);const current=m.coach_user_id||m.scorer_user_id||'';return `<div class="fixture"><div class="grid"><div><h3>${esc(m.team_a_name||team(m.team_a_id)?.name||'Span A')} vs ${esc(m.team_b_name||team(m.team_b_id)?.name||'Span B')}</h3><div class="muted">${esc(m.match_date)} • ${String(m.match_time||'').slice(0,5)} • ${esc(m.venue||'')} • ${esc(m.status||'')}</div><div class="small">Huidige telling: <b>${esc(labelCoach(current,cs))}</b></div></div><div><label>Afrigter</label><select id="c_${m.id}"><option value="">— Geen afrigter —</option>${cs.map(c=>`<option value="${esc(c.coach_user_id)}" ${current===c.coach_user_id?'selected':''}>${esc(c.profile.full_name)}</option>`).join('')}</select></div><div><button onclick="save('${m.id}')">Stoor toewysing</button></div></div></div>`}).join(''):'<p class="muted">Geen wedstryde.</p>'}function labelCoach(id,cs){if(!id)return'Geen afrigter toegeken nie';return cs.find(c=>c.coach_user_id===id)?.profile?.full_name||'Onbekende gebruiker'}window.save=async id=>{const v=document.getElementById('c_'+id).value||null;setMsg('Stoor toewysing…');const {error}=await db.from('matches').update({coach_user_id:v,scorer_user_id:v}).eq('id',id);if(error){setMsg(error.message,'error');return}setMsg('Wedstryd suksesvol aan die afrigter toegeken.','good');await init()};$('logout').onclick=()=>db.auth.signOut().then(()=>location.href='admin-v20.html');init().catch(e=>setMsg(e.message,'error'));</script></body></html>
