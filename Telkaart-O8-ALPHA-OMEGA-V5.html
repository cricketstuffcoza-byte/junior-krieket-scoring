<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket O/8 T80 V7</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>html,body,#f{margin:0;width:100%;height:100%;border:0}#f{display:block}#m{font:700 16px system-ui;padding:24px}.modal{position:fixed;inset:0;background:#0008;z-index:999999;display:flex;align-items:center;justify-content:center;padding:14px}.modal.hide{display:none}.box{background:#fff;width:min(650px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:20px;box-sizing:border-box;font-family:system-ui,sans-serif}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.grid button{padding:14px 9px;border:1px solid #ccd4df;border-radius:10px;background:#f5f7fa;font-weight:800}.grid button.sel{outline:3px solid #2f75b5;background:#eaf4ff}.actions{display:flex;gap:9px;margin-top:16px}.actions button{flex:1;padding:14px;border:0;border-radius:10px;font-weight:900}.ok{background:#172033;color:#fff}.muted{color:#667085}</style></head><body><div id="m">Laai O/8 telkaart…</div><iframe id="f" style="display:none"></iframe><script>(async()=>{const db=supabase.createClient('https://moomommajyldjquncnrd.supabase.co','sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH');const p=new URLSearchParams(location.search);let id=p.get('match');try{if(!id){const {data:{user}}=await db.auth.getUser();if(!user)throw Error('Meld eers aan.');const {data,error}=await db.from('matches').select('id').eq('coach_user_id',user.id).eq('age_group','U/8').neq('status','COMPLETED').order('match_date',{ascending:false}).order('match_time',{ascending:false}).limit(1);if(error)throw error;if(!data?.length)throw Error('Geen aktiewe O/8-wedstryd gevind nie.');id=data[0].id}const f=document.getElementById('f');f.src='./Telkaart-O8-ALPHA-OMEGA-V2.html?match='+encodeURIComponent(id);f.style.display='block';document.getElementById('m').style.display='none';f.onload=()=>{const w=f.contentWindow,d=f.contentDocument;if(!d)return;['wide','noball','wicket'].forEach(id=>{const el=d.getElementById(id);if(!el)return;const n=el.cloneNode(true);el.replaceWith(n)});const wide=d.getElementById('wide'),nb=d.getElementById('noball'),wick=d.getElementById('wicket');if(!wide||!nb||!wick)throw Error('Die telkaart-knoppies kon nie gelaai word nie.');const m=d.createElement('div');m.className='modal hide';m.innerHTML='<div class="box"><h2 id="mt">WICKET</h2><p id="mh" class="muted"></p><div id="mc"></div><div class="actions"><button id="mx">KANSELLEER</button><button id="mok" class="ok" disabled>BEVESTIG</button></div></div>';d.body.appendChild(m);const mt=m.querySelector('#mt'),mh=m.querySelector('#mh'),mc=m.querySelector('#mc'),mok=m.querySelector('#mok'),mx=m.querySelector('#mx');let mode=null,extra=0,out=null,how=null,fielder=null;const esc=s=>String(s??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));const pname=w.pname;const current=()=>w.current();const batters=()=>{const i=current();return [i.striker,i.non].filter(Boolean)};const fielders=()=>{const i=current();return (w.players||[]).filter(x=>x.team_id===i.fieldingTeam)};const btns=(arr,key)=>arr.map(x=>'<button type="button" data-k="'+key+'" data-id="'+esc(x.id)+'">'+esc(pname(x.id))+'</button>').join('');const close=()=>{m.classList.add('hide');mode=null};function showWicket(){mode='WICKET';out=null;how=null;fielder=null;mok.disabled=true;mt.textContent='WICKET';mh.textContent='Kies die kolwer en hoe hy/sy uit is.';mc.innerHTML='<b>Watter kolwer is uit?</b><div class="grid" id="outs">'+btns(batters(),'out')+'</div><div id="detail" style="margin-top:14px"></div>';mc.querySelectorAll('[data-k="out"]').forEach(b=>b.onclick=()=>{out=b.dataset.id;mc.querySelectorAll('[data-k="out"]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');const z=mc.querySelector('#detail');z.innerHTML='<b>Hoe is '+esc(pname(out))+' uit?</b><div class="grid" id="hows" style="margin-top:9px">'+['Bowled','Caught','Stumped','LBW','Run out','Hit wicket'].map(x=>'<button type="button" data-how="'+x+'">'+x+'</button>').join('')+'</div><div id="field" style="margin-top:12px"></div>';z.querySelectorAll('[data-how]').forEach(h=>h.onclick=()=>{how=h.dataset.how;z.querySelectorAll('[data-how]').forEach(x=>x.classList.remove('sel'));h.classList.add('sel');const ff=z.querySelector('#field');if(how==='Run out'){fielder=null;ff.innerHTML='<b>Veldwerker:</b><div class="grid" style="margin-top:9px">'+btns(fielders(),'fielder')+'</div>';ff.querySelectorAll('[data-k="fielder"]').forEach(q=>q.onclick=()=>{fielder=q.dataset.id;ff.querySelectorAll('[data-k="fielder"]').forEach(x=>x.classList.remove('sel'));q.classList.add('sel');mok.disabled=false})}else{fielder=null;ff.innerHTML='';mok.disabled=false}})}) ;m.classList.remove('hide')}function showExtra(kind){mode=kind;extra=0;out=null;how=null;fielder=null;mt.textContent=kind==='WIDE'?'WIDE':'NO-BALL';mh.textContent='Die gebeurtenis word as 1 bal getel. Kies die bykomende lopies of Run-out.';mc.innerHTML='<b>Wat het daarna gebeur?</b><div class="grid" style="margin-top:9px">'+[0,1,2,3,4,5,6].map(n=>'<button type="button" data-extra="'+n+'">+'+n+'</button>').join('')+'<button type="button" data-extra="R">RUN-OUT</button></div><div id="exdetail" style="margin-top:14px"></div>';mc.querySelectorAll('[data-extra]').forEach(b=>b.onclick=()=>{mc.querySelectorAll('[data-extra]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');if(b.dataset.extra==='R'){out=null;fielder=null;const z=mc.querySelector('#exdetail');z.innerHTML='<b>Watter kolwer is uit?</b><div class="grid" style="margin-top:9px">'+btns(batters(),'out')+'</div><div id="rf" style="margin-top:12px"></div>';z.querySelectorAll('[data-k="out"]').forEach(q=>q.onclick=()=>{out=q.dataset.id;z.querySelectorAll('[data-k="out"]').forEach(x=>x.classList.remove('sel'));q.classList.add('sel');const rf=z.querySelector('#rf');rf.innerHTML='<b>Watter veldwerker?</b><div class="grid" style="margin-top:9px">'+btns(fielders(),'fielder')+'</div>';rf.querySelectorAll('[data-k="fielder"]').forEach(v=>v.onclick=()=>{fielder=v.dataset.id;rf.querySelectorAll('[data-k="fielder"]').forEach(x=>x.classList.remove('sel'));v.classList.add('sel');mok.disabled=false})});mok.disabled=true}else{extra=Number(b.dataset.extra);mok.disabled=false}});m.classList.remove('hide')}function commit(){const i=current();if(!i||!w.state)return;if(mode==='WICKET'){if(!out||!how||(how==='Run out'&&!fielder))return;applyWicket(i,out,how,fielder);close();return}if(mode==='WIDE'||mode==='NOBALL'){if(out&&!fielder)return;const total=1+extra;const bs=w.bowlStats(i.bowler);const ps=w.playerStats(i.striker);i.balls=(i.balls||0)+1;i.overBalls=(i.overBalls||0)+1;i.runs=(i.runs||0)+total;bs.balls=(bs.balls||0)+1;bs.runs=(bs.runs||0)+total;if(mode==='WIDE')bs.wides=(bs.wides||0)+1;else{bs.noballs=(bs.noballs||0)+1;if(extra)ps.runs=(ps.runs||0)+extra}if(out){applyRunoutOnly(i,out,fielder)}log(mode+' '+(total===1?'+1':'+'+total)+(out?' • '+pname(out)+' UIT – Run out • veldwerker: '+pname(fielder):''));w.render();w.persist();close()}}function applyWicket(i,id,method,field){i.balls=(i.balls||0)+1;i.overBalls=(i.overBalls||0)+1;i.wickets=(i.wickets||0)+1;const ps=w.playerStats(id);ps.out=method;ps.balls=(ps.balls||0)+1;i.out=i.out||[];if(!i.out.includes(id))i.out.push(id);if(i.striker===id)i.striker=null;if(i.non===id)i.non=null;if(method==='Run out'){const fs=w.bowlStats(field);fs.runouts=(fs.runouts||0)+1}else{const bs=w.bowlStats(i.bowler);bs.balls=(bs.balls||0)+1;bs.wickets=(bs.wickets||0)+1}log(pname(id)+' UIT – '+method+(field?' • veldwerker: '+pname(field):''));w.render();w.persist()}function applyRunoutOnly(i,id,field){i.wickets=(i.wickets||0)+1;i.out=i.out||[];if(!i.out.includes(id))i.out.push(id);const ps=w.playerStats(id);ps.out='Run out';if(i.striker===id)i.striker=null;if(i.non===id)i.non=null;const fs=w.bowlStats(field);fs.runouts=(fs.runouts||0)+1}function log(text){w.state.log=w.state.log||[];const i=current();w.state.log.push({ball:(i.overs||0)+'.'+(i.overBalls||0),text});}wide.onclick=e=>{e.preventDefault();e.stopImmediatePropagation();showExtra('WIDE')};nb.onclick=e=>{e.preventDefault();e.stopImmediatePropagation();showExtra('NOBALL')};wick.onclick=e=>{e.preventDefault();e.stopImmediatePropagation();showWicket()};mok.onclick=commit;mx.onclick=close};}catch(e){document.getElementById('m').textContent='Fout: '+e.message}})();</script></body></html>
