<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Ouer Goedkeuring</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body style="font-family:system-ui;max-width:1000px;margin:30px auto;padding:20px"><h1>👨‍👩‍👧 Ouer Goedkeurings</h1><p>Kies die korrekte speler, keur die ouer goed, en die toegang-e-pos word outomaties gestuur.</p><div id="list">Laai…</div><script>(async()=>{const U='https://moomommajyldjquncnrd.supabase.co',K='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH',db=supabase.createClient(U,K),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const {data:{session}}=await db.auth.getSession();if(!session){$('list').textContent='Meld eers aan as admin.';return}const prof=await db.from('user_profiles').select('role').eq('user_id',session.user.id).single();if(prof.data?.role!=='admin'){$('list').textContent='Geen admin toegang.';return}const [rq,pl]=await Promise.all([db.from('parent_approval_requests').select('*').eq('status','pending').order('created_at',{ascending:true}),db.from('players').select('id,first_name,surname,team_id,teams(name,age_group)').eq('active',true).order('first_name')]);if(rq.error||pl.error){$('list').textContent=(rq.error||pl.error).message;return}const opts=pl.data.map(p=>`<option value="${p.id}">${esc(p.first_name)} ${esc(p.surname)} — ${esc(p.teams?.name||'')} (${esc(p.teams?.age_group||'')})</option>`).join('');$('list').innerHTML=rq.data.length?rq.data.map(r=>`<section style="border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0"><b>${esc(r.requested_email)}</b><br>Kind: ${esc(r.requested_child_name)} · ${esc(r.relationship||'')} · ${esc(r.requested_phone||'')}<br><select id="p-${r.id}" style="margin-top:10px;padding:8px"><option value="">Kies korrekte speler…</option>${opts}</select> <button onclick="approve('${r.id}')">✅ Keur goed & stuur e-pos</button> <button onclick="reject('${r.id}')">Verwerp</button></section>`).join(''):'Geen hangende versoeke.';window.approve=async id=>{const player=$(('p-'+id)).value;if(!player)return alert('Kies eers die speler.');const {data,error}=await db.rpc('admin_approve_parent_request',{p_request_id:id,p_player_id:player});if(error)return alert(error.message);const r=await db.from('parent_approval_requests').select('guardian_user_id,requested_email,requested_child_name').eq('id',id).single();if(r.error)return alert(r.error.message);const res=await fetch(U+'/functions/v1/parent-approval-email',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({request_id:id})});if(!res.ok){alert('Ouer goedgekeur, maar e-pos kon nie gestuur word nie. Kontroleer die Resend-konfigurasie.');return}alert('Ouer goedgekeur en toegang-e-pos gestuur.');location.reload()};window.reject=async id=>{const {error}=await db.from('parent_approval_requests').update({status:'rejected',reviewed_by:session.user.id,reviewed_at:new Date().toISOString()}).eq('id',id).eq('status','pending');if(error)alert(error.message);else location.reload()}})()</script></body></html>
