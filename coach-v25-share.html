tion:fixed;inset:0;background:#17203380;z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px}.share-modal-box{background:#fff;width:min(520px,100%);border-radius:18px;padding:20px;box-shadow:0 15px 50px #0003}.share-url{word-break:break-all;background:#f2f4f7;border-radius:10px;padding:10px;font-size:13px;margin:12px 0}.live-badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#fde8e8;color:#b42318;font-size:12px;font-weight:900}@media(max-width:600px){.important-link-head{align-items:flex-start}}</style>';doc.head.appendChild(s)}function showShare(doc,title,url){const old=doc.getElementById('shareModal');if(old)old.remove();const m=doc.createElement('div');m.id='shareModal';m.className='share-modal';m.innerHTML='<div class="share-modal-box"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:0">📤 Deel skakel</h2><button id="shareClose" class="share-btn share-copy">Sluit</button></div><p style="margin:10px 0 4px"><b>'+esc(title)+'</b></p><div class="share-url">'+esc(url)+'</div><div class="share-actions"><button id="copyLink" class="share-btn share-copy">📋 Kopieer skakel</button><button id="whatsappLink" class="share-btn share-wa">💬 Stuur via WhatsApp</button></div><p id="shareMsg" class="muted" style="margin:10px 0 0"></p></div>';doc.body.appendChild(m);doc.getElementById('shareClose').onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()};doc.getElementById('copyLink').onclick=async()=>{try{await navigator.clipboard.writeText(url);doc.getElementById('shareMsg').textContent='Skakel gekopieer.'}catch(e){doc.getElementById('shareMsg').textContent='Kon nie outomaties kopieer nie – kies die skakel hierbo.'}};doc.getElementById('whatsappLink').onclick=()=>{const text=encodeURIComponent(title+'\n'+url);doc.defaultView.open('https://wa.me/?text='+text,'_blank')};}function linkCard(doc,title,description,url,live){return '<div class="important-link"><div class="important-link-head"><div><b>'+esc(title)+'</b>'+(live?' <span class="live-badge">● LIVE</span>':'')+'<div class="muted" style="margin-top:4px">'+esc(description)+'</div></div><button class="share-btn share-open" data-share-title="'+esc(title)+'" data-share-url="'+esc(url)+'">📤 Deel</button></div><div class="share-actions"><button class="share-btn share-copy" data-copy="'+esc(url)+'">📋 Kopieer skakel</button><button class="share-btn share-wa" data-wa="'+esc(url)+'">💬 WhatsApp</button></div></div>'}async function loadLive(){const doc=deepDoc();if(!doc)return;injectStyle(doc);let box=doc.getElementById('importantLinks');if(!box){const app=doc.getElementById('app');if(!app)return;box=doc.createElement('section');box.id='importantLinks';box.className='important-links';const first=app.children[0];app.insertBefore(box,first?first.nextSibling:first)}let html='<div class="important-link-head"><div><h2 style="margin:0">🔗 Belangrike skakels</h2><div class="muted" style="margin-top:4px">Deel vinnig registrasie en, wanneer beskikbaar, die huidige live telling.</div></div></div>';html+=linkCard(doc,'👨‍👩‍👧 Ouer / Voog registrasie','Deel hierdie skakel met ’n ouer of voog wat nog moet registreer.',REG,false);const session=(await db.auth.getSession()).data.session;if(session){const q=await db.from('matches').select('id,team_a_id,team_b_id,status').or('coach_user_id.eq.'+session.user.id+',scorer_user_id.eq.'+session.user.id).eq('status','LIVE');if(!q.error&&q.data&&q.data.length){const ids=[...new Set(q.data.flatMap(x=>[x.team_a_id,x.team_b_id]).filter(Boolean))];let tm={};if(ids.length){const t=await db.from('teams').select('id,name').in('id',ids);(t.data||[]).forEach(x=>tm[x.id]=x.name)}q.data.forEach(x=>{const name=(tm[x.team_a_id]||'Span A')+' vs '+(tm[x.team_b_id]||'Span B');html+=linkCard(doc,'🏏 Live telling – '+name,'Die wedstryd is tans LIVE.',BASE+x.id,true)})}}box.innerHTML=html;doc.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await doc.defaultView.navigator.clipboard.writeText(b.dataset.copy);b.textContent='✓ Gekopieer';setTimeout(()=>b.textContent='📋 Kopieer skakel',1400)}catch(e){showShare(doc,'Deel skakel',b.dataset.copy)}});doc.querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>doc.defaultView.open('https://wa.me/?text='+encodeURIComponent('Junior Krieket skakel\n'+b.dataset.wa),'_blank'));doc.querySelectorAll('[data-share-url]').forEach(b=>b.onclick=()=>showShare(doc,b.dataset.shareTitle,b.dataset.shareUrl))}function start(){loadLive();clearInterval(timer);timer=setInterval(loadLive,10000)}outer.addEventListener('load',()=>{setTimeout(start,700)});})();</script></body></html>
