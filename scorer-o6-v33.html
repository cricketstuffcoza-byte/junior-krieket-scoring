<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – O/6 Telkaart V33</title><style>html,body{margin:0;background:#eef2f6;width:100%;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="score" title="Junior Krieket O/6 Telkaart"></iframe><script>'use strict';const q=location.search,outer=document.getElementById('score');outer.src='scorer-o6-v32.html'+q+'&fix=v33';function doc(){try{const d=outer.contentDocument,f=d&&d.getElementById('frame');return f&&f.contentDocument}catch(e){return null}}function win(){try{const d=outer.contentDocument,f=d&&d.getElementById('frame');return f&&f.contentWindow}catch(e){return null}}function pdf(){try{const d=doc(),w=win(),s=w&&w.__juniorState;if(!d||!s)return alert('Wedstryddata is nog nie gereed nie.');const title='Junior Krieket – '+(s.batting||'Wedstryd')+' – Innings '+(s.innings||1);const score=s.score&&s.batting?s.score[s.batting]:{};const rows=Object.values(s.bats||{}).filter(x=>x&&x.name).map(x=>'<tr><td>'+x.name+'</td><td>'+Number(x.runs||0)+'</td><td>'+Number(x.balls||0)+'</td><td>'+Number(x.unplayable||0)+'</td><td>'+Number(x.catches||0)+'</td><td>'+Number(x.runOuts||0)+'</td><td>'+Number(x.dismissals||0)+'</td></tr>').join('');const bowls=Object.values(s.bowlers||{}).filter(x=>x&&x.name).map(x=>'<tr><td>'+x.name+'</td><td>'+Number(x.runs||0)+'</td><td>'+Number(x.legalBalls||0)+'</td><td>'+Number(x.wickets||0)+'</td><td>'+Number(x.wides||0)+'</td><td>'+Number(x.noBalls||0)+'</td></tr>').join('');const p=window.open('','_blank');if(!p)return alert('Laat asseblief pop-ups toe vir die PDF.');p.document.write('<!doctype html><html lang="af"><head><meta charset="utf-8"><title>'+title+'</title><style>body{font-family:Arial,sans-serif;padding:25px;color:#172033}h1{margin:0 0 6px}h2{margin-top:22px;border-bottom:1px solid #ccc;padding-bottom:5px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.box{border:1px solid #ccc;border-radius:7px;padding:9px}table{width:100%;border-collapse:collapse;margin-top:8px}th,td{border:1px solid #ccc;padding:6px;text-align:center}th:first-child,td:first-child{text-align:left}@media print{body{padding:10px}}</style></head><body><h1>'+title+'</h1><div>Datum: '+new Date().toLocaleDateString('af-ZA')+'</div><div class="grid"><div class="box"><b>'+String(s.batting||'')+'</b><br>'+Number(score.runs||0)+'/'+Number(score.wickets||0)+'</div><div class="box"><b>Overs</b><br>'+Math.floor(Number(score.legalBalls||0)/8)+'.'+(Number(score.legalBalls||0)%8)+'</div><div class="box"><b>Onspeelbaar</b><br>'+Number(score.unplayable||0)+'</div><div class="box"><b>Coach throws</b><br>'+Number(score.coach||0)+' ('+Number(score.coachRuns||0)+' lopies)</div></div><h2>Kolwer-statistieke</h2><table><tr><th>Speler</th><th>Lopies</th><th>Speelbaar</th><th>Onspeelbaar</th><th>Catches</th><th>Run Outs</th><th>Uit</th></tr>'+rows+'</table><h2>Bouler-statistieke</h2><table><tr><th>Bouler</th><th>Lopies teen</th><th>Geldige balle</th><th>Paaltjies</th><th>Wydes</th><th>No-balls</th></tr>'+bowls+'</table><p>Kolpaar: '+(s.pair||0)+' | Paar balle: '+(s.pairBalls||0)+'/16 | Face: '+(s.striker||'—')+' | Hardloper: '+(s.nonStriker||'—')+' | Bouler: '+(s.bowler||'—')+'</p><script>setTimeout(()=>window.print(),400)<\/script></body></html>');p.document.close()}catch(e){alert('Kon nie PDF voorberei nie: '+(e.message||e))}}function patch(){try{const d=doc(),w=win(),s=w&&w.__juniorState;if(!d||!w||!s)return;const pair=d.getElementById('pairPanel'),choices=d.getElementById('pairChoices'),bp=d.getElementById('bowlerPanel');/* RESUME INTO SECOND INNINGS: restore the selection workflow after a reload. */if(s.started&&!s.completed&&Number(s.innings)>=2&&!s.striker&&!s.nonStriker&&pair&&pair.classList.contains('hidden')&&typeof w.openPair==='function'){s.bowler=null;s.selectedBowler=null;w.openPair();if(typeof w.render==='function')w.render()}/* Once a pair is confirmed, require a bowler before any ball. */if(s.started&&!s.completed&&Number(s.innings)>=2&&!s.bowler&&s.striker&&s.nonStriker&&pair&&pair.classList.contains('hidden')&&bp&&bp.classList.contains('hidden')&&typeof w.openBowler==='function'){w.openBowler();if(typeof w.render==='function')w.render()}/* MANUAL STRIKE SWAP */const face=d.getElementById('striker');const box=face&&face.closest('.card');if(box&&!d.getElementById('swapStrike')){const b=d.createElement('button');b.id='swapStrike';b.type='button';b.className='btn';b.textContent='🔄 RUIL STRIKE';b.style.marginTop='8px';b.addEventListener('click',()=>{if(!s.started||s.completed||!s.striker||!s.nonStriker)return;if(s.pendingDismissal||s.pendingFielder||s.pendingNewBatter||s.pendingCoachThrow||s.pairLimitAccepted)return;if(typeof w.snapshot==='function')w.snapshot();[s.striker,s.nonStriker]=[s.nonStriker,s.striker];if(typeof w.render==='function')w.render()});box.appendChild(b)}/* PDF BUTTONS */const actions=d.querySelector('.actions');if(actions&&!d.getElementById('downloadPdf')){const b=d.createElement('button');b.id='downloadPdf';b.type='button';b.className='btn';b.textContent='📄 LAAI PDF AF';b.addEventListener('click',pdf);actions.appendChild(b)}const end=d.getElementById('inningsPanel');if(end&&!end.classList.contains('hidden')&&!d.getElementById('inningsPdf33')){const b=d.createElement('button');b.id='inningsPdf33';b.type='button';b.className='primary';b.textContent='📄 LAAI PDF AF – INNINGS '+(s.innings||1);b.style.width='100%';b.style.marginTop='10px';b.addEventListener('click',pdf);end.appendChild(b)}}catch(e){console.warn('O/6 v33 patch',e)}}setInterval(patch,150);outer.addEventListener('load',()=>setTimeout(patch,300));</script></body></html>
