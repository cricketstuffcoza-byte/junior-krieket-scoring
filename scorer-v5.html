<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Beskikbare Spelers</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#eef2f6;font-family:system-ui,sans-serif;color:#172033}.bar{max-width:1100px;margin:0 auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.team{border:1px solid #e4e7ec;border-radius:14px;padding:14px}.player{display:flex;align-items:center;gap:10px;padding:9px;border-bottom:1px solid #eef0f3}.player:last-child{border-bottom:0}.player input{width:20px;height:20px}.primary{background:#172033;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}.muted{color:#667085}.error{color:#b42318}.empty{padding:12px 0;color:#667085}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="bar"><div id="error" class="card error" style="display:none"></div><div id="picker"><div class="card"><h1>👥 Kies beskikbare spelers</h1><p id="info" class="muted">Laai wedstryd…</p><p>Bevestig slegs die spelers wat <b>vandag beskikbaar is</b>. Hierdie lys word vir hierdie wedstryd gebruik.</p></div><div id="teams" class="grid"></div><div class="card"><button id="continue" class="primary">Gaan voort na telkaart</button><p id="msg" class="muted"></p></div></div><iframe id="frame" style="display:none;width:100%;height:calc(100vh - 90px);min-height:900px;border:0;border-radius:16px;background:#fff" title="Junior Krieket telkaart"></iframe></div><script>'use strict';const SUPABASE_URL='https://moomommajyldjquncnrd.supabase.co',SUPABASE_KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH',db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let match,all=[];function fail(e){$('error').textContent=e?.message||String(e);$('error').style.display='block'}async function init(){const id=new URLSearchParams(location.search).get('match');if(!id)throw Error('Geen wedstryd-ID ontvang nie.');const mr=await db.from('matches').select('id,fixture_code,team_a_id,team_b_id,match_date,match_time,venue,age_group').eq('id',id).maybeSingle();if(mr.error)throw mr.error;if(!mr.data)throw Error('Die wedstryd kon nie gevind word nie.');match=mr.data;const ids=[match.team_a_id,match.team_b_id].filter(Boolean);const [tr,mpr]=await Promise.all([db.from('teams').select('id,name').in('id',ids),db.from('match_players').select('player_id,team_id,players(id,first_name,surname)').eq('match_id',id)]);if(tr.error)throw tr.error;const tm=Object.fromEntries((tr.data||[]).map(t=>[t.id,t.name]));if(mpr.error)throw mpr.error;all=(mpr.data||[]).filter(x=>x.players).map(x=>({...x,teamName:tm[x.team_id]||'Span'}));if(!all.length){const pr=await db.from('players').select('id,first_name,surname,team_id').in('team_id',ids).eq('active',true).order('surname').order('first_name');if(pr.error)throw pr.error;all=(pr.data||[]).map(x=>({player_id:x.id,team_id:x.team_id,players:x,teamName:tm[x.team_id]||'Span'}));}$('info').textContent=`${tm[match.team_a_id]||'Span A'} vs ${tm[match.team_b_id]||'Span B'} · ${match.age_group||''} · ${match.match_date||''}`;for(const tid of ids){const div=document.createElement('div');div.className='team';const name=tm[tid]||'Span';div.innerHTML=`<h2>${esc(name)}</h2>`;const teamPlayers=all.filter(x=>x.team_id===tid);if(!teamPlayers.length)div.innerHTML+='<div class="empty">Geen spelers gevind nie.</div>';teamPlayers.forEach(x=>{const n=[x.players.first_name,x.players.surname].filter(Boolean).join(' ');div.innerHTML+=`<label class="player"><input type="checkbox" value="${x.player_id}" data-team="${x.team_id}" checked> <span>${esc(n)}</span></label>`});$('teams').appendChild(div)}}async function go(){const selected=[...document.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);const selectedByTeam={};document.querySelectorAll('input[type=checkbox]:checked').forEach(x=>(selectedByTeam[x.dataset.team]??=[]).push(x.value));const teamIds=[match.team_a_id,match.team_b_id].filter(Boolean);if(teamIds.some(t=>!(selectedByTeam[t]||[]).length)){$('msg').textContent='Kies minstens 1 beskikbare speler per span.';return}localStorage.setItem('availablePlayers:'+match.id,JSON.stringify(selected));const age=String(match.age_group||'').toUpperCase().replace('O/','U/');$('msg').textContent='Beskikbare spelers bevestig. Laai korrekte telkaart…';if(age!=='U/8'){$('msg').textContent='Scorer V5 is tans vir O/8 bedoel.';return}$('frame').src=`Telkaart-O8-ALPHA-OMEGA-V6.html?match=${encodeURIComponent(match.id)}&available=${encodeURIComponent(selected.join(','))}`;$('frame').style.display='block';$('picker').style.display='none'}$('continue').onclick=go;init().catch(fail);</script></body></html>
