<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Telkaart V5</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#eef2f6;font-family:system-ui,sans-serif;color:#172033}.bar{max-width:1100px;margin:0 auto;padding:12px 18px}.card{background:#fff;border-radius:16px;padding:14px 18px;margin:10px 0;box-shadow:0 2px 12px #0001}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pill{padding:5px 10px;border-radius:999px;background:#edf2f7;font-size:12px;font-weight:800}.muted{color:#667085}.error{color:#b42318}.scoreframe{width:100%;height:calc(100vh - 150px);min-height:760px;border:0;border-radius:16px;background:#fff}.hidden{display:none!important}</style></head><body><div class="bar"><div class="card"><div class="top"><div><h2>🏏 Telkaart</h2><div id="fixture" class="muted">Laai wedstryd…</div><div id="scorer" class="muted"></div></div><span class="pill">Telling gehou deur afrigter</span></div></div><div id="error" class="card error hidden"></div><iframe id="frame" class="scoreframe hidden" title="Junior Krieket telkaart"></iframe></div><script>'use strict';const URL='https://moomommajyldjquncnrd.supabase.co',KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function init(){if(!window.supabase||!window.supabase.createClient)throw Error('Die Supabase-aanmeldingsdiens kon nie laai nie.');const db=window.supabase.createClient(URL,KEY);const id=new URLSearchParams(location.search).get('match');if(!id)throw Error('Geen wedstryd-ID ontvang nie.');const {data:m,error}=await db.from('matches').select('id,fixture_code,team_a_id,team_b_id,match_date,match_time,venue,coach_user_id,scorer_user_id').eq('id',id).maybeSingle();if(error)throw error;if(!m)throw Error('Die wedstryd kon nie gevind word nie. ID: '+id);const teamIds=[m.team_a_id,m.team_b_id].filter(Boolean);const {data:teams,error:teamError}=await db.from('teams').select('id,name').in('id',teamIds);if(teamError)throw teamError;const teamMap=Object.fromEntries((teams||[]).map(t=>[t.id,t.name]));const teamA=teamMap[m.team_a_id]||'Onbekende span';const teamB=teamMap[m.team_b_id]||'Onbekende span';let coachId=m.coach_user_id||m.scorer_user_id;let name='Onbekend';if(coachId){const {data:p}=await db.from('user_profiles').select('full_name').eq('user_id',coachId).maybeSingle();if(p?.full_name)name=p.full_name}document.getElementById('fixture').innerHTML=`<b>${esc(teamA)} vs ${esc(teamB)}</b> • ${esc(m.match_date)} • ${String(m.match_time||'').slice(0,5)} • ${esc(m.venue||'')}`;document.getElementById('scorer').innerHTML=`<b>Telling gehou deur:</b> ${esc(name)}`;const f=document.getElementById('frame');f.src=`scorer.html?match=${encodeURIComponent(id)}&v=5`;f.classList.remove('hidden')}init().catch(e=>{const x=document.getElementById('error');x.textContent=e.message||'Kon nie wedstryd laai nie.';x.classList.remove('hidden')});</script></body></html>
