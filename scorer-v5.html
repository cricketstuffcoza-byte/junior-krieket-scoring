<!doctype html>
<html lang="af">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Junior Krieket – Alpha & Omega Telkaart</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#eef2f6;font-family:system-ui,sans-serif;color:#172033}.bar{max-width:1100px;margin:0 auto;padding:12px 18px}.card{background:#fff;border-radius:16px;padding:14px 18px;margin:10px 0;box-shadow:0 2px 12px #0001}.muted{color:#667085}.error{color:#b42318;background:#fff3f2}.hidden{display:none!important}.scoreframe{width:100%;height:calc(100vh - 90px);min-height:900px;border:0;border-radius:16px;background:#fff}
</style>
</head>
<body>
<div class="bar">
  <div id="error" class="card error hidden"></div>
  <iframe id="frame" class="scoreframe hidden" title="Junior Krieket Alpha & Omega telkaart"></iframe>
</div>
<script>
'use strict';
const SUPABASE_URL='https://moomommajyldjquncnrd.supabase.co';
const SUPABASE_KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH';
const ALPHA_URL='https://raw.githubusercontent.com/cricketstuffcoza-byte/junior-krieket-scoring/o6-alpha-omega/Telkaart-O6-ALPHA-OMEGA-V16.html';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
function fail(e){const x=$("error");x.textContent=e?.message||String(e)||'Kon Alpha & Omega telkaart nie laai nie.';x.classList.remove('hidden')}
async function init(){
  const matchId=new URLSearchParams(location.search).get('match');
  if(!matchId)throw Error('Geen wedstryd-ID ontvang nie.');
  const {data:match,error:matchError}=await db.from('matches').select('id,fixture_code,team_a_id,team_b_id,match_date,match_time,venue,age_group').eq('id',matchId).maybeSingle();
  if(matchError)throw matchError;if(!match)throw Error('Die wedstryd kon nie gevind word nie.');
  const ids=[match.team_a_id,match.team_b_id].filter(Boolean);
  const {data:teams,error:teamError}=await db.from('teams').select('id,name').in('id',ids);
  if(teamError)throw teamError;
  const teamMap=Object.fromEntries((teams||[]).map(t=>[t.id,t.name]));
  const teamA=teamMap[match.team_a_id]||'Span A',teamB=teamMap[match.team_b_id]||'Span B';
  const {data:mp,error:mpError}=await db.from('match_players').select('player_id,team_id,players(first_name,surname)').eq('match_id',matchId);
  if(mpError)throw mpError;
  const players={};
  players[teamA]=(mp||[]).filter(x=>x.team_id===match.team_a_id&&x.players).map(x=>[x.players.first_name,x.players.surname].filter(Boolean).join(' '));
  players[teamB]=(mp||[]).filter(x=>x.team_id===match.team_b_id&&x.players).map(x=>[x.players.first_name,x.players.surname].filter(Boolean).join(' '));
  if(players[teamA].length<2||players[teamB].length<2)throw Error('Die wedstryd se spelers kon nie volledig gelaai word nie.');
  const age=String(match.age_group||'U/6').toUpperCase().replace('O/','U/');
  const safeMatch={teamA,teamB,group:age,date:match.match_date||'',time:String(match.match_time||'').slice(0,5),venue:match.venue||''};
  const response=await fetch(ALPHA_URL,{cache:'no-store'});if(!response.ok)throw Error('Die bewaarde Alpha & Omega telkaart kon nie gelaai word nie ('+response.status+').');
  let html=await response.text();
  html=html.replace(/const MATCH=\{[^;]*\};/,`const MATCH=${JSON.stringify(safeMatch)};`);
  html=html.replace(/const PLAYERS=\{[\s\S]*?\n\};/,`const PLAYERS=${JSON.stringify(players)};`);
  html=html.replace('Plaaslike toetsweergawe • wedstrydinstellings is deur Admin vooraf bepaal','Alpha & Omega telkaart • wedstrydinstellings is deur Admin vooraf bepaal');
  const f=$("frame");
  f.src=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  f.classList.remove('hidden');
}
init().catch(fail);
</script>
</body>
</html>
