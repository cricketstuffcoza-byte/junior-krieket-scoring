async function patchCoachList(){try{const v17=frame.contentDocument?.getElementById('v21Frame');if(!v17?.contentDocument)return false;const d=v17.contentDocument,w=v17.contentWindow,select=d.getElementById('v21Coach');if(!select)return false;const sb=w.supabase?.createClient?.(SUPABASE_URL,SUPABASE_KEY);if(!sb)return false;const{data:roleRows,error:roleErr}=await sb.from('user_roles').select('user_id').eq('role','coach').eq('active',true);if(roleErr)throw roleErr;const ids=[...new Set((roleRows||[]).map(r=>r.user_id).filter(Boolean))];let profiles=[];if(ids.length){const{data,error}=await sb.from('user_profiles').select('user_id,full_name,active').in('user_id',ids);if(error)throw error;profiles=data||[]}const coaches=profiles.filter(p=>p.active!==false).sort((a,b)=>String(a.full_name||'').localeCompare(String(b.full_name||'')));const current=select.value;select.innerHTML='<option value="">— Kies afrigter —</option>'+coaches.map(c=>{const id=String(c.user_id).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const name=String(c.full_name||'Afrigter').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));return '<option value="'+id+'">'+name+'</option>'}).join('');if(current&&coaches.some(c=>String(c.user_id)===String(current)))select.value=current;return true}catch(e){console.error('Coach dropdown fix:',e);return false}}
frame.addEventListener('load',async()=>{for(let i=0;i<120;i++){try{if(await patchCoachList())return}catch(e){}await sleep(250)}})})();</script></body></html>
