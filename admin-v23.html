<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Admin Portaal V23</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eef2f6;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033}.shell{max-width:1220px;margin:0 auto;padding:18px}.brand{background:#172033;color:#fff;border-radius:18px 18px 0 0;padding:22px 24px 10px;box-shadow:0 3px 16px #0001}.brand h1{margin:0;font-size:28px}.brand p{margin:7px 0 18px;color:#d5deea}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#edf2f7;color:#172033;font-size:12px;font-weight:800}.frame{display:block;width:100%;height:calc(100vh - 92px);min-height:950px;border:0;border-radius:0 0 18px 18px;background:#eef2f6;box-shadow:0 3px 16px #0001}</style></head><body><div class="shell"><div class="brand"><h1>🔐 Admin Portaal V23</h1><p>Junior Krieket • Administrasie, spanne, spelers, wedstryde en ouerprofiele</p><span class="pill">V23 • LIVE DATABASE</span></div><iframe id="portal" class="frame" src="admin-v21.html" title="Junior Krieket Admin Portaal V23"></iframe></div><div id="overlay" style="display:none;position:fixed;inset:0;background:#0008;z-index:100;align-items:center;justify-content:center;font-family:system-ui,sans-serif"><div style="background:#fff;border-radius:18px;padding:24px;max-width:760px;width:calc(100% - 30px);max-height:90vh;overflow:auto"><h2>✏️ Wysig Ouerprofiel</h2><p id="email" style="color:#667085"></p><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div><label>Volle naam</label><input id="n" style="width:100%;padding:11px"></div><div><label>Selfoonnommer</label><input id="p" style="width:100%;padding:11px"></div><div><label>Nood-telefoonnommer</label><input id="e" style="width:100%;padding:11px"></div><div><label>Verhouding</label><select id="r" style="width:100%;padding:11px"><option>Ouer</option><option>Voog</option><option>Ander</option></select></div><div><label>Status</label><select id="a" style="width:100%;padding:11px"><option value="true">Aktief</option><option value="false">Gedeaktiveer</option></select></div></div><div style="display:flex;gap:10px;margin-top:16px"><button id="save" style="padding:11px 15px;background:#172033;color:#fff;border:0;border-radius:10px;font-weight:800">💾 Stoor</button><button id="cancel" style="padding:11px 15px;border:0;border-radius:10px;font-weight:800">Kanselleer</button></div><p id="m"></p></div></div><script>(function(){const frame=document.getElementById('portal'),ov=document.getElementById('overlay'),$=id=>document.getElementById(id);const URL='https://moomommajyldjquncnrd.supabase.co',KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH';let db,parent;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function addParentTab(doc){const tabs=doc.getElementById('tabs');if(!tabs)return;let b=doc.getElementById('v23ParentTab');if(!b){b=doc.createElement('button');b.id='v23ParentTab';b.textContent='👨‍👩‍👧 Ouerprofiele';b.dataset.tab='v23parents';tabs.appendChild(b)}let s=doc.getElementById('v23parents');if(!s){s=doc.createElement('section');s.id='v23parents';s.className='hidden';s.innerHTML='<div class="card"><div class="top"><div><h2>👨‍👩‍👧 Ouerprofiele</h2><p class="muted">Bestuur enige goedgekeurde ouer/voog se besonderhede.</p></div><button class="ghost" id="v23Refresh">↻ Verfris</button></div><p id="v23Msg" class="small"></p><div id="v23Table" class="tablewrap">Laai…</div></div>';doc.getElementById('app').appendChild(s)}return{tabs,b,s}}
async function loadParents(doc){const box=doc.getElementById('v23Table');if(!box)return;box.textContent='Laai ouers…';try{const q=await db.from('user_profiles').select('user_id,full_name,mobile_phone,emergency_phone,relationship,active').eq('role','parent').order('full_name');if(q.error)throw q.error;const ps=q.data||[],ids=ps.map(x=>x.user_id);let links=[];if(ids.length){const l=await db.from('guardian_players').select('guardian_user_id,relationship,players(first_name,surname)').in('guardian_user_id',ids);if(l.error)throw l.error;links=l.data||[]}const map=new Map();links.forEach(x=>{if(!map.has(x.guardian_user_id))map.set(x.guardian_user_id,[]);map.get(x.guardian_user_id).push(`${x.players?.first_name||''} ${x.players?.surname||''}`.trim())});box.innerHTML='<table><thead><tr><th>Ouer</th><th>Kontak</th><th>Kinders</th><th>Status</th><th>Aksies</th></tr></thead><tbody>'+(ps.map(x=>`<tr><td><b>${esc(x.full_name||'—')}</b><br><span class="muted">${esc(x.user_id)}</span></td><td>${esc(x.mobile_phone||'—')}<br>Nood: ${esc(x.emergency_phone||'—')}<br>${esc(x.relationship||'—')}</td><td>${esc((map.get(x.user_id)||[]).join(', ')||'Geen')}</td><td>${x.active?'🟢 Aktief':'⚫ Gedeaktiveer'}</td><td><button class="ghost mini" data-v23-edit="${esc(x.user_id)}">✏️ Wysig</button></td></tr>`).join('')||'<tr><td colspan="5">Geen ouerprofiele nie.</td></tr>')+'</tbody></table>';box.querySelectorAll('[data-v23-edit]').forEach(b=>b.onclick=()=>openEdit(ps.find(x=>x.user_id===b.dataset.v23Edit)))}catch(e){box.innerHTML='<span class="error">Kon ouers nie laai nie: '+esc(e.message||e)+'</span>'}}
function openEdit(p){parent=p;if(!p)return;$('email').textContent='Gebruiker ID: '+p.user_id;$('n').value=p.full_name||'';$('p').value=p.mobile_phone||'';$('e').value=p.emergency_phone||'';$('r').value=p.relationship||'Ouer';$('a').value=String(p.active!==false);$('m').textContent='';$('m').className='';ov.style.display='flex'}
async function save(){if(!parent)return;const m=$('m');m.textContent='Stoor…';const{error}=await db.rpc('admin_update_parent_profile',{p_guardian_user_id:parent.user_id,p_full_name:$('n').value.trim(),p_mobile_phone:$('p').value.trim(),p_emergency_phone:$('e').value.trim(),p_relationship:$('r').value,p_active:$('a').value==='true'});if(error){m.textContent=error.message;m.style.color='#b42318';return}m.textContent='Ouerprofiel suksesvol opgedateer.';m.style.color='#067647';setTimeout(()=>{ov.style.display='none';const doc=frame.contentDocument;loadParents(doc)},500)}
frame.addEventListener('load',()=>{const doc=frame.contentDocument;if(!doc)return;try{const style=doc.createElement('style');style.textContent='*{box-sizing:border-box}html,body{margin:0!important;background:#eef2f6!important;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important}.wrap{max-width:1180px!important;margin:0 auto!important;padding:18px!important}.card{border:1px solid #edf0f4!important}';doc.head.appendChild(style);db=frame.contentWindow.supabase.createClient(URL,KEY);const x=addParentTab(doc);if(!x)return;const show=()=>{doc.querySelectorAll('#app>section').forEach(s=>s.classList.add('hidden'));x.s.classList.remove('hidden');doc.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b===x.b));loadParents(doc)};x.b.onclick=show;doc.getElementById('v23Refresh').onclick=()=>loadParents(doc);loadParents(doc)}catch(e){console.error(e)}});$('save').onclick=save;$('cancel').onclick=()=>ov.style.display='none';})();</script></body></html>
