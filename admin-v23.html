<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Admin Portaal V23</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eef2f6;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033}.shell{max-width:1220px;margin:0 auto;padding:18px}.brand{background:#172033;color:#fff;border-radius:18px 18px 0 0;padding:22px 24px 10px;box-shadow:0 3px 16px #0001}.brand h1{margin:0;font-size:28px}.brand p{margin:7px 0 18px;color:#d5deea}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#edf2f7;color:#172033;font-size:12px;font-weight:800}.frame{display:block;width:100%;height:calc(100vh - 92px);min-height:950px;border:0;border-radius:0 0 18px 18px;background:#eef2f6;box-shadow:0 3px 16px #0001}</style></head><body><div class="shell"><div class="brand"><h1>🔐 Admin Portaal V23</h1><p>Junior Krieket • Administrasie, spanne, spelers, wedstryde en ouerprofiele</p><span class="pill">V23 • LIVE DATABASE</span></div><iframe id="portal" class="frame" src="admin-v21.html" title="Junior Krieket Admin Portaal V23"></iframe></div><script>(function(){const frame=document.getElementById('portal');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function addParentDirectory(v21){const inner=v21?.contentWindow?.document?.getElementById('v21Frame');if(!inner)return false;const d=inner.contentDocument,w=inner.contentWindow;if(!d||!w)return false;const tabs=d.getElementById('tabs'),app=d.getElementById('app'),sb=w.supabase;if(!tabs||!app||!sb||typeof sb.createClient!=='function')return false;const loading=d.getElementById('v21Loading');if(loading)loading.style.display='none';if(d.getElementById('v23ParentDirectoryTab'))return true;const db=sb.createClient('https://moomommajyldjquncnrd.supabase.co','sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH');const b=d.createElement('button');b.type='button';b.id='v23ParentDirectoryTab';b.dataset.tab='parentDirectory';b.textContent='👨‍👩‍👧 Ouer / Voogde';tabs.appendChild(b);const sec=d.createElement('section');sec.id='parentDirectory';sec.className='hidden';sec.innerHTML='<div class="card"><div class="top"><div><h2>👨‍👩‍👧 Ouer / Voogde</h2><p class="muted">Alle ouers en voogde met die kind/kinders wat aan elke rekening gekoppel is.</p></div><button class="ghost" id="v23ParentRefresh">↻ Verfris</button></div><div id="v23ParentStatus" class="status info">Gereed.</div><div id="v23ParentTable" class="tablewrap" style="margin-top:14px"></div></div>';app.appendChild(sec);const status=d.getElementById('v23ParentStatus'),box=d.getElementById('v23ParentTable');async function load(){status.textContent='Laai ouers en voogde…';status.className='status info';try{const{data:roles,error:re}=await db.from('user_roles').select('user_id').eq('role','parent');if(re)throw re;const ids=[...new Set((roles||[]).map(x=>x.user_id).filter(Boolean))];if(!ids.length){box.innerHTML='<p class="muted">Geen ouer/voog-rekeninge gevind nie.</p>';status.textContent='Geen ouer/voog-rekeninge gevind nie.';return}const{data:profiles,error:pe}=await db.from('user_profiles').select('user_id,full_name,mobile_phone,emergency_phone,relationship,active').in('user_id',ids).order('full_name');if(pe)throw pe;const{data:links,error:le}=await db.from('guardian_players').select('guardian_user_id,player_id,relationship').in('guardian_user_id',ids);if(le)throw le;const pids=[...new Set((links||[]).map(x=>x.player_id).filter(Boolean))];let ps=[];if(pids.length){const{data,error}=await db.from('players').select('id,first_name,surname,team_id').in('id',pids);if(error)throw error;ps=data||[]}const tids=[...new Set(ps.map(x=>x.team_id).filter(Boolean))];let ts=[];if(tids.length){const{data,error}=await db.from('teams').select('id,name,age_group').in('id',tids);if(error)throw error;ts=data||[]}const pm=new Map(ps.map(x=>[String(x.id),x])),tm=new Map(ts.map(x=>[String(x.id),x])),lm=new Map();(links||[]).forEach(x=>{const k=String(x.guardian_user_id);if(!lm.has(k))lm.set(k,[]);const p=pm.get(String(x.player_id));if(p)lm.get(k).push({p,r:x.relationship})});const rows=(profiles||[]).map(x=>{const kids=lm.get(String(x.user_id))||[];const kh=kids.length?kids.map(k=>{const t=tm.get(String(k.p.team_id));return '<div style="margin-bottom:7px"><b>'+esc(k.p.first_name)+' '+esc(k.p.surname)+'</b><div class="muted small">'+esc(t?.name||'Geen span')+(t?.age_group?' · '+esc(t.age_group):'')+(k.r?' · '+esc(k.r):'')+'</div></div>'}).join(''):'<span class="muted">Geen kind gekoppel</span>';return '<tr><td><b>'+esc(x.full_name||'—')+'</b><div class="muted small">'+esc(x.relationship||'Ouer/Voog')+(x.active===false?' · Gedeaktiveer':'')+'</div></td><td>'+esc(x.mobile_phone||'—')+'</td><td>'+esc(x.emergency_phone||'—')+'</td><td>'+kh+'</td></tr>'}).join('');box.innerHTML='<table><thead><tr><th>Ouer / Voog</th><th>Selfoon</th><th>Noodnommer</th><th>Kind / Kinders</th></tr></thead><tbody>'+rows+'</tbody></table>';status.textContent=(profiles||[]).length+' ouer/voog-rekeninge gelaai.';status.className='status success'}catch(e){box.innerHTML='';status.textContent='Kon ouer/voog-lys nie laai nie: '+(e.message||e);status.className='status error'}}b.onclick=async()=>{if(typeof w.show==='function')w.show('parentDirectory');else{d.querySelectorAll('#app>section').forEach(s=>s.classList.add('hidden'));sec.classList.remove('hidden');d.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b))}await load()};d.getElementById('v23ParentRefresh').onclick=load;return true}frame.addEventListener('load',async()=>{for(let i=0;i<60;i++){try{const v21=frame.contentWindow.document.getElementById('v21Frame');if(v21&&v21.contentDocument){const ok=await addParentDirectory(frame.contentDocument);if(ok)return}}catch(e){}await sleep(250)}})})();</script></body></html>
