<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Junior Krieket – Afrigter Portaal LIVE</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#172033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 16px #0001}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{display:block;font-weight:800;margin-bottom:5px}input,textarea{width:100%;padding:12px;border:1px solid #ccd3dc;border-radius:10px;font-size:16px}textarea{min-height:110px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#172033;color:#fff}.ghost{background:#eef2f6}.hidden{display:none!important}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#edf2f7;font-size:12px;font-weight:800}.muted{color:#667085}.error{color:#b42318}.success{color:#087443}.fixture{border:1px solid #e1e6ed;border-radius:14px;padding:15px;margin:10px 0}.status{padding:12px;border-radius:12px;background:#f6f8fa}.small{font-size:13px}@media(max-width:800px){.grid,.grid3{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div id="auth" class="card"><div class="top"><div><h1>🏏 Junior Krieket</h1><p class="muted">Afrigter Portaal • LIVE</p></div><span class="pill">V19</span></div><div class="grid"><div><label>E-pos</label><input id="email" type="email" autocomplete="username"></div><div><label>Wagwoord</label><input id="password" type="password" autocomplete="current-password"></div></div><button id="login" class="primary" style="margin-top:12px">MELD AAN</button><p id="authMsg" class="small">Meld aan om jou wedstryde te sien.</p></div><div id="app" class="hidden"><div class="card"><div class="top"><div><h1>🧑‍🏫 Afrigter Portaal</h1><p id="welcome" class="muted"></p></div><button id="logout" class="ghost">TEKEN UIT</button></div></div><div class="card"><h2>My spanne</h2><div id="teams" class="grid3"></div></div><div class="card"><div class="top"><div><h2>📅 My wedstryde</h2><p class="muted">LIVE wedstryde kan direk hier oopgemaak word.</p></div><button id="refresh" class="ghost">HERNU</button></div><div id="fixtures"></div></div><div class="card"><h2>📄 My verslae</h2><div id="reports"></div></div></div></div><script>'use strict';const SB='https://moomommajyldjquncnrd.supabase.co',KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH';let session=null,myTeams=[],myFixtures=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function ak(){for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k&&k.endsWith('-auth-token'))return k}return null}function ao(){try{let k=ak();return k?JSON.parse(localStorage.getItem(k)||'{}'):null}catch{return null}}async function refreshToken(){let a=ao(),r=a?.refresh_token;if(!r)return null;let x=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:r})});if(!x.ok)return null;let n=await x.json(),k=ak();if(k&&n.access_token)localStorage.setItem(k,JSON.stringify({...a,...n}));return n.access_token}async function token(){return ao()?.access_token||await refreshToken()}async function api(path,opt={},retry=true){let t=await token();if(!t)throw Error('Geen geldige aanmelding nie.');let r=await fetch(SB+'/rest/v1/'+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'application/json',Prefer:opt.prefer||'return=representation',...(opt.headers||{})}}),tx=await r.text(),d;try{d=tx?JSON.parse(tx):null}catch{d=tx}if(!r.ok&&retry&&r.status===401){await refreshToken();return api(path,opt,false)}if(!r.ok)throw Error(d?.message||d?.hint||tx||('HTTP '+r.status));return d}function msg(t,c=''){let e=$('authMsg');e.textContent=t;e.className='small '+c}async function start(s){try{session=s;let p=(await api('user_profiles?select=full_name,role,active&user_id=eq.'+s.user.id))[0];if(!p)throw Error('Jou gebruikersprofiel bestaan nie.');if(p.active===false)throw Error('Jou profiel is gedeaktiveer.');if(!['coach','afrigter'].includes(String(p.role).toLowerCase()))throw Error('Hierdie rekening is nie as afrigter geregistreer nie.');$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='Welkom, '+(p.full_name||s.user.email);await loadAll()}catch(e){$('app').classList.add('hidden');$('auth').classList.remove('hidden');msg(e.message,'error')}}async function loadAll(){let ct=await api('coach_teams?select=team_id&coach_user_id=eq.'+session.user.id+'&active=eq.true'),ids=(ct||[]).map(x=>x.team_id).filter(Boolean);myTeams=ids.length?await api('teams?select=id,name,age_group,active&id=in.('+ids.join(',')+')&active=eq.true'):[];$('teams').innerHTML=myTeams.length?myTeams.map(t=>`<div class="status"><b>${esc(t.name)}</b><br><span class="pill">${esc(t.age_group)}</span></div>`).join(''):'<p class="muted">Geen aktiewe spanne aan jou toegeken nie.</p>';await loadFixtures();await loadReports()}async function loadFixtures(){let ids=myTeams.map(t=>t.id);if(!ids.length){$('fixtures').innerHTML='<p class="muted">Geen wedstryde.</p>';return}myFixtures=await api('fixture_list?select=*&or=(team_a_id.in.('+ids.join(',')+'),team_b_id.in.('+ids.join(',')+'))&order=match_date.asc');$('fixtures').innerHTML=myFixtures.length?myFixtures.map(f=>`<div class="fixture"><div class="top"><div><h3>${esc(f.team_a_name)} vs ${esc(f.team_b_name)}</h3><div class="muted">${esc(f.match_date)} • ${String(f.match_time||'').slice(0,5)} • ${esc(f.venue||'')}</div></div><span class="pill">${esc(f.age_group)} · ${esc(f.status)}</span></div><div class="actions">${f.status==='LIVE'?`<button class="primary" onclick="openScorer('${f.id}')">🏏 OPEN LIVE TELKAART</button>`:''}${f.status==='SCHEDULED'?'<span class="muted small">Wag vir toss / begin.</span>':''}</div></div>`).join(''):'<p class="muted">Geen wedstryde vir jou spanne nie.</p>'}window.openScorer=id=>location.href='scorer-live.html?match='+encodeURIComponent(id);async function loadReports(){try{let r=await api('player_reports?select=id,created_at,homework,coach_feedback&author_user_id=eq.'+session.user.id+'&order=created_at.desc');$('reports').innerHTML=r?.length?r.map(x=>`<div class="fixture"><b>Verslag</b><br><span class="small muted">${new Date(x.created_at).toLocaleString('af-ZA')}</span><p><b>Huiswerk:</b> ${esc(x.homework)}</p><p><b>Terugvoer:</b> ${esc(x.coach_feedback)}</p></div>`).join(''):'<p class="muted">Nog geen verslae nie.</p>'}catch(e){$('reports').innerHTML='<p class="muted">Verslae kon nie gelaai word nie.</p>'}}$('login').onclick=async()=>{try{msg('Meld aan…');let x=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});let d=await x.json();if(!x.ok)throw Error(d.msg||d.error_description||'Aanmelding het misluk.');let k=ak()||'sb-moomommajyldjquncnrd-auth-token';localStorage.setItem(k,JSON.stringify(d));await start(d)}catch(e){msg(e.message,'error')}};$('logout').onclick=()=>{let k=ak();if(k)localStorage.removeItem(k);location.reload()};$('refresh').onclick=loadAll;let a=ao();if(a?.user&&a?.access_token)start(a);</script></body></html>
