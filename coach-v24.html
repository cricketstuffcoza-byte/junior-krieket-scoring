<!doctype html>
<html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Afrigter Portaal V25</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<div id="auth"><h1>🏏 Junior Krieket</h1><h2>Afrigter Portaal V25</h2><form id="loginForm"><input id="email" type="email" autocomplete="username" required placeholder="E-pos"><input id="password" type="password" autocomplete="current-password" required placeholder="Wagwoord"><button id="loginButton" type="submit">Meld Aan</button></form><p id="authMsg">Veilige aanmelding gereed.</p></div>
<div id="denied" hidden><h2>🔒 Geen toegang</h2><p id="deniedMsg"></p><button id="back" type="button">Meld aan met ander rekening</button></div>
<main id="app" hidden><h1>🧑‍🏫 Afrigter Portaal V25</h1><p id="welcome"></p><button id="logout" type="button">Teken uit</button><section><h2>My spanne</h2><div id="teams"></div></section><section><h2>👥 My Span se Spelers</h2><div id="players"></div></section><section><h2>🤝 Mede-afrigters</h2><div id="coaches"></div></section><section><h2>📅 My wedstryde</h2><button id="refresh" type="button">↻ Verfris</button><div id="fixtures"></div></section><section><h2>📄 My ingediende verslae</h2><div id="reports"></div></section></main>
<script>
(function(){'use strict';
const SUPABASE_URL='https://moomommajyldjquncnrd.supabase.co',SUPABASE_KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH';
let db,session,profile,myTeams=[];const $=id=>document.getElementById(id);
function msg(t,c=''){const e=$('authMsg');e.textContent=t;e.style.color=c==='error'?'#b42318':''}function showAuth(){$('auth').hidden=false;$('app').hidden=true;$('denied').hidden=true}
async function loadAll(){const r=await db.from('coach_teams').select('team_id,active,teams(id,name,age_group,active)').eq('coach_user_id',session.user.id).eq('active',true);if(r.error)throw r.error;myTeams=(r.data||[]).map(x=>x.teams).filter(Boolean).filter(t=>t.active!==false);$('teams').innerHTML=myTeams.length?myTeams.map(t=>`<div><b>${t.name}</b> — ${t.age_group}</div>`).join(''):'Geen aktiewe spanne aan jou toegeken nie.';await loadPlayers();await loadCoaches();await loadFixtures();await loadReports()}
async function loadPlayers(){if(!myTeams.length){$('players').textContent='Geen spelers beskikbaar nie.';return}const ids=myTeams.map(t=>t.id);const r=await db.from('players').select('id,first_name,surname,team_id,active,teams(name,age_group)').in('team_id',ids).eq('active',true).order('first_name');if(r.error)throw r.error;$('players').innerHTML=(r.data||[]).map(p=>`<div><b>${p.first_name} ${p.surname}</b> — ${p.teams?.name||''} · ${p.teams?.age_group||''}</div>`).join('')||'Geen aktiewe spelers in jou spanne nie.'}
async function loadCoaches(){if(!myTeams.length){$('coaches').textContent='Geen mede-afrigters.';return}const ids=myTeams.map(t=>t.id);const r=await db.from('coach_teams').select('coach_user_id,team_id,active,teams(name)').in('team_id',ids).eq('active',true);if(r.error)throw r.error;const coachIds=[...new Set((r.data||[]).map(x=>x.coach_user_id).filter(id=>id&&id!==session.user.id))];let p=[];if(coachIds.length){const q=await db.from('user_profiles').select('user_id,full_name,active').in('user_id',coachIds);if(q.error)throw q.error;p=q.data||[]}const pm=new Map(p.map(x=>[x.user_id,x]));$('coaches').innerHTML=(r.data||[]).filter(x=>x.coach_user_id!==session.user.id&&pm.get(x.coach_user_id)?.active!==false).map(x=>`<div><b>${pm.get(x.coach_user_id)?.full_name||'Onbekende afrigter'}</b> — Mede-afrigter · ${x.teams?.name||''}</div>`).join('')||'Geen ander aktiewe mede-afrigters is tans aan dieselfde span(s) toegeken nie.'}
async function loadFixtures(){const r=await db.from('matches').select('id,fixture_code,age_group,team_a_id,team_b_id,match_date,match_time,venue,status').or(`coach_user_id.eq.${session.user.id},scorer_user_id.eq.${session.user.id}`).order('match_date').order('match_time');if(r.error)throw r.error;const rows=r.data||[];const ids=[...new Set(rows.flatMap(f=>[f.team_a_id,f.team_b_id]).filter(Boolean))];let map={};if(ids.length){const q=await db.from('teams').select('id,name').in('id',ids);if(q.error)throw q.error;(q.data||[]).forEach(t=>map[t.id]=t.name)}$('fixtures').innerHTML=rows.length?rows.map(f=>{const a=map[f.team_a_id]||'Onbekend',b=map[f.team_b_id]||'Onbekend',ag=String(f.age_group||'').toUpperCase().replace(/[^A-Z0-9]/g,''),can=['SCHEDULED','LIVE'].includes(String(f.status).toUpperCase()),target=(ag==='U6'||ag==='O6')?'scorer-o6-v19.html':'scorer-o8-v20.html';return `<div><b>${a} vs ${b}</b> — ${f.match_date} ${String(f.match_time||'').slice(0,5)} — ${f.age_group} — ${f.status} ${can?`<button type="button" onclick="openScorer('${f.id}','${target}')">🏏 Open Telkaart</button>`:''}</div>`}).join(''):'Geen wedstryde is tans aan jou toegeken nie.'}
async function loadReports(){$('reports').textContent=''}
function openScorer(id,target){location.href=`${target}?match=${encodeURIComponent(id)}&v=20`}
async function start(s){session=s;try{const r=await db.from('user_profiles').select('full_name,role,active').eq('user_id',s.user.id).maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error('Gebruikersprofiel bestaan nog nie.');if(r.data.active===false)throw Error('Jou gebruikersprofiel is gedeaktiveer.');if(!['coach','afrigter'].includes(String(r.data.role).toLowerCase()))throw Error('Hierdie rekening is nie as afrigter geregistreer nie.');profile=r.data;$('auth').hidden=true;$('denied').hidden=true;$('app').hidden=false;$('welcome').textContent='Welkom, '+(r.data.full_name||s.user.email);await loadAll()}catch(e){$('auth').hidden=true;$('app').hidden=true;$('denied').hidden=false;$('deniedMsg').textContent=e.message||String(e)}}
async function login(e){e.preventDefault();e.stopPropagation();const email=$('email').value.trim(),password=$('password').value;if(!email||!password){msg('Vul asseblief jou e-pos en wagwoord in.','error');return}const b=$('loginButton');b.disabled=true;msg('Meld aan…');try{const r=await db.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(!r.data?.session)throw Error('Aanmelding het nie ’n sessie teruggestuur nie.');await start(r.data.session);$('password').value=''}catch(e){$('password').value='';msg(e.message||String(e),'error')}finally{b.disabled=false}}
function init(){db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);$('loginForm').addEventListener('submit',login);$('logout').addEventListener('click',()=>db.auth.signOut());$('back').addEventListener('click',()=>{db.auth.signOut();showAuth()});$('refresh').addEventListener('click',()=>loadAll().catch(e=>alert(e.message)));db.auth.getSession().then(({data:{session:s}})=>s?start(s):showAuth());db.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_IN'&&s)start(s);if(e==='SIGNED_OUT')showAuth()})}window.openScorer=openScorer;if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();})();
</script></body></html>
