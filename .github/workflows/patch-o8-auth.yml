name: Patch O8 scorer auth

on:
  push:
    branches: ["*"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Patch O8 scorer
        run: python3 scripts/patch_o8_auth.py

      - name: Commit patched scorer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scorer-o8-v9.html
          if git diff --cached --quiet; then
            echo "No scorer changes required"
            exit 0
          fi
          git commit -m "Fix O8 scorer production auth fallback"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
