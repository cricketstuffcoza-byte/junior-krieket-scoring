name: Fix admin login

on:
  push:
    branches: [portal-v10]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin login bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin-v15.html')
          s=p.read_text()
          s=s.replace('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2', 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js')
          old="const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id);"
          new="const $=id=>document.getElementById(id);let db=null;if(window.supabase&&window.supabase.createClient){db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}else{$('login').disabled=true;$('signup').disabled=true;msg('authMsg','Die Supabase-biblioteek kon nie laai nie. Herlaai die bladsy of kontroleer jou internetverbinding.','error')}"
          if old not in s:
            raise SystemExit('Expected admin bootstrap not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add admin-v15.html
          git diff --cached --quiet || git commit -m "Fix admin login bootstrap"
          git push
