name: Fix V24 age routing
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-v24-age-routing.yml'
      - 'coach-v24.html'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch V24 scorer routing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('coach-v24.html')
          s=p.read_text(encoding='utf-8')
          # Make every fixture button pass the actual age group stored on the match.
          if "openScorer('${f.id}')" in s:
              s=s.replace("openScorer('${f.id}')", "openScorer('${f.id}','${esc(f.age_group)}')", 1)
          elif "openScorer('${f.id}','${esc(f.age_group)}')" not in s:
              raise SystemExit('fixture button pattern not found')
          # Never hard-code one scorer. O/6 and U/6 use Phase 1; O/8 and U/8 use the O/8 T80 scorer.
          import re
          s=re.sub(r"window\.openScorer=id=>\{[^\n]*?\};", "window.openScorer=(id,ageGroup)=>{const age=String(ageGroup||'').toUpperCase();const scorer=(age.includes('U/6')||age.includes('O/6'))?'scorer-phase1.html':'scorer-fixed.html';location.href=`${scorer}?match=${encodeURIComponent(id)}&v=25`;};", s, count=1)
          if "window.openScorer=(id,ageGroup)=>" not in s:
              raise SystemExit('openScorer function pattern not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coach-v24.html
          git commit -m 'Route coach scorecards by match age group' || exit 0
          git push