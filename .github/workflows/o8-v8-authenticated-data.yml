name: O8 V8 authenticated production data
on:
  push:
    paths:
      - '.github/workflows/o8-v8-authenticated-data.yml'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch V8 production loader to use coach session
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scorer-o8-v8.html')
          s=p.read_text(encoding='utf-8')

          marker='<script>\n"use strict";'
          if marker in s and 'cdn.jsdelivr.net/npm/@supabase/supabase-js@2' not in s:
              s=s.replace(marker, '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n<script>\n"use strict";', 1)

          old='''    const API="https://moomommajyldjquncnrd.supabase.co/rest/v1";\n    const KEY="sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH";\n    const H={apikey:KEY,Authorization:"Bearer "+KEY,Accept:"application/json"};'''
          new='''    const API="https://moomommajyldjquncnrd.supabase.co/rest/v1";\n    const KEY="sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH";\n    // V8 is opened from the authenticated Coach V25 portal. Reuse the\n    // Supabase browser session so RLS policies see the logged-in coach.\n    let accessToken=null;\n    try{\n      if(window.supabase?.createClient){\n        const authClient=window.supabase.createClient("https://moomommajyldjquncnrd.supabase.co",KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});\n        const sessionResult=await authClient.auth.getSession();\n        accessToken=sessionResult?.data?.session?.access_token||null;\n      }\n    }catch(_){}\n    const H={apikey:KEY,Authorization:"Bearer "+(accessToken||KEY),Accept:"application/json"};'''
          if old not in s:
              raise SystemExit('Expected production loader header block not found')
          s=s.replace(old,new,1)

          old2='''    if(!matches.length)throw new Error("Wedstryd nie gevind nie.");'''
          new2='''    if(!matches.length)throw new Error(`Wedstryd nie gevind nie (HTTP ${mr.status}).`);'''
          s=s.replace(old2,new2,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'supabase-js@2' scorer-o8-v8.html
          grep -q 'authClient.auth.getSession' scorer-o8-v8.html
          grep -q 'accessToken||KEY' scorer-o8-v8.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scorer-o8-v8.html
          git commit -m 'Use authenticated coach session in O8 V8 loader' || exit 0
          git push
