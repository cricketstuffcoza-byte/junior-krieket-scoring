name: Fix coach O6 live gate
on:
  push:
    branches: [coach-o6-test]
    paths:
      - 'COACH-O6-TEST-LIVE-GATE.md'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coach-o6-test
      - name: Patch coach portal
        shell: python
        run: |
          from pathlib import Path
          p=Path('coach-o6-test.html')
          s=p.read_text(encoding='utf-8')
          old="const live=f.status==='LIVE';const available=f.age_group==='U/6'&&live;"
          new="const status=String(f.status||'').toUpperCase();const playable=['SCHEDULED','LIVE'].includes(status);const available=f.age_group==='U/6'&&playable;"
          if old not in s:
              raise SystemExit('Expected coach live-gate code was not found')
          s=s.replace(old,new,1)
          old2="${available?`<button class=\"primary\" onclick=\"openMatch('${f.id}')\">🏏 OPEN O/6 TELKAART</button>`:`<span class=\"muted small\">${f.age_group==='U/6'?'Wedstryd is nog nie LIVE nie.':'Hierdie O/6 toetsportaal is tans net vir O/6.'}</span>`}"
          new2="${available?`<button class=\"primary\" onclick=\"openMatch('${f.id}')\">🏏 ${status==='LIVE'?'OPEN O/6 TELKAART':'BEGIN O/6 TELKAART'}</button>`:`<span class=\"muted small\">${f.age_group==='U/6'?(status==='COMPLETED'?'Wedstryd is reeds voltooi.':'Wedstryd is nie beskikbaar nie.'):'Hierdie O/6 toetsportaal is tans net vir O/6.'}</span>`}"
          if old2 not in s:
              raise SystemExit('Expected fixture button code was not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add coach-o6-test.html
          git commit -m "Allow coach to open scheduled O6 matches"
          git push
