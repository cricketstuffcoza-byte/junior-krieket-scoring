name: Patch coach portal route
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch coach route
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('coach.html')
          p.write_text("""<!doctype html><html lang='af'><head><meta charset='utf-8'><meta http-equiv='refresh' content='0;url=coach-v23.html'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Junior Krieket – Afrigter Portaal</title></head><body><p>Maak Afrigter Portaal oop…</p><script>location.replace('coach-v23.html'+location.search)</script></body></html>""", encoding='utf-8')
          p=Path('coach-v23.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const can=['SCHEDULED','LIVE'].includes(String(f.status));", "const can=['SCHEDULED','LIVE'].includes(String(f.status).toUpperCase());")
          s=s.replace("location.href=`scorer-v5.html?match=${encodeURIComponent(safeId)}&v=23`", "location.href=`scorer-fixed.html?match=${encodeURIComponent(safeId)}&v=23`")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add coach.html coach-v23.html
          git diff --cached --quiet || git commit -m "Fix coach portal route and scorer link"
          git push
