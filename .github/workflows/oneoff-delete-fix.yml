name: One-off V23 Delete Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Apply V23 delete-window fix') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix V23 delete renderer target
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin-v23.html')
          s = p.read_text()
          old = "v21.defaultView.refreshMatchList=renderMatches"
          new = "v17frame.contentWindow.refreshMatchList=renderMatches"
          if old not in s:
              raise SystemExit('Expected V23 renderer target not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit fix and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-v23.html
          git rm .github/workflows/oneoff-delete-fix.yml
          git commit -m "Apply V23 delete-window fix"
          git push