name: Fix retirement next batter flow

on:
  push:
    branches: [main]

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch scorer flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scorer-fixed.html')
          s=p.read_text()
          old="""$('confirmNew').onclick=async()=>{if(!pendingNew)return;const i=cur();if(replacementSlot==='striker')i.striker=pendingNew;else i.non=pendingNew;i.batters.push(pendingNew);replacementSlot=null;pendingNew=null;hide('newBatterCard');if(i.bowler)show('scoreCard');else showScoreOrBowler();render();await save()};"""
          new="""$('confirmNew').onclick=async()=>{if(!pendingNew)return;const i=cur();if(replacementSlot==='striker')i.striker=pendingNew;else i.non=pendingNew;i.batters.push(pendingNew);replacementSlot=null;pendingNew=null;hide('newBatterCard');render();await save();if(i.striker===null||i.non===null){replacementSlot=i.striker===null?'striker':'non';$('newReason').textContent='Die volgende kolwer het ook die 15-limiet bereik en tree af. Kies die volgende nuwe kolwer.';show('newBatterCard');newBatterChoices();return}if(i.bowler)show('scoreCard');else showScoreOrBowler()};"""
          if old not in s:
              raise SystemExit('Expected confirmNew block not found; aborting without changes')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-retirement-next-batter.yml
          git add scorer-fixed.html
          git commit -m "Fix repeated retirement next batter selection"
          git push
