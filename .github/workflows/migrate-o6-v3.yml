name: One-time O6 migration v3
on:
  workflow_run:
    workflows: ["Fix O8 scorer flow"]
    types: [completed]
permissions:
  contents: write
jobs:
  migrate:
    if: ${{ github.event.workflow_run.conclusion == 'success' && contains(github.event.workflow_run.head_commit.message, '[migrate-o6-v3]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Make O6 deployment authoritative
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin o6-alpha-omega --depth=1
          git show origin/o6-alpha-omega:Telkaart-O6-ALPHA-OMEGA-V16.html > o6-v19-core.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scorer-o6-v19.html')
          s=p.read_text(encoding='utf-8')
          if "const BASE_URL='https://raw.githubusercontent.com/cricketstuffcoza-byte/junior-krieket-scoring/o6-alpha-omega/Telkaart-O6-ALPHA-OMEGA-V16.html';" in s:
              s=s.replace("const BASE_URL='https://raw.githubusercontent.com/cricketstuffcoza-byte/junior-krieket-scoring/o6-alpha-omega/Telkaart-O6-ALPHA-OMEGA-V16.html';", "const BASE_URL='/o6-v19-core.html';")
          if "frame.src=URL.createObjectURL(new Blob([html],{type:'text/html'}));" in s:
              s=s.replace("frame.src=URL.createObjectURL(new Blob([html],{type:'text/html'}));", "frame.srcdoc=html;")
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'cricketstuffcoza-byte'
          git config user.email 'cricketstuffcoza@gmail.com'
          git rm -f .github/workflows/migrate-o6-v2.yml .github/workflows/migrate-o6-architecture-v2.yml .github/workflows/migrate-o6-v3.yml 2>/dev/null || true
          git add scorer-o6-v19.html o6-v19-core.html
          git commit -m 'Make O6 scorer deployment self-contained'
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || git rebase --abort
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
