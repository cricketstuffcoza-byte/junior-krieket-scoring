name: Fix U6 undo UI state restoration

on:
  push:
    branches: [main]

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix U6 undo UI state restoration'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch scorer
        shell: python
        run: |
          from pathlib import Path
          p = Path('scorer-o6-v19.html')
          s = p.read_text(encoding='utf-8')
          marker = "render();\\n})();<\\/script>`;"
          if marker not in s:
              raise SystemExit('Enhancement script marker not found')
          code = r'''\n// U6 V19 UNDO UI RESTORE: state snapshots restore data, so rebuild every active UI panel from restored state.\n(function(){\n  function v19Hide(id){var x=document.getElementById(id);if(x)x.classList.add('hidden')}\n  function v19Show(id){var x=document.getElementById(id);if(x)x.classList.remove('hidden')}\n  function v19SyncChoices(){\n    if(typeof state==='undefined'||!state)return;\n    var pc=document.getElementById('pairChoices');\n    if(pc && state.started && !state.striker && !state.nonStriker){\n      pc.innerHTML='';\n      (typeof available==='function'?available():[]).forEach(function(name){\n        var b=document.createElement('button');b.type='button';b.className='btn choice';b.textContent=name;\n        b.classList.toggle('selected',(state.selectedPair||[]).includes(name));\n        b.addEventListener('click',function(){\n          var i=state.selectedPair.indexOf(name);\n          if(i>=0)state.selectedPair.splice(i,1);else if(state.selectedPair.length<2)state.selectedPair.push(name);\n          v19SyncChoices();\n        });\n        pc.appendChild(b);\n      });\n      var cp=document.getElementById('confirmPair');if(cp)cp.disabled=(state.selectedPair||[]).length!==2;\n    }\n    var bc=document.getElementById('bowlerChoices');\n    if(bc && state.started && state.striker && state.nonStriker && !state.bowler){\n      bc.innerHTML='';\n      (PLAYERS[state.bowling]||[]).forEach(function(name){\n        var used=(state.usedBowlers||[]).includes(name);\n        var b=document.createElement('button');b.type='button';b.className='btn choice';b.textContent=used?name+' ✓ Reeds geboul':name;b.disabled=used;\n        b.classList.toggle('selected',state.selectedBowler===name);\n        b.addEventListener('click',function(){state.selectedBowler=name;v19SyncChoices()});\n        bc.appendChild(b);\n      });\n      var cb=document.getElementById('confirmBowler');if(cb)cb.disabled=!state.selectedBowler;\n    }\n    var fc=document.getElementById('fielderChoices');\n    if(fc && state.pendingFielder){\n      fc.innerHTML='';\n      (PLAYERS[state.bowling]||[]).forEach(function(name){\n        var b=document.createElement('button');b.type='button';b.className='btn choice';b.textContent=name;b.classList.toggle('selected',state.selectedFielder===name);\n        b.addEventListener('click',function(){state.selectedFielder=name;v19SyncChoices()});\n        fc.appendChild(b);\n      });\n      var cf=document.getElementById('confirmFielder');if(cf)cf.disabled=!state.selectedFielder;\n      var fm=document.getElementById('fielderMessage');if(fm)fm.textContent=state.dismissalType==='CAUGHT'?'Kies die speler wat die catch geneem het.':'Kies die speler wat die run-out veroorsaak het.';\n    }\n    var nc=document.getElementById('newBatterChoices');\n    if(nc && state.pendingNewBatter){\n      nc.innerHTML='';\n      (typeof available==='function'?available():[]).filter(function(n){return n!==state.nonStriker&&n!==state.striker}).forEach(function(name){\n        var b=document.createElement('button');b.type='button';b.className='btn choice';b.textContent=name;b.classList.toggle('selected',state.selectedNewBatter===name);\n        b.addEventListener('click',function(){state.selectedNewBatter=name;v19SyncChoices()});\n        nc.appendChild(b);\n      });\n      var cn=document.getElementById('confirmNewBatter');if(cn)cn.disabled=!state.selectedNewBatter;\n    }\n  }\n  function v19SyncUndoUI(){\n    if(typeof state==='undefined'||!state)return;\n    ['pairPanel','bowlerPanel','limitPanel','newBatterPanel','inningsPanel','finalPanel','wicketPanel','fielderPanel','coachPanel','endModal','v19RunoutModal','v19ReplacementModal'].forEach(v19Hide);\n    if(!state.started){return}\n    if(state.completed){v19Show('finalPanel');return}\n    if(state.pendingFielder){v19Show('fielderPanel');v19SyncChoices();return}\n    if(state.pendingDismissal){v19Show('wicketPanel');if(typeof buildDismissalChoices==='function')buildDismissalChoices();return}\n    if(state.pendingNewBatter){v19Show('newBatterPanel');v19SyncChoices();return}\n    if(state.pendingCoachThrow){v19Show('coachPanel');return}\n    if(state.pairLimitAccepted){v19Show('limitPanel');return}\n    if(!state.striker||!state.nonStriker){v19Show('pairPanel');v19SyncChoices();return}\n    if(!state.bowler){v19Show('bowlerPanel');v19SyncChoices();return}\n  }\n  var ub=document.getElementById('undo');\n  if(ub)ub.addEventListener('click',function(){setTimeout(v19SyncUndoUI,0)},false);\n})();\n'''
          s = s.replace(marker, "render();" + code + "\\n})();<\\/script>`;")
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scorer-o6-v19.html
          git diff --cached --quiet || git commit -m 'Fix U6 undo UI state restoration'
          git push
