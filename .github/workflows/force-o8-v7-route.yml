name: Force O8 scorer V7 route
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/force-o8-v7-route.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Route O8 to scorer V7
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('coach-v25.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("if(age==='U/8')return `scorer-v5.html?match=${encodeURIComponent(m.id)}&v=25`;", "if(age==='U/8')return `scorer-o8-v7.html?match=${encodeURIComponent(m.id)}&v=7`;")
          p.write_text(s,encoding='utf-8')
          p=Path('coach-v24.html')
          if p.exists():
            s=p.read_text(encoding='utf-8')
            s=s.replace("'scorer-fixed.html'", "'scorer-o8-v7.html'")
            p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coach-v25.html coach-v24.html
          git commit -m 'Route O8 matches to scorer V7' || exit 0
          git push
