name: Normalize O8 and U8 scorer age
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-scorer-age-normalization.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Normalize O8/U8 validation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scorer-fixed.html')
          s=p.read_text(encoding='utf-8')
          old="if(m.age_group!=='U/8')throw Error('Hierdie telkaart is slegs vir O/8.');"
          new="if(!['U/8','O/8'].includes(String(m.age_group||'').toUpperCase()))throw Error('Hierdie telkaart is slegs vir O/8.');"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('O8/U8 validation pattern not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scorer-fixed.html
          git commit -m 'Accept O8 and U8 in O8 T80 scorer' || exit 0
          git push