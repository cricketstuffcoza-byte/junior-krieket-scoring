name: One-time scorer resume fix

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-scorer-resume.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scorer resume UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scorer.html')
          s = p.read_text()
          old = "if(i.striker&&i.non&&i.bowler){$('scoreCard').classList.remove('hidden')}else if(i.striker&&i.non&&!i.bowler){$('bowlSelect').classList.remove('hidden');bowlChoices()}else if(!i.striker&&i.non){replacement='striker';$('newReason').textContent='Die vorige kolwer is uit. Kies die volgende kolwer.';$('newBatterCard').classList.remove('hidden');newBatterChoices()}else{$('batSelect').classList.remove('hidden');batChoices()}"
          new = "['batSelect','bowlSelect','scoreCard','dismissCard','newBatterCard','newBowlerCard','inningsCard','finishCard'].forEach(id=>$(id).classList.add('hidden'));selectedBat=[];selectedBowler=null;pendingNew=null;replacement=null;if(i.striker&&i.non&&i.bowler){$('scoreCard').classList.remove('hidden')}else if(i.striker&&i.non&&!i.bowler){$('bowlSelect').classList.remove('hidden');bowlChoices()}else if(!i.striker&&i.non){replacement='striker';$('newReason').textContent='Die vorige kolwer is uit. Kies slegs die een nuwe kolwer.';$('newBatterCard').classList.remove('hidden');newBatterChoices()}else{$('batSelect').classList.remove('hidden');batChoices()}"
          if old not in s:
              raise SystemExit('Target resume block not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scorer.html
          git rm .github/workflows/one-time-fix-scorer-resume.yml
          git commit -m 'Fix scorer resume panel selection'
          git push
