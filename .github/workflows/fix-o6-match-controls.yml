name: Fix O6 match controls

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply O6 match controls patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch V19 match controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scorer-o6-v19.html')
          s = p.read_text()
          marker = "render();\\n})();<\\/script>`;"
          if marker not in s:
              raise SystemExit('V19 enhancement marker not found')
          patch = r'''render();

// O6 MATCH CONTROLS PATCH V1
(function(){
  'use strict';

  // 1) RUN OUT: after selecting the batsman, ALWAYS ask for the fielder.
  // The V19 runout flow must not complete the dismissal until the fielder
  // has been selected and confirmed.
  var runoutChoices = document.getElementById('v19RunoutChoices');
  if(runoutChoices){
    runoutChoices.addEventListener('click', function(ev){
      var btn = ev.target.closest ? ev.target.closest('button[data-v19-batter]') : null;
      if(!btn) return;
      ev.preventDefault();
      ev.stopImmediatePropagation();
      state.pendingRunOutBatter = decodeURIComponent(btn.getAttribute('data-v19-batter'));
      document.getElementById('v19RunoutModal').classList.add('hidden');
      if(typeof openFielderChooser === 'function') openFielderChooser('RUN_OUT');
    }, true);
  }

  // 2) STRIKE SWITCH: scorer can manually correct who is on strike.
  function addStrikeSwitch(){
    if(document.getElementById('v19SwitchStrike')) return;
    var host = document.getElementById('striker');
    if(!host || !host.parentElement) return;
    var b = document.createElement('button');
    b.id = 'v19SwitchStrike';
    b.type = 'button';
    b.className = 'v19secondary';
    b.textContent = '🔄 WISSEL STRIKE';
    b.style.marginTop = '10px';
    b.addEventListener('click', function(){
      if(!state || !state.started || !state.striker || !state.nonStriker) return;
      if(state.pendingNewBatter || state.pendingDismissal || state.pendingFielder || state.pendingCoachThrow || state.pairLimitAccepted) return;
      if(typeof snapshot === 'function') snapshot();
      [state.striker,state.nonStriker] = [state.nonStriker,state.striker];
      if(typeof render === 'function') render();
    });
    host.parentElement.appendChild(b);
  }
  addStrikeSwitch();

  // 3) END OF OVER: selecting a new bowler must lock all ball-entry controls.
  // The underlying V16 scorer keeps state.bowler set while the bowler panel is
  // open, so canBall() otherwise remains true. Clear it until the new bowler
  // is confirmed, then the normal controls become active again.
  if(typeof openBowler === 'function'){
    var originalOpenBowler = openBowler;
    openBowler = function(){
      if(state) state.bowler = null;
      originalOpenBowler();
      if(typeof render === 'function') render();
    };
  }

  // Extra safety: even if a browser/UI repaint races the bowler-panel update,
  // do not accept a ball while the new-bowler chooser is visible.
  function guardBallEntry(ev){
    var panel = document.getElementById('bowlerPanel');
    if(panel && !panel.classList.contains('hidden')){
      ev.preventDefault();
      ev.stopImmediatePropagation();
    }
  }
  var normal = document.getElementById('normalButtons');
  var coach = document.getElementById('coachPanel');
  if(normal) normal.addEventListener('click', guardBallEntry, true);
  if(coach) coach.addEventListener('click', guardBallEntry, true);

  // Re-enable/disable the strike switch according to the current match state.
  var oldRender = render;
  render = function(){
    oldRender();
    var sw = document.getElementById('v19SwitchStrike');
    if(sw){
      var ok = !!(state && state.started && state.striker && state.nonStriker && !state.pendingNewBatter && !state.pendingDismissal && !state.pendingFielder && !state.pendingCoachThrow && !state.pairLimitAccepted);
      sw.disabled = !ok;
    }
  };
  if(typeof render === 'function') render();
})();
</script>`;'''
          s = s.replace(marker, patch, 1)
          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "cricketstuffcoza-byte"
          git config user.email "cricketstuffcoza@gmail.com"
          git add scorer-o6-v19.html
          git diff --cached --quiet || git commit -m "Apply O6 match controls patch"
          git push