name: Restore and fix scorer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore scorer from known-good revision and apply fixes
        run: |
          git show 82ad55d6b5df80c745ee00738fd625e51e8b4741:scorer-fixed.html > scorer-fixed.html
          python - <<'PY'
          from pathlib import Path
          p=Path('scorer-fixed.html')
          s=p.read_text()
          old="function render(){const i=cur();$('score').textContent=i.runs+'/'+i.wickets;$('balls').textContent=i.balls+' / 80';$('over').textContent=i.overs+'.'+i.overBalls;"
          new="function render(){const i=cur();const total=Math.max(0,Number(i.balls)||0);const completed=Math.floor(total/5);const inBall=total%5;$('score').textContent=i.runs+'/'+i.wickets;$('balls').textContent=total+' / 80';$('over').textContent=completed+'.'+inBall;"
          if old not in s: raise SystemExit('render anchor missing')
          s=s.replace(old,new,1)
          old2="}else{show('setup');render()}$('loading').classList.add('hidden');show('main')}catch(e){showErr(e)}}boot();"
          new2="}else{show('setup');$('status').textContent='READY'}$('loading').classList.add('hidden');show('main')}catch(e){showErr(e)}}boot();"
          if old2 not in s: raise SystemExit('boot setup anchor missing')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit repaired scorer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scorer-fixed.html
          git commit -m "Restore scorer and fix initial state error"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/restore-and-fix-scorer.yml
          git commit -m "Remove temporary scorer restore workflow"
          git push
