name: Fix O8 over bowler selection

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix O8 over-end bowler selection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scorer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scorer-fixed.html')
          s = p.read_text()
          old = "function showScoreOrBowler(){const i=cur();if(i.bowler){hide('bowlSelect');show('scoreCard')}else{hide('scoreCard');show('bowlSelect');$('confirmBowl').disabled=true;bowlChoices()}}"
          new = "function showScoreOrBowler(){const i=cur();if(!i.bowler){hide('scoreCard');hide('eventCard');hide('newBatterCard');show('bowlSelect');selectedBowler=null;$('confirmBowl').disabled=true;bowlChoices();return}hide('bowlSelect');hide('eventCard');show('scoreCard')}"
          if old not in s:
              raise SystemExit('target function not found')
          s = s.replace(old, new, 1)
          old2 = "function endBallIfNeeded(){const i=cur();if(i.overBalls>=5){i.overs++;i.overBalls=0;[i.striker,i.non]=[i.non,i.striker];i.bowler=null;selectedBowler=null;return true}return false}"
          new2 = "function endBallIfNeeded(){const i=cur();if(i.overBalls>=5){i.overs++;i.overBalls=0;[i.striker,i.non]=[i.non,i.striker];i.bowler=null;selectedBowler=null;return true}return false}"
          if old2 in s:
              s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scorer-fixed.html
          git diff --cached --quiet || git commit -m 'Fix O8 over-end bowler selection'
          git push
