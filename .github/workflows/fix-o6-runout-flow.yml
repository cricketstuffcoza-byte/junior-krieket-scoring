name: Fix O6 runout flow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch U6 V19 controls
        shell: python
        run: |
          from pathlib import Path
          p = Path('scorer-o6-v19.html')
          s = p.read_text(encoding='utf-8')
          marker = "render();\\n})();<\\/script>`;"
          if marker not in s:
              raise SystemExit('V19 enhancement marker not found')
          patch = r'''render();

// O6 MATCH CONTROLS PATCH V3
(function(){
  'use strict';

  // RUN OUT: selecting the batsman must open the existing fielder chooser.
  var runoutChoices=document.getElementById('v19RunoutChoices');
  if(runoutChoices){
    runoutChoices.addEventListener('click',function(ev){
      var btn=ev.target.closest?ev.target.closest('button[data-v19-batter]'):null;
      if(!btn)return;
      ev.preventDefault();ev.stopImmediatePropagation();
      state.pendingRunOutBatter=decodeURIComponent(btn.getAttribute('data-v19-batter'));
      document.getElementById('v19RunoutModal').classList.add('hidden');
      if(typeof openFielderChooser==='function')openFielderChooser('RUN_OUT');
    },true);
  }

  // Complete a U/6 run-out without removing the batsman, but still credit the
  // selected fielder and move to a new bowler when this was the last legal ball.
  if(typeof finishRunout==='function'){
    var oldFinishRunout=finishRunout;
    finishRunout=function(){
      oldFinishRunout();
      if(state&&!state.completed&&typeof team==='function'){
        var t=team();
        if(t&&t.legalBalls>0&&t.legalBalls%R.legalPerOver===0&&typeof openBowler==='function')openBowler();
      }
      if(typeof render==='function')render();
    };
  }

  // Manual strike correction.
  function addStrikeSwitch(){
    if(document.getElementById('v19SwitchStrike'))return;
    var host=document.getElementById('striker');
    if(!host||!host.parentElement)return;
    var b=document.createElement('button');
    b.id='v19SwitchStrike';b.type='button';b.className='v19secondary';b.textContent='🔄 WISSEL STRIKE';b.style.marginTop='10px';
    b.addEventListener('click',function(){
      if(!state||!state.started||!state.striker||!state.nonStriker)return;
      if(state.pendingNewBatter||state.pendingDismissal||state.pendingFielder||state.pendingCoachThrow||state.pairLimitAccepted)return;
      if(typeof snapshot==='function')snapshot();
      [state.striker,state.nonStriker]=[state.nonStriker,state.striker];
      if(typeof render==='function')render();
    });
    host.parentElement.appendChild(b);
  }
  addStrikeSwitch();

  // End-of-over lock. The old scorer leaves state.bowler populated while the
  // bowler chooser is open, which makes canBall() return true. Clear it until
  // the new bowler is explicitly confirmed.
  if(typeof openBowler==='function'){
    var oldOpenBowler=openBowler;
    openBowler=function(){
      if(state)state.bowler=null;
      oldOpenBowler();
      if(typeof render==='function')render();
    };
  }
  function guardBallEntry(ev){
    var panel=document.getElementById('bowlerPanel');
    if(panel&&!panel.classList.contains('hidden')){ev.preventDefault();ev.stopImmediatePropagation();}
  }
  var normal=document.getElementById('normalButtons'),coach=document.getElementById('coachPanel');
  if(normal)normal.addEventListener('click',guardBallEntry,true);
  if(coach)coach.addEventListener('click',guardBallEntry,true);

  var oldRender=render;
  render=function(){
    oldRender();
    var sw=document.getElementById('v19SwitchStrike');
    if(sw){
      var bp=document.getElementById('bowlerPanel');
      sw.disabled=!(state&&state.started&&state.striker&&state.nonStriker&&!state.pendingNewBatter&&!state.pendingDismissal&&!state.pendingFielder&&!state.pendingCoachThrow&&!state.pairLimitAccepted&&(!bp||bp.classList.contains('hidden')));
    }
  };
  render();
})();
</script>`;'''
          s=s.replace(marker,patch,1)
          p.write_text(s,encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scorer-o6-v19.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix U6 runout fielder strike and over controls"
          git push