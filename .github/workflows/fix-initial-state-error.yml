name: Fix initial scorer state error
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove premature render
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scorer-fixed.html')
          s=p.read_text()
          old="}else{show('setup');render()}$('loading').classList.add('hidden');show('main')}catch(e){showErr(e)}}boot();"
          new="}else{show('setup')}$('loading').classList.add('hidden');show('main')}catch(e){showErr(e)}}boot();"
          if old not in s:
              raise SystemExit('Expected initial-state block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scorer-fixed.html
          git rm .github/workflows/fix-initial-state-error.yml
          git commit -m "Fix scorer initial state error"
          git push
