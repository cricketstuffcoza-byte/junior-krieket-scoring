name: Patch O6 V19 live sync
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch V16 source used by V19
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: cricketstuffcoza-byte/junior-krieket-scoring
        run: |
          set -e
          python - <<'PY'
          import os, json, base64, urllib.request
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']; branch='o6-alpha-omega'; path='Telkaart-O6-ALPHA-OMEGA-V16.html'
          api=f'https://api.github.com/repos/{repo}/contents/{path}?ref={branch}'
          req=urllib.request.Request(api,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'})
          data=json.load(urllib.request.urlopen(req))
          html=base64.b64decode(data['content']).decode()

          live_marker='JUNIOR_V19_LIVE_SYNC_V1'
          if live_marker not in html:
            script='''<script>/* JUNIOR_V19_LIVE_SYNC_V1 */(function(){\n"use strict";\nconst SB_URL="https://moomommajyldjquncnrd.supabase.co";\nconst SB_KEY="sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH";\nfunction matchId(){try{return new URLSearchParams(window.parent.location.search).get("match")}catch(e){return null}}\nasync function publish(){try{if(typeof state==="undefined"||!state||!state.started)return;const id=matchId();if(!id)return;const t=state.score[state.batting]||{};const payload={match_id:id,innings_no:Number(state.innings)||1,innings_runs:Number(t.runs)||0,innings_wickets:Number(t.wickets)||0,playable_balls:Number(t.legalBalls)||0,unplayable_balls:Number(t.unplayable)||0,over_no:Math.floor((Number(t.legalBalls)||0)/(R.legalPerOver||8)),over_playable_balls:(Number(t.legalBalls)||0)%(R.legalPerOver||8),pair_no:Number(state.pair)||0,pair_playable_balls:Number(state.pairBalls)||0,striker_id:null,non_striker_id:null,current_bowler_id:null,status:state.closed||state.completed?"COMPLETED":"LIVE",state_json:state,updated_at:new Date().toISOString(),updated_by:null};await fetch(SB_URL+"/rest/v1/live_match_state?on_conflict=match_id",{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(payload)});}catch(e){console.warn("Live sync",e)}}\nsetInterval(publish,1000);window.addEventListener("beforeunload",publish);\n})();</script>'''
            html=html.replace('</body>',script+'\n</body>',1)

          resume_marker='JUNIOR_V19_RESUME_V1'
          if resume_marker not in html:
            resume='''<script>/* JUNIOR_V19_RESUME_V1 */(function(){\n"use strict";\nconst KEY_PREFIX="junior_krieket_v19_saved_";\nfunction matchId(){try{return new URLSearchParams(window.parent.location.search).get("match")}catch(e){return null}}\nfunction key(){const id=matchId();return id?KEY_PREFIX+id:null}\nfunction getSaved(){try{const k=key();if(!k)return null;const raw=localStorage.getItem(k);if(!raw)return null;const x=JSON.parse(raw);return x&&x.state?x:null}catch(e){console.warn("V19 resume read",e);return null}}\nfunction save(){try{if(typeof state==="undefined"||!state||!state.started)return;const k=key();if(!k)return;localStorage.setItem(k,JSON.stringify({version:1,savedAt:new Date().toISOString(),state:state,players:typeof PLAYERS!=="undefined"?PLAYERS:null,match:typeof MATCH!=="undefined"?MATCH:null}));}catch(e){console.warn("V19 resume save",e)}}\nfunction restore(){const saved=getSaved();if(!saved||typeof state==="undefined"||!state)return false;try{Object.keys(saved.state).forEach(function(k){state[k]=saved.state[k]});if(saved.players&&typeof PLAYERS!=="undefined"){Object.keys(saved.players).forEach(function(k){PLAYERS[k]=saved.players[k]})}if(typeof render==="function")render();return true}catch(e){console.warn("V19 resume restore",e);return false}}\nfunction addSaveButton(){const start=document.getElementById("start");if(!start||document.getElementById("v19SaveResume"))return;const b=document.createElement("button");b.id="v19SaveResume";b.type="button";b.className="btn";b.textContent="💾 STOOR & GAAN LATER VOORT";b.style.marginLeft="8px";b.addEventListener("click",function(){save();try{const st=document.getElementById("status");if(st){st.textContent="💾 Wedstryd veilig gestoor. Jy kan later weer Open Telkaart kies om voort te gaan.";st.className="banner blue"}}catch(e){}});start.parentNode.insertBefore(b,start.nextSibling)}\nfunction resumeGate(){const start=document.getElementById("start");if(!start)return;const saved=getSaved();if(!saved)return;start.textContent="▶️ GAAN VOORT MET GESTOORDE WEDSTRYD";start.addEventListener("click",function(ev){if(getSaved()){ev.preventDefault();ev.stopImmediatePropagation();if(restore()){var b=document.getElementById("v19SaveResume");if(b)b.classList.remove("hidden");}}},true)}\nfunction init(){addSaveButton();resumeGate();setTimeout(function(){if(getSaved()){try{if(typeof state!=="undefined"&&state&&state.started){restore();var b=document.getElementById("v19SaveResume");if(b)b.classList.remove("hidden")}}catch(e){}}},250);setInterval(save,1500);window.addEventListener("beforeunload",save);document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")save()});}\nsetTimeout(init,50);\n})();</script>'''
            html=html.replace('</body>',resume+'\n</body>',1)

          new_content=base64.b64encode(html.encode()).decode()
          put=f'https://api.github.com/repos/{repo}/contents/{path}'
          body=json.dumps({'message':'Add V19 save and resume support','content':new_content,'sha':data['sha'],'branch':branch}).encode()
          req=urllib.request.Request(put,data=body,method='PUT',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','Content-Type':'application/json'})
          print(urllib.request.urlopen(req).read().decode())
          PY