name: Fix boulbeurt calculation
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace boulbeurt logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scorer-fixed.html')
          s=p.read_text()
          old="function render(){const i=cur();$('score').textContent=i.runs+'/'+i.wickets;$('balls').textContent=i.balls+' / 80';$('over').textContent=i.overs+'.'+i.overBalls;"
          new="function render(){const i=cur();const total=Math.max(0,Number(i.balls)||0);const completed=Math.floor(total/5);const inBall=total%5;$('score').textContent=i.runs+'/'+i.wickets;$('balls').textContent=total+' / 80';$('over').textContent=completed+'.'+inBall;"
          if old not in s: raise SystemExit('render anchor not found')
          s=s.replace(old,new,1)
          old2="function endBallIfNeeded(){const i=cur();if(i.overBalls>=5){i.overs++;i.overBalls=0;[i.striker,i.non]=[i.non,i.striker];i.bowler=null;selectedBowler=null;return true}return false}"
          new2="function endBallIfNeeded(){const i=cur();const total=Number(i.balls)||0;if(total>0&&total%5===0){i.overs=Math.floor(total/5);i.overBalls=0;[i.striker,i.non]=[i.non,i.striker];i.bowler=null;selectedBowler=null;return true}i.overs=Math.floor(total/5);i.overBalls=total%5;return false}"
          if old2 not in s: raise SystemExit('endBallIfNeeded anchor not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scorer-fixed.html
          git rm .github/workflows/fix-boulbeurt.yml
          git commit -m "Fix boulbeurt calculation from total balls"
          git push
