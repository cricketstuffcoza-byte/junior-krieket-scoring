name: One-time O6 architecture migration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    if: contains(github.event.head_commit.message, '[migrate-o6]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy O6 core from legacy branch and make main authoritative
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin o6-alpha-omega --depth=1
          git show origin/o6-alpha-omega:Telkaart-O6-ALPHA-OMEGA-V16.html > o6-v19-core.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scorer-o6-v19.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const BASE_URL='https://raw.githubusercontent.com/cricketstuffcoza-byte/junior-krieket-scoring/o6-alpha-omega/Telkaart-O6-ALPHA-OMEGA-V16.html';", "const BASE_URL='/o6-v19-core.html';")
          s=s.replace("frame.src=URL.createObjectURL(new Blob([html],{type:'text/html'}));", "frame.srcdoc=html;")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove migration workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cricketstuffcoza-byte'
          git config user.email 'cricketstuffcoza@gmail.com'
          git rm .github/workflows/migrate-o6-architecture.yml
          git add scorer-o6-v19.html o6-v19-core.html
          git commit -m 'Make O6 scorer deployment self-contained'
          git push
