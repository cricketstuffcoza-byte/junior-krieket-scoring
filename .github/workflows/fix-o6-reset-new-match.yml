name: Fix O6 reset to new match

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch V19 reset in production wrapper
        shell: python
        run: |
          from pathlib import Path

          path = Path('scorer-o6-v19.html')
          text = path.read_text(encoding='utf-8')

          marker = '/* O6 V19 HARD RESET PATCH V2 */'
          if marker in text:
              print('Reset patch already present.')
              raise SystemExit(0)

          needle = "const enhancement=`"
          if needle not in text:
              raise SystemExit('Could not find V19 enhancement block.')

          patch = r'''\n<script>\n(function(){\n  'use strict';\n  // U/6 HERSTEL must create a completely new match.\n  // Capture before the original target handler and stop the save/resume\n  // layer from recreating the saved state during the reload.\n  document.addEventListener('click', function(ev){\n    var btn = ev.target && ev.target.closest ? ev.target.closest('#reset') : null;\n    if(!btn) return;\n    ev.preventDefault();\n    ev.stopImmediatePropagation();\n    try { if(typeof state !== 'undefined' && state) state.started = false; } catch(e) {}\n    try {\n      var id = new URLSearchParams(window.parent.location.search).get('match');\n      if(id) localStorage.removeItem('junior_krieket_v19_saved_' + id);\n    } catch(e) {}\n    window.location.reload();\n  }, true);\n})();\n</script>\n<!-- O6 V19 HARD RESET PATCH V2 -->\n'''

          text = text.replace(needle, needle + patch, 1)
          path.write_text(text, encoding='utf-8')
          print('V19 hard reset patch added to production wrapper.')

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scorer-o6-v19.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Fix U6 reset to show new match start'
            git push origin HEAD:main
          fi

      # V2: production wrapper patch must run on the current main branch.
