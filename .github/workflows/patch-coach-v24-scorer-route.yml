name: Fix V24 scorer routing
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V24 scorer routing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('coach-v24.html')
          s=p.read_text(encoding='utf-8')
          old="window.openScorer=id=>location.href=`scorer-fixed.html?match=${encodeURIComponent(id)}&v=24`;"
          new="window.openScorer=async id=>{try{const {data,error}=await db.from('matches').select('age_group').eq('id',id).single();if(error)throw error;const ag=String(data?.age_group||'').toUpperCase().replace('/','');const target=ag==='U6'?'scorer-phase1.html':'scorer-fixed.html';location.href=`${target}?match=${encodeURIComponent(id)}&v=24`}catch(e){alert('Kon nie die wedstryd se ouderdomsgroep bepaal nie: '+(e.message||e))}};"
          if old not in s:
              raise SystemExit('Expected V24 scorer route not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add coach-v24.html
          git rm .github/workflows/patch-coach-v24-scorer-route.yml
          git commit -m "Route V24 coaches to correct age-group scorer"
          git push
