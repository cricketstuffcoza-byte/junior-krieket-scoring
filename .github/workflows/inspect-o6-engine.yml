name: Inspect O6 scoring engine
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-production
      - name: Inspect runout and scoring handlers
        run: |
          echo '--- RUNOUT ---'
          grep -n -i -E 'runout|run out|wicket' scorer.html | tail -n 30 || true
          echo '--- HANDLERS ---'
          grep -n -E 'onclick|addEventListener|function .*score|function .*ball|function .*wicket|function .*dismiss' scorer.html | tail -n 80 || true
          echo '--- START ---'
          grep -n -E "\$('start'\)|id=\"start\"|newState|pairChoices|TEAMS" scorer.html | tail -n 50 || true
