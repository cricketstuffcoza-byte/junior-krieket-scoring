name: Inspect O6 scoring engine
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-production
      - name: Inspect scoring core
        run: |
          echo '--- ADD PLAYABLE ---'
          sed -n '72,84p' scorer.html
          echo '--- RETIREMENT ---'
          sed -n '79,86p' scorer.html
          echo '--- START ---'
          sed -n '100,108p' scorer.html
