<!doctype html>
<html lang="af">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Junior Krieket – O/8 LIVE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#172033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 3px 15px #0001}.top{background:#172033;color:#fff}.error{background:#fde8e8;color:#a11}.muted{color:#687385}.actions{display:flex;gap:8px;flex-wrap:wrap}button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;font-weight:800}.primary{background:#172033;color:#fff}</style>
</head>
<body>
<div class="app">
<section class="card top"><h1>🏏 Junior Krieket – O/8 T80</h1><div>LIVE SCORER • 80 balle • 5 balle per boulbeurt</div></section>
<section class="card" id="status">Maak die veilige LIVE-telkaart oop…</section>
</div>
<script>
'use strict';
const id=new URLSearchParams(location.search).get('match');
const status=document.getElementById('status');
if(!id){status.className='card error';status.textContent='Geen wedstryd-ID verskaf nie.';}
else{
  status.innerHTML='<b>Laai telkaart…</b><p class="muted">Jy word na die geverifieerde O/8-telkaart geneem.</p>';
  const target='scorer.html?match='+encodeURIComponent(id);
  setTimeout(()=>location.replace(target),150);
}
</script>
</body>
</html>
