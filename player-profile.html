<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Spelerprofiel</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,sans-serif;background:#eef2f6;color:#172033;margin:0}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{border:1px solid #e4e7ec;border-radius:14px;padding:14px}.label{font-size:12px;font-weight:800;color:#667085;text-transform:uppercase}.value{font-size:24px;font-weight:900;margin-top:4px}.muted{color:#667085}.error{color:#b42318}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#edf2f7;font-size:12px;font-weight:800}.contact{border:1px solid #e4e7ec;border-radius:14px;padding:14px;margin:10px 0}button{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer;background:#172033;color:#fff}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><div class="wrap"><div id="msg" class="card">Laai spelerprofiel…</div><main id="app" class="hidden"></main></div><script>(async()=>{const URL='https://moomommajyldjquncnrd.supabase.co',KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH';const db=supabase.createClient(URL,KEY),id=new URLSearchParams(location.search).get('player');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));try{const {data:{session}}=await db.auth.getSession();if(!session)throw Error('Meld asseblief eers aan.');if(!id)throw Error('Geen speler gekies nie.');const {data:p,error:pe}=await db.from('players').select('id,first_name,surname,team_id,active,teams(name,age_group)').eq('id',id).maybeSingle();if(pe)throw pe;if(!p)throw Error('Speler nie gevind nie.');const {data:ct,error:ce}=await db.from('coach_teams').select('team_id').eq('coach_user_id',session.user.id).eq('team_id',p.team_id).eq('active',true).maybeSingle();if(ce)throw ce;if(!ct)throw Error('Jy het nie toegang tot hierdie speler se profiel nie.');const [{data:career,error:care},{data:reports,error:re},{data:guardians,error:ge}]=await Promise.all([db.from('player_career_stats').select('*').eq('player_id',id).maybeSingle(),db.from('player_reports').select('created_at,homework,coach_feedback').eq('player_id',id).eq('author_user_id',session.user.id).order('created_at',{ascending:false}).limit(10),db.rpc('coach_get_player_guardians',{p_player_id:id})]);if(care)throw care;if(re)throw re;if(ge)throw ge;const name=`${p.first_name} ${p.surname}`;document.title='Junior Krieket – '+name;document.getElementById('msg').remove();const a=document.getElementById('app');a.className='';a.innerHTML=`<section class="card"><div class="top"><div><h1>🏏 ${esc(name)}</h1><p class="muted">${esc(p.teams?.name||'')} · ${esc(p.teams?.age_group||'')}</p></div><button onclick="history.back()">← Terug</button></div></section><section class="card"><h2>👨‍👩‍👧 Ouer / Voog kontakbesonderhede</h2>${guardians?.length?guardians.map(g=>`<div class="contact"><b>${esc(g.full_name||'—')}</b><div class="muted">Verhouding: ${esc(g.relationship||'—')}</div><div>E-pos: ${esc(g.email||'—')}</div><div>Selfoon: ${esc(g.mobile_phone||'—')}</div><div><b>Noodnommer: ${esc(g.emergency_phone||'—')}</b></div></div>`).join(''):'<p class="muted">Geen goedgekeurde ouer/voog is aan hierdie speler gekoppel nie.</p>'}</section><section class="card"><h2>Spelerstatistieke</h2><div class="grid"><div class="stat"><div class="label">Wedstryde</div><div class="value">${career?.matches??0}</div></div><div class="stat"><div class="label">Kolf lopies</div><div class="value">${career?.batting_runs??0}</div></div><div class="stat"><div class="label">Balle</div><div class="value">${career?.playable_balls??0}</div></div><div class="stat"><div class="label">Vier's</div><div class="value">${career?.fours??0}</div></div><div class="stat"><div class="label">Ses's</div><div class="value">${career?.sixes??0}</div></div><div class="stat"><div class="label">Boul-wickets</div><div class="value">${career?.bowler_wickets??0}</div></div><div class="stat"><div class="label">Catches</div><div class="value">${career?.catches??0}</div></div><div class="stat"><div class="label">Run-outs</div><div class="value">${career?.run_outs??0}</div></div></div></section><section class="card"><h2>Onlangse verslae</h2>${reports?.length?reports.map(r=>`<div class="stat"><b>${new Date(r.created_at).toLocaleDateString('af-ZA')}</b><p><b>Huiswerk:</b> ${esc(r.homework||'')}</p><p><b>Terugvoer:</b> ${esc(r.coach_feedback||'')}</p></div>`).join(''):'<p class="muted">Geen verslae beskikbaar nie.</p>'}</section>`}catch(e){document.getElementById('msg').innerHTML=`<h2>⚠️ Kon nie profiel laai nie</h2><p class="error">${esc(e.message||e)}</p><button onclick="history.back()">← Terug</button>`}})();</script></body></html>
