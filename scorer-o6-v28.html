<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – O/6 Telkaart</title><style>html,body{margin:0;background:#eef2f6;width:100%;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="score" title="Junior Krieket O/6 Telkaart"></iframe><script>'use strict';const q=location.search,frame=document.getElementById('score');frame.src='scorer-o6-v27.html'+q+'&fix=finalpair';function patch(){try{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;const s=w.__juniorState;if(!s||Number(s.pairBalls)!==16)return;const panel=d.getElementById('pairPanel'),choices=d.getElementById('pairChoices');if(!panel||panel.classList.contains('hidden')||!choices)return;const current=[s.striker,s.nonStriker].filter(Boolean);current.forEach(name=>{if(![...choices.children].some(b=>b.textContent.trim()===name)){const b=d.createElement('button');b.type='button';b.className='btn choice';b.textContent=name;b.addEventListener('click',()=>{if(b.disabled)return;const i=s.selectedPair.indexOf(name);if(i>=0)s.selectedPair.splice(i,1);else if(s.selectedPair.length<2)s.selectedPair.push(name);[...choices.children].forEach(x=>x.classList.toggle('selected',s.selectedPair.includes(x.textContent.trim())));const c=d.getElementById('confirmPair');if(c)c.disabled=s.selectedPair.length!==2});choices.appendChild(b)}});[...choices.children].forEach(x=>x.classList.toggle('selected',s.selectedPair.includes(x.textContent.trim())))}catch(e){}}frame.addEventListener('load',()=>{setInterval(patch,250);setTimeout(patch,100)});</script></body></html>
