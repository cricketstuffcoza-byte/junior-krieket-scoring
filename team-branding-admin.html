<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Span Branding</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,sans-serif;background:#eef2f6;color:#172033;margin:0}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:800;margin:0 0 6px}select,input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd3dc;border-radius:10px}button{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#172033;color:#fff}.ghost{background:#eef2f6}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.muted{color:#667085}.error{color:#b42318}.success{color:#087443}.preview{width:180px;height:180px;border-radius:18px;border:1px dashed #ccd3dc;object-fit:cover;background:#f6f8fa}.cover{width:100%;max-height:260px;border-radius:16px;object-fit:cover;background:#f6f8fa}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section id="auth" class="card"><h1>🎨 Span Branding</h1><p class="muted">Admin kan enige span se logo en span-voorbladfoto oplaai of verander.</p><form id="login"><div class="grid"><div><label>E-pos</label><input id="email" type="email" required></div><div><label>Wagwoord</label><input id="password" type="password" required></div></div><div class="actions"><button class="primary">Meld Aan</button></div></form><p id="msg" class="muted"></p></section><main id="app" class="hidden"><section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h1>🎨 Span Branding</h1><p id="welcome" class="muted"></p></div><button class="ghost" id="logout">Teken uit</button></div></section><section class="card"><div class="grid"><div><label>Kies span</label><select id="team"></select></div><div><label>Span logo</label><input id="logo" type="file" accept="image/png,image/jpeg,image/webp"></div><div><label>Span coverpage foto</label><input id="cover" type="file" accept="image/png,image/jpeg,image/webp"></div></div><div class="actions"><button class="primary" id="save">💾 Stoor Branding</button><button class="ghost" id="back">← Terug na Admin</button></div><p id="status" class="muted"></p></section><section class="card"><h2>Voorskou</h2><div class="grid"><div><h3>Logo</h3><img id="logoPreview" class="preview" alt="Span logo"></div><div><h3>Coverpage</h3><img id="coverPreview" class="cover" alt="Span coverpage"></div></div></section></main></div><script>(function(){const URL='https://moomommajyldjquncnrd.supabase.co',KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH',db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}}),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let teams=[];function setMsg(t,c='muted'){$('status').textContent=t;$('status').className=c}function preview(){const t=teams.find(x=>x.id===$('team').value);$('logoPreview').src=t?.logo_path?db.storage.from('team-branding').getPublicUrl(t.logo_path).data.publicUrl:'';$('coverPreview').src=t?.cover_photo_path?db.storage.from('team-branding').getPublicUrl(t.cover_photo_path).data.publicUrl:''}async function start(s){try{const{data:r,error:re}=await db.rpc('has_access_role',{p_role:'admin'});if(re)throw re;if(r!==true)throw Error('Geen Admin-toegang nie.');const{data:p,error:pe}=await db.from('user_profiles').select('full_name,active').eq('user_id',s.user.id).maybeSingle();if(pe)throw pe;if(!p||p.active===false)throw Error('Jou gebruikersprofiel is nie aktief nie.');$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='Welkom, '+(p.full_name||s.user.email);const q=await db.from('teams').select('id,name,age_group,logo_path,cover_photo_path').order('name');if(q.error)throw q.error;teams=q.data||[];$('team').innerHTML=teams.map(t=>'<option value="'+esc(t.id)+'">'+esc(t.name)+' · '+esc(t.age_group)+'</option>').join('');preview()}catch(e){setMsg(e.message||String(e),'error')}}async function save(){const t=teams.find(x=>x.id===$('team').value);if(!t)return setMsg('Kies asseblief ’n span.','error');const logo=$('logo').files[0],cover=$('cover').files[0];if(!logo&&!cover)return setMsg('Kies ’n logo en/of coverpage foto.','error');$('save').disabled=true;setMsg('Laai branding op…');try{const patch={};if(logo){const ext=(logo.name.split('.').pop()||'jpg').toLowerCase(),path=t.id+'/logo.'+ext;const u=await db.storage.from('team-branding').upload(path,logo,{upsert:true,contentType:logo.type,cacheControl:'3600'});if(u.error)throw u.error;patch.logo_path=path}if(cover){const ext=(cover.name.split('.').pop()||'jpg').toLowerCase(),path=t.id+'/cover.'+ext;const u=await db.storage.from('team-branding').upload(path,cover,{upsert:true,contentType:cover.type,cacheControl:'3600'});if(u.error)throw u.error;patch.cover_photo_path=path}const u=await db.from('teams').update(patch).eq('id',t.id);if(u.error)throw u.error;Object.assign(t,patch);preview();$('logo').value='';$('cover').value='';setMsg('Branding suksesvol gestoor.','success')}catch(e){setMsg('Kon branding nie stoor nie: '+(e.message||e),'error')}finally{$('save').disabled=false}}$('login').onsubmit=e=>{e.preventDefault();db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value}).then(r=>{if(r.error)throw r.error;return start(r.data.session)}).catch(e=>setMsg(e.message||String(e),'error'))};$('team').onchange=preview;$('save').onclick=save;$('logout').onclick=()=>db.auth.signOut();$('back').onclick=()=>location.href='admin-v23.html';db.auth.getSession().then(({data:{session}})=>session&&start(session)})})();</script></body></html>
