<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Afrigter Portaal V25</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#eef2f6;color:#172033;margin:0;padding:18px}.wrap{max-width:1220px;margin:auto}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}.brand{background:#172033;color:#fff}.muted{color:#667085}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.team,.player,.fixture{border:1px solid #e4e7ec;border-radius:15px;padding:16px;background:#fff}.team,.player{cursor:pointer}.team:hover,.player:hover{transform:translateY(-1px);box-shadow:0 5px 18px #0001}.avatar{width:68px;height:68px;border-radius:14px;background:#edf2f7;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:21px;overflow:hidden;flex:0 0 68px}.avatar img{width:100%;height:100%;object-fit:cover}.player{display:flex;gap:13px;align-items:center}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#edf2f7;font-size:12px;font-weight:800}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.hidden{display:none!important}button{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#172033;color:#fff}.ghost{background:#eef2f6}.modal{position:fixed;inset:0;background:#17203380;display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}.modalbox{background:#fff;width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:20px;padding:22px}.profile{display:flex;gap:18px;align-items:center;border-bottom:1px solid #e4e7ec;padding-bottom:18px}.profilephoto{width:120px;height:120px;border-radius:18px;background:#edf2f7;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900}.profilephoto img{width:100%;height:100%;object-fit:cover}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stat{border:1px solid #e4e7ec;border-radius:13px;padding:13px;text-align:center}.stat b{display:block;font-size:24px;margin-bottom:3px}.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.info>div{border:1px solid #e4e7ec;border-radius:13px;padding:13px}.guardian{border:1px solid #e4e7ec;border-radius:13px;padding:14px;margin-top:12px}@media(max-width:900px){.grid,.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){body{padding:10px}.grid,.stats,.info{grid-template-columns:1fr}.profile{align-items:flex-start}.profilephoto{width:90px;height:90px;flex-basis:90px}}</style></head><body><div class="wrap"><header class="card brand"><h1>🧑‍🏫 Afrigter Portaal V25</h1><p>Junior Krieket • My spanne, spelers en wedstryde</p><span class="pill">V25</span></header><section id="auth" class="card"><h2>Meld aan</h2><form id="login"><div class="info"><div><b>E-pos</b><input id="email" type="email" required style="width:100%;padding:11px;margin-top:6px"></div><div><b>Wagwoord</b><input id="password" type="password" required style="width:100%;padding:11px;margin-top:6px"></div></div><p><button class="primary">Meld Aan</button></p><p id="msg" class="muted"></p></form></section><section id="denied" class="card hidden"><h2>🔒 Geen Afrigter-toegang</h2><p id="deniedMsg"></p></section><main id="app" class="hidden"><section class="card"><div class="head"><div><h2 style="margin:0">🧑‍🏫 Afrigter Portaal</h2><p id="welcome" class="muted"></p><p id="roles" class="muted"></p></div><button id="logout" class="ghost">Teken uit</button></div></section><section class="card"><h2>🏏 My spanne</h2><p class="muted">Klik op ’n span om sy spelers te sien.</p><div id="teams" class="grid"></div></section><section class="card"><div class="head"><div><h2 style="margin:0">👥 My spelers</h2><p id="summary" class="muted">Laai spelers…</p></div><button id="allPlayers" class="ghost hidden">Wys alle spelers</button></div><div id="players" class="grid" style="margin-top:14px"></div></section><section class="card"><div class="head"><h2 style="margin:0">📅 My wedstryde</h2><button id="refresh" class="ghost">↻ Verfris</button></div><div id="fixtures"></div></section><section class="card"><h2>📄 My ingediende verslae</h2><div id="reports"></div></section></main></div><div id="modal" class="modal hidden"><div class="modalbox"><div class="head"><h2 style="margin:0">Spelerprofiel</h2><button id="close" class="ghost">Sluit</button></div><div id="profile" style="margin-top:18px"></div></div></div><script>(async()=>{const U='https://moomommajyldjquncnrd.supabase.co',K='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH',db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));let session,teams=[],players=[],photos={};const initials=p=>((p.first_name||'')[0]||'')+((p.surname||'')[0]||'');async function role(r){const q=await db.rpc('has_access_role',{p_role:r});if(q.error)throw q.error;return q.data===true}async function load(){const t=await db.from('coach_teams').select('team_id,teams(id,name,age_group,active)').eq('coach_user_id',session.user.id).eq('active',true);if(t.error)throw t.error;teams=(t.data||[]).map(x=>x.teams).filter(x=>x&&x.active!==false);const q=await db.rpc('coach_list_my_players');if(q.error)throw q.error;const raw=q.data||[],seen=new Set();players=[];raw.forEach(x=>{if(!seen.has(x.player_id)){seen.add(x.player_id);players.push(x)}});photos={};const paths=[...new Set(players.map(x=>x.photo_path).filter(Boolean))];for(const path of paths){let url=path;if(!/^https?:\\/\\//i.test(path)){const r=await db.storage.from('player-photos').createSignedUrl(path,3600);url=r.data?.signedUrl||null}if(url)players.filter(x=>x.photo_path===path).forEach(x=>photos[x.player_id]=url)}renderTeams();renderPlayers();const f=await db.from('matches').select('id,age_group,team_a_id,team_b_id,match_date,match_time,venue,status').or(`coach_user_id.eq.${session.user.id},scorer_user_id.eq.${session.user.id}`).order('match_date',{ascending:true});if(f.error)throw f.error;const rows=f.data||[],ids=[...new Set(rows.flatMap(x=>[x.team_a_id,x.team_b_id]).filter(Boolean))];let tm={};if(ids.length){const z=await db.from('teams').select('id,name').in('id',ids);(z.data||[]).forEach(x=>tm[x.id]=x.name)}$('fixtures').innerHTML=rows.length?rows.map(x=>`<div class="fixture"><b>${esc(tm[x.team_a_id]||'Onbekend')} vs ${esc(tm[x.team_b_id]||'Onbekend')}</b><div class="muted">${esc(x.match_date)} • ${esc(String(x.match_time||'').slice(0,5))} • ${esc(x.venue||'')}</div><p><span class="pill">${esc(x.age_group)} · ${esc(x.status)}</span></p>${['SCHEDULED','LIVE'].includes(String(x.status).toUpperCase())?`<button class="primary" onclick="openScorecard('${x.id}','${esc(x.age_group)}')">🏏 Open Telkaart</button>`:''}</div>`).join(''):'<p class="muted">Geen wedstryde is tans aan jou toegeken nie.</p>';const rr=await db.from('player_reports').select('id,created_at,homework,coach_feedback,players(first_name,surname)').eq('author_user_id',session.user.id).order('created_at',{ascending:false});$('reports').innerHTML=rr.error?`<p class="muted">${esc(rr.error.message)}</p>`:(rr.data||[]).length?rr.data.map(x=>`<div class="fixture"><b>${esc(x.players?.first_name)} ${esc(x.players?.surname)}</b><div class="muted">${esc(new Date(x.created_at).toLocaleString('af-ZA'))}</div><p><b>Huiswerk:</b> ${esc(x.homework)}</p><p><b>Terugvoer:</b> ${esc(x.coach_feedback||'')}</p></div>`).join(''):'<p class="muted">Nog geen verslae ingedien nie.</p>'}function renderTeams(){ $('teams').innerHTML=teams.length?teams.map(t=>`<div class="team" data-team="${t.id}"><h3>${esc(t.name)}</h3><span class="pill">${esc(t.age_group)}</span><p class="muted">${players.filter(p=>p.team_id===t.id).length} aktiewe spelers</p><b class="link">Klik om spelers te sien →</b></div>`).join(''):'<p class="muted">Geen aktiewe spanne aan jou toegeken nie.</p>';document.querySelectorAll('[data-team]').forEach(x=>x.onclick=()=>{renderPlayers(x.dataset.team);$('players').scrollIntoView({behavior:'smooth',block:'start'})})}function renderPlayers(filter){const r=filter?players.filter(p=>p.team_id===filter):players;$('allPlayers').classList.toggle('hidden',!filter);$('summary').textContent=`${r.length} aktiewe speler${r.length===1?'':'s'} • Klik ’n speler vir volledige profiel`;$('players').innerHTML=r.length?r.map(p=>`<div class="player" data-player="${p.player_id}"><div class="avatar">${photos[p.player_id]?`<img src="${esc(photos[p.player_id])}">`:esc(initials(p))}</div><div><h3 style="margin:0">${esc(p.first_name)} ${esc(p.surname)}</h3><div class="muted">${esc(p.team_name)} • ${esc(p.age_group)}</div></div></div>`).join(''):'<p class="muted">Geen spelers in hierdie span nie.</p>';document.querySelectorAll('[data-player]').forEach(x=>x.onclick=()=>openProfile(x.dataset.player))}async function openProfile(id){const p=players.find(x=>x.player_id===id);if(!p)return;const g=(await db.rpc('coach_list_my_players')).data||[];const guardians=[];g.forEach(x=>{if(x.player_id===id&&x.guardian_user_id&&!guardians.some(a=>a.guardian_user_id===x.guardian_user_id))guardians.push(x)});const s=await db.rpc('coach_get_player_career_stats',{p_player_id:id});const a=s.data?.[0]||{};const sr=Number(a.playable_balls)>0?(Number(a.batting_runs||0)*100/Number(a.playable_balls)).toFixed(1):'0.0';const photo=photos[id];$('profile').innerHTML=`<div class="profile"><div class="profilephoto">${photo?`<img src="${esc(photo)}">`:esc(initials(p))}</div><div><h1 style="margin:0">${esc(p.first_name)} ${esc(p.surname)}</h1><p class="muted">${esc(p.team_name)} • ${esc(p.age_group)}</p></div></div><section class="card" style="box-shadow:none;padding:0;margin-top:18px"><h2>📊 Speler statistieke</h2><div class="stats"><div class="stat"><b>${a.matches||0}</b>Wedstryde</div><div class="stat"><b>${a.batting_runs||0}</b>Lopies</div><div class="stat"><b>${a.playable_balls||0}</b>Kolf balle</div><div class="stat"><b>${sr}</b>Strike rate</div><div class="stat"><b>${a.fours||0}</b>4s</div><div class="stat"><b>${a.sixes||0}</b>6s</div><div class="stat"><b>${a.bowler_wickets||0}</b>Paaltjies</div><div class="stat"><b>${a.bowler_runs_conceded||0}</b>Runs afgestaan</div><div class="stat"><b>${a.bowler_playable_balls||0}</b>Bowling balle</div><div class="stat"><b>${a.dot_balls||0}</b>Dot balle</div><div class="stat"><b>${a.catches||0}</b>Vangskote</div><div class="stat"><b>${a.run_outs||0}</b>Run outs</div></div></section><section style="margin-top:20px"><h2>👨‍👩‍👧 Ouer / Voog inligting</h2>${guardians.length?guardians.map(x=>`<div class="guardian"><h3 style="margin-top:0">${esc(x.guardian_name||'Ouer / Voog')}</h3><div class="info"><div><b>E-pos</b><br>${esc(x.guardian_email||'Nie beskikbaar nie')}</div><div><b>Verhouding</b><br>${esc(x.guardian_relationship||'Nie aangedui nie')}</div><div><b>Telefoon</b><br>${esc(x.guardian_phone||'Nie beskikbaar nie')}</div><div><b>Selfoon</b><br>${esc(x.guardian_mobile_phone||'Nie beskikbaar nie')}</div><div><b>Noodnommer</b><br>${esc(x.guardian_emergency_phone||'Nie beskikbaar nie')}</div></div></div>`).join(''):'<p class="muted">Geen ouer/voog is tans gekoppel nie.</p>'}</section>`;$('modal').classList.remove('hidden')}window.openScorecard=(id,age)=>{const g=String(age||'').toUpperCase();let target='scorer-fixed.html';if(g==='U/6')target='scorer-o6-v25.html';else if(g==='U/7')target='scorer-o7-v19.html';location.href=target+'?match='+encodeURIComponent(id)+'&v=25&resume=1&ts='+Date.now()};$('login').onsubmit=async e=>{e.preventDefault();try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;session=r.data.session;const rs=[];for(const x of ['admin','coach','parent'])if(await role(x))rs.push(x);if(!rs.includes('coach'))throw Error('Hierdie rekening het nie Afrigter-toegang nie.');const p=await db.from('user_profiles').select('full_name,active').eq('user_id',session.user.id).maybeSingle();if(p.error)throw p.error;if(!p.data||p.data.active===false)throw Error('Jou gebruikersprofiel is gedeaktiveer.');$('auth').classList.add('hidden');$('denied').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='Welkom, '+(p.data.full_name||session.user.email);$('roles').textContent='Toegang: '+rs.join(' • ');await load()}catch(e){$('msg').textContent=e.message||String(e)}};$('logout').onclick=()=>db.auth.signOut();$('refresh').onclick=()=>load();$('allPlayers').onclick=()=>renderPlayers();$('close').onclick=()=>$('modal').classList.add('hidden');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')};db.auth.getSession().then(({data:{session:s}})=>{if(s){session=s;$('auth').classList.add('hidden');startExisting()}});async function startExisting(){try{const rs=[];for(const x of ['admin','coach','parent'])if(await role(x))rs.push(x);if(!rs.includes('coach'))throw Error('Hierdie rekening het nie Afrigter-toegang nie.');const p=await db.from('user_profiles').select('full_name,active').eq('user_id',session.user.id).maybeSingle();if(p.error)throw p.error;if(!p.data||p.data.active===false)throw Error('Jou gebruikersprofiel is gedeaktiveer.');$('app').classList.remove('hidden');$('welcome').textContent='Welkom, '+(p.data.full_name||session.user.email);$('roles').textContent='Toegang: '+rs.join(' • ');await load()}catch(e){$('denied').classList.remove('hidden');$('deniedMsg').textContent=e.message||String(e)}}})()</script></body></html>
