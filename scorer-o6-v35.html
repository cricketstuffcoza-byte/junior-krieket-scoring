<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Junior Krieket – O/6 Telkaart V38</title><style>html,body{margin:0;background:#eef2f6;width:100%;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="score" title="Junior Krieket O/6 Telkaart"></iframe><script>(function(){'use strict';const f=document.getElementById('score'),q=new URLSearchParams(location.search),id=q.get('match');f.src='./scorer-o6-v34.html?match='+encodeURIComponent(id||'')+'&resume=1&v=38&ts='+Date.now();function core(){try{const v=f.contentWindow;if(!v||!v.document)return null;const inner=v.document.getElementById('score');return inner&&inner.contentWindow?inner.contentWindow:null}catch(e){return null}}function safeRoster(w,s){try{if(!w.teamPlayers||!s.bats)return;const original=w.teamPlayers;w.__originalTeamPlayers=w.__originalTeamPlayers||original;w.teamPlayers=function(){const list=w.__originalTeamPlayers.call(w)||[];return list.filter(n=>n&&s.bats[n])}}catch(e){}}function finishOrContinue(w,s,pairPanel,bowlerPanel){safeRoster(w,s);const active=(w.teamPlayers?w.teamPlayers():[]).filter(n=>s.bats[n]&&!s.bats[n].out&&!s.bats[n].retired);const completed=new Set(Array.isArray(s.completedPairPlayers)?s.completedPairPlayers:[]);if(s.striker)completed.add(s.striker);if(s.nonStriker)completed.add(s.nonStriker);const freshAfter=active.filter(n=>!completed.has(n));if(freshAfter.length===0){s.bowler=null;s.selectedBowler=null;s.pendingNewBatter=false;s.pendingCoachThrow=false;s.pendingCoachWicket=false;s.pendingDismissal=false;s.pendingFielder=false;if(bowlerPanel)bowlerPanel.classList.add('hidden');if(pairPanel)pairPanel.classList.add('hidden');if(typeof w.finishInnings==='function')w.finishInnings();return true}if(pairPanel&&pairPanel.classList.contains('hidden')&&typeof w.openPair==='function'){s.bowler=null;s.selectedBowler=null;if(bowlerPanel)bowlerPanel.classList.add('hidden');w.openPair();w.render&&w.render();return true}return false}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}function installPdf(w){try{if(!w||w.__ballByBallPdfInstalled)return;const doc=w.document,act=doc.querySelector('.actions');if(!act)return;const makePdf=function(ev){ev.preventDefault();ev.stopImmediatePropagation();try{const s=w.__juniorState;if(!s)return alert('Wedstryddata is nog nie gereed nie.');const sc=s.score&&s.batting?s.score[s.batting]||{}:{};const A=(doc.getElementById('labelA')||{}).textContent||'Span A',B=(doc.getElementById('labelB')||{}).textContent||'Span B';const log=Array.isArray(s.log)?s.log:[];const rows=Object.values(s.bats||{}).filter(x=>x&&x.name).map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+Number(x.runs||0)+'</td><td>'+Number(x.balls||0)+'</td><td>'+Number(x.unplayable||0)+'</td><td>'+Number(x.dismissals||0)+'</td></tr>').join('');const bowls=Object.values(s.bowlers||{}).filter(x=>x&&x.name).map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+Number(x.runs||0)+'</td><td>'+Number(x.legalBalls||0)+'</td><td>'+Number(x.wickets||0)+'</td><td>'+Number(x.wides||0)+'</td><td>'+Number(x.noBalls||0)+'</td></tr>').join('');const ballRows=log.map(function(e,i){const result=e.wicket?('WICKET'+(e.dismissal?': '+e.dismissal:'')):(e.kind||((Number(e.runs)||0)+' runs'));const runText=Number(e.runs||0);const over=e.over!=null?e.over:(Math.floor(Math.max(0,Number(e.ball||0)-1)/8)+'.'+(Math.max(0,Number(e.ball||0)-1)%8));return '<tr><td>'+Number(e.inn||s.innings||1)+'</td><td>'+esc(over)+'</td><td>'+Number(e.ball||i+1)+'</td><td>'+esc(e.face||'—')+'</td><td>'+esc(result)+'</td><td>'+runText+'</td><td>'+esc(e.runOutBatter||'')+'</td></tr>'}).join('');const title='Junior Krieket – '+A+' vs '+B+' – Wedstrydverslag';const html='<html><head><title>'+esc(title)+'</title><style>@page{size:A4 landscape;margin:12mm}body{font-family:Arial,sans-serif;padding:10px;font-size:11px}h1{font-size:20px}h2{margin-top:22px;font-size:15px}table{width:100%;border-collapse:collapse;margin:8px 0 14px}th,td{border:1px solid #bbb;padding:5px;text-align:center}th{background:#eee}th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5){text-align:left}.summary{display:flex;gap:25px}.pagebreak{page-break-before:always}.small{font-size:9px;color:#666}</style></head><body><h1>Junior Krieket – '+esc(A)+' vs '+esc(B)+'</h1><p><b>Innings:</b> '+Number(s.innings||1)+' – '+esc(s.batting||'')+' &nbsp; <b>Telling:</b> '+Number(sc.runs||0)+'/'+Number(sc.wickets||0)+' &nbsp; <b>Overs:</b> '+Math.floor(Number(sc.legalBalls||0)/8)+'.'+Number(sc.legalBalls||0)%8+'</p><p><b>Onspeelbaar:</b> '+Number(sc.unplayable||0)+' &nbsp; <b>Coach throws:</b> '+Number(sc.coach||0)+' ('+Number(sc.coachRuns||0)+' lopies)</p><h2>Kolwer-statistieke</h2><table><tr><th>Speler</th><th>Lopies</th><th>Speelbaar balle</th><th>Onspeelbaar</th><th>Uit</th></tr>'+rows+'</table><h2>Boulers</h2><table><tr><th>Bouler</th><th>Lopies teen</th><th>Balle</th><th>Paaltjies</th><th>Wydes</th><th>No-balls</th></tr>'+bowls+'</table><div class="pagebreak"></div><h2>Bal-vir-bal verslag</h2><table><tr><th>Innings</th><th>Oor</th><th>Bal</th><th>Kolwer</th><th>Resultaat</th><th>Lopies</th><th>Run-out kolwer</th></tr>'+ballRows+'</table><p class="small">Gegenereer: '+new Date().toLocaleString('af-ZA')+' • '+log.length+' aangetekende balle/gebeure.</p></body></html>';const p=w.open('','_blank');if(!p)return alert('Laat asseblief pop-ups toe.');p.document.write(html);p.document.close();setTimeout(function(){p.focus();p.print()},500)}catch(e){alert('Kon nie PDF voorberei nie: '+e.message)}};const buttons=act.querySelectorAll('button');buttons.forEach(function(b){if(b.id==='pdfGame'||b.id==='pdfInnings'){b.addEventListener('click',makePdf,true)}});w.__ballByBallPdfInstalled=true}catch(e){console.warn('O/6 ball-by-ball PDF patch',e)}}function fix(){const w=core();if(!w||!w.__juniorState)return;const s=w.__juniorState;if(!s.started||s.completed)return;try{safeRoster(w,s);installPdf(w);const score=s.score&&s.batting?s.score[s.batting]:null,pairPanel=w.document.getElementById('pairPanel'),bowlerPanel=w.document.getElementById('bowlerPanel');const pairDone=Number(s.pairBalls||0)>=16;if(pairDone&&typeof w.finishInnings==='function'){if(finishOrContinue(w,s,pairPanel,bowlerPanel))return}const legal=Number(score&&score.legalBalls||0);if(s.bowler&&legal>0&&legal%8===0&&Number(s.pairBalls||0)<16&&!s.pairLimitAccepted&&bowlerPanel&&bowlerPanel.classList.contains('hidden')&&typeof w.openBowler==='function'){s.bowler=null;s.selectedBowler=null;w.openBowler();w.render&&w.render()}}catch(e){console.warn('O/6 V38 workflow fix',e)}}f.addEventListener('load',function(){setTimeout(fix,250);setTimeout(fix,800);setTimeout(fix,1500)});setInterval(fix,400)})();</script></body></html>
