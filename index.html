<!doctype html>
<html lang="af">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Junior Krieket</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#eef2f6}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:28px}.card{background:#fff;border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 3px 16px #0001}.hero{background:#172033;color:#fff}.muted{color:#667085}.hero .muted{color:#d5deea}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button,a{border:0;border-radius:11px;padding:13px 17px;font-weight:800;text-decoration:none;cursor:pointer}.primary{background:#fff;color:#172033}.secondary{background:#eef2f6;color:#172033}.error{color:#b42318}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#edf2f7;color:#172033;font-size:12px;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <div class="card hero">
    <h1>🏏 Junior Krieket</h1>
    <p class="muted">Junior Krieket scoring • Live Supabase database • Cloudflare Pages</p>
    <span class="pill">PRODUCTION</span>
  </div>
  <div class="card">
    <h2 id="title">Laai…</h2>
    <p id="message" class="muted">Bepaal die regte toepassing…</p>
    <div id="actions" class="actions"></div>
  </div>
</div>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const match=params.get('match');
  const title=document.getElementById('title');
  const message=document.getElementById('message');
  const actions=document.getElementById('actions');
  function link(label,href,primary=true){
    const a=document.createElement('a');a.href=href;a.textContent=label;a.className=primary?'primary':'secondary';actions.appendChild(a);
  }
  if(match){
    title.textContent='Laai wedstryd…';
    message.textContent='Die wedstryd-ID is ontvang. Die korrekte ouderdomsgroep-telkaart word oopgemaak.';
    fetch('https://moomommajyldjquncnrd.supabase.co/rest/v1/matches?id=eq.'+encodeURIComponent(match)+'&select=age_group',{headers:{apikey:'sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH'},cache:'no-store'})
      .then(r=>{if(!r.ok)throw Error('Kon nie die wedstryd bepaal nie.');return r.json()})
      .then(rows=>{
        const ag=String(rows?.[0]?.age_group||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
        if(ag==='U6'||ag==='O6') location.replace('scorer-o6.html?match='+encodeURIComponent(match)+'&v=29');
        else if(ag==='U8'||ag==='O8') location.replace('scorer-o8-v21.html?match='+encodeURIComponent(match)+'&v=29');
        else throw Error('Geen telkaart beskikbaar vir hierdie ouderdomsgroep nie.');
      })
      .catch(e=>{title.textContent='Kon nie wedstryd oopmaak nie';message.textContent=e.message||String(e);message.className='error';link('Maak Admin Portaal oop','admin-v24.html',false)});
    return;
  }
  title.textContent='Welkom';
  message.textContent='Kies die toepassing wat jy wil gebruik.';
  link('🔐 Admin Portaal V24','admin-v24.html',true);
  link('📖 Live Score Router','scorer.html',false);
})();
</script>
</body>
</html>
