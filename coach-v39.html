rt=html.indexOf('window.openScorer=async id=>');const routeEnd=html.indexOf('async function loadReports()',routeStart);if(routeStart<0||routeEnd<0)throw Error('Coach Portal se telkaart-roete kon nie gevind word nie.');const newRoute="window.openScorer=async id=>{const safeId=String(id||'').trim();if(!safeId)return;try{const r=await fetch('https://moomommajyldjquncnrd.supabase.co/rest/v1/matches?select=age_group&id=eq.'+encodeURIComponent(safeId),{headers:{Accept:'application/json',apikey:'sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH'}});if(!r.ok)throw Error('Wedstryd kon nie gelaai word nie.');const rows=await r.json();const age=String(rows?.[0]?.age_group||'').toUpperCase();let target='scorer-fixed.html',v='26';if(age.includes('U/6')||age.includes('O/6')){target='scorer-o6-v40.html';v='40'}else if(age.includes('U/8')||age.includes('O/8')){target='scorer-o8-v8.html';v='8'}else if(age.includes('U/7')||age.includes('O/7')){target='scorer-o7.html';v='25'}location.href=target+'?match='+encodeURIComponent(safeId)+'&v='+v+'&resume=1&ts='+Date.now()};";html=html.slice(0,routeStart)+newRoute+html.slice(routeEnd);f.srcdoc=html}catch(e){document.body.innerHTML='<div style="padding:30px;font-family:system-ui"><h2>Coach Portal kon nie laai nie</h2><p>'+String(e.message||e)+'</p></div>'}})();</script></body></html>
