<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Ouerportaal V3</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,sans-serif;background:#eef2f6;color:#172033;margin:0}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:block;font-weight:800;margin-bottom:6px}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd3dc;border-radius:10px}button{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#172033;color:#fff}.ghost{background:#eef2f6}.hidden{display:none}.muted{color:#667085}.error{color:#b42318}.ok{color:#067647}.child{border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:10px 0}.live{background:#b42318;color:#fff}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#edf2f7;font-size:12px;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section id="auth" class="card"><h1>👨‍👩‍👧 Ouerportaal V3</h1><p class="muted">Dieselfde login kan nou ook Admin en Afrigter toegang hê.</p><form id="login"><div class="grid"><div><label>E-pos</label><input id="email" type="email" required></div><div><label>Wagwoord</label><input id="password" type="password" required></div></div><div class="actions"><button class="primary">Meld Aan</button></div></form><p id="msg" class="muted"></p></section><section id="denied" class="card hidden"><h2>🔒 Geen Ouer-toegang</h2><p id="deniedMsg"></p><button class="ghost" id="back">Meld aan met ander rekening</button></section><main id="app" class="hidden"><section class="card"><div style="display:flex;justify-content:space-between;gap:12px"><div><h1>👨‍👩‍👧 My Ouerportaal</h1><p id="welcome" class="muted"></p><p id="roles" class="muted"></p></div><button class="ghost" id="logout">Teken uit</button></div></section><section id="profile" class="card"><h2>My besonderhede</h2><form id="profileForm" class="grid"><div><label>Volle naam</label><input id="name" required></div><div><label>Selfoonnommer</label><input id="phone"></div><div><label>Nood-telefoonnommer</label><input id="emergency"></div><div><label>Verhouding</label><select id="relationship"><option>Ouer</option><option>Voog</option><option>Ander</option></select></div><div><button class="primary">💾 Stoor</button></div></form><p id="profileMsg" class="muted"></p></section><section class="card"><h2>My kinders</h2><div id="children"></div></section><section class="card"><h2>📅 Wedstryde</h2><div id="matches"></div></section></main></div><script>(function(){const URL='https://moomommajyldjquncnrd.supabase.co',KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH',db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let session=null,profile=null,roles=[];function msg(t,c='muted'){$('msg').textContent=t;$('msg').className=c}async function hasRole(r){const q=await db.rpc('has_access_role',{p_role:r});if(q.error)throw q.error;return q.data===true}async function start(s){session=s;try{roles=[];for(const r of ['admin','coach','parent'])if(await hasRole(r))roles.push(r);if(!roles.includes('parent'))throw Error('Hierdie rekening het nie Ouer-toegang nie.');const p=await db.from('user_profiles').select('full_name,active,mobile_phone,emergency_phone,relationship').eq('user_id',s.user.id).maybeSingle();if(p.error)throw p.error;if(!p.data||p.data.active===false)throw Error('Jou gebruikersprofiel is gedeaktiveer.');profile=p.data;$('auth').classList.add('hidden');$('denied').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='Welkom, '+(profile.full_name||s.user.email);$('roles').textContent='Toegang: '+roles.join(' • ');$('name').value=profile.full_name||'';$('phone').value=profile.mobile_phone||'';$('emergency').value=profile.emergency_phone||'';$('relationship').value=profile.relationship||'Ouer';await load()}catch(e){$('auth').classList.add('hidden');$('app').classList.add('hidden');$('denied').classList.remove('hidden');$('deniedMsg').textContent=e.message||String(e)}}async function load(){const r=await db.from('guardian_players').select('player_id,relationship,players(id,first_name,surname,team_id,teams(name,age_group))').eq('guardian_user_id',session.user.id);if(r.error)throw r.error;const kids=r.data||[];$('children').innerHTML=kids.length?kids.map(x=>`<div class="child"><b>${esc(x.players?.first_name)} ${esc(x.players?.surname)}</b><div class="muted">${esc(x.players?.teams?.name||'')} · ${esc(x.players?.teams?.age_group||'')} · ${esc(x.relationship||'')}</div></div>`).join(''):'<p class="muted">Geen kinders is tans aan jou rekening gekoppel nie.</p>';const teamIds=[...new Set(kids.map(x=>x.players?.team_id).filter(Boolean))],ages=[...new Set(kids.map(x=>x.players?.teams?.age_group).filter(Boolean))];if(!teamIds.length){$('matches').innerHTML='<p class="muted">Geen wedstryde.</p>';return}const m=await db.from('matches').select('id,age_group,team_a_id,team_b_id,match_date,match_time,venue,status').in('age_group',ages);if(m.error)throw m.error;const ids=[...new Set((m.data||[]).flatMap(x=>[x.team_a_id,x.team_b_id]).filter(Boolean))];let tm={};if(ids.length){const t=await db.from('teams').select('id,name').in('id',ids);if(t.error)throw t.error;(t.data||[]).forEach(x=>tm[x.id]=x.name)}const rows=(m.data||[]).filter(x=>teamIds.includes(x.team_a_id)||teamIds.includes(x.team_b_id));$('matches').innerHTML=rows.length?rows.map(x=>{const live=['LIVE','IN_PROGRESS','IN PROGRESS','PLAYING'].includes(String(x.status||'').toUpperCase());return `<div class="child"><b>${live?'🔴 LIVE':esc(x.status||'GESKEDULEER')}</b><div>${esc(tm[x.team_a_id]||'Onbekend')} vs ${esc(tm[x.team_b_id]||'Onbekend')}</div><div class="muted">${esc(x.match_date)} ${esc(String(x.match_time||'').slice(0,5))} · ${esc(x.venue||'')}</div>${live?`<div class="actions"><button class="live" onclick="location.href='live-score.html?match=${encodeURIComponent(x.id)}'">🔴 Volg Regstreeks</button></div>`:''}</div>`}).join(''):'<p class="muted">Geen geskeduleerde wedstryde.</p>'}async function save(e){e.preventDefault();$('profileMsg').textContent='Stoor…';const r=await db.rpc('parent_update_own_profile',{p_full_name:$('name').value.trim(),p_mobile_phone:$('phone').value.trim(),p_emergency_phone:$('emergency').value.trim(),p_relationship:$('relationship').value});if(r.error){$('profileMsg').textContent=r.error.message;$('profileMsg').className='error';return}profile.full_name=$('name').value.trim();$('welcome').textContent='Welkom, '+profile.full_name;$('profileMsg').textContent='Jou besonderhede is suksesvol opgedateer.';$('profileMsg').className='ok'}$('login').onsubmit=async e=>{e.preventDefault();try{msg('Meld aan…');const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;await start(r.data.session)}catch(e){msg(e.message||String(e),'error')}};$('profileForm').onsubmit=save;$('logout').onclick=()=>db.auth.signOut();$('back').onclick=()=>{db.auth.signOut();$('denied').classList.add('hidden');$('auth').classList.remove('hidden')};db.auth.getSession().then(({data:{session}})=>session&&start(session));})();</script></body></html>
