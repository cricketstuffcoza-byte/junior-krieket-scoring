<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Ouerportaal V3</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,sans-serif;background:#eef2f6;color:#172033;margin:0}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:block;font-weight:800;margin-bottom:6px}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd3dc;border-radius:10px}button{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#172033;color:#fff}.ghost{background:#eef2f6}.hidden{display:none}.muted{color:#667085}.error{color:#b42318}.ok{color:#067647}.child{border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:10px 0}.live{background:#b42318;color:#fff}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.avatar-lg{width:120px;height:120px;border-radius:20px;object-fit:cover;background:#edf2f7;display:block}.photo-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.photo-notice{border:1px solid #f0d58a;background:#fff8e1;border-radius:12px;padding:12px;margin:12px 0;font-size:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section id="auth" class="card"><h1>👨‍👩‍👧 Ouerportaal</h1><p class="muted">Dieselfde login kan ook Admin en Afrigter toegang hê.</p><form id="login"><div class="grid"><div><label>E-pos</label><input id="email" type="email" required></div><div><label>Wagwoord</label><input id="password" type="password" required></div></div><div class="actions"><button type="submit" class="primary">Meld Aan</button></div></form><p id="msg" class="muted"></p></section><section id="denied" class="card hidden"><h2>🔒 Geen Ouer-toegang</h2><p id="deniedMsg"></p><button class="ghost" id="back">Meld aan met ander rekening</button></section><main id="app" class="hidden"><section class="card"><div style="display:flex;justify-content:space-between;gap:12px"><div><h1>👨‍👩‍👧 My Ouerportaal</h1><p id="welcome" class="muted"></p><p id="roles" class="muted"></p></div><button class="ghost" id="logout">Teken uit</button></div></section><section class="card"><h2>My besonderhede</h2><form id="profileForm" class="grid"><div><label>Volle naam</label><input id="name" required></div><div><label>Selfoonnommer</label><input id="phone"></div><div><label>Nood-telefoonnommer</label><input id="emergency"></div><div><label>Verhouding</label><select id="relationship"><option>Ouer</option><option>Voog</option><option>Ander</option></select></div><div><button class="primary">💾 Stoor</button></div></form><p id="profileMsg" class="muted"></p></section><section class="card"><h2>My kinders</h2><div id="children"></div></section><section class="card"><h2>📅 Wedstryde</h2><div id="matches"></div></section></main><div id="childModal" class="hidden" style="position:fixed;inset:0;background:#0008;z-index:9999;padding:20px;overflow:auto"><div style="max-width:620px;margin:40px auto;background:#fff;border-radius:20px;padding:22px"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="childTitle">Kindprofiel</h2><button class="ghost" id="closeChild">✕</button></div><div id="childBody"></div></div></div></div><script>
(function(){
const SUPABASE_URL='https://moomommajyldjquncnrd.supabase.co';
const SUPABASE_KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH';
if(!globalThis.supabase)throw new Error('Supabase library kon nie laai nie.');
const db=globalThis.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let session=null,profile=null,roles=[];
async function hasRole(r){const q=await db.rpc('has_access_role',{p_role:r});if(q.error)throw q.error;return q.data===true}
async function start(s){session=s;try{roles=[];for(const r of ['admin','coach','parent'])if(await hasRole(r))roles.push(r);if(!roles.includes('parent'))throw Error('Hierdie rekening het nie Ouer-toegang nie.');const p=await db.from('user_profiles').select('full_name,active,mobile_phone,emergency_phone,relationship').eq('user_id',s.user.id).maybeSingle();if(p.error)throw p.error;if(!p.data||p.data.active===false)throw Error('Jou gebruikersprofiel is gedeaktiveer.');profile=p.data;$('auth').classList.add('hidden');$('denied').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='Welkom, '+(profile.full_name||s.user.email);$('roles').textContent='Toegang: '+roles.join(' • ');$('name').value=profile.full_name||'';$('phone').value=profile.mobile_phone||'';$('emergency').value=profile.emergency_phone||'';$('relationship').value=profile.relationship||'Ouer';await load()}catch(e){$('auth').classList.add('hidden');$('app').classList.add('hidden');$('denied').classList.remove('hidden');$('deniedMsg').textContent=e.message||String(e)}}
async function photoUrl(id){const r=await db.storage.from('player-photos').createSignedUrl('player-photos/'+id,3600);if(r.error)throw r.error;return r.data?.signedUrl||''}
async function openChildProfile(id){try{const r=await db.from('players').select('id,first_name,surname,team_id,active').eq('id',id).maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error('Kindprofiel kon nie gevind word nie.');const t=await db.from('teams').select('name,age_group').eq('id',r.data.team_id).maybeSingle();if(t.error)throw t.error;let url='';try{url=await photoUrl(id)}catch(_){}$('childTitle').textContent=((r.data.first_name||'')+' '+(r.data.surname||'')).trim();$('childBody').innerHTML='<div style="display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start"><div><img id="childPhoto" class="avatar-lg" src="'+esc(url)+'" style="display:'+(url?'block':'none')+'"><div id="photoPlaceholder" class="avatar-lg" style="display:'+(url?'none':'flex')+';align-items:center;justify-content:center;font-size:42px">👤</div></div><div style="flex:1;min-width:220px"><p><b>Span:</b> '+esc(t.data?.name||'Geen span')+'</p><p><b>Ouderdomsgroep:</b> '+esc(t.data?.age_group||'')+'</p><p><b>Status:</b> '+(r.data.active===false?'Gedeaktiveer':'Aktief')+'</p><div class="card" style="margin-top:16px;padding:16px;background:#f8fafc"><b>📷 Kind se foto</b><div class="photo-notice">ℹ️ <b>Foto is opsioneel.</b> Indien u ’n foto oplaai, kan dit deur die kind se <b>afrigter en Admin</b> gesien word. Indien u die foto privaat wil hou, moet u dit eerder <b>nie oplaai nie</b>.</div><input id="photoInput" type="file" accept="image/*"><div class="photo-actions"><button class="primary" id="uploadPhoto">📷 Laai foto op</button></div><p id="photoMsg" class="muted"></p></div></div></div>';$('childModal').classList.remove('hidden');$('uploadPhoto').onclick=async()=>{const f=$('photoInput').files?.[0];if(!f){$('photoMsg').textContent='Kies asseblief ’n foto.';return}if(f.size>8*1024*1024){$('photoMsg').textContent='Die foto moet kleiner as 8 MB wees.';return}const b=$('uploadPhoto');b.disabled=true;$('photoMsg').textContent='Laai foto op…';try{const up=await db.storage.from('player-photos').upload('player-photos/'+id,f,{upsert:true,contentType:f.type||'image/jpeg'});if(up.error)throw up.error;const u=await photoUrl(id);if(u){$('childPhoto').src=u;$('childPhoto').style.display='block';$('photoPlaceholder').style.display='none'}$('photoMsg').textContent='Foto suksesvol opgelaai. Die afrigter en Admin kan dit sien.';$('photoMsg').className='ok'}catch(e){$('photoMsg').textContent='Kon foto nie oplaai nie: '+(e.message||e);$('photoMsg').className='error'}finally{b.disabled=false}}}catch(e){alert(e.message||String(e))}}
async function load(){const r=await db.from('guardian_players').select('player_id,relationship,players(id,first_name,surname,team_id,teams(name,age_group))').eq('guardian_user_id',session.user.id);if(r.error)throw r.error;const kids=r.data||[];$('children').innerHTML=kids.length?kids.map(x=>'<div class="child"><b>'+esc(x.players?.first_name)+' '+esc(x.players?.surname)+'</b><div class="muted">'+esc(x.players?.teams?.name||'')+' · '+esc(x.players?.teams?.age_group||'')+' · '+esc(x.relationship||'')+'</div><div class="actions"><button type="button" class="primary child-profile-btn" data-player-id="'+esc(x.players?.id)+'">👤 Maak profiel oop</button></div></div>').join(''):'<p class="muted">Geen kinders is tans aan jou rekening gekoppel nie.</p>';document.querySelectorAll('.child-profile-btn').forEach(b=>b.addEventListener('click',()=>openChildProfile(b.dataset.playerId)));const teamIds=[...new Set(kids.map(x=>x.players?.team_id).filter(Boolean))],ages=[...new Set(kids.map(x=>x.players?.teams?.age_group).filter(Boolean))];if(!teamIds.length){$('matches').innerHTML='<p class="muted">Geen wedstryde.</p>';return}const m=await db.from('matches').select('id,age_group,team_a_id,team_b_id,match_date,match_time,venue,status').in('age_group',ages);if(m.error)throw m.error;const ids=[...new Set((m.data||[]).flatMap(x=>[x.team_a_id,x.team_b_id]).filter(Boolean))];let tm={};if(ids.length){const t=await db.from('teams').select('id,name').in('id',ids);if(t.error)throw t.error;(t.data||[]).forEach(x=>tm[x.id]=x.name)}const rows=(m.data||[]).filter(x=>teamIds.includes(x.team_a_id)||teamIds.includes(x.team_b_id));$('matches').innerHTML=rows.length?rows.map(x=>{const live=['LIVE','IN_PROGRESS','IN PROGRESS','PLAYING'].includes(String(x.status||'').toUpperCase());return '<div class="child"><b>'+(live?'🔴 LIVE':esc(x.status||'GESKEDULEER'))+'</b><div>'+esc(tm[x.team_a_id]||'Onbekend')+' vs '+esc(tm[x.team_b_id]||'Onbekend')+'</div><div class="muted">'+esc(x.match_date)+' '+esc(String(x.match_time||'').slice(0,5))+' · '+esc(x.venue||'')+'</div>'+(live?'<div class="actions"><button class="live" type="button" onclick="location.href=\'live-score.html?match='+encodeURIComponent(x.id)+'\'">🔴 Volg Regstreeks</button></div>':'')+'</div>'}).join(''):'<p class="muted">Geen geskeduleerde wedstryde.</p>'}
async function save(e){e.preventDefault();$('profileMsg').textContent='Stoor…';const r=await db.rpc('parent_update_own_profile',{p_full_name:$('name').value.trim(),p_mobile_phone:$('phone').value.trim(),p_emergency_phone:$('emergency').value.trim(),p_relationship:$('relationship').value});if(r.error){$('profileMsg').textContent=r.error.message;$('profileMsg').className='error';return}profile.full_name=$('name').value.trim();$('welcome').textContent='Welkom, '+profile.full_name;$('profileMsg').textContent='Jou besonderhede is suksesvol opgedateer.';$('profileMsg').className='ok'}
async function handleParentLogin(e){e.preventDefault();const msg=$('msg');try{msg.textContent='Meld aan…';msg.className='muted';const email=$('email').value.trim(),password=$('password').value;if(!email||!password){msg.textContent='Vul asseblief e-pos en wagwoord in.';msg.className='error';return}const r=await db.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(!r.data?.session)throw Error('Aanmelding het nie ’n sessie teruggestuur nie.');await start(r.data.session)}catch(e){msg.textContent=e.message||String(e);msg.className='error'}}
$('login').addEventListener('submit',handleParentLogin);$('profileForm').onsubmit=save;$('logout').onclick=()=>db.auth.signOut();$('closeChild').onclick=()=>$('childModal').classList.add('hidden');$('back').onclick=()=>{db.auth.signOut();$('denied').classList.add('hidden');$('auth').classList.remove('hidden')};db.auth.getSession().then(({data:{session}})=>session&&start(session)).catch(e=>console.error('Session error',e));
})();
</script></body></html>
