<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Admin Portaal V21</title><style>body{font-family:system-ui,sans-serif;background:#eef2f6;color:#172033;margin:0}.loading{max-width:700px;margin:15vh auto;background:#fff;border-radius:18px;padding:28px;box-shadow:0 3px 16px #0001}.error{color:#b42318}</style></head><body><div class="loading" id="loading"><h1>🔐 Admin Portaal V21</h1><p>Laai die volledige Admin-portaal…</p></div><script>(async()=>{try{const res=await fetch('admin-v20.html',{cache:'no-store'});if(!res.ok)throw new Error('Kon Admin V20 nie laai nie.');const html=await res.text();const doc=new DOMParser().parseFromString(html,'text/html');doc.title='Junior Krieket – Admin Portaal V21';const patch=doc.createElement('script');patch.textContent=String.raw`(function(){const q=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const badge=q('#auth .pill');if(badge)badge.textContent='ADMIN V21';const title=q('#app h1');if(title)title.textContent='🔐 Admin Portaal V21';const sec=document.getElementById('matches');if(!sec)return;const card=document.createElement('div');card.className='card';card.id='v21AssignCard';card.innerHTML='<h2>👤 Afrigter / Wedstryd-toewysing</h2><p class="muted">Wedstrydtoewysing word nou tydens wedstrydskepping gedoen. Die aparte toewysing hieronder bly beskikbaar vir bestaande wedstryde.</p><div class="grid"><div><label>Wedstryd</label><select id="v21Match"></select></div><div><label>Afrigter</label><select id="v21Coach"></select></div></div><div class="actions"><button class="primary" id="v21Assign">Ken Afrigter Toe</button></div><p id="v21Msg" class="small"></p></div>';sec.insertBefore(card,sec.children[1]);let coaches=[],matches=[],teams=[],venues=[];function msg(t,c){const e=q('#v21Msg');if(e){e.textContent=t;e.className='small '+(c||'info')}}async function loadCoaches(){const r=await db.from('user_profiles').select('user_id,full_name,active,role').eq('role','coach').eq('active',true).order('full_name');if(r.error)throw r.error;coaches=r.data||[];const opts='<option value="">— Kies afrigter —</option>'+coaches.map(c=>'<option value="'+esc(c.user_id)+'">'+esc(c.full_name||'Afrigter')+'</option>').join('');q('#v21Coach').innerHTML=opts;const createCoach=q('#v21CreateCoach');if(createCoach)createCoach.innerHTML=opts}async function loadMatches(){const r=await db.from('matches').select('*').order('match_date').order('match_time');if(r.error)throw r.error;matches=r.data||[];q('#v21Match').innerHTML='<option value="">— Kies wedstryd —</option>'+matches.map(m=>'<option value="'+esc(m.id)+'">'+esc(m.fixture_code||m.id.slice(0,8))+' · '+esc(m.match_date)+' '+esc(String(m.match_time||'').slice(0,5))+' · '+esc(m.age_group)+'</option>').join('')}async function assign(){const id=q('#v21Match').value,c=q('#v21Coach').value;if(!id||!c)return msg('Kies asseblief ’n wedstryd en afrigter.','error');const m=matches.find(x=>x.id===id);if(!m)return msg('Wedstryd nie gevind nie.','error');const ct=await db.from('coach_teams').select('team_id').eq('coach_user_id',c).eq('active',true);if(ct.error)return msg(ct.error.message,'error');const allowed=new Set((ct.data||[]).map(x=>x.team_id));if(!allowed.has(m.team_a_id)&&!allowed.has(m.team_b_id))return msg('Hierdie afrigter is nie aan Span A of Span B van hierdie wedstryd toegewys nie.','error');const r=await db.from('matches').update({coach_user_id:c}).eq('id',id);if(r.error)return msg(r.error.message,'error');msg('Afrigter suksesvol aan wedstryd toegewys.','success');await loadMatches()}async function installCreateCoach(){const a=q('#v20A'),b=q('#v20B'),age=q('#v20Age'),d=q('#v20Date'),t=q('#v20Time'),v=q('#v20Venue'),button=q('#v20Create');if(!a||!b||!button)return;const wrap=document.createElement('div');wrap.style.marginTop='12px';wrap.innerHTML='<label>Afrigter vir hierdie wedstryd</label><select id="v21CreateCoach"><option value="">— Kies afrigter —</option></select><p class="small muted">Kies slegs ’n aktiewe afrigter wat aan Span A of Span B gekoppel is.</p>';const grid=button.closest('.card')?.querySelector('.grid3');if(grid)grid.appendChild(wrap);await loadCoaches();const old=button.onclick;button.onclick=async function(){const c=q('#v21CreateCoach').value;if(!c)return msg('Kies asseblief die afrigter vir hierdie wedstryd.','error');const agev=age.value,av=a.value,bv=b.value,dv=d.value,tv=t.value,vv=v.value;if(!av||!bv||av===bv)return msg('Kies twee verskillende spanne.','error');if(!dv||!tv)return msg('Kies asseblief datum en tyd.','error');if(!vv)return msg('Kies asseblief ’n venue.','error');const ct=await db.from('coach_teams').select('team_id').eq('coach_user_id',c).eq('active',true);if(ct.error)return msg(ct.error.message,'error');const allowed=new Set((ct.data||[]).map(x=>x.team_id));if(!allowed.has(av)&&!allowed.has(bv))return msg('Die gekose afrigter is nie aan een van die twee gekose spanne toegewys nie.','error');const venueName=(window.v20Venues||[]).find?.(x=>x.id===vv)?.name||v.options[v.selectedIndex]?.text||'';const dup=await db.from('matches').select('id').eq('match_date',dv).eq('match_time',tv).or('and(team_a_id.eq.'+av+',team_b_id.eq.'+bv+'),and(team_a_id.eq.'+bv+',team_b_id.eq.'+av+')').limit(1);if(dup.error)return msg(dup.error.message,'error');if((dup.data||[]).length)return msg('Daar bestaan reeds ’n wedstryd tussen hierdie twee spanne op dieselfde datum en tyd.','error');const fixture='JK-'+dv.replaceAll('-','')+'-'+Math.random().toString(36).slice(2,7).toUpperCase();const ins=await db.from('matches').insert({fixture_code:fixture,age_group:agev,team_a_id:av,team_b_id:bv,match_date:dv,match_time:tv,venue:venueName,status:'SCHEDULED',coach_user_id:c});if(ins.error)return msg(ins.error.message,'error');msg('Wedstryd en afrigter suksesvol geskep.','success');['v20A','v20B','v20Date','v20Time','v21CreateCoach'].forEach(id=>{const e=q('#'+id);if(e)e.value=''});const refresh=q('#v20MatchRefresh');if(refresh)await refresh.click();await loadMatches()};if(old)button.dataset.v20Original='yes'}loadCoaches().then(installCreateCoach).then(loadMatches).catch(e=>msg(e.message,'error'));q('#v21Assign').onclick=assign;const tab=q('#tabs button[data-tab="matches"]');if(tab)tab.addEventListener('click',()=>setTimeout(()=>{loadCoaches().then(installCreateCoach).then(loadMatches).catch(e=>msg(e.message,'error'))},0))})();`;doc.body.appendChild(patch);document.open();document.write('<!doctype html>'+doc.documentElement.outerHTML);document.close()}catch(e){document.getElementById('loading').innerHTML='<h1>Admin V21</h1><p class="error">'+String(e.message||e)+'</p>'}})();</script></body></html>
