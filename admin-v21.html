<!doctype html>
<html lang="af">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Junior Krieket – Admin Portaal V21</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#eef2f6}
#v21Frame{display:block;width:100%;height:100%;min-height:100vh;border:0}
#v21Loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#eef2f6;font-family:system-ui,sans-serif;color:#172033;z-index:10}
#v21Loading .box{background:#fff;border-radius:18px;padding:28px;box-shadow:0 3px 16px #0001;max-width:700px;margin:20px}
#v21Loading .error{color:#b42318}
</style>
</head>
<body>
<div id="v21Loading"><div class="box"><h1>🔐 Admin Portaal V21</h1><p>Laai die volledige Admin-portaal…</p></div></div>
<iframe id="v21Frame" title="Junior Krieket Admin Portaal V21" src="admin-v17.html"></iframe>
<script>
(function(){
  const frame=document.getElementById('v21Frame');
  const loading=document.getElementById('v21Loading');
  let patched=false;

  function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

  async function patchV21(){
    if(patched)return;
    const w=frame.contentWindow;
    const d=frame.contentDocument;
    if(!w||!d)return;
    patched=true;

    // Create a real Supabase client in the iframe scope.
    // The V17 page keeps its client in a top-level const, which is not exposed as window.db.
    // V21 therefore must not use w.db; this client shares the same Supabase auth storage.
    const SUPABASE_URL='https://moomommajyldjquncnrd.supabase.co';
    const SUPABASE_KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH';
    if(!w.supabase||typeof w.supabase.createClient!=='function')throw new Error('Supabase-biblioteek kon nie laai nie.');
    const v21db=w.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

    const style=d.createElement('style');
    style.textContent=`
      .v21coach{grid-column:1/-1}
      .v21coach label{display:block;font-weight:700;margin-bottom:6px}
      .v21coach select{width:100%;box-sizing:border-box}
      .v21note{margin-top:7px}
    `;
    d.head.appendChild(style);

    const badge=d.querySelector('#auth .pill');
    if(badge)badge.textContent='ADMIN V21';
    const title=d.querySelector('#app h1');
    if(title)title.textContent='🔐 Admin Portaal V21';
    try{d.title='Junior Krieket – Admin Portaal V21'}catch(e){}

    const matches=d.getElementById('matches');
    const grid=matches?.querySelector('.grid3');
    const button=d.getElementById('createMatch');
    if(!grid||!button)return;

    let wrap=d.getElementById('v21CoachWrap');
    if(!wrap){
      wrap=d.createElement('div');
      wrap.className='v21coach';
      wrap.id='v21CoachWrap';
      wrap.innerHTML='<label for="v21Coach">Afrigter vir hierdie wedstryd</label><select id="v21Coach"><option value="">— Laai afrigters… —</option></select><p class="small muted v21note">Die afrigter moet reeds aan Span A of Span B toegewys wees.</p>';
      grid.appendChild(wrap);
    }

    const select=d.getElementById('v21Coach');
    try{
      const {data,error}=await v21db.from('user_profiles')
        .select('user_id,full_name,active,role')
        .eq('role','coach')
        .eq('active',true)
        .order('full_name');
      if(error)throw error;
      select.innerHTML='<option value="">— Kies afrigter —</option>'+((data||[]).map(c=>'<option value="'+esc(c.user_id)+'">'+esc(c.full_name||'Afrigter')+'</option>').join(''));
      const msg=d.getElementById('matchMsg');
      if(msg){msg.textContent='';msg.className='small'}
    }catch(e){
      select.innerHTML='<option value="">— Kon afrigters nie laai nie —</option>';
      const msg=d.getElementById('matchMsg');
      if(msg){msg.textContent='Kon afrigters nie laai nie: '+(e.message||e);msg.className='small error'}
    }

    const fresh=button.cloneNode(true);
    button.replaceWith(fresh);
    fresh.addEventListener('click',async function(e){
      e.preventDefault();
      e.stopPropagation();
      const age=d.getElementById('matchAge')?.value;
      const a=d.getElementById('matchA')?.value;
      const b=d.getElementById('matchB')?.value;
      const date=d.getElementById('matchDate')?.value;
      const time=d.getElementById('matchTime')?.value;
      const venue=d.getElementById('matchVenue')?.value;
      const coach=select.value;
      const notice=d.getElementById('matchMsg');
      const setMsg=(text,cls)=>{if(notice){notice.textContent=text;notice.className='small '+(cls||'')}};

      if(!coach)return setMsg('Kies asseblief ’n afrigter vir hierdie wedstryd.','error');
      if(!a||!b||a===b)return setMsg('Kies twee verskillende spanne.','error');
      if(!date||!time)return setMsg('Kies asseblief datum en tyd.','error');
      if(!venue)return setMsg('Kies asseblief ’n venue.','error');

      fresh.disabled=true;
      fresh.textContent='Skep wedstryd…';
      try{
        const {data:assignments,error:assignError}=await v21db.from('coach_teams')
          .select('team_id')
          .eq('coach_user_id',coach)
          .eq('active',true);
        if(assignError)throw assignError;
        const allowed=new Set((assignments||[]).map(x=>String(x.team_id)));
        if(!allowed.has(String(a))&&!allowed.has(String(b))){
          throw new Error('Die gekose afrigter is nie aan Span A of Span B toegewys nie.');
        }

        const venueName=d.getElementById('matchVenue')?.selectedOptions?.[0]?.textContent?.trim()||'';
        const fixture='JK-'+String(date).replaceAll('-','')+'-'+Math.random().toString(36).slice(2,7).toUpperCase();
        const matchTime=String(time).length===5?String(time)+':00':time;
        const {error}=await v21db.from('matches').insert({
          fixture_code:fixture,
          age_group:age,
          team_a_id:a,
          team_b_id:b,
          match_date:date,
          match_time:matchTime,
          venue:venueName,
          status:'SCHEDULED',
          coach_user_id:coach
        });
        if(error)throw error;

        setMsg('Wedstryd en afrigter suksesvol geskep.','success');
        ['matchA','matchB','matchDate','matchTime'].forEach(id=>{const x=d.getElementById(id);if(x)x.value=''});
        select.value='';
        if(typeof w.loadCore==='function')await w.loadCore();
        else if(typeof w.render==='function')w.render();
      }catch(err){
        setMsg('Kon wedstryd nie skep nie: '+(err.message||err),'error');
      }finally{
        fresh.disabled=false;
        fresh.textContent='Skep Wedstryd';
      }
    });
  }

  frame.addEventListener('load',async function(){
    loading.style.display='none';
    try{await patchV21()}catch(e){
      loading.style.display='flex';
      loading.querySelector('.box').innerHTML='<h1>Admin V21</h1><p class="error">Kon V21 nie voltooi laai nie: '+String(e.message||e)+'</p>';
    }
  });
})();
</script>
</body>
</html>
