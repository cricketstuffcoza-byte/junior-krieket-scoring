<!doctype html>
<html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Admin Portaal V21</title><style>body{font-family:system-ui,sans-serif;background:#eef2f6;color:#172033;margin:0}.loading{max-width:700px;margin:15vh auto;background:#fff;border-radius:18px;padding:28px;box-shadow:0 3px 16px #0001}.error{color:#b42318}</style></head><body><div class="loading" id="loading"><h1>🔐 Admin Portaal V21</h1><p>Laai die volledige Admin-portaal…</p></div><script>(async()=>{try{const res=await fetch('admin-v20.html',{cache:'no-store'});if(!res.ok)throw new Error('Kon Admin V20 nie laai nie.');const html=await res.text();const doc=new DOMParser().parseFromString(html,'text/html');doc.title='Junior Krieket – Admin Portaal V21';const patch=doc.createElement('script');patch.textContent=String.raw`(function(){const b=document.querySelector('#auth .pill');if(b)b.textContent='ADMIN V21';const h=document.querySelector('#app h1');if(h)h.textContent='🔐 Admin Portaal V21';const sec=document.getElementById('matches');if(!sec)return;const old=sec.innerHTML;sec.innerHTML=old.replace('</div></section>','</div></section>');const card=document.createElement('div');card.className='card';card.innerHTML='<h2>👤 Afrigter / Wedstryd-toewysing</h2><p class="muted">Ken ’n aktiewe afrigter aan ’n spesifieke wedstryd toe. Die afrigter sal later slegs wedstryde vir sy toegewysde span/ne sien.</p><div class="grid"><div><label>Wedstryd</label><select id="v21Match"></select></div><div><label>Afrigter</label><select id="v21Coach"></select></div></div><div class="actions"><button class="primary" id="v21Assign">Ken Afrigter Toe</button></div><p id="v21Msg" class="small"></p></div>';sec.insertBefore(card,sec.children[1]);let coaches=[],matches=[];const q=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function msg(t,c){const e=q('#v21Msg');e.textContent=t;e.className='small '+(c||'info')}async function load(){const [mr,cr]=await Promise.all([db.from('matches').select('*').order('match_date').order('match_time'),db.from('user_profiles').select('user_id,full_name,active,role').eq('role','coach').eq('active',true).order('full_name')]);if(mr.error)throw mr.error;if(cr.error)throw cr.error;matches=mr.data||[];coaches=cr.data||[];q('#v21Match').innerHTML='<option value="">— Kies wedstryd —</option>'+matches.map(m=>'<option value="'+esc(m.id)+'">'+esc(m.fixture_code||m.id.slice(0,8))+' · '+esc(m.match_date)+' '+esc(String(m.match_time||'').slice(0,5))+' · '+esc(m.age_group)+'</option>').join('');q('#v21Coach').innerHTML='<option value="">— Kies afrigter —</option>'+coaches.map(c=>'<option value="'+esc(c.user_id)+'">'+esc(c.full_name||'Afrigter')+'</option>').join('')}async function assign(){const id=q('#v21Match').value,c=q('#v21Coach').value;if(!id||!c)return msg('Kies asseblief ’n wedstryd en afrigter.','error');const m=matches.find(x=>x.id===id);if(!m)return msg('Wedstryd nie gevind nie.','error');const linked=coaches.find(x=>x.user_id===c);const teamsForCoach=await db.from('coach_teams').select('team_id').eq('coach_user_id',c).eq('active',true);if(teamsForCoach.error)return msg(teamsForCoach.error.message,'error');const allowed=new Set((teamsForCoach.data||[]).map(x=>x.team_id));if(!allowed.has(m.team_a_id)&&!allowed.has(m.team_b_id))return msg('Hierdie afrigter is nie aan Span A of Span B van hierdie wedstryd toegewys nie.','error');const {error}=await db.from('matches').update({coach_user_id:c}).eq('id',id);if(error)return msg(error.message,'error');msg('Afrigter suksesvol aan wedstryd toegewys.','success');await load();}q('#v21Assign').onclick=assign;const tab=document.querySelector('#tabs button[data-tab="matches"]');if(tab)tab.addEventListener('click',()=>setTimeout(()=>load().catch(e=>msg(e.message,'error')),0));load().catch(e=>msg(e.message,'error'));})();`;doc.body.appendChild(patch);document.open();document.write('<!doctype html>'+doc.documentElement.outerHTML);document.close()}catch(e){document.getElementById('loading').innerHTML='<h1>Admin V21</h1><p class="error">'+String(e.message||e)+'</p>'}})();</script></body></html>
