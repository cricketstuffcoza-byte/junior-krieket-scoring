<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Ouerportaal</title><style>html,body{margin:0;height:100%;background:#eef2f6}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="portal" src="parent-v3.html?v=homework4" title="Ouerportaal"></iframe><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){const U='https://moomommajyldjquncnrd.supabase.co',K='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH',db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),frame=document.getElementById('portal'),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[m]));let injected=false;const doc=()=>frame.contentDocument||frame.contentWindow.document;async function load(){const d=doc(),app=d.getElementById('app');if(!app||injected||app.classList.contains('hidden'))return;injected=true;const s=d.createElement('section');s.id='homeworkCard';s.className='card';s.innerHTML='<div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h2 style="margin:0">🏠 My kinders se huiswerk</h2><p class="muted" style="margin:5px 0 0">Ouderdom- en vaardigheidsvlak-spesifieke oefeninge wat deur die afrigter toegeken is.</p></div><button id="hwRefresh" class="ghost" type="button">↻ Verfris</button></div><div id="hwList" style="margin-top:12px"><p class="muted">Laai huiswerk…</p></div>';app.insertBefore(s,app.lastElementChild);d.getElementById('hwRefresh').onclick=()=>render(d);await render(d)}async function render(d){const box=d.getElementById('hwList');if(!box)return;box.innerHTML='<p class="muted">Laai huiswerk…</p>';const q=await db.rpc('parent_list_homework');if(q.error){box.innerHTML='<p class="error">Kon huiswerk nie laai nie: '+esc(q.error.message)+'</p>';return}const rows=q.data||[];if(!rows.length){box.innerHTML='<p class="muted">Geen huiswerk is tans toegeken nie.</p>';return}box.innerHTML=rows.map(x=>{const done=!!x.completed_at;const level=x.difficulty||'Maklik';return '<div style="border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:10px 0;background:'+(done?'#f0fdf4':'#fff')+'"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><h3 style="margin:0">'+esc(x.player_name)+'</h3><p style="margin:5px 0"><b>'+esc(x.title)+'</b> <span style="display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2f7;font-size:12px;font-weight:800">'+esc(x.duration_minutes)+' minute</span> <span style="display:inline-block;padding:4px 8px;border-radius:999px;background:#f4f4f5;font-size:12px;font-weight:800">'+esc(level)+'</span></p><p class="muted" style="margin:6px 0">'+esc(x.category)+'</p><p style="margin:8px 0;line-height:1.5">'+esc(x.instructions)+'</p><p class="muted" style="margin:6px 0;font-size:12px">Toegedien: '+esc(new Date(x.assigned_at).toLocaleString('af-ZA'))+'</p></div><label style="min-width:120px;text-align:center;cursor:pointer"><input type="checkbox" data-hwid="'+esc(x.id)+'" '+(done?'checked':'')+' style="width:28px;height:28px"><div style="font-weight:900;color:'+(done?'#067647':'#b42318')+'">'+(done?'✓ Gedoen':'Nog nie gedoen')+'</div></label></div></div>'}).join('');d.querySelectorAll('[data-hwid]').forEach(cb=>cb.onchange=async()=>{cb.disabled=true;const r=await db.rpc('parent_complete_homework',{p_homework_id:cb.dataset.hwid,p_completed:cb.checked});if(r.error){cb.checked=!cb.checked;alert(r.error.message);cb.disabled=false;return}await render(d)})}frame.addEventListener('load',()=>{setInterval(()=>load(),1000)});})();</script></body></html>
