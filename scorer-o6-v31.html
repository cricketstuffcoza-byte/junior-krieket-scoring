<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – O/6 Telkaart V31</title><style>html,body{margin:0;background:#eef2f6;width:100%;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="score" title="Junior Krieket O/6 Telkaart"></iframe><script>
'use strict';
const q=location.search,outer=document.getElementById('score');outer.src='scorer-o6-v30.html'+q+'&fix=v31';
function innerDoc(){try{const d=outer.contentDocument;if(!d)return null;const f=d.getElementById('frame');return f&&f.contentDocument?f.contentDocument:null}catch(e){return null}}
function innerWin(){try{const d=outer.contentDocument,f=d&&d.getElementById('frame');return f&&f.contentWindow?f.contentWindow:null}catch(e){return null}}
function cleanName(n){return String(n||'').trim().replace(/ ✓.*$/,'')}
function makePdf(){try{const d=innerDoc(),w=innerWin(),s=w&&w.__juniorState;if(!d||!s)return alert('Die wedstryddata is nog nie gereed nie.');const team=s.score?.[s.batting]||{};const opp=s.score?.[s.batting===s._teamA?s._teamB:s._teamA]||{};const rows=Object.values(s.bats||{}).filter(x=>x&&x.name).map(x=>`<tr><td>${x.name}</td><td>${x.runs||0}</td><td>${x.balls||0}</td><td>${x.unplayable||0}</td><td>${x.catches||0}</td><td>${x.runOuts||0}</td><td>${x.dismissals||0}</td></tr>`).join('');const bowl=Object.values(s.bowlers||{}).filter(x=>x&&x.name).map(x=>`<tr><td>${x.name}</td><td>${x.runs||0}</td><td>${x.legalBalls||0}</td><td>${x.wickets||0}</td><td>${x.wides||0}</td><td>${x.noBalls||0}</td></tr>`).join('');const title='Junior Krieket – '+(s.batting||'Wedstryd')+' – Innings '+s.innings;const p=window.open('','_blank');if(!p)return alert('Laat asseblief pop-ups toe vir die PDF.');p.document.write(`<!doctype html><html lang="af"><head><meta charset="utf-8"><title>${title}</title><style>body{font-family:Arial,sans-serif;padding:28px;color:#172033}h1{margin-bottom:4px}h2{margin-top:24px;border-bottom:1px solid #ccc;padding-bottom:6px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.box{border:1px solid #ccc;border-radius:8px;padding:10px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #ccc;padding:7px;text-align:center}th:first-child,td:first-child{text-align:left}.muted{color:#666}@media print{body{padding:12px}}</style></head><body><h1>${title}</h1><div class="muted">Datum: ${d.querySelector('#tossWinner')?.value||''} ${location.pathname}</div><div class="summary"><div class="box"><b>${s.batting||''}</b><br>${team.runs||0}/${team.wickets||0}</div><div class="box"><b>Overs</b><br>${Math.floor((team.legalBalls||0)/8)}.${(team.legalBalls||0)%8}</div><div class="box"><b>Onspeelbaar</b><br>${team.unplayable||0}</div><div class="box"><b>Coach Throws</b><br>${team.coach||0} (${team.coachRuns||0} lopies)</div></div><h2>Kolwer-statistieke</h2><table><tr><th>Speler</th><th>Lopies</th><th>Speelbaar</th><th>Onspeelbaar</th><th>Catches</th><th>Run Outs</th><th>Uit</th></tr>${rows}</table><h2>Bouler-statistieke</h2><table><tr><th>Bouler</th><th>Lopies teen</th><th>Geldige balle</th><th>Paaltjies</th><th>Wydes</th><th>No-balls</th></tr>${bowl}</table><h2>Huidige wedstrydstatus</h2><p>Kolpaar: ${s.pair||0} | Paar balle: ${s.pairBalls||0}/16 | Face: ${s.striker||'—'} | Hardloper: ${s.nonStriker||'—'} | Bouler: ${s.bowler||'—'}</p><p class="muted">Gegenereer: ${new Date().toLocaleString('af-ZA')}</p></body></html>`);p.document.close();p.focus();setTimeout(()=>p.print(),400)}catch(e){alert('Kon nie die PDF voorberei nie: '+(e.message||e))}}
function patch(){try{const d=innerDoc(),w=innerWin(),s=w&&w.__juniorState;if(!d||!w||!s)return;
/* MANUAL STRIKE SWAP */
const strikerBox=d.getElementById('striker')?.closest('.card');if(strikerBox&&!d.getElementById('swapStrike')){const b=d.createElement('button');b.id='swapStrike';b.type='button';b.className='btn';b.textContent='🔄 RUIL STRIKE';b.style.marginTop='8px';b.addEventListener('click',()=>{if(!s.started||s.completed||!s.striker||!s.nonStriker)return;if(s.pendingDismissal||s.pendingFielder||s.pendingNewBatter||s.pendingCoachThrow||s.pairLimitAccepted)return; if(typeof w.snapshot==='function')w.snapshot();[s.striker,s.nonStriker]=[s.nonStriker,s.striker];if(typeof w.render==='function')w.render()});strikerBox.appendChild(b)}
/* INNINGS PDF */
const ip=d.getElementById('inningsPanel');if(ip&&!ip.classList.contains('hidden')&&!d.getElementById('inningsPdf')){const b=d.createElement('button');b.id='inningsPdf';b.type='button';b.className='primary';b.textContent='📄 STAAK / PDF – INNINGS '+s.innings;b.style.width='100%';b.style.marginTop='10px';b.addEventListener('click',makePdf);ip.appendChild(b)}
/* PDF always available after innings 1 */
const actions=d.querySelector('.actions');if(actions&&!d.getElementById('matchPdf')){const b=d.createElement('button');b.id='matchPdf';b.type='button';b.className='btn';b.textContent='📄 PDF VAN HUIDIGE WEDSTRYD';b.addEventListener('click',makePdf);actions.appendChild(b)}
}catch(e){console.warn('O/6 v31 patch',e)}}
setInterval(patch,250);outer.addEventListener('load',()=>setTimeout(patch,350));
</script></body></html>
