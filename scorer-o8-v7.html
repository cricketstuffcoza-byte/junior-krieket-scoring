<!doctype html>
<html lang="af">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Junior Krieket – O/8 T80 V7</title>
<style>html,body,#f{margin:0;width:100%;height:100%;border:0}#f{display:block}#m{font:700 16px system-ui;padding:24px;color:#172033}</style>
</head>
<body>
<div id="m">Laai O/8 telkaart V7…</div><iframe id="f" style="display:none"></iframe>
<script>
(async()=>{
'use strict';
const p=new URLSearchParams(location.search),matchId=p.get('match'),frame=document.getElementById('f');
if(!matchId){document.getElementById('m').textContent='Geen wedstryd-ID verskaf nie.';return}
frame.src='./Telkaart-O8-ALPHA-OMEGA-V7-1.html?match='+encodeURIComponent(matchId);
frame.onload=()=>{
  document.getElementById('m').style.display='none';frame.style.display='block';
  let inner=frame.contentWindow;
  function waitForV2(){
    const v2=inner.document.querySelector('iframe');
    if(!v2){setTimeout(waitForV2,100);return}
    v2.addEventListener('load',()=>install(v2),{once:true});
    if(v2.contentDocument && v2.contentDocument.readyState==='complete') install(v2);
  }
  function install(v2){
    const d=v2.contentDocument,w=v2.contentWindow;
    if(!d||d.getElementById('o8AvailabilityOverlay'))return;
    const style=d.createElement('style');
    style.textContent=`#o8AvailabilityOverlay{position:fixed;inset:0;background:rgba(238,242,246,.98);z-index:999999;overflow:auto;padding:24px;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033}#o8AvailabilityOverlay .av-card{max-width:1180px;margin:0 auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 3px 15px #0001}#o8AvailabilityOverlay h1{margin:0 0 8px}#o8AvailabilityOverlay h2{margin:18px 0 8px}.av-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.av-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.av-player{padding:12px;border:1px solid #d6dce4;border-radius:10px;background:#f6f8fa;font-weight:800;cursor:pointer}.av-player.sel{outline:3px solid #4d8fca;background:#e7f2fc}.av-note{padding:12px;border-radius:10px;background:#eaf4ff;border:1px solid #9fc5e8;font-weight:700}.av-warn{padding:12px;border-radius:10px;background:#fff3e1;border:1px solid #e5c59c;margin-top:12px}.av-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}.av-btn{border:0;border-radius:10px;padding:13px 18px;font-weight:900;background:#172033;color:#fff;cursor:pointer}.av-btn:disabled{opacity:.45;cursor:not-allowed}.av-error{color:#b42318;font-weight:800;margin-top:10px}@media(max-width:800px){.av-grid{grid-template-columns:1fr}.av-list{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.av-list{grid-template-columns:1fr}}`;
    d.head.appendChild(style);
    const ov=d.createElement('div');ov.id='o8AvailabilityOverlay';d.body.appendChild(ov);
    const sup=w.supabase||null;
    const SUPABASE_URL='https://moomommajyldjquncnrd.supabase.co',SUPABASE_KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH';
    const client=sup?.createClient?sup.createClient(SUPABASE_URL,SUPABASE_KEY):null;
    let teams=[],players=[],availableA=new Set(),availableB=new Set(),phase=1;
    async function load(){
      if(!client){ov.innerHTML='<div class="av-card"><h2>Fout</h2><div class="av-error">Supabase kon nie gelaai word nie.</div></div>';return}
      const mr=await client.from('matches').select('id,team_a_id,team_b_id').eq('id',matchId).single();
      if(mr.error)throw mr.error;
      const pr=await client.from('players').select('id,first_name,surname,team_id,active').in('team_id',[mr.data.team_a_id,mr.data.team_b_id]).eq('active',true).order('first_name');
      if(pr.error)throw pr.error;
      teams=[{id:mr.data.team_a_id,name:'Span A'},{id:mr.data.team_b_id,name:'Span B'}];
      players=pr.data||[];
      const sr=await client.from('live_match_state').select('innings_no,state_json').eq('match_id',matchId).maybeSingle();
      if(!sr.error && sr.data?.innings_no>=2) phase=2;
      render();
    }
    function nm(x){return [x.first_name,x.surname].filter(Boolean).join(' ')}
    function render(){
      const A=players.filter(x=>x.team_id===teams[0].id),B=players.filter(x=>x.team_id===teams[1].id);
      ov.innerHTML=`<div class="av-card"><h1>👥 ${phase===1?'1ste':'2de'} innings — Beskikbare spelers</h1><div class="av-note">Bevestig watter spelers <b>vandag vir hierdie innings</b> beskikbaar is. Kies minstens 2 spelers per span. Hierdie bevestiging word apart vir elke innings gedoen.</div><div class="av-grid"><section><h2>${teams[0].name}</h2><div class="av-list">${A.map(x=>`<button type="button" class="av-player ${availableA.has(x.id)?'sel':''}" data-p="${x.id}">${nm(x)}</button>`).join('')}</div></section><section><h2>${teams[1].name}</h2><div class="av-list">${B.map(x=>`<button type="button" class="av-player ${availableB.has(x.id)?'sel':''}" data-p="${x.id}">${nm(x)}</button>`).join('')}</div></section></div><div class="av-warn">${phase===1?'Hierdie lys word vir die 1ste innings gebruik.':'Hierdie is ’n nuwe beskikbaarheidsbevestiging vir die 2de innings en kan van innings 1 verskil.'}</div><div class="av-actions"><button id="o8ConfirmAvail" class="av-btn" disabled>BEVESTIG BESKIKBARE SPELERS</button><span id="o8AvailMsg" class="av-error"></span></div></div>`;
      ov.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const id=b.dataset.p, s=players.find(x=>x.id===id)?.team_id===teams[0].id?availableA:availableB;s.has(id)?s.delete(id):s.add(id);render();});
      const btn=ov.querySelector('#o8ConfirmAvail');btn.disabled=availableA.size<2||availableB.size<2;btn.onclick=confirm;
    }
    function filterChoices(){
      const ids=new Set([...availableA,...availableB]);
      ['batChoices','openingChoices','bowlChoices','newBatterChoices','newWicketChoices','newBowlerChoices'].forEach(id=>{
        const el=d.getElementById(id);if(!el)return;
        el.querySelectorAll('button[data-id]').forEach(b=>{b.style.display=ids.has(b.dataset.id)?'':'none'});
      });
    }
    function confirm(){
      const ids=[...availableA,...availableB];
      try{localStorage.setItem('o8-v7-avail-'+matchId+'-'+phase,JSON.stringify(ids))}catch(e){}
      ov.remove();
      filterChoices();
      if(phase===1){
        const start=d.getElementById('start');
        if(start){start.dataset.o8AvailConfirmed='1';start.click();}
      } else {
        const startSecond=d.getElementById('startSecond');
        if(startSecond){startSecond.dataset.o8AvailConfirmed='1';startSecond.click();}
      }
    }
    const start=d.getElementById('start');
    if(start)start.addEventListener('click',e=>{if(!start.dataset.o8AvailConfirmed){e.preventDefault();e.stopImmediatePropagation();return}},true);
    const startSecond=d.getElementById('startSecond');
    if(startSecond)startSecond.addEventListener('click',e=>{if(!startSecond.dataset.o8AvailConfirmed){e.preventDefault();e.stopImmediatePropagation();return}},true);
    if(startSecond)startSecond.addEventListener('click',()=>{if(startSecond.dataset.o8AvailConfirmed==='1'){setTimeout(()=>{phase=2;availableA=new Set();availableB=new Set();if(!d.getElementById('o8AvailabilityOverlay')){d.body.appendChild(ov);render()}},80)}});
    const mo=new MutationObserver(()=>filterChoices());mo.observe(d.body,{childList:true,subtree:true});
    load().catch(e=>{ov.innerHTML='<div class="av-card"><h2>Kan spelers nie laai nie</h2><div class="av-error">'+String(e.message||e)+'</div></div>'});
  }
  waitForV2();
};
})();
</script></body></html>
