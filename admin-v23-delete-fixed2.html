 v17=v17f.contentWindow,d=v17f.contentDocument;if(!d)return null;const box=d.getElementById('matchTable');if(!box)return null;return{v23,v21,v17,d,box}}catch(e){return null}}async function install(){const x=getDeep();if(!x)return false;const{v17,d,box}=x;let sb;try{sb=v17.supabase?.createClient(URL,KEY)||outer.contentWindow.supabase?.createClient(URL,KEY)}catch(e){sb=null}if(!sb)return false;async function render(){if(running)return;running=true;try{const{data,error}=await sb.from('matches').select('id,fixture_code,age_group,match_date,match_time,venue,status,result_type,result_reason,team_a_id,team_b_id,teams_a:teams!matches_team_a_id_fkey(name),teams_b:teams!matches_team_b_id_fkey(name)').order('match_date',{ascending:false}).order('match_time',{ascending:false}).limit(200);if(error){box.innerHTML='<div class="status error">Kon wedstrydlys nie laai nie: '+esc(error.message)+'</div>';return}const rows=(data||[]).map(m=>{const a=m.teams_a?.name||'Onbekend',b=m.teams_b?.name||'Onbekend',r=[m.result_type,m.result_reason].filter(Boolean).join(' ')||'—';return '<tr><td>'+esc(m.match_date||'—')+'</td><td>'+esc(a)+' vs '+esc(b)+'</td><td>'+esc(m.venue||'—')+'</td><td>'+esc(m.status||'—')+'</td><td>'+esc(r)+'</td><td class="rowactions"><button class="danger mini" type="button" data-fixed-delete2="'+esc(m.id)+'">🗑️ Delete</button></td></tr>'}).join('');if(observer)observer.disconnect();box.innerHTML='<table><thead><tr><th>Datum</th><th>Wedstryd</th><th>Venue</th><th>Status</th><th>Uitslag/status</th><th>Aksies</th></tr></thead><tbody>'+(rows||'<tr><td colspan="6">Geen wedstryde.</td></tr>')+'</tbody></table>';box.querySelectorAll('[data-fixed-delete2]').forEach(btn=>btn.addEventListener('click',async function(){const id=this.dataset.fixedDelete2,row=this.closest('tr');const name=row?.children?.[1]?.textContent||'Hierdie wedstryd',date=row?.children?.[0]?.textContent||'';if(!v17.confirm('DELETE hierdie wedstryd?\n\n'+name+'\n'+date+'\n\nAlle gekoppelde scorer-data vir hierdie wedstryd sal ook verwyder word.\n\nHierdie aksie kan nie ongedaan gemaak word nie.'))return;this.disabled=true;this.textContent='Deleting…';const{error}=await sb.from('matches').delete().eq('id',id);if(error){this.disabled=false;this.textContent='🗑️ Delete';v17.alert('Kon wedstryd nie delete nie:\n'+error.message);return}await render();flash('Wedstryd suksesvol gedelete.')}));if(observer)observer.observe(box,{childList:true,subtree:true});}finally{running=false}}try{Object.defineProperty(v17,'refreshMatchList',{configurable:true,get:function(){return render},set:function(){}})}catch(e){try{v17.refreshMatchList=render}catch(_){} }await render();if(observer)observer.disconnect();observer=new MutationObserver(()=>{if(running)return;const buttons=box.querySelectorAll('[data-fixed-delete2]');if(!buttons.length)setTimeout(render,0)});observer.observe(box,{childList:true,subtree:true});d.querySelectorAll('#tabs button').forEach(t=>{if(!t.dataset.deleteFix2){t.dataset.deleteFix2='1';t.addEventListener('click',()=>{if(t.dataset.tab==='matches')setTimeout(render,50)})}});flash('Delete-funksie permanent aktief');return true}async function boot(){for(let i=0;i<240;i++){if(await install())return;await new Promise(r=>setTimeout(r,250))}}outer.addEventListener('load',boot);boot()})();</script></body></html>
