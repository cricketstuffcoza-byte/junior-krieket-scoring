<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – O/6 Telkaart V29</title><style>html,body{margin:0;background:#eef2f6;width:100%;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="score" title="Junior Krieket O/6 Telkaart"></iframe><script>'use strict';const q=location.search,outer=document.getElementById('score');outer.src='scorer-o6-v27.html'+q+'&fix=finalpair';const U='https://moomommajyldjquncnrd.supabase.co',K='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH';let bowlingRoster=[];const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function loadRoster(){try{const id=new URLSearchParams(location.search).get('match');if(!id)return;const H={apikey:K,Authorization:'Bearer '+K};const mr=await fetch(U+'/rest/v1/matches?id=eq.'+encodeURIComponent(id)+'&select=team_a_id,team_b_id,first_batting_team_id',{headers:H,cache:'no-store'});if(!mr.ok)return;const m=(await mr.json())[0];if(!m)return;const bowlingId=m.first_batting_team_id===m.team_a_id?m.team_b_id:m.first_batting_team_id===m.team_b_id?m.team_a_id:null;if(!bowlingId)return;const pr=await fetch(U+'/rest/v1/players?team_id=eq.'+encodeURIComponent(bowlingId)+'&select=first_name,surname,active&order=first_name.asc',{headers:H,cache:'no-store'});if(!pr.ok)return;bowlingRoster=(await pr.json()).filter(p=>p.active!==false).map(p=>[p.first_name,p.surname].filter(Boolean).join(' ').trim()).filter(Boolean)}catch(e){}}function innerDoc(){try{const d=outer.contentDocument;if(!d)return null;const f=d.getElementById('frame');return f&&f.contentDocument?f.contentDocument:null}catch(e){return null}}function innerWin(){try{const d=outer.contentDocument,f=d&&d.getElementById('frame');return f&&f.contentWindow?f.contentWindow:null}catch(e){return null}}function collectPreviousBowlers(d,s){const out=new Set();const add=n=>{n=String(n||'').trim();if(n)out.add(n)};try{const bs=d.getElementById('bowlStats');if(bs)bs.querySelectorAll('tr').forEach((tr,i)=>{if(i>0)add(tr.children[0]?.textContent)})}catch(e){}const walk=v=>{if(!v||typeof v!=='object')return;if(Array.isArray(v)){v.forEach(walk);return}Object.keys(v).forEach(k=>{const val=v[k];if(k==='bowler'||k==='bowlerName'||k==='bowler_name')add(val);else if(k==='bowler_id'&&typeof val==='string'){}if(val&&typeof val==='object')walk(val)})};try{walk(s?.log)}catch(e){}return [...out]}function patch(){try{const d=innerDoc(),w=innerWin(),s=w&&w.__juniorState;if(!d||!w||!s)return;/* FINAL BATTER PAIR: restore current pair players */if(Number(s.pairBalls)===16){const panel=d.getElementById('pairPanel'),choices=d.getElementById('pairChoices');if(panel&&!panel.classList.contains('hidden')&&choices){[s.striker,s.nonStriker].filter(Boolean).forEach(name=>{if(![...choices.children].some(b=>b.textContent.trim()===name)){const b=d.createElement('button');b.type='button';b.className='btn choice';b.textContent=name;b.addEventListener('click',()=>{if(b.disabled)return;const i=s.selectedPair.indexOf(name);if(i>=0)s.selectedPair.splice(i,1);else if(s.selectedPair.length<2)s.selectedPair.push(name);[...choices.children].forEach(x=>x.classList.toggle('selected',s.selectedPair.includes(x.textContent.trim())));const c=d.getElementById('confirmPair');if(c)c.disabled=s.selectedPair.length!==2});choices.appendChild(b)}});[...choices.children].forEach(x=>x.classList.toggle('selected',s.selectedPair.includes(x.textContent.trim())))}}/* FINAL BOWLER EXCEPTION: when exactly one fresh bowler remains, allow previous bowlers again */const bp=d.getElementById('bowlerPanel'),bc=d.getElementById('bowlerChoices');if(bp&&!bp.classList.contains('hidden')&&bc&&bc.children.length===1){const current=String(s.bowler||'').trim();const previous=collectPreviousBowlers(d,s);const names=[...new Set(previous.concat(bowlingRoster))].filter(n=>n&&n!==current);names.forEach(name=>{if([...bc.children].some(b=>b.textContent.trim()===name))return;const b=d.createElement('button');b.type='button';b.className='btn choice';b.textContent=name;b.addEventListener('click',()=>{[...bc.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected');s.selectedBowler=name;const c=d.getElementById('confirmBowler');if(c)c.disabled=false});bc.appendChild(b)});const msg=d.getElementById('bowlerMessage');if(msg&&!msg.dataset.finalBowlerFix){msg.textContent='Laaste nuwe bouler: jy kan die laaste nuwe bouler kies, of enige vorige bouler wat reeds geboul het. Kies een en bevestig.';msg.dataset.finalBowlerFix='1'}}/* RESTORE SAVE BUTTON */const actions=d.querySelector('.actions');if(actions&&!d.getElementById('saveMatch')){const b=d.createElement('button');b.id='saveMatch';b.type='button';b.className='btn';b.textContent='💾 STOOR HUIDIGE WEDSTRYD';b.addEventListener('click',()=>{try{const id=new URLSearchParams(location.search).get('match');const key='junior_krieket_v19_saved_'+id;const x={savedAt:new Date().toISOString(),state:w.__juniorState};localStorage.setItem(key,JSON.stringify(x));b.textContent='✓ GESTOOR';setTimeout(()=>b.textContent='💾 STOOR HUIDIGE WEDSTRYD',1800)}catch(e){alert('Kon nie die huidige wedstryd stoor nie: '+(e.message||e))}});actions.appendChild(b)}}catch(e){console.warn('O/6 v29 patch',e)}}loadRoster();setInterval(patch,250);outer.addEventListener('load',()=>{setTimeout(patch,300);const d=outer.contentDocument,f=d&&d.getElementById('frame');if(f)f.addEventListener('load',()=>setTimeout(patch,300))});</script></body></html>
