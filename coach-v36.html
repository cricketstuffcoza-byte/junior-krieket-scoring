<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Junior Krieket – Afrigter Portaal V36</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,sans-serif;background:#eef2f6;color:#172033;margin:0}.wrap{max-width:1180px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}label{display:block;font-weight:800;margin-bottom:6px}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd3dc;border-radius:10px}button{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#172033;color:#fff}.ghost{background:#eef2f6}.hidden{display:none!important}.muted{color:#667085}.error{color:#b42318}.success{color:#087443}.fixture{border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:10px 0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#edf2f7;font-size:12px;font-weight:800}.hero{min-height:280px;border-radius:20px;background-size:cover;background-position:center;position:relative;overflow:hidden;display:flex;align-items:flex-end;color:#fff;margin-bottom:14px}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 25%,rgba(0,0,0,.78))}.heroInner{position:relative;padding:24px;display:flex;align-items:center;gap:18px;width:100%;box-sizing:border-box}.logo{width:92px;height:92px;border-radius:50%;object-fit:cover;background:#fff;border:3px solid #fff}@media(max-width:800px){.grid,.grid3{grid-template-columns:1fr}.hero{min-height:230px}}</style></head><body><div class="wrap"><section id="auth" class="card"><h1>🧑‍🏫 Afrigter Portaal V36</h1><p class="muted">Meld aan met jou Junior Krieket-rekening.</p><form id="login"><div class="grid"><div><label>E-pos</label><input id="email" type="email" autocomplete="username" required></div><div><label>Wagwoord</label><input id="password" type="password" autocomplete="current-password" required></div></div><div class="actions"><button id="loginBtn" class="primary" type="submit">Meld Aan</button></div></form><p id="msg" class="muted"></p></section><section id="denied" class="card hidden"><h2>🔒 Geen Afrigter-toegang</h2><p id="deniedMsg"></p><button class="ghost" id="back">Meld aan met ander rekening</button></section><main id="app" class="hidden"><section class="card"><h1>🧑‍🏫 Afrigter Portaal</h1><p id="welcome" class="muted"></p><button class="ghost" id="logout">Teken uit</button></section><section class="card"><h2>📅 My wedstryde</h2><div id="fixtures"></div></section></main></div><script>(function(){const URL='https://moomommajyldjquncnrd.supabase.co',KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH',db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let session=null;async function hasRole(r){const q=await db.rpc('has_access_role',{p_role:r});if(q.error)throw q.error;return q.data===true}async function start(s){if(!s||!s.user)throw Error('Geen geldige sessie ontvang nie.');session=s;if(!await hasRole('coach')){document.getElementById('auth').classList.add('hidden');document.getElementById('denied').classList.remove('hidden');document.getElementById('deniedMsg').textContent='Hierdie rekening het nie Afrigter-toegang nie.';return}const p=await db.from('user_profiles').select('full_name,active').eq('user_id',s.user.id).maybeSingle();if(p.error)throw p.error;if(!p.data||p.data.active===false)throw Error('Jou gebruikersprofiel is gedeaktiveer.');$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='Welkom, '+(p.data.full_name||s.user.email);await loadAll()}window.openScorecard=function(id,age){const g=String(age||'').toUpperCase();if(g==='U/6'){location.href='scorer-o6-v40.html?match='+encodeURIComponent(id)+'&v=40&resume=1&ts='+Date.now();return}location.href='scorer-fixed.html?match='+encodeURIComponent(id)+'&resume=1&ts='+Date.now()};async function loadAll(){const f=await db.from('matches').select('id,age_group,team_a_id,team_b_id,match_date,match_time,venue,status,coach_user_id,scorer_user_id').or('coach_user_id.eq.'+session.user.id+',scorer_user_id.eq.'+session.user.id).order('match_date',{ascending:true}).order('match_time',{ascending:true});if(f.error)throw f.error;const rows=f.data||[],ids=[...new Set(rows.flatMap(x=>[x.team_a_id,x.team_b_id]).filter(Boolean))],tm={};if(ids.length){const t=await db.from('teams').select('id,name').in('id',ids);if(t.error)throw t.error;(t.data||[]).forEach(x=>tm[x.id]=x.name)}$('fixtures').innerHTML=rows.length?rows.map(x=>'<div class="fixture"><b>'+esc(tm[x.team_a_id]||'Onbekend')+' vs '+esc(tm[x.team_b_id]||'Onbekend')+'</b><div class="muted">'+esc(x.match_date)+' • '+esc(String(x.match_time||'').slice(0,5))+' • '+esc(x.venue||'')+'</div><div class="actions"><button class="primary" onclick="openScorecard(\''+x.id+'\',\''+esc(x.age_group)+'\')">🏏 Open Telkaart</button><span class="pill">'+esc(x.age_group)+' · '+esc(x.status)+'</span></div></div>').join(''):'<p class="muted">Geen wedstryde is tans aan jou toegeken nie.</p>'}$('logout').onclick=()=>db.auth.signOut().then(()=>location.reload());db.auth.getSession().then(({data:{session}})=>{if(session)start(session).catch(e=>{$('msg').textContent=e.message||String(e);$('msg').className='error'})});$('login').onsubmit=async e=>{e.preventDefault();try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;await start(r.data.session)}catch(e){$('msg').textContent=e.message||String(e);$('msg').className='error'}})})();</script></body></html>
