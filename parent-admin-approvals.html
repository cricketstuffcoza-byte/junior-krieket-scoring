<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Ouer Goedkeurings</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,sans-serif;background:#eef2f6;color:#172033;margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}.request{border:1px solid #e4e7ec;border-radius:14px;padding:16px;margin:10px 0}.childreq{border:1px solid #edf0f4;border-radius:12px;padding:12px;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}button,select{padding:10px;border-radius:9px;border:1px solid #ccd2da;font-weight:700}.primary{background:#172033;color:#fff}.ok{color:#067647}.err{color:#b42318}.muted{color:#667085}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="card"><h1>👨‍👩‍👧 Ouer-goedkeurings</h1><p class="muted">Match elke kind aan die korrekte speler en keur die ouer/voog goed. Twee verskillende ouers mag dieselfde speler hê.</p><button id="refresh">↻ Verfris</button><div id="msg"></div></section><section class="card"><div id="list">Laai…</div></section></div><script>(function(){const URL='https://moomommajyldjquncnrd.supabase.co',KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH',db=window.supabase.createClient(URL,KEY);const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){const {data:s,error}=await db.auth.getSession();if(error||!s.session){$('list').innerHTML='<p class="err">Meld asseblief as admin aan.</p>';return}const pr=await db.from('user_profiles').select('role').eq('user_id',s.session.user.id).single();if(pr.error||String(pr.data?.role).toLowerCase()!=='admin'){$('list').innerHTML='<p class="err">Geen admin toegang.</p>';return}const r=await db.from('parent_approval_requests').select('*').order('created_at',{ascending:false});if(r.error){$('list').innerHTML='<p class="err">'+esc(r.error.message)+'</p>';return}const players=await db.from('players').select('id,first_name,surname,team_id,teams(name,age_group)').eq('active',true).order('first_name');const opts=(players.data||[]).map(p=>`<option value="${p.id}">${esc(p.first_name)} ${esc(p.surname)} — ${esc(p.teams?.name||'')} (${esc(p.teams?.age_group||'')})</option>`).join('');$('list').innerHTML=(r.data||[]).map(x=>`<div class="request"><div><b>${esc(x.requested_email)}</b> · ${esc(x.requested_phone||'')}</div><div>Noodkontak: <b>${esc(x.emergency_phone||'—')}</b> · Verhouding: ${esc(x.relationship||'')}</div><div class="childreq"><b>Kind:</b> ${esc(x.requested_child_name)}<div class="grid" style="margin-top:8px"><select id="p-${x.id}"><option value="">Kies korrekte speler…</option>${opts}</select><button class="primary" onclick="approve('${x.id}')">✅ Keur goed & stuur e-pos</button></div></div><div class="muted">Status: ${esc(x.status)}</div></div>`).join('')||'<p class="muted">Geen ouer-versoeke nie.</p>')}window.approve=async id=>{const player=$('p-'+id).value;if(!player){alert('Kies eers die korrekte speler.');return}const {data:s}=await db.auth.getSession();if(!s.session){$('msg').innerHTML='<p class="err">Admin sessie ontbreek.</p>';return}const {error}=await db.rpc('admin_approve_parent_request',{p_request_id:id,p_player_id:player});if(error){$('msg').innerHTML='<p class="err">Goedkeuring kon nie voltooi word nie: '+esc(error.message)+'</p>';return}const fn=await fetch(URL+'/functions/v1/parent-approval-email',{method:'POST',headers:{Authorization:'Bearer '+s.session.access_token,'Content-Type':'application/json'},body:JSON.stringify({request_id:id,portal_url:location.origin+'/parent-v2.html'})});const out=await fn.text();$('msg').innerHTML=fn.ok?'<p class="ok">Ouer goedgekeur en toegang-e-pos gestuur.</p>':'<p class="err">Ouer goedgekeur, maar e-pos kon nie gestuur word nie: '+esc(out)+'</p>';load()};window.reject=async id=>{const {data:s}=await db.auth.getSession();const {error}=await db.from('parent_approval_requests').update({status:'rejected',reviewed_by:s.session.user.id,reviewed_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else load()};$('refresh').onclick=load;load()})();</script></body></html>
