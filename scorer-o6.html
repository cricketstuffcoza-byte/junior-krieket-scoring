<!doctype html>
<html lang="af">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Junior Krieket – O/6 Telkaart</title>
</head>
<body style="margin:0;background:#eef2f6;font-family:system-ui,sans-serif">
<div id="boot" style="max-width:900px;margin:40px auto;background:#fff;border-radius:16px;padding:24px;font-weight:700">Laai O/6 telkaart…</div>
<script>
(async function(){
  const q=new URLSearchParams(location.search),id=q.get('match');
  const boot=document.getElementById('boot');
  if(!id){boot.textContent='Geen wedstryd-ID is verskaf nie.';return;}
  const SB='https://moomommajyldjquncnrd.supabase.co';
  const KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH';
  const H={apikey:KEY,Authorization:'Bearer '+KEY};
  const savedKey='junior_krieket_v19_saved_'+id;
  const presenceKey='junior_krieket_v19_presence_'+id;
  try{
    // FIRST restore the verified historical backup, before loading the scoring engine.
    // This is critical: the engine reads localStorage during its own startup.
    if(id==='54e506e4-dcdc-478c-b223-c748e784f5de'){
      const rr=await fetch('./restore-vikings-dragons.html?data='+Date.now(),{cache:'no-store'});
      if(rr.ok){
        const txt=await rr.text();
        const m=txt.match(/const DATA='([^']+)'/);
        if(m){
          const raw=atob(m[1]);
          const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
          const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
          const backup=JSON.parse(await new Response(stream).text());
          localStorage.setItem(savedKey,JSON.stringify(backup));
          localStorage.setItem(presenceKey,JSON.stringify({A:['De Wet Cilliers','Drikus Venter','Heinro Michau','Henrique Bronkhorst','Joshua van Staden','Juandré Van Loggerenberg','Kai van Schoor','Ryan Nolte','Zayn Steynberg'],B:['Caelem Meeling','CJ Kruger','DeAndre Joubert','Edward Nienaber','Jacques Marais','Keegan Kruger','Lehan Benadie','Preston Kruger','Tristan Theron']}));
          localStorage.setItem('junior_krieket_v19_restore_ready_'+id,'1');
        }
      }
    }

    const mRes=await fetch(SB+'/rest/v1/matches?select=id,team_a_id,team_b_id,match_date,match_time,venue,age_group,first_batting_team_id,second_batting_team_id,status&id=eq.'+encodeURIComponent(id),{headers:H,cache:'no-store'});
    if(!mRes.ok)throw Error('Die wedstryd kon nie gelaai word nie.');
    const match=(await mRes.json())[0];
    if(!match)throw Error('Die wedstryd is nie gevind nie.');
    const ids=[match.team_a_id,match.team_b_id].filter(Boolean).join(',');
    const [tRes,pRes]=await Promise.all([
      fetch(SB+'/rest/v1/teams?select=id,name&id=in.('+ids+')',{headers:H,cache:'no-store'}),
      fetch(SB+'/rest/v1/players?select=first_name,surname,team_id&team_id=in.('+ids+')&active=eq.true',{headers:H,cache:'no-store'})
    ]);
    if(!tRes.ok||!pRes.ok)throw Error('Span- of spelerdata kon nie gelaai word nie.');
    const teams=await tRes.json(),players=await pRes.json();
    const tm=Object.fromEntries(teams.map(x=>[x.id,x.name]));
    const teamA=tm[match.team_a_id]||'Span A',teamB=tm[match.team_b_id]||'Span B';
    const byTeam={};
    byTeam[teamA]=players.filter(x=>x.team_id===match.team_a_id).map(x=>[x.first_name,x.surname].filter(Boolean).join(' ')).filter(Boolean);
    byTeam[teamB]=players.filter(x=>x.team_id===match.team_b_id).map(x=>[x.first_name,x.surname].filter(Boolean).join(' ')).filter(Boolean);

    const coreRes=await fetch('./o6-v19-core.html?core='+Date.now(),{cache:'no-store'});
    if(!coreRes.ok)throw Error('Die O/6 telkaart-kern kon nie gelaai word nie.');
    let html=await coreRes.text();
    const matchObj={teamA,teamB,group:String(match.age_group||'U/6'),date:match.match_date||'',time:String(match.match_time||'').slice(0,5),venue:match.venue||'Laerskool Wonderboom'};
    html=html.replace(/const MATCH=\{[^;]*\};/,'const MATCH='+JSON.stringify(matchObj)+';');
    html=html.replace(/const PLAYERS=\{[\s\S]*?\};\s*const RULES=/,'const PLAYERS='+JSON.stringify(byTeam)+';\nconst RULES=');
    html=html.replace(/<div class="locked">Blitzwolwe<\/div>/g,'<div class="locked">'+teamA+'</div>');
    html=html.replace(/<div class="locked">Sixers<\/div>/g,'<div class="locked">'+teamB+'</div>');
    html=html.replace(/<option>Blitzwolwe<\/option>/g,'<option>'+teamA+'</option>');
    html=html.replace(/<option>Sixers<\/option>/g,'<option>'+teamB+'</option>');
    html=html.replace('Plaaslike toetsweergawe • wedstrydinstellings is deur Admin vooraf bepaal','O/6 Alpha & Omega • wedstrydinstellings is deur Admin vooraf bepaal');
    document.open();document.write(html);document.close();
  }catch(e){boot.textContent='Fout: '+(e.message||String(e));boot.style.color='#b42318';console.error(e)}
})();
</script>
</body>
</html>
