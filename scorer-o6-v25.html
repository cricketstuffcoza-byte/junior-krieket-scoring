<!doctype html>
<html lang="af">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – O/6 Telkaart</title><style>html,body{margin:0;background:#eef2f6;font-family:system-ui,sans-serif}#boot{max-width:900px;margin:40px auto;background:#fff;border-radius:16px;padding:24px;font-weight:800;line-height:1.5}iframe{width:100%;height:100vh;border:0;display:none}</style></head>
<body><div id="boot">Laai O/6 telkaart…</div><iframe id="frame" title="Junior Krieket O/6 Telkaart"></iframe>
<script>
'use strict';
(async function(){
 const boot=document.getElementById('boot'),frame=document.getElementById('frame'),id=new URLSearchParams(location.search).get('match');
 const SB_URL='https://moomommajyldjquncnrd.supabase.co',SB_KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH',headers={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY};
 const fail=e=>{boot.textContent='Telkaart kon nie gelaai word nie: '+(e?.message||e);boot.style.color='#b42318'};
 if(!id){fail(Error('Geen wedstryd-ID is verskaf nie.'));return}
 try{
  const mr=await fetch(SB_URL+'/rest/v1/matches?id=eq.'+encodeURIComponent(id)+'&select=id,age_group,team_a_id,team_b_id,match_date,match_time,venue',{headers,cache:'no-store'});if(!mr.ok)throw Error('Wedstryd kon nie gevind word nie.');
  const ma=(await mr.json())[0];if(!ma)throw Error('Hierdie wedstryd bestaan nie in die databasis nie.');if(String(ma.age_group||'').toUpperCase()!=='U/6')throw Error('Hierdie wedstryd is nie n O/6 wedstryd nie.');
  const ids=[ma.team_a_id,ma.team_b_id].filter(Boolean),tr=await fetch(SB_URL+'/rest/v1/teams?id=in.('+ids.map(encodeURIComponent).join(',')+')&select=id,name',{headers,cache:'no-store'});if(!tr.ok)throw Error('Span-inligting kon nie gelaai word nie.');
  const teams=await tr.json(),tm={};teams.forEach(t=>tm[t.id]=t);const teamA=tm[ma.team_a_id]?.name||'Span A',teamB=tm[ma.team_b_id]?.name||'Span B';
  const pr=await fetch(SB_URL+'/rest/v1/players?team_id=in.('+ids.map(encodeURIComponent).join(',')+')&select=team_id,first_name,surname,active&order=first_name.asc',{headers,cache:'no-store'});if(!pr.ok)throw Error('Spelerlys kon nie gelaai word nie.');
  const dbPlayers={};ids.forEach(t=>dbPlayers[t]=[]);(await pr.json()).forEach(p=>{if(p.active!==false&&dbPlayers[p.team_id]){const n=[p.first_name,p.surname].filter(Boolean).join(' ').trim();if(n)dbPlayers[p.team_id].push(n)}});
  const matchObj={teamA,teamB,group:'U/6',date:ma.match_date||'',time:String(ma.match_time||'').slice(0,5),venue:ma.venue||''};
  const key='junior_krieket_v19_saved_'+id;
  let savedEnvelope=null;try{const raw=localStorage.getItem(key);if(raw){const x=JSON.parse(raw);if(x&&x.state&&x.state.started)savedEnvelope=x}}catch(e){}
  let playersObj={[teamA]:dbPlayers[ma.team_a_id]||[],[teamB]:dbPlayers[ma.team_b_id]||[]};
  if(savedEnvelope&&savedEnvelope.players&&Array.isArray(savedEnvelope.players[teamA])&&Array.isArray(savedEnvelope.players[teamB])){
   playersObj={[teamA]:savedEnvelope.players[teamA].slice(),[teamB]:savedEnvelope.players[teamB].slice()};
  }
  const cr=await fetch('./o6-v19-core.html?x='+Date.now(),{cache:'no-store'});if(!cr.ok)throw Error('O/6 telkaart-kern kon nie gelaai word nie.');let html=await cr.text();
  const replaced=html.replace(/const MATCH=\{[\s\S]*?\};\s*const PLAYERS=\{[\s\S]*?\};\s*const RULES=/,'const MATCH='+JSON.stringify(matchObj)+';\nconst PLAYERS='+JSON.stringify(playersObj)+';\nconst RULES=');if(replaced===html)throw Error('Die O/6 wedstryd-instellings kon nie voorberei word nie.');
  html=replaced.replace('Plaaslike toetsweergawe • wedstrydinstellings is deur Admin vooraf bepaal','O/6 • huidige wedstryd');
  const resumeScript=`<script>(function(){'use strict';const P='junior_krieket_v19_saved_';const A=${JSON.stringify(teamA)},B=${JSON.stringify(teamB)};function mid(){return new URLSearchParams(window.parent.location.search).get('match')}function key(){const id=mid();return id?P+id:null}function saved(){try{const r=localStorage.getItem(key());if(!r)return null;const x=JSON.parse(r);return x&&x.state&&x.state.started?x.state:null}catch(e){return null}}function labels(){const a=document.getElementById('labelA'),b=document.getElementById('labelB');if(a)a.textContent=A;if(b)b.textContent=B;document.querySelectorAll('.locked').forEach(e=>{const v=e.textContent.trim();if(v==='Blitzwolwe'||v==='Span A')e.textContent=A;if(v==='Sixers'||v==='Span B')e.textContent=B});document.title='Junior Krieket – '+A+' vs '+B+' • O/6'}function batter(n){return{name:n,runs:0,balls:0,unplayable:0,out:false,retired:false,dismissals:0,catches:0,runOuts:0}}function repair(s){s.score=s.score||{};s.score[A]=s.score[A]||{runs:0,wickets:0,legalBalls:0,unplayable:0,coach:0,coachRuns:0};s.score[B]=s.score[B]||{runs:0,wickets:0,legalBalls:0,unplayable:0,coach:0,coachRuns:0};s.bats=s.bats||{};[A,B].forEach(t=>{const list=(window.PLAYERS&&window.PLAYERS[t])||[];list.forEach(n=>{if(!s.bats[n])s.bats[n]=batter(n);else{const d=s.bats[n];d.runs=Number(d.runs)||0;d.balls=Number(d.balls)||0;d.unplayable=Number(d.unplayable)||0;d.out=!!d.out;d.retired=!!d.retired;d.dismissals=Number(d.dismissals)||0;d.catches=Number(d.catches)||0;d.runOuts=Number(d.runOuts)||0}})});s.pairFaceBalls=s.pairFaceBalls||{};s.completedPairPlayers=Array.isArray(s.completedPairPlayers)?s.completedPairPlayers:[];s.bowlers=s.bowlers||{};s.usedBowlers=Array.isArray(s.usedBowlers)?s.usedBowlers:[];s.log=Array.isArray(s.log)?s.log:[];return s}async function resume(){try{let s=saved();if(!s){const id=mid();if(id){const r=await fetch('${SB_URL}/rest/v1/live_match_state?match_id=eq.'+encodeURIComponent(id)+'&select=state_json&limit=1',{headers:{apikey:'${SB_KEY}',Authorization:'Bearer ${SB_KEY}'},cache:'no-store'});if(r.ok){const x=(await r.json())[0];if(x&&x.state_json&&x.state_json.started)s=x.state_json}}}if(!s){alert('Daar is nog geen gestoorde onvoltooide wedstryd vir hierdie wedstryd nie.');return}s=repair(JSON.parse(JSON.stringify(s)));window.__juniorState=s;window.__juniorUndoStack=[];localStorage.setItem(key(),JSON.stringify({version:1,savedAt:new Date().toISOString(),state:s,players:window.PLAYERS,match:window.MATCH}));labels();render();if(s.innings&&s.started&&!s.completed&&Number(s.pairBalls)>=16){s.pairLimitAccepted=false;openPair();render()}const st=document.getElementById('status');if(st){st.textContent='Gaan voort met huidige wedstryd. Die gestoorde data is behou.';st.className='banner blue'}}catch(e){alert('Die huidige wedstryd kon nie hervat word nie: '+(e&&e.message||e))}}const old=document.getElementById('reset');if(old){const b=old.cloneNode(true);b.textContent='▶ GAAN VOORT MET HUIDIGE WEDSTRYD';old.replaceWith(b);b.addEventListener('click',resume)}labels()})();<\\/script>`;
  html=html.replace('</body>',resumeScript+'</body>');frame.srcdoc=html;frame.onload=()=>{boot.style.display='none';frame.style.display='block'};
 }catch(e){fail(e)}
})();
</script></body></html>
