<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spelerstatistieke</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,sans-serif;background:#eef2f6;color:#172033;margin:0;padding:18px}.wrap{max-width:1100px;margin:auto}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stat{border:1px solid #e4e7ec;border-radius:13px;padding:13px;text-align:center}.stat b{display:block;font-size:25px}.muted{color:#667085}select,button{padding:11px 14px;border-radius:10px;border:1px solid #d2d9e0;font-weight:800;background:#fff}button{cursor:pointer}.primary{background:#172033;color:#fff;border:0}.green{background:#eaf7ef}.red{background:#fff0f0}@media(max-width:750px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="card"><button onclick="history.back()">← Terug</button><div id="profile" style="margin-top:18px">Laai speler…</div></div></div><script>(async()=>{const U='https://moomommajyldjquncnrd.supabase.co',K='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH',db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true}}),root=document.getElementById('profile'),id=new URLSearchParams(location.search).get('player'),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));if(!id){root.textContent='Geen speler gekies nie.';return}const sess=await db.auth.getSession();if(!sess.data.session){root.textContent='Meld eers aan.';return}const p=await db.from('players').select('id,first_name,surname,team_id,teams(name,age_group)').eq('id',id).maybeSingle();if(p.error||!p.data){root.textContent='Speler kon nie gelaai word nie.';return}const x=p.data,t=x.teams||{};let years=await db.rpc('get_player_years',{p_player_id:id});if(years.error){root.textContent=years.error.message;return}years=years.data||[];const current=new Date().getFullYear(),availableYears=[...new Set([current,...years.map(y=>y.season_year)])].sort((a,b)=>b-a);root.innerHTML=`<div class="top"><div><h1 style="margin:0">🏏 ${esc(x.first_name)} ${esc(x.surname)}</h1><div class="muted">${esc(t.name||'')} • ${esc(t.age_group||'')}</div></div><div><label>Seisoen: </label><select id="year">${availableYears.map(y=>`<option value="${y}">${y}</option>`).join('')}</select></div></div><div id="content" style="margin-top:20px"></div>`;async function load(y){const r=await db.rpc('get_player_yearly_stats',{p_player_id:id,p_year:Number(y)});if(r.error){document.getElementById('content').innerHTML='<p>'+esc(r.error.message)+'</p>';return}const a=r.data?.[0]||{};document.getElementById('content').innerHTML=`<h2>📊 ${y} Statistieke</h2><div class="stats"><div class="stat green"><b>${a.matches_played||0}</b>Wedstryde gespeel</div><div class="stat red"><b>${a.matches_not_played||0}</b>Wedstryde nie gespeel</div><div class="stat"><b>${a.matches_selected||0}</b>Gekies</div><div class="stat"><b>${a.batting_runs||0}</b>Kolf lopies</div><div class="stat"><b>${a.playable_balls||0}</b>Kolf balle</div><div class="stat"><b>${a.fours||0}</b>4s</div><div class="stat"><b>${a.sixes||0}</b>6s</div><div class="stat"><b>${a.bowler_wickets||0}</b>Paaltjies</div><div class="stat"><b>${a.bowler_runs_conceded||0}</b>Bowling lopies</div><div class="stat"><b>${a.bowler_playable_balls||0}</b>Bowling balle</div><div class="stat"><b>${a.dot_balls||0}</b>Dot balle</div><div class="stat"><b>${a.catches||0}</b>Vangskote</div><div class="stat"><b>${a.run_outs||0}</b>Run outs</div></div><p class="muted" style="margin-top:16px">Die statistieke word outomaties uit amptelike wedstryddata bereken.</p>`}document.getElementById('year').addEventListener('change',e=>load(e.target.value));load(current)})().catch(e=>document.getElementById('profile').textContent=e.message||String(e));</script></body></html>
