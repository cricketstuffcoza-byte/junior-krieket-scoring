Y='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH',id=new URLSearchParams(location.search).get('match'),db=window.supabase.createClient(SB,KEY);const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function teamScore(st,name){const s=st&&st.score&&st.score[name]||{};return `${Number(s.runs)||0}/${Number(s.wickets)||0}`}async function load(){try{if(!id){$('title').textContent='Geen wedstryd gekies nie.';return}const {data:m,error}=await db.from('matches').select('*').eq('id',id).single();if(error)throw error;const ids=[m.team_a_id,m.team_b_id].filter(Boolean);const {data:teams,error:te}=await db.from('teams').select('id,name').in('id',ids);if(te)throw te;const tm={};(teams||[]).forEach(t=>tm[t.id]=t.name);const teamA=tm[m.team_a_id]||'Span A',teamB=tm[m.team_b_id]||'Span B';$('title').textContent=`${teamA} vs ${teamB}`;$('a').textContent=teamA;$('b').textContent=teamB;$('meta').textContent=`${m.match_date||''} · ${String(m.match_time||'').slice(0,5)} · ${m.venue||''}`;const {data:ls,error:le}=await db.from('live_match_state').select('*').eq('match_id',id).maybeSingle();if(le)throw le;if(!ls){$('status').textContent='WEDSTRYD NOG NIE BEGIN NIE';$('live').textContent='● WAG VIR LIVE';$('batters').innerHTML='<div class="muted">Die afrigter moet eers die wedstryd begin.</div>';return}let st=ls.state_json;if(typeof st==='string')try{st=JSON.parse(st)}catch{};if(!st){$('status').textContent=ls.status||'—';return}const batting=st.batting,score=st.score&&st.score[batting]||{};$('score').textContent=`${Number(score.runs)||0}/${Number(score.wickets)||0}`;$('scoreA').textContent=teamScore(st,teamA);$('scoreB').textContent=teamScore(st,teamB);$('status').textContent=ls.status||'LIVE';$('live').textContent=ls.status==='COMPLETED'?'● KLAAR':'● LIVE';$('over').textContent=`${Math.floor((Number(score.legalBalls)||0)/8)}.${(Number(score.legalBalls)||0)%8}`;$('balls').textContent=`${Number(score.legalBalls)||0} / 80`;$('pair').textContent=st.pair?`#${st.pair} · ${Number(st.pairBalls)||0}/16`:'—';$('bowler').textContent=st.bowler||'—';const bats=[st.striker,st.nonStriker].filter(Boolean);$('batters').innerHTML=bats.length?bats.map(n=>{const s=st.bats&&st.bats[n]||{};const face= n===st.striker?'Face the Ball':'Hardloper';return `<div><span class="pill">${face}</span><b>${esc(n)}</b><div class="muted">${Number(s.runs)||0} lopies · ${Number(s.balls)||0} balle</div></div>`}).join(''):'<div class="muted">Geen huidige kolwers beskikbaar nie.</div>';const hist=Array.isArray(st.log)?st.log.slice(-10).reverse():[];$('ballList').innerHTML=hist.length?hist.map(x=>`<div class="row"><b>${esc(x.over||'')}</b> · ${esc(x.face||'')} · ${Number(x.runs)||0} · ${esc(x.kind||'')}${x.wicket?' · <strong>'+esc(x.dismissal||'PAALTJIE')+'</strong>':''}</div>`).join(''):'<div class="muted">Geen balle aangeteken nie.</div>'}catch(e){$('title').textContent='Kon wedstryd nie laai nie';$('meta').textContent=e.message||String(e)}}load();setInterval(load,2000)})();</script></body></html>
