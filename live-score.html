<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Live Telling</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,sans-serif;background:#eef2f6;color:#172033;margin:0}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 3px 16px #0001}.score{font-size:46px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.muted{color:#667085}.live{display:inline-block;padding:6px 10px;border-radius:999px;background:#fde8e8;color:#b42318;font-weight:900;font-size:12px}.row{padding:8px 0;border-bottom:1px solid #e5e7eb}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="card"><div id="live" class="live">● LIVE</div><h1 id="title">Laai wedstryd…</h1><div id="score" class="score">0/0</div><div id="meta" class="muted"></div></section><section class="card"><h2>Wedstryd</h2><div class="grid"><div><b>Span A</b><div id="a">—</div></div><div><b>Span B</b><div id="b">—</div></div><div><b>Status</b><div id="status">—</div></div><div><b>Boulbeurt</b><div id="over">0.0</div></div><div><b>Balle</b><div id="balls">0 / 80</div></div></div></section><section class="card"><h2>Huidige kolwers</h2><div id="batters" class="grid"><div class="muted">Nog geen kolwers gekies nie.</div></div></section><section class="card"><h2>Huidige bouler</h2><div id="bowler">—</div></section><section class="card"><h2>Laaste balle</h2><div id="ballList"><div class="muted">Geen balle aangeteken nie.</div></div></section></div><script>(function(){const SB='https://moomommajyldjquncnrd.supabase.co',KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH',id=new URLSearchParams(location.search).get('match');const db=window.supabase.createClient(SB,KEY);const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function pname(id,players){const p=(players||[]).find(x=>x.id===id);return p?[p.first_name,p.surname].filter(Boolean).join(' '):'—'}async function load(){try{if(!id){$('title').textContent='Geen wedstryd gekies nie.';return}const {data:m,error}=await db.from('matches').select('*').eq('id',id).single();if(error)throw error;const ids=[m.team_a_id,m.team_b_id].filter(Boolean);const {data:teams}=await db.from('teams').select('id,name').in('id',ids);const tm={};(teams||[]).forEach(t=>tm[t.id]=t.name);$('title').textContent=`${tm[m.team_a_id]||'Span A'} vs ${tm[m.team_b_id]||'Span B'}`;$('a').textContent=tm[m.team_a_id]||'—';$('b').textContent=tm[m.team_b_id]||'—';$('status').textContent=m.status||'—';$('meta').textContent=`${m.match_date||''} · ${m.venue||''}`;const {data:ls,error:le}=await db.from('live_match_state').select('*').eq('match_id',id).maybeSingle();if(le)throw le;let st=ls?.state_json;if(typeof st==='string')try{st=JSON.parse(st)}catch{};if(!st){$('score').textContent='0/0';$('over').textContent='0.0';$('balls').textContent='0 / 80';$('batters').innerHTML='<div class="muted">Die wedstryd het nog nie begin nie.</div>';return}const idx=Math.max(0,(Number(st.inningsNo)||1)-1),inn=st.innings?.[idx]||st.innings?.[0]||{};const {data:players,error:pe}=await db.from('players').select('id,first_name,surname,team_id').in('team_id',ids);if(pe)throw pe;const total=Number(inn.balls)||Number(ls.playable_balls)||0;$('score').textContent=`${Number(inn.runs)||Number(ls.innings_runs)||0}/${Number(inn.wickets)||Number(ls.innings_wickets)||0}`;$('over').textContent=`${Math.floor(total/5)}.${total%5}`;$('balls').textContent=`${total} / 80`;$('bowler').textContent=pname(inn.bowler||ls.current_bowler_id,players);const batters=[inn.striker,inn.non].filter(Boolean);$('batters').innerHTML=batters.length?batters.map(pid=>{const s=st.stats?.[pid]||{};return `<div><b>${esc(pname(pid,players))}</b><div class="muted">${Number(s.runs)||0} lopies · ${Number(s.balls)||0} balle</div></div>`}).join(''):'<div class="muted">Geen huidige kolwers beskikbaar nie.</div>';const hist=Array.isArray(st.log)?st.log.slice(-10).reverse():[];$('ballList').innerHTML=hist.length?hist.map(x=>`<div class="row">${esc(x.label||x.text||x.result||'Bal aangeteken')}</div>`).join(''):'<div class="muted">Geen balle aangeteken nie.</div>'}catch(e){$('title').textContent='Kon wedstryd nie laai nie';$('meta').textContent=e.message||String(e)}}load();setInterval(load,3000)})();</script></body></html>
