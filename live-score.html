<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Live Telling</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,sans-serif;background:#eef2f6;color:#172033;margin:0}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 3px 16px #0001}.score{font-size:44px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.muted{color:#667085}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#edf2f7;font-size:12px;font-weight:800}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="card"><h1>🔴 Live Telling</h1><p id="title" class="muted">Laai wedstryd…</p><div class="score" id="score">—</div><div id="meta" class="muted"></div></section><section class="card"><h2>Wedstryd</h2><div class="grid"><div><b>Span A</b><div id="a">—</div></div><div><b>Span B</b><div id="b">—</div></div><div><b>Status</b><div id="status">—</div></div><div><b>Boulbeurt</b><div id="over">—</div></div></div></section><section class="card"><h2>Huidige kolwers</h2><div id="batters" class="grid"></div></section><section class="card"><h2>Huidige bouler</h2><div id="bowler">—</div></section><section class="card"><h2>Laaste balle</h2><div id="balls" class="muted">Geen balle aangeteken nie.</div></section></div><script>(function(){const URL='https://moomommajyldjquncnrd.supabase.co',KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH',id=new URLSearchParams(location.search).get('match');const db=window.supabase.createClient(URL,KEY);const $=x=>document.getElementById(x);async function load(){if(!id){$('title').textContent='Geen wedstryd gekies nie.';return}const {data:m,error}=await db.from('matches').select('*').eq('id',id).single();if(error){$('title').textContent=error.message;return}const ids=[m.team_a_id,m.team_b_id].filter(Boolean);const tr=await db.from('teams').select('id,name').in('id',ids);const map={};(tr.data||[]).forEach(t=>map[t.id]=t.name);$('title').textContent=`${map[m.team_a_id]||'Span A'} vs ${map[m.team_b_id]||'Span B'}`;$('a').textContent=map[m.team_a_id]||'—';$('b').textContent=map[m.team_b_id]||'—';$('status').textContent=m.status||'—';$('meta').textContent=`${m.match_date||''} · ${m.venue||''}`;let st=m.scoring_state||m.state||null;if(typeof st==='string')try{st=JSON.parse(st)}catch{};if(st){const inn=st.innings?.[st.currentInnings??0]||st.innings?.[0];$('score').textContent=inn?`${inn.runs||0}/${inn.wickets||0}`:'—';$('over').textContent=inn?.over||inn?.overs||'—';$('bowler').textContent=inn?.currentBowlerName||inn?.bowlerName||'—';const bs=inn?.activeBatters||inn?.batters||[];$('batters').innerHTML=bs.map(b=>`<div><b>${b.name||b.player_name||b}</b><div class="muted">${b.runs??0} lopies · ${b.balls??0} balle</div></div>`).join('')||'<div class="muted">Geen huidige kolwers beskikbaar.</div>';const balls=inn?.ballHistory||st.ballHistory||[];$('balls').innerHTML=balls.slice(-10).reverse().map(b=>`<div>${b.over||''} — ${b.label||b.runs??0}</div>`).join('')||'Geen balle aangeteken nie.'}}load();setInterval(load,5000)})();</script></body></html>
