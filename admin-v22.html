<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Admin Portaal V22</title><style>html,body{margin:0;width:100%;height:100%;background:#eef2f6}#frame{width:100%;height:100%;min-height:100vh;border:0}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#eef2f6;font-family:system-ui,sans-serif;z-index:10}#loading .box{background:#fff;border-radius:18px;padding:28px;box-shadow:0 3px 16px #0001;max-width:720px;margin:20px}</style></head><body><div id="loading"><div class="box"><h2>🔐 Admin Portaal V22</h2><p>Laai die Admin-portaal…</p></div></div><iframe id="frame" src="admin-v21.html" title="Junior Krieket Admin Portaal V22"></iframe><script>(function(){const f=document.getElementById('frame'),loading=document.getElementById('loading');const URL='https://moomommajyldjquncnrd.supabase.co',KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH';let done=false;const sleep=m=>new Promise(r=>setTimeout(r,m));const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function patch(){if(done)return;const v21=f.contentWindow,d21=f.contentDocument;if(!v21||!d21)return false;const inner=d21.getElementById('v21Frame');if(!inner||!inner.contentDocument)return false;const w=inner.contentWindow,d=inner.contentDocument;if(!w.supabase||!w.supabase.createClient)return false;done=true;loading.style.display='none';const sb=w.supabase.createClient(URL,KEY);const coachSection=d.getElementById('coaches');if(!coachSection)return true;let card=d.getElementById('v22CoachAssignments');if(card)return true;card=d.createElement('div');card.id='v22CoachAssignments';card.className='card';card.innerHTML='<h2>🔄 Verander Afrigter se Toegewysde Span</h2><p class="muted">Kies ’n afrigter en kies presies watter span(s) aan hom/haar toegeken moet wees.</p><div class="grid"><div><label>Afrigter</label><select id="v22CoachSelect"><option value="">— Kies afrigter —</option></select></div><div><label>Spanne</label><div id="v22TeamChecks" class="listbox">Kies eers ’n afrigter.</div></div></div><div class="actions"><button class="primary" id="v22Save">💾 Stoor Span-toewysings</button></div><p id="v22Msg" class="small"></p>';coachSection.insertBefore(card,coachSection.firstChild);
const coachSel=d.getElementById('v22CoachSelect'),checks=d.getElementById('v22TeamChecks'),save=d.getElementById('v22Save'),msg=d.getElementById('v22Msg');let coaches=[],teams=[];
function setMsg(t,c){msg.textContent=t;msg.className='small '+(c||'')}
async function load(){const [cr,tr]=await Promise.all([sb.from('user_profiles').select('user_id,full_name,active,role').eq('role','coach').eq('active',true).order('full_name'),sb.from('teams').select('id,name,age_group,active').eq('active',true).order('age_group').order('name')]);if(cr.error)throw cr.error;if(tr.error)throw tr.error;coaches=cr.data||[];teams=tr.data||[];coachSel.innerHTML='<option value="">— Kies afrigter —</option>'+coaches.map(c=>'<option value="'+esc(c.user_id)+'">'+esc(c.full_name||'Afrigter')+'</option>').join('')}
async function loadAssignments(){const id=coachSel.value;if(!id){checks.innerHTML='Kies eers ’n afrigter.';return}checks.innerHTML='Laai spanne…';const {data,error}=await sb.from('coach_teams').select('team_id,active').eq('coach_user_id',id);if(error){checks.innerHTML='<span class="error">'+esc(error.message)+'</span>';return}const active=new Set((data||[]).filter(x=>x.active!==false).map(x=>String(x.team_id)));checks.innerHTML=teams.map(t=>'<label class="check"><input type="checkbox" value="'+esc(t.id)+'" '+(active.has(String(t.id))?'checked':'')+'> '+esc(t.name)+' <span class="muted">('+esc(t.age_group)+')</span></label>').join('')||'Geen aktiewe spanne.'}
coachSel.addEventListener('change',()=>loadAssignments());save.addEventListener('click',async()=>{const id=coachSel.value;if(!id)return setMsg('Kies eers ’n afrigter.','error');const selected=[...checks.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);if(!selected.length)return setMsg('Kies minstens een span.','error');save.disabled=true;try{const {data:existing,error:e1}=await sb.from('coach_teams').select('id,team_id,active').eq('coach_user_id',id);if(e1)throw e1;const wanted=new Set(selected);for(const row of (existing||[])){const should=wanted.has(String(row.team_id));if(Boolean(row.active)!==should){const {error}=await sb.from('coach_teams').update({active:should}).eq('id',row.id);if(error)throw error}}const existingTeams=new Set((existing||[]).map(r=>String(r.team_id)));for(const tid of selected){if(!existingTeams.has(String(tid))){const {error}=await sb.from('coach_teams').insert({coach_user_id:id,team_id:tid,active:true});if(error)throw error}}setMsg('Span-toewysings suksesvol opgedateer.','success');await loadAssignments()}catch(e){setMsg('Kon span-toewysings nie stoor nie: '+(e.message||e),'error')}finally{save.disabled=false}});
try{await load()}catch(e){setMsg('Kon afrigters/spanne nie laai nie: '+e.message,'error')}return true}
f.addEventListener('load',async()=>{for(let i=0;i<60;i++){try{if(await patch())return}catch(e){}await sleep(250)}loading.querySelector('.box').innerHTML='<h2>Admin V22</h2><p style="color:#b42318">Kon V22 nie voltooi laai nie.</p>'});})();</script></body></html>
