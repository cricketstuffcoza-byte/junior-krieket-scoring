<!doctype html>
<html lang="af">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Junior Krieket – Alle Users</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#172033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1350px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}h1,h2,h3{margin:0 0 7px}.muted{color:#667085}.actions{display:flex;gap:9px;flex-wrap:wrap}.button{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#172033;color:#fff}.ghost{background:#eef2f6;color:#172033}.danger{background:#fff3f2;color:#b42318;padding:6px 9px;border-radius:9px;border:0;font-weight:800;cursor:pointer}.status{padding:12px 14px;border-radius:11px;background:#f6f8fa;margin-top:14px}.success{color:#087443;background:#ecfdf3}.error{color:#b42318;background:#fff3f2}.filters{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:end}.filters input,.assignbox select{width:100%;padding:11px;border:1px solid #ccd3dc;border-radius:10px;font:inherit}.tablewrap{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse;min-width:1180px}th,td{padding:11px 10px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top;font-size:14px}.rolebox{display:flex;gap:8px;flex-wrap:wrap}.role{display:inline-flex;align-items:center;gap:5px;border:1px solid #d0d5dd;border-radius:999px;padding:5px 9px;background:#fff;font-weight:700;font-size:12px}.role input{margin:0}.inactive{opacity:.6}.small{font-size:12px}.name{font-weight:900}.email{color:#667085;font-size:13px;margin-top:3px}.assignbox{margin-top:10px;padding:11px;border:1px solid #e4e7ec;border-radius:12px;background:#f8fafc}.assigngrid{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:8px;align-items:end}.assigned{margin-top:8px}.assignedrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0;padding:6px 8px;border-radius:9px;background:#edf2f7;font-size:12px;font-weight:700}.count{font-size:12px;font-weight:800;color:#667085;margin-bottom:7px}@media(max-width:800px){.filters,.assigngrid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<header class="card"><div class="top"><div><h1>👥 Alle Users</h1><p class="muted">Bestuur Ouers/Voogde, Afrigters en Admins. Een rekening kan meer as een rol hê.</p></div><div class="actions"><button class="button ghost" id="back">← Admin Portaal</button><button class="button ghost" id="refresh">↻ Verfris</button></div></div><div id="status" class="status">Verifieer admin-toegang…</div></header>
<section class="card"><div class="filters"><div><label for="search"><b>Soek gebruikers</b></label><input id="search" placeholder="Naam, e-pos of selfoon…"></div><div><button class="button ghost" id="allBtn">Alle</button></div><div><button class="button ghost" id="activeBtn">Net aktief</button></div></div><div class="tablewrap"><table><thead><tr><th>User</th><th>Kontak</th><th>Status</th><th>Rolle</th><th>Ouer / Voog-koppeling</th><th>Afrigter / Span-koppeling</th><th>Aksie</th></tr></thead><tbody id="users"></tbody></table></div></section>
<script>
(function(){
const URL='https://moomommajyldjquncnrd.supabase.co',KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH';
const db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let rows=[],players=[],teams=[],showActiveOnly=false,links=[],coachTeams=[];
function setStatus(text,cls=''){const s=$('status');s.textContent=text;s.className='status '+cls}
function hasRole(u,r){return (u.roles||[]).map(x=>String(x).toLowerCase()).includes(r)}
function userLinks(id){return links.filter(x=>String(x.guardian_user_id)===String(id))}
function userCoachTeams(id){return coachTeams.filter(x=>String(x.coach_user_id)===String(id))}
function playerLabel(p){return `${p.first_name||''} ${p.surname||''}`.trim()||'Onbekende speler'}
function playerGuardianCount(id){return links.filter(x=>String(x.player_id)===String(id)).length}
function playerDisplay(p){let s=playerLabel(p);if(p.team_name)s+=' · '+p.team_name;if(p.age_group)s+=' · '+p.age_group;return s}
function teamLabel(t){let s=t.name||'Onbekende span';if(t.age_group)s+=' · '+t.age_group;return s}
function render(){
 const q=$('search').value.trim().toLowerCase();
 const filtered=rows.filter(u=>{if(showActiveOnly&&u.active===false)return false;const hay=[u.full_name,u.email,u.phone,u.mobile_phone,u.emergency_phone].map(x=>String(x||'').toLowerCase()).join(' ');return !q||hay.includes(q)});
 $('users').innerHTML=filtered.length?filtered.map(u=>{
  const ul=userLinks(u.user_id),parent=hasRole(u,'parent'),ct=userCoachTeams(u.user_id),coach=hasRole(u,'coach');
  const linked=ul.length?'<div class="assigned">'+ul.map(x=>`<div class="assignedrow"><span>👤 ${esc(x.player_name)}${x.relationship?' · '+esc(x.relationship):''}</span><button class="danger" data-unlink="${esc(u.user_id)}" data-player="${esc(x.player_id)}">Verwyder</button></div>`).join('')+'</div>':'<div class="small muted">Geen kind gekoppel nie.</div>';
  const available=players.filter(p=>!ul.some(x=>String(x.player_id)===String(p.id))&&playerGuardianCount(p.id)<2);
  const parentSelector=parent?`<div class="assignbox"><div class="count">Elke kind kan maksimum 2 ouers/voogde hê. Verwyder eers een koppeling om weer toe te ken.</div><div class="assigngrid"><div><label class="small">Kind / Speler</label><select data-player-for="${esc(u.user_id)}"><option value="">— Kies speler —</option>${available.map(p=>`<option value="${esc(p.id)}">${esc(playerDisplay(p))} (${playerGuardianCount(p.id)}/2)</option>`).join('')}</select></div><div><label class="small">Verhouding</label><select data-rel-for="${esc(u.user_id)}"><option value="Ouer">Ouer</option><option value="Voog">Voog</option><option value="Pa">Pa</option><option value="Ma">Ma</option><option value="Ander">Ander</option></select></div><button class="button primary" data-link="${esc(u.user_id)}">Koppel kind</button></div>${!available.length?'<div class="small muted" style="margin-top:8px">Geen beskikbare kinders nie — kinders met 2 ouers/voogde is versteek.</div>':''}${linked}</div>`:'<span class="small muted">Ken eers Ouer/Voog-rol toe.</span>';
  const coachLinked=ct.length?'<div class="assigned">'+ct.map(x=>`<div class="assignedrow"><span>🏏 ${esc(x.team_name)}${x.age_group?' · '+esc(x.age_group):''}</span><button class="danger" data-uncoach="${esc(u.user_id)}" data-team="${esc(x.team_id)}">Verwyder</button></div>`).join('')+'</div>':'<div class="small muted">Geen span toegeken nie.</div>';
  const availableTeams=teams.filter(t=>!ct.some(x=>String(x.team_id)===String(t.id)));
  const coachSelector=coach?`<div class="assignbox"><div class="count">’n Afrigter kan meer as een span hê. Verwyder ’n span indien dit verkeerd toegeken is.</div><div class="assigngrid"><div><label class="small">Span</label><select data-team-for="${esc(u.user_id)}"><option value="">— Kies span —</option>${availableTeams.map(t=>`<option value="${esc(t.id)}">${esc(teamLabel(t))}</option>`).join('')}</select></div><button class="button primary" data-coach="${esc(u.user_id)}">Ken span toe</button></div>${!availableTeams.length?'<div class="small muted" style="margin-top:8px">Geen ongekoppelde spanne beskikbaar nie.</div>':''}${coachLinked}</div>`:'<span class="small muted">Ken eers Afrigter-rol toe.</span>';
  return `<tr class="${u.active===false?'inactive':''}"><td><div class="name">${esc(u.full_name||'Geen naam')}</div><div class="email">${esc(u.email||'Geen e-pos')}</div><div class="small">${esc(u.user_id)}</div></td><td>${esc(u.mobile_phone||u.phone||'—')}<br><span class="small">Nood: ${esc(u.emergency_phone||'—')}</span></td><td>${u.active===false?'⚫ Gedeaktiveer':'🟢 Aktief'}</td><td><div class="rolebox">${['parent','coach','admin'].map(r=>`<label class="role"><input type="checkbox" data-user="${esc(u.user_id)}" data-role="${r}" ${hasRole(u,r)?'checked':''}> ${r==='parent'?'👨‍👩‍👧 Ouer/Voog':r==='coach'?'🏏 Afrigter':'🛠️ Admin'}</label>`).join('')}</div></td><td>${parentSelector}</td><td>${coachSelector}</td><td><button class="button primary save" data-save="${esc(u.user_id)}">Stoor rolle</button></td></tr>`
 }).join(''):'<tr><td colspan="7">Geen gebruikers gevind nie.</td></tr>';
 $('users').querySelectorAll('[data-save]').forEach(btn=>btn.onclick=()=>saveRoles(btn.dataset.save,btn));
 $('users').querySelectorAll('[data-link]').forEach(btn=>btn.onclick=()=>linkChild(btn.dataset.link,btn));
 $('users').querySelectorAll('[data-unlink]').forEach(btn=>btn.onclick=()=>unlinkChild(btn.dataset.unlink,btn.dataset.player,btn));
 $('users').querySelectorAll('[data-coach]').forEach(btn=>btn.onclick=()=>assignTeam(btn.dataset.coach,btn));
 $('users').querySelectorAll('[data-uncoach]').forEach(btn=>btn.onclick=()=>unassignTeam(btn.dataset.uncoach,btn.dataset.team,btn));
}
async function saveRoles(userId,btn){const u=rows.find(x=>String(x.user_id)===String(userId));if(!u)return;const checks=[...document.querySelectorAll(`input[data-user="${CSS.escape(String(userId))}"]`)];const next=new Set(checks.filter(x=>x.checked).map(x=>x.dataset.role));const current=new Set((u.roles||[]).map(x=>String(x).toLowerCase()));const changes=['parent','coach','admin'].filter(r=>next.has(r)!==current.has(r));if(!changes.length){setStatus('Geen rolverandering vir '+(u.full_name||u.email)+'.','');return}if(next.size===0&&!confirm('Hierdie gebruiker sal geen portaalrolle hê nie. Voortgaan?'))return;btn.disabled=true;btn.textContent='Stoor…';try{for(const r of changes){const {error}=await db.rpc('admin_set_user_role',{p_user_id:userId,p_role:r,p_enabled:next.has(r)});if(error)throw error}setStatus('Rolle vir '+(u.full_name||u.email)+' suksesvol opgedateer.','success');await load()}catch(e){setStatus('Kon rolle nie stoor nie: '+(e.message||e),'error')}finally{btn.disabled=false;btn.textContent='Stoor rolle'}}
async function linkChild(userId,btn){const playerSel=document.querySelector(`select[data-player-for="${CSS.escape(String(userId))}"]`),relSel=document.querySelector(`select[data-rel-for="${CSS.escape(String(userId))}"]`);const playerId=playerSel?.value,relationship=relSel?.value||'Ouer';if(!playerId){setStatus('Kies asseblief eers die kind/speler.','error');return}if(playerGuardianCount(playerId)>=2){setStatus('Hierdie kind het reeds 2 ouers/voogde. Verwyder eers een koppeling.','error');return}btn.disabled=true;btn.textContent='Koppel…';try{const {error}=await db.from('guardian_players').insert({guardian_user_id:userId,player_id:playerId,relationship});if(error)throw error;setStatus('Kind suksesvol gekoppel.','success');await load()}catch(e){setStatus('Kon kind nie koppel nie: '+(e.message||e),'error')}finally{btn.disabled=false;btn.textContent='Koppel kind'}}
async function unlinkChild(userId,playerId,btn){const u=rows.find(x=>String(x.user_id)===String(userId));if(!confirm('Verwyder hierdie kind se koppeling van '+(u?.full_name||'hierdie ouer/voog')+'?'))return;btn.disabled=true;try{const {error}=await db.from('guardian_players').delete().eq('guardian_user_id',userId).eq('player_id',playerId);if(error)throw error;setStatus('Kind se koppeling is verwyder en kan nou weer toegeken word.','success');await load()}catch(e){setStatus('Kon koppeling nie verwyder nie: '+(e.message||e),'error')}finally{btn.disabled=false}}
async function assignTeam(userId,btn){const sel=document.querySelector(`select[data-team-for="${CSS.escape(String(userId))}"]`),teamId=sel?.value;if(!teamId){setStatus('Kies asseblief eers die span.','error');return}if(userCoachTeams(userId).some(x=>String(x.team_id)===String(teamId))){setStatus('Hierdie span is reeds aan die afrigter toegeken.','error');return}btn.disabled=true;btn.textContent='Ken toe…';try{const {error}=await db.from('coach_teams').upsert({coach_user_id:userId,team_id:teamId,active:true},{onConflict:'coach_user_id,team_id'});if(error)throw error;setStatus('Span suksesvol aan afrigter toegeken.','success');await load()}catch(e){setStatus('Kon span nie toeken nie: '+(e.message||e),'error')}finally{btn.disabled=false;btn.textContent='Ken span toe'}}
async function unassignTeam(userId,teamId,btn){const u=rows.find(x=>String(x.user_id)===String(userId));const ct=userCoachTeams(userId).find(x=>String(x.team_id)===String(teamId));if(!confirm('Verwyder '+(ct?.team_name||'hierdie span')+' van '+(u?.full_name||'hierdie afrigter')+'?'))return;btn.disabled=true;try{const {error}=await db.from('coach_teams').delete().eq('coach_user_id',userId).eq('team_id',teamId);if(error)throw error;setStatus('Span se toekenning is verwyder en kan weer aan hierdie of ’n ander afrigter toegeken word.','success');await load()}catch(e){setStatus('Kon span se toekenning nie verwyder nie: '+(e.message||e),'error')}finally{btn.disabled=false}}
async function loadPlayers(){const {data,error}=await db.from('players').select('id,first_name,surname,active,teams(name,age_group)').eq('active',true).order('first_name');if(error)throw error;players=(data||[]).map(p=>({...p,team_name:p.teams?.name||'',age_group:p.teams?.age_group||''}))}
async function loadTeams(){const {data,error}=await db.from('teams').select('id,name,age_group,active').eq('active',true).order('age_group').order('name');if(error)throw error;teams=data||[]}
async function loadLinks(){const ids=rows.map(x=>x.user_id).filter(Boolean);if(!ids.length){links=[];return}const {data,error}=await db.from('guardian_players').select('guardian_user_id,player_id,relationship').in('guardian_user_id',ids);if(error)throw error;const pids=[...new Set((data||[]).map(x=>x.player_id))];const names=new Map();if(pids.length){const {data:ps,error:pe}=await db.from('players').select('id,first_name,surname').in('id',pids);if(pe)throw pe;(ps||[]).forEach(p=>names.set(String(p.id),playerLabel(p)))}links=(data||[]).map(x=>({...x,player_name:names.get(String(x.player_id))||'Onbekende speler'}))}
async function loadCoachTeams(){const ids=rows.map(x=>x.user_id).filter(Boolean);if(!ids.length){coachTeams=[];return}const {data,error}=await db.from('coach_teams').select('coach_user_id,team_id,active,teams(name,age_group)').in('coach_user_id',ids);if(error)throw error;coachTeams=(data||[]).filter(x=>x.active!==false).map(x=>({...x,team_name:x.teams?.name||'Onbekende span',age_group:x.teams?.age_group||''}))}
async function load(){setStatus('Laai gebruikers, kinders en spanne…');const {data,error}=await db.rpc('admin_list_users');if(error)throw error;rows=(data||[]).map(x=>({...x,roles:Array.isArray(x.roles)?x.roles:[]}));await Promise.all([loadPlayers(),loadTeams(),loadLinks(),loadCoachTeams()]);setStatus(rows.length+' gebruikers gelaai.','success');render()}
async function init(){const {data,error}=await db.auth.getSession();if(error)throw error;if(!data.session){location.replace('central-login.html');return}const {data:ok,error:re}=await db.rpc('has_access_role',{p_role:'admin'});if(re)throw re;if(ok!==true){setStatus('Geen admin-toegang vir hierdie rekening nie.','error');return}await load()}
$('search').oninput=render;$('refresh').onclick=()=>load().catch(e=>setStatus('Kon gebruikers nie laai nie: '+(e.message||e),'error'));$('allBtn').onclick=()=>{showActiveOnly=false;render()};$('activeBtn').onclick=()=>{showActiveOnly=true;render()};$('back').onclick=()=>location.href='admin-v23.html';
init().catch(e=>setStatus(e.message||String(e),'error'));
})();
</script></body></html>
