<!doctype html>
<html lang="af">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Junior Krieket – Alle Users</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#172033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1250px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}h1,h2{margin:0 0 7px}.muted{color:#667085}.actions{display:flex;gap:9px;flex-wrap:wrap}.button{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#172033;color:#fff}.ghost{background:#eef2f6;color:#172033}.status{padding:12px 14px;border-radius:11px;background:#f6f8fa;margin-top:14px}.success{color:#087443;background:#ecfdf3}.error{color:#b42318;background:#fff3f2}.filters{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:end}.filters input{width:100%;padding:11px;border:1px solid #ccd3dc;border-radius:10px;font:inherit}.tablewrap{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:11px 10px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top;font-size:14px}.rolebox{display:flex;gap:8px;flex-wrap:wrap}.role{display:inline-flex;align-items:center;gap:5px;border:1px solid #d0d5dd;border-radius:999px;padding:5px 9px;background:#fff;font-weight:700;font-size:12px}.role input{margin:0}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf2f7;font-size:12px;font-weight:800;margin:2px}.inactive{opacity:.6}.small{font-size:12px}.name{font-weight:900}.email{color:#667085;font-size:13px;margin-top:3px}@media(max-width:800px){.filters{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<header class="card"><div class="top"><div><h1>👥 Alle Users</h1><p class="muted">Bestuur Ouers/Voogde, Afrigters en Admins. Een rekening kan meer as een rol hê.</p></div><div class="actions"><button class="button ghost" id="back">← Admin Portaal</button><button class="button ghost" id="refresh">↻ Verfris</button></div></div><div id="status" class="status">Verifieer admin-toegang…</div></header>
<section class="card"><div class="filters"><div><label for="search"><b>Soek gebruikers</b></label><input id="search" placeholder="Naam, e-pos of selfoon…"></div><div><button class="button ghost" id="allBtn">Alle</button></div><div><button class="button ghost" id="activeBtn">Net aktief</button></div></div><div class="tablewrap"><table><thead><tr><th>User</th><th>Kontak</th><th>Status</th><th>Rolle</th><th>Aksie</th></tr></thead><tbody id="users"></tbody></table></div></section>
<script>
(function(){
const URL='https://moomommajyldjquncnrd.supabase.co',KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH';
const db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let rows=[],showActiveOnly=false;
function setStatus(text,cls=''){const s=$('status');s.textContent=text;s.className='status '+cls}
function hasRole(u,r){return (u.roles||[]).map(x=>String(x).toLowerCase()).includes(r)}
function render(){const q=$('search').value.trim().toLowerCase();const filtered=rows.filter(u=>{if(showActiveOnly&&u.active===false)return false;const hay=[u.full_name,u.email,u.phone,u.mobile_phone,u.emergency_phone].map(x=>String(x||'').toLowerCase()).join(' ');return !q||hay.includes(q)});$('users').innerHTML=filtered.length?filtered.map(u=>`<tr class="${u.active===false?'inactive':''}"><td><div class="name">${esc(u.full_name||'Geen naam')}</div><div class="email">${esc(u.email||'Geen e-pos')}</div><div class="small">${esc(u.user_id)}</div></td><td>${esc(u.mobile_phone||u.phone||'—')}<br><span class="small">Nood: ${esc(u.emergency_phone||'—')}</span></td><td>${u.active===false?'⚫ Gedeaktiveer':'🟢 Aktief'}</td><td><div class="rolebox">${['parent','coach','admin'].map(r=>`<label class="role"><input type="checkbox" data-user="${esc(u.user_id)}" data-role="${r}" ${hasRole(u,r)?'checked':''}> ${r==='parent'?'👨‍👩‍👧 Ouer/Voog':r==='coach'?'🏏 Afrigter':'🛠️ Admin'}</label>`).join('')}</div></td><td><button class="button primary save" data-save="${esc(u.user_id)}">Stoor rolle</button></td></tr>`).join(''):'<tr><td colspan="5">Geen gebruikers gevind nie.</td></tr>';
$('users').querySelectorAll('[data-save]').forEach(btn=>btn.onclick=()=>saveRoles(btn.dataset.save,btn));}
async function saveRoles(userId,btn){const u=rows.find(x=>String(x.user_id)===String(userId));if(!u)return;const checks=[...document.querySelectorAll(`input[data-user="${CSS.escape(String(userId))}"]`)];const next=new Set(checks.filter(x=>x.checked).map(x=>x.dataset.role));const current=new Set((u.roles||[]).map(x=>String(x).toLowerCase()));const changes=['parent','coach','admin'].filter(r=>next.has(r)!==current.has(r));if(!changes.length){setStatus('Geen rolverandering vir '+(u.full_name||u.email)+'.','');return}if(next.size===0){if(!confirm('Hierdie gebruiker sal geen portaalrolle hê nie. Voortgaan?'))return}btn.disabled=true;btn.textContent='Stoor…';try{for(const r of changes){const {error}=await db.rpc('admin_set_user_role',{p_user_id:userId,p_role:r,p_enabled:next.has(r)});if(error)throw error}setStatus('Rolle vir '+(u.full_name||u.email)+' suksesvol opgedateer.','success');await load()}catch(e){setStatus('Kon rolle nie stoor nie: '+(e.message||e),'error')}finally{btn.disabled=false;btn.textContent='Stoor rolle'}}
async function load(){setStatus('Laai alle gebruikers…');const {data,error}=await db.rpc('admin_list_users');if(error)throw error;rows=(data||[]).map(x=>({...x,roles:Array.isArray(x.roles)?x.roles:[]}));setStatus(rows.length+' gebruikers gelaai.','success');render()}
async function init(){const {data,error}=await db.auth.getSession();if(error)throw error;if(!data.session){location.replace('central-login.html');return}const {data:ok,error:re}=await db.rpc('has_access_role',{p_role:'admin'});if(re)throw re;if(ok!==true){setStatus('Geen admin-toegang vir hierdie rekening nie.','error');return}await load()}
$('search').oninput=render;$('refresh').onclick=()=>load().catch(e=>setStatus('Kon gebruikers nie laai nie: '+(e.message||e),'error'));$('allBtn').onclick=()=>{showActiveOnly=false;render()};$('activeBtn').onclick=()=>{showActiveOnly=true;render()};$('back').onclick=()=>location.href='admin-v23.html';
init().catch(e=>setStatus(e.message||String(e),'error'));
})();
</script></body></html>
