<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – Telkaart V6</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#eef2f6;font-family:Arial;color:#17202a}.wrap{padding:10px}.frame{width:100%;height:calc(100vh - 210px);min-height:700px;border:0;border-radius:16px;background:#fff}.card{background:#fff;border-radius:15px;padding:14px;margin-top:10px}.hidden{display:none!important}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{padding:5px 10px;border-radius:999px;background:#edf2f7;font-weight:900;font-size:12px}.select{width:100%;padding:11px;border:1px solid #d9dee3;border-radius:10px}.primary{padding:13px 18px;border:0;border-radius:10px;background:#172033;color:#fff;font-weight:900;cursor:pointer}.status{padding:11px;border-radius:11px;background:#eef5ea;font-weight:800;margin-top:10px}.error{color:#b42318;background:#fff0f0}</style></head><body><div class="wrap"><div class="card"><div class="top"><div><b id="fixture">Laai wedstryd…</b><div id="scorer" class="pill" style="margin-top:6px">Tellinghouer: —</div></div><span id="age" class="pill">—</span></div></div><div id="error" class="card error hidden"></div><iframe id="score" class="frame" title="Junior Krieket Telkaart"></iframe><div id="completion" class="card hidden"><div class="top"><div><h3 style="margin:0">🏆 Wedstryd voltooi</h3><div>Die telling is klaar. Kies nou die Speler van die Wedstryd.</div></div><span class="pill">VOLTOOI</span></div><select id="pom" class="select" style="margin-top:10px"><option value="">Kies speler…</option></select><button id="close" class="primary" disabled style="margin-top:10px">🔒 SLUIT TELKAART</button><div id="closeMsg" class="status hidden"></div></div></div><script>'use strict';const SUPABASE_URL='https://moomommajyldjquncnrd.supabase.co',SUPABASE_KEY='sb_publishable_MIdISKN9MwYu5A8IzhYGBQ_VBBlEGAH';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const q=new URLSearchParams(location.search),matchId=q.get('match')||'';let user=null,match=null;const $=x=>document.getElementById(x);async function load(){if(!matchId)throw Error('Geen wedstryd-ID ontvang nie.');const au=await db.auth.getUser();user=au.data.user;if(au.error||!user)throw Error('Geen geldige aanmelding gevind nie.');const {data,error}=await db.from('matches').select('id,fixture_code,team_a_id,team_b_id,match_date,match_time,venue,age_group,coach_user_id,scorer_user_id,status,player_of_match_id,scorecard_closed_at').eq('id',matchId).maybeSingle();if(error)throw error;if(!data)throw Error('Wedstryd nie gevind nie.');match=data;const {data:teams,error:te}=await db.from('teams').select('id,name').in('id',[data.team_a_id,data.team_b_id]);if(te)throw te;const tm=Object.fromEntries((teams||[]).map(x=>[x.id,x.name]));$('fixture').textContent=`${tm[data.team_a_id]||'Span A'} vs ${tm[data.team_b_id]||'Span B'} • ${data.match_date} • ${String(data.match_time||'').slice(0,5)} • ${data.venue||''}`;$('age').textContent=data.age_group||'—';let scorer=data.coach_user_id||data.scorer_user_id;if(scorer){const {data:p}=await db.from('user_profiles').select('full_name').eq('user_id',scorer).maybeSingle();$('scorer').textContent='Tellinghouer: '+(p?.full_name||'—')}else $('scorer').textContent='Tellinghouer: —';const engine=`scoring-engine-v6.html?match=${encodeURIComponent(matchId)}&age_group=${encodeURIComponent(data.age_group||'U/6')}&v=${Date.now()}`;$('score').src=engine;if(data.scorecard_closed_at){await showCompletion();$('close').disabled=true;$('pom').disabled=true;$('closeMsg').textContent='Telkaart is reeds gesluit.';$('closeMsg').classList.remove('hidden')}}async function showCompletion(){const {data,error}=await db.from('match_players').select('player_id,players(id,first_name,surname)').eq('match_id',matchId);if(error)throw error;$('pom').innerHTML='<option value="">Kies speler…</option>';(data||[]).forEach(r=>{if(!r.players)return;const o=document.createElement('option');o.value=r.players.id;o.textContent=[r.players.first_name,r.players.surname].filter(Boolean).join(' ');$('pom').appendChild(o)});$('completion').classList.remove('hidden')}window.addEventListener('message',async e=>{if(e.data?.type!=='MATCH_COMPLETED'||e.data.matchId!==matchId)return;try{const {error}=await db.from('matches').update({status:'COMPLETED',completed_at:new Date().toISOString()}).eq('id',matchId);if(error)throw error;await showCompletion()}catch(err){$('error').textContent=err.message||'Kon wedstryd nie as voltooi stoor nie.';$('error').classList.remove('hidden')}});$('pom').addEventListener('change',()=>{$('close').disabled=!$('pom').value});$('close').onclick=async()=>{const playerId=$('pom').value;if(!playerId)return;$('close').disabled=true;$('closeMsg').textContent='Sluit telkaart…';$('closeMsg').classList.remove('hidden');const {error}=await db.from('matches').update({player_of_match_id:playerId,scorecard_closed_at:new Date().toISOString(),scorecard_closed_by_user_id:user.id}).eq('id',matchId);if(error){$('close').disabled=false;$('closeMsg').textContent=error.message;return}$('pom').disabled=true;$('closeMsg').textContent='✅ Telkaart is gesluit en Speler van die Wedstryd is aangeteken.'};load().catch(e=>{$('error').textContent=e.message||'Kon wedstryd nie laai nie.';$('error').classList.remove('hidden')});</script></body></html>
