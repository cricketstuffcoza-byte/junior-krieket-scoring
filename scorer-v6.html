<!doctype html>
<html lang="af">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Junior Krieket – Telkaart V6</title>
<style>
body{margin:0;background:#eef2f6;font-family:Arial,Helvetica,sans-serif;color:#17202a}
.wrap{max-width:1100px;margin:auto;padding:14px}.frame{width:100%;height:calc(100vh - 28px);min-height:850px;border:0;border-radius:16px;background:#fff}
#fairnessModal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:9999}
#fairnessModal.hidden{display:none}.modalbox{width:min(620px,100%);background:white;border-radius:18px;padding:24px;box-shadow:0 20px 60px #0005}.modalbox h2{margin:0 0 10px;font-size:25px}.modalbox p{font-size:17px;line-height:1.5}.big{font-weight:900;font-size:21px}.ok{width:100%;padding:15px;border:0;border-radius:12px;background:#172033;color:white;font-weight:900;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap"><iframe id="score" class="frame" title="Junior Krieket Telkaart"></iframe></div>
<div id="fairnessModal" class="hidden"><div class="modalbox">
<h2>⚠️ Gelyke kolfgeleentheid</h2>
<p id="fairnessText"></p>
<button id="fairnessOk" class="ok">AANVAAR EN GAAN VOORT</button>
</div></div>
<script>
'use strict';
const iframe=document.getElementById('score');
const modal=document.getElementById('fairnessModal');
const text=document.getElementById('fairnessText');
let restricted=null;
let acknowledged=false;
let lastEventCount=-1;
let monitoring=false;
let pairNumber=null;

const q=location.search||'';
iframe.src='scorer.html'+q+'&v=6';
function app(){return iframe.contentWindow}
function getState(){try{return app().eval('state')}catch(e){return null}}
function setStrikerSide(side){try{app().eval('state.strikerSide='+side);app().render()}catch(e){}}
function pair(){const s=getState();if(!s)return null;try{return app().eval('currentPair()')}catch(e){return null}}
function playerStats(name){const s=getState();if(!s||!name)return null;return(s.player&&s.player[name])||{balls:0}}
function showMessage(name,other){
 restricted=name;acknowledged=false;
 text.innerHTML=`<span class="big">${name}</span> het nou <span class="big">6 speelbare balle</span> in hierdie kolfpaar geface.<br><br><b>${name}</b> mag nie meer die speelbare balle face vir die res van hierdie kolfpaar nie. Die oorblywende speelbare balle gaan aan <b>${other}</b>.<br><br>Die twee spelers bly by die paaltjies tot die kolfpaar se 12 speelbare balle voltooi is.`;
 modal.classList.remove('hidden');
}
function acknowledge(){
 const p=pair();if(!p||!restricted){modal.classList.add('hidden');return}
 const side=p.indexOf(restricted);if(side>=0)setStrikerSide(1-side);
 acknowledged=true;modal.classList.add('hidden');enforce();
}
document.getElementById('fairnessOk').onclick=acknowledge;
function enforce(){
 const s=getState();if(!s||!restricted)return;
 const p=pair();if(!p)return;
 if(s.pair!==pairNumber||s.pairBalls>=12){restricted=null;acknowledged=false;pairNumber=s.pair;return}
 const r=playerStats(restricted);if(r&&r.balls>=6){
   const side=p.indexOf(restricted);if(side>=0&&s.strikerSide===side)setStrikerSide(1-side);
 }
}
function detect(){
 const s=getState();if(!s)return;
 if(pairNumber===null)pairNumber=s.pair;
 if(s.pair!==pairNumber){restricted=null;acknowledged=false;pairNumber=s.pair}
 const count=(s.events||[]).length;
 if(count!==lastEventCount){
   lastEventCount=count;
   const p=pair();if(!p)return;
   const a=playerStats(p[0]),b=playerStats(p[1]);
   if(!restricted&&s.pairBalls>0&&s.pairBalls<12){
     if(a.balls>=6&&b.balls<6){showMessage(p[0],p[1]);return}
     if(b.balls>=6&&a.balls<6){showMessage(p[1],p[0]);return}
   }
 }
 enforce();
}
iframe.addEventListener('load',()=>{monitoring=true;lastEventCount=-1;setInterval(()=>{if(monitoring)detect()},250)})
</script>
</body>
</html>
