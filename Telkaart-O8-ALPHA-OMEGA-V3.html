<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Junior Krieket – O/8 T80</title></head><body><p id="m">Laai O/8 telkaart…</p><script>
(async()=>{try{const u='./Telkaart-O8-ALPHA-OMEGA-V2.html';const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('O/8 telkaart kon nie gelaai word nie.');let h=await r.text();
const oldEnd=`function endDelivery(){const i=current();if(i.overBalls>=5){i.overs++;i.overBalls=0;[i.striker,i.non]=[i.non,i.striker];i.bowler=null;selectedBowl=null;render();if(!endInningsCheck()){ $('bowlSelect').classList.remove('hidden');renderBowlerChoices();$('confirmBowl').disabled=true; }return}if(!endInningsCheck()&&!i.retirementPending&&i.striker&&playerStats(i.striker).balls>=15){i.retirementPending=true;i.retired.push(i.striker);pendingNew=null;pendingReason=\`${'${'}pname(i.striker)} het 15 balle bereik en tree af.\`;$('newBatterReason').textContent=pendingReason;$('newBatterCard').classList.remove('hidden');renderNewBatter();$('confirmNewBatter').disabled=true;return}render();persist()}`;
const newEnd=`function endDelivery(){const i=current();if(endInningsCheck())return;if(i.striker&&!i.retirementPending&&playerStats(i.striker).balls>=15&&!i.out.includes(i.striker)&&!i.retired.includes(i.striker)){i.retirementPending=true;i.retired.push(i.striker);pendingNew=null;pendingReason=\`${'${'}pname(i.striker)} het 15 balle bereik en tree af.\`;$('newBatterReason').textContent=pendingReason;$('newBatterCard').classList.remove('hidden');renderNewBatter();$('confirmNewBatter').disabled=true;render();persist();return}if(i.overBalls>=5){i.overs++;i.overBalls=0;[i.striker,i.non]=[i.non,i.striker];i.bowler=null;selectedBowl=null;render();if(!endInningsCheck()){ $('bowlSelect').classList.remove('hidden');renderBowlerChoices();$('confirmBowl').disabled=true; }return}render();persist()}`;
if(!h.includes(oldEnd))throw Error('O/8 retirement-fix kon die bestaande funksie vind nie.');h=h.replace(oldEnd,newEnd);
const oldDismiss=`function openDismissal(){if(!current().striker)return;pendingDismiss=null;const opts=['Bowled','Caught','Stumped','LBW','Run out','Hit wicket','Obstructing the field'];selectButtons($('dismissChoices'),opts.map(x=>({id:x,label:x})),pendingDismiss,id=>{pendingDismiss=id;selectButtons($('dismissChoices'),opts.map(x=>({id:x,label:x})),pendingDismiss,arguments.callee);$('confirmDismiss').disabled=false});$('dismissCard').classList.remove('hidden');$('confirmDismiss').disabled=true}`;
const newDismiss=`function openDismissal(){if(!current().striker)return;pendingDismiss=null;const opts=['Bowled','Caught','Stumped','LBW','Run out','Hit wicket','Obstructing the field'];const draw=()=>{selectButtons($('dismissChoices'),opts.map(x=>({id:x,label:x})),pendingDismiss,id=>{pendingDismiss=id;draw();$('confirmDismiss').disabled=false})};draw();$('dismissCard').classList.remove('hidden');$('confirmDismiss').disabled=true}`;
if(!h.includes(oldDismiss))throw Error('O/8 dismissal-fix kon die bestaande funksie vind nie.');h=h.replace(oldDismiss,newDismiss);
// Make the scoring controls unavailable while a replacement batter/bowler/dismissal is required.
const marker=`$('close').onclick=closeMatch;`;
const guard=`$('close').onclick=closeMatch;window.addEventListener('beforeunload',()=>{try{persist()}catch(e){}});`;
if(h.includes(marker))h=h.replace(marker,guard);
document.open();document.write(h);document.close();
}catch(e){document.getElementById('m').textContent=e.message;document.getElementById('m').style.color='#b42318'}})();</script></body></html>
